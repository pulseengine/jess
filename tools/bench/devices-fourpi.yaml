# COMMITTED COPY of the bench registry on `fourpi` (Raspberry Pi 4, Debian 13, aarch64).
# The authoritative file is ~/.config/pulseengine/bench-devices.yaml ON THAT HOST — a claim is
# host-local by construction, so this copy is for review and for gale to see what is there, not
# for with-device to read from a checkout.
#
# The shared physical bench ON THIS HOST (fourpi, Raspberry Pi 4, Debian 13 aarch64).
#
# WHY THIS FILE IS SEPARATE FROM jess/tools/bench/devices.yaml: a probe can only be driven
# from the host it is plugged into, so a claim is host-local by construction. When hardware
# moves, its lock moves with it. The Pixhawk moved here on 2026-09-05; the entry in jess.git
# describes the Mac and its /dev/cu.* paths, which do not exist on Linux.
#
# WHEN A CLAIM IS REQUIRED - either condition is sufficient:
#   1. It attaches a DEBUG PROBE (openocd, probe-rs, pyocd, gdb). `mdw` is not a harmless read.
#   2. It opens a device whose data is CONSUMED BY THE READER - any tty/serial, EVEN O_RDONLY.
# Rule 2 is not theoretical: measured on this same Pixhawk, one reader got 66,872 B in 5 s
# while two concurrent readers got 37,787 + 40,053 B and NEITHER saw an error. Two agents
# tailing one tty each capture a silent subset (gale#356).
devices:
  pixhawk-6xrt:
    what: Holybro Pixhawk 6X-RT flight controller (i.MX RT1176)
    usb: 3643:001d  PX4 FMU v6XRT.x
    tty: /dev/ttyACM0
    by-id: /dev/serial/by-id/usb-Dronecode_Project__Inc._PX4_FMU_v6XRT.x_0-if00
    identify: lsusb -d 3643:001d
    note: >
      THE VEHICLE. Anything that writes - ISP entry, SDP, flash - needs this claim AND
      explicit operator consent for that specific action. Reading the tty needs the claim too.
  stlink-v1:
    what: ST-LINK/V1 (onboard) + STM32F100 target - almost certainly an STM32VLDISCOVERY
    usb: 0483:3744  ST-LINK/V1, firmware V1J13S0
    identify: lsusb -d 0483:3744
    target: STM32F100 value line, Cortex-M3 r1p1, 128 KB flash, 8 KB SRAM
    target-read-on: 2026-09-05, halted via openocd HLA, resumed afterwards
    target-ids:
      dbgmcu-idcode: 0x10016420   # DEV_ID 0x420 = STM32F100 low/medium-density value line
      cpuid:         0x411fc231   # ARM Cortex-M3 r1p1
      flash-size-kb: 128          # 0x1FFFF7E0 -> 0x0080
      initial-msp:   0x20002000   # => 8 KB SRAM
      unique-id:     05e12d35 30553130 43191e14
      flash-0x08000000: 20002000 08000401 08000ad5 080013d7   # has real firmware on it
    why-it-matters: >
      THIS IS THE SAME PART AS THE PIXHAWK 6X-RT IO COPROCESSOR - STM32F100, Cortex-M3,
      128 KB flash, 8 KB SRAM. The gust F100/M3 byte-exact pass-through oracle
      (REQ-PIX-004 PART-P02 / TEST-PIX-028) has only ever run in Renode; this board is a
      standalone target for it on REAL SILICON with zero flight risk, and it is shared with
      gale. Nothing about it is on the flight path.
    caveats: >
      ST-LINK V1J13S0 firmware supports only the deprecated HLA transport - openocd needs
      interface/stlink-hla.cfg, not stlink-dap.cfg, and says so itself in its own error text.
      nSRST is not wired (openocd reports "SRST error"); reset must be done over SWD, not by
      line. Halting requires openocd -c halt first: with HLA, memory reads on a running
      target return nothing at all rather than erroring, which reads exactly like a dead
      probe.
    note: >
      NOT the STLINK-V3 (003B001A3235511337333439) in jess/tools/bench/devices.yaml - that
      one is on the Mac with a NUCLEO-G474RE. Registered under its own name deliberately:
      reusing "stlink-v3" here would be a lock whose name does not match the hardware, which
      is the AFD-082 vacuous-lock failure in a new costume.
  selftest-device:
    what: SYNTHETIC - not real hardware. Used only by `with-device --self-test`.
