# The shared physical bench. One entry per device that more than one agent may want.
#
# WHY THIS IS MACHINE-LOCAL AND THAT IS CORRECT: a probe can only be driven from the host it
# is plugged into, so two agents can only collide if they are on the SAME machine. Locking
# is therefore a host-local problem and needs no server, no GitHub mutex and no git-CAS
# lease. When hardware moves to another host (e.g. the Pi), the lock moves with it.
# WHEN A CLAIM IS REQUIRED — either condition is sufficient:
#
#   1. It attaches a DEBUG PROBE (openocd, probe-rs, pyocd, gdb). `mdw` is not a harmless read.
#   2. It opens a device whose data is CONSUMED BY THE READER — any tty/serial, EVEN O_RDONLY.
#
# Rule 2 replaces an earlier "read-only telemetry needs no claim" exemption, which was wrong.
# gale caught it (gale#356) and jess MEASURED it on this Pixhawk:
#     one reader alone      66,872 B in 5 s
#     two readers together  37,787 B + 40,053 B = 77,840 B combined
# Each reader got roughly HALF. Combined is ~16% over solo, not the ~2x that duplication
# would give. And crucially the OS does NOT refuse the second open — both readers proceed
# and neither sees an error. Two agents tailing one tty therefore each capture a SILENT
# SUBSET, indistinguishable from a flaky USB link. That is precisely the failure this tool
# exists to prevent, so exempting it was self-defeating.
#
# Genuinely claim-free is narrower than "reads": inspecting files, lsusb/ioreg, `pyocd list`,
# reading a log someone already captured to disk. Not live streams.
devices:
  # REMOVED 2026-10-01 (AFD-129): `nucleo-g474re` (probe serial 003B001A3235511337333439) is NOT
  # on this Mac. It is on gale.local, confirmed by that same serial. Measured: this Mac has NO
  # ST-LINK at all — both ioreg and system_profiler return nothing for one.
  #
  # It is REMOVED rather than annotated because a comment does not stop `with-device` granting a
  # claim on it. This file's documented job is "what is PRESENT HERE", and a registry naming an
  # absent device hands the claimant a lock over nothing while telling it the board is held — a
  # vacuous lock reached from the opposite direction to AFD-082: not two names for one board, but
  # one name for no board. The BOARD stays in hardware-catalog.yaml, which is "what we support";
  # that is the split working as designed.
  #
  # Its host-local entry belongs in gale.local's own registry
  # (~/.config/pulseengine/bench-devices.yaml), which exists there. Note the alias `stlink-v3` from
  # jess#266 moves with it, not with this file.
  #
  # AND THE GAP THIS EXPOSED: nothing verifies presence. check-catalog.sh asserts registry names
  # resolve in the catalogue; it does not assert a registered device is attached. Every device here
  # carries an `identify:` command precisely so presence COULD be checked, and no gate runs one.
  pixhawk-6xrt:
    what: Holybro Pixhawk 6X-RT flight controller (i.MX RT1176)
    usb: PX4 FMU v6XRT.x, idVendor 13891
    tty: /dev/cu.usbmodem01
    identify: "ioreg -p IOUSB -l -w 0 | grep 'PX4 FMU'"
    note: >
      Vehicle. Anything that WRITES — ISP entry, SDP, flash — needs this claim AND operator
      consent. SO DOES READING THE TTY: see the claim rule below. An earlier version of this
      file exempted read-only telemetry and that was WRONG (gale#356).
  selftest-device:
    what: SYNTHETIC — not real hardware. Used only by `with-device --self-test`.
    note: >
      Registered explicitly rather than special-cased in code. The alternative was a
      bypass for names matching some pattern, and a bypass in a lock is exactly the hole
      that later gets used for something real. Adding the synthetic device to the registry
      keeps ONE rule: the registry is authoritative, no exceptions.

