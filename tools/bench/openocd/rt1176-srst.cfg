# The same SWD path with nRST (Pixhawk Debug Full pin 9). on-target-run.sh --restore uses it:
# a core-only reset does not bring PX4 back; nRST makes the boot ROM reload it from flash.
# Formerly an uncommitted /tmp/rt1176-srst.cfg on the bench host.
source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0x1fc9 0x0143
transport select swd
adapter speed 1000
reset_config srst_only srst_nogate connect_assert_srst
swd newdap rt cpu -irlen 4
dap create rt.dap -chain-position rt.cpu
target create rt.cpu cortex_m -dap rt.dap
