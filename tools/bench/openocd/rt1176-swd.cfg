# SWD to the Pixhawk 6X-RT's RT1176 M7 through the MCU-Link (1fc9:0143), no reset line.
# Used by on-target-run.sh for halt / load_image / resume / mdw. Nothing here writes flash,
# enters ISP or touches fuses. Formerly an uncommitted /tmp/rt1176-dapread.cfg on the bench
# host, lost on its first reboot.
source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0x1fc9 0x0143
transport select swd
adapter speed 1000
reset_config none
swd newdap rt cpu -irlen 4
dap create rt.dap -chain-position rt.cpu
target create rt.cpu cortex_m -dap rt.dap
