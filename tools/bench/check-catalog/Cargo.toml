[package]
name = "check-catalog"
version = "0.1.0"
edition = "2021"
description = "Assert the bench hardware catalogue and a device registry agree (names, aliases, provenance)"
license = "Apache-2.0"
publish = false

# Port of the Python embedded in tools/bench/check-catalog.sh (jess#290). The YAML is read
# through `rivet yaml to-json` (rivet's own parser, org policy), never parsed here. The old
# script is kept as tools/bench/check-catalog.ref.sh and is the equivalence oracle:
# tests/equivalence.rs runs both and asserts identical stdout and exit code.
#
# It also builds as a wasm32-wasip2 component. component-run.sh runs it under wasmtime: it does the
# two rivet calls on the host (a component cannot spawn) and passes the JSON in through
# CHECK_CATALOG_INPUT=json, CHECK_CATALOG_JSON_FOR_<i>/_FILE_<i> and CHECK_CATALOG_PROVENANCE.
# EQUIV_PORT_BIN=component-run.sh runs the same harness against the component.

[dependencies]
serde_json = { version = "1", features = ["preserve_order"] }
