project:
  name: jess
  version: "0.1.0"
  schemas:
    - common
    - dev
    - research
    - stpa
    - stpa-sec
    - score
    - safety-case
    - supply-chain

externals:
  # gale — jess's stpa hazards trace to gale's losses/hazards (gale:L-1, gale:H-2).
  # relay — jess's silicon-binding requirements cross-link to the relay artifacts
  #   they bind/validate (the joint on-target trace, jess#62<->relay#214 split):
  #     REQ-PIX-012 -> relay:FV-FALCON-HAL-001 (HAL seam), -003 -> IMUDRV-001,
  #     -010 -> MAVLINK-001, -014 -> SIM-007 (gz-sim) + HITL-002.
  # Both pinned in rivet.lock; CI checks out each sibling at its pinned SHA.
  # (loom/rivet externals from the original AFD-001 experiment were dropped.)
  gale: { path: ../gale, prefix: gale }
  relay: { path: ../relay, prefix: relay }

sources:
  - path: artifacts
    format: generic-yaml

docs:
  - docs

results: results
