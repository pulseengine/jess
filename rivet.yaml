project:
  name: jess
  version: "0.1.0"
  schemas:
    - common
    - dev
    - research
    - stpa
    - stpa-sec
    - score
    - safety-case
    - supply-chain

externals:
  # Only gale is referenced by jess artifacts (gale:L-1, gale:H-2 hazard
  # traceability in stpa.yaml). loom/rivet externals were from the original
  # AFD-001 cross-repo experiment and are unused — dropped so `rivet validate`
  # needs only the gale sibling (CI checks it out at the rivet.lock SHA).
  gale: { path: ../gale, prefix: gale }

sources:
  - path: artifacts
    format: generic-yaml

docs:
  - docs

results: results
