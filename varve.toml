# jess's toolchain pin.
#
# WHY THIS EXISTS, concretely: on 2026-08-27 jess filed an upstream defect report
# (meld#390) against meld 0.41.3 while 0.52.0 was latest — ELEVEN minor versions
# stale. Nothing detected the drift, because nothing was pinned: the local binary
# came from PATH and CI pinned its own separate versions in ci.yml. That cost a
# supplier's attention on a report whose version citation was wrong. See AFD-045.
#
# The realm supplies both the registry and the trust root, so no environment
# variable is needed; varve-realms.toml is committed beside this file.
manifest-version = 1

[toolchain]
realm   = "covalent"
channel = "rolling"
layer   = "2026.11.28"
# The layer NAME is not sufficient on its own: two entries for 2026.08.4 existed in the old
# realm under different digests, and varve refuses to guess between them rather than
# silently picking one. That refusal is the feature.
#
# MIGRATED 2026-09-09 (jess#261). The rolling trust root rotated AND the registry moved, so
# THREE things had to change together, not the two the issue listed: varve-realms.toml
# (registry + trust-root), this `layer`, and this `digest`. Moving the first two and leaving
# the digest gave `error: source has no layer matching sha256:c1e6a418...` — the old layer's
# digest, which does not exist in the new registry.
# This digest is the one `varve install` fetched and verified against the NEW trust root on
# 2026-09-09; it was resolved by name and then recorded, never guessed.
# MOVED 2026-10-28: 2026.09.2 -> 2026.10.32, resolved by `varve install` against the committed
# realm (trust root unchanged since 2026-09-09) and then recorded. The layer changes rivet
# 0.35.0 -> 0.41.1 and spar 0.40.0 -> 0.47.1 for jess; it carries meld 0.65.1 and synth 0.88.0,
# EQUAL to artifacts.pins. loom stays 1.4.1 in the layer, as it already was in 2026.09.2:
# the campaign keeps loom 1.4.0 through artifacts.pins (AFD-142, loom#448), and nothing that
# builds the lowered object dispatches loom from the layer.
# MOVED 2026-11-25: 2026.10.32 -> 2026.11.40, resolved by `varve install` against the committed
# realm and then recorded (`varve outdated`: newest signed for line 2026.11, index #41). It moves
# the two tools the layer is the authority for: rivet 0.41.1 -> 0.43.3 (needed for `rivet yaml
# to-json`, jess#290) and spar 0.47.1 -> 0.49.0. The layer also carries meld 0.70.0, synth 0.91.0
# and loom 1.5.4; artifacts.pins stays the authority for those (meld 0.65.1, synth 0.89.0, loom
# 1.4.0) and CI passes them explicitly, so the lowered object does not change. Locally, a script
# that falls back to `varve run meld|loom|synth` now gets the layer's newer version.
# MOVED 2026-11-26: 2026.11.40 -> 2026.11.44, resolved by `varve install` and then recorded
# (`varve outdated`: newest signed for line 2026.11, index #45). `varve diff` lists 15 changed
# and 5 removed entries, 0 added. rivet, spar, meld, synth and loom do not change. For jess
# only kiln changes, 0.8.0 -> 0.9.0, and the `kilnd` name is gone; tools/xruntime/kiln-check.sh
# already calls `kiln`, and gave the same verdict under both (mixer#mix 4 of 4 outputs
# bit-identical to wasmtime, 2 of 5 exports executed, 3 not drivable). jig, plant, sieve
# and warte change too; jess calls none of them.
# MOVED 2026-11-27 (owner decision: covalent is the standard layer): pulseengine/rolling
# 2026.11.44 -> covalent/rolling 2026.11.28, resolved by `varve install` and then recorded (signed
# index counter 29). covalent signs nothing of its own here (0 tools) and composes two layers,
# each verified against its own realm's root: pulseengine 2026.11.45 (sha256:e13fb390..., 20
# tools) and pulseengine-wasm 2026.11.6 (sha256:0d699621..., 7 tools). varve-realms.toml is the
# published varve v0.48.0 copy, which adds those two realms; the covalent root matches
# realm-root.pub in pulseengine/covalent-layers.
# For jess: `varve diff 2026.11.44 2026.11.45` changes none of the tools jess calls (rivet 0.43.3,
# spar 0.49.0, meld 0.70.0, synth 0.91.0, loom 1.5.4, kiln 0.9.0 unchanged). NEW through the shim:
# wasm-tools 1.263.0, wasmtime 51.0.0 and wac 0.12.0, where ci.yml pins 1.245.1, 42.0.1 and
# 0.10.1 explicitly. CI is unaffected; locally a script that reaches the varve shim now gets
# the layer's versions instead of a refusal.
digest  = "sha256:da7f6b48f875349c020e46ba52958f022db4c03b90b70bf91c718ccbbebbbbce"
