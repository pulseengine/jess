# jess's toolchain pin.
#
# WHY THIS EXISTS, concretely: on 2026-08-27 jess filed an upstream defect report
# (meld#390) against meld 0.41.3 while 0.52.0 was latest — ELEVEN minor versions
# stale. Nothing detected the drift, because nothing was pinned: the local binary
# came from PATH and CI pinned its own separate versions in ci.yml. That cost a
# supplier's attention on a report whose version citation was wrong. See AFD-045.
#
# The realm supplies both the registry and the trust root, so no environment
# variable is needed; varve-realms.toml is committed beside this file.
manifest-version = 1

[toolchain]
realm   = "pulseengine"
channel = "rolling"
layer   = "2026.10.32"
# The layer NAME is not sufficient on its own: two entries for 2026.08.4 existed in the old
# realm under different digests, and varve refuses to guess between them rather than
# silently picking one. That refusal is the feature.
#
# MIGRATED 2026-09-09 (jess#261). The rolling trust root rotated AND the registry moved, so
# THREE things had to change together, not the two the issue listed: varve-realms.toml
# (registry + trust-root), this `layer`, and this `digest`. Moving the first two and leaving
# the digest gave `error: source has no layer matching sha256:c1e6a418...` — the old layer's
# digest, which does not exist in the new registry.
# This digest is the one `varve install` fetched and verified against the NEW trust root on
# 2026-09-09; it was resolved by name and then recorded, never guessed.
# MOVED 2026-10-28: 2026.09.2 -> 2026.10.32, resolved by `varve install` against the committed
# realm (trust root unchanged since 2026-09-09) and then recorded. The layer changes rivet
# 0.35.0 -> 0.41.1 and spar 0.40.0 -> 0.47.1 for jess; it carries meld 0.65.1 and synth 0.88.0,
# EQUAL to artifacts.pins. loom stays 1.4.1 in the layer, as it already was in 2026.09.2:
# the campaign keeps loom 1.4.0 through artifacts.pins (AFD-142, loom#448), and nothing that
# builds the lowered object dispatches loom from the layer.
digest  = "sha256:53e2cdf8a2e9755cdefd8fd3dbeddab9deca8de28ca8994ddcc427856265ea53"
