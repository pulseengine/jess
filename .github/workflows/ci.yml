name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# EVERY `run:` gets `bash -eo pipefail`, not GitHub's default `bash -e {0}`.
#
# Without this, a step written as `oracle.sh | tee -a "$GITHUB_STEP_SUMMARY"` reports
# TEE's exit status, so the oracle can fail and the step still goes green. Six steps
# here are written exactly that way, including `cargo llvm-cov --fail-under-lines 90`,
# TEST-PIX-026 (fuse-repro-oracle) and TEST-PIX-029 (sigil-gate) — three enforcement
# gates that could not go red. Found by clean-room verification.
#
# This repo has a standing rule that "a piped exit code is the PIPE's, not the
# script's", and it was being applied to shell commands while CI violated it in six
# places. The `pipefail is active` guard in rivet-validate keeps it from regressing.
defaults:
  run:
    shell: bash

env:
  # Pinned PulseEngine tool releases — bumped explicitly via PR. Bumped v0.22.1 ->
  # v0.25.0: needed for GIT-LINK external resolution — `rivet sync` git-fetches the
  # gale + relay externals into .rivet/repos/ and validate resolves them from there
  # (v0.22.1 resolved externals only via `path:`, requiring manual sibling checkouts).
  # Verified: jess store validates clean + `coverage --fail-under 60` still gates
  # (64.8% >= 60) on v0.25.0.
  # Aligned to the varve pin (0.34.0). CI was on v0.25.0 while varve.toml's layer carried
  # 0.34.0, so CI qualified this project against a toolchain the pin does not claim — and the
  # clean-room skill's own example is `rivet validate` flipping verdict between rivet versions
  # on an unchanged tree. Measured before bumping, same unchanged tree:
  #   0.25.0 / 0.32.0 / 0.34.0 / 0.36.0 -> all PASS (266 warnings), coverage 63.9% >= 60.
  # So this closes a latent hazard, not an active defect. tools/varve/check-drift.sh now
  # reports ci.yml-vs-pin disagreement as BLOCKING, separately from PATH staleness.
  # Tracks the varve LAYER, which is the authority for rivet (artifacts.pins does not name
  # it). The 2026.08.4 -> 2026.09.2 layer migration moved rivet 0.34.0 -> 0.35.0, and
  # check-drift reported the gap as BLOCKING until this followed. Measured on the same
  # unchanged store before bumping: 0.34.0 / 0.35.0 / 0.36.0 all `Result: PASS (277 warnings)`
  # and all clear the floor — but the coverage NUMBER moved, 63.9% under 0.34.0 and 64.8%
  # under 0.35.0+. The metric is version-dependent, so a coverage figure is only meaningful
  # beside the binary that produced it.
  RIVET_VERSION: v0.35.0
  # v0.24.0 adds `codegen --format wit` (AADL -> WIT, spar#319) used by the
  # WIT-derivation gate below; verified backward-compatible with jess's model
  # (parse + instance green). Bumped from v0.17.0.
  # Aligned to the varve pin (0.40.0); CI was on v0.24.0, sixteen minors behind, and spar
  # GENERATES the WIT. CI has no varve, so tools/wit/regen.sh falls through to PATH and the
  # WIT-derivation gate ran 0.24.0's codegen while a developer got the pinned 0.40.0.
  # Measured before bumping: both emit BYTE-IDENTICAL wit/ from hardware/pixhawk6x-rt.aadl,
  # and both report WIT-DERIVATION OK against the committed tree. 0.24.0 also predates
  # `--version` (CLI convention #1), which is why check-drift.sh could not see it on PATH.
  SPAR_VERSION: v0.40.0
  # Pinned meld for the scry sound-analysis gate (REQ-PIX-018 leg b) + the fused-core
  # reproducibility gate (TEST-PIX-026, meld#325/#341).
  #
  # BUMPED v0.41.3 -> v0.52.0 to CLOSE the divergence this comment used to record: the varve
  # pin carried 0.52.0 and jess cited 0.52.0 upstream while THIS gate ran 0.41.3, so the
  # version in a defect report was never the version CI exercised. tools/varve/check-drift.sh
  # existed to flag exactly that. CI and the varve pin now agree.
  #
  # The old comment said the bump "needs that gate re-verified, which is a separate reviewed
  # change, not a one-line edit". That re-verification is this change (AFD-094), measured on
  # the real pinned falcon component rather than assumed:
  #
  #   scry gate            0.41.3 / 0.52.0 / 0.54.0  ALL IDENTICAL:
  #                        771 pts, 175 funcs, 71 call-edges, 12 indirect,
  #                        0 unsound-fallback, 0 diagnostics
  #   TEST-PIX-026         PASS on all three: --reproducible byte-stable, negative control
  #                        fires (default fusion differs run-to-run), and PATH-INDEPENDENT
  #
  # THE ATTESTATION KEY IS VERSION-DEPENDENT, which is worth stating plainly because the
  # oracle's own wording ("portable attestation key") invites the opposite reading. Same
  # input, same flags, three versions, three keys:
  #     0.41.3  8c1617d30812b05fdc82a5267d1295ce8106b750ec955c70ca7472af27e22dc0
  #     0.52.0  09d24df8c324f62e7dd0af43e68858dfb1177e77346ebbc126558d631a2bcee8
  #     0.54.0  42a9362763c61cf88d8445c41c835e1b259051acab5d7d19ed59aed91f48bd75
  # Portable across PATHS and MACHINES; NOT across meld versions. So a recorded digest is
  # only re-verifiable alongside the meld version that produced it — which is what the varve
  # pin is for. Safe to bump here because the oracle asserts the PROPERTY, not a golden
  # digest, and no artifact in this repo records any of these three keys (checked).
  #
  # v0.54.0 is ALSO verified good (AFD-093: fuses the real 5-stage cascade to VALID wasm,
  # all five boundaries resolve, and the composed image EXECUTES to the reference) and is
  # ready for whenever the varve layer moves. Not adopted here: the point of this change is
  # to make CI match the pin, not to jump ahead of it and recreate the divergence.
  # Kept in lockstep with tools/deps/artifacts.pins — check-drift.sh reports a ci-vs-pin
  # disagreement as BLOCKING, so these two moving apart is a red board, not a silent drift.
  # BUMPED v0.58.3 -> v0.62.0 with tools/deps/artifacts.pins, in the same commit, because
  # these two moving apart is the AFD-045 class. The lockstep is now ENFORCED rather than
  # asserted: `check-drift.sh --committed-only` runs in rivet-validate below. It was cited in
  # five comments in this file as the thing keeping them in step and was never invoked — and
  # this very bump proved it, by going green with the two files disagreeing (AFD-137).
  MELD_VERSION: v0.62.0
  # The gale + relay rivet externals are git-links pinned in rivet.yaml/rivet.lock;
  # the rivet-validate job's `rivet sync` git-fetches each at its pin (gale for the
  # stpa hazard trace gale:L-1/H-2; relay for the silicon-binding cross-links
  # REQ-PIX-012->HAL, -003->IMU, -010->MAVLink, -014->gz-sim+HITL). No manual
  # sibling checkout — see the rivet-validate job.

jobs:
  # The rivet artifact spine is jess's substance — this is the core gate.
  rivet-validate:
    name: rivet validate (artifact spine)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: jess
      # gale + relay externals are declared as git-links in rivet.yaml (pinned in
      # rivet.lock); `rivet sync` below git-fetches each at its pin into
      # jess/.rivet/repos/ — no manual sibling checkout needed.
      - name: Fetch pinned rivet release
        run: |
          set -euo pipefail
          gh release download "$RIVET_VERSION" --repo pulseengine/rivet \
            --pattern 'rivet-*-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern 'SHA256SUMS.txt' --dir /tmp/rivet
          cd /tmp/rivet
          exp=$(grep 'x86_64-unknown-linux-gnu.tar.gz' SHA256SUMS.txt | awk '{print $1}')
          act=$(sha256sum ./*x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          test -n "$exp" && test "$exp" = "$act" || { echo "checksum mismatch"; exit 1; }
          tar xzf ./*x86_64-unknown-linux-gnu.tar.gz
          install -m755 "$(find . -name rivet -type f | head -1)" /usr/local/bin/rivet
        env:
          GH_TOKEN: ${{ github.token }}
      # GUARD. `defaults.run.shell: bash` above is what makes every piped gate in this
      # workflow able to fail. If it is ever removed, the gates go quietly green instead
      # of red — the exact failure it was added to fix. Assert the property, not the key.
      - name: pipefail is active (guards every piped gate in this workflow)
        run: |
          rc=0
          sh -c 'exit 3' | cat || rc=$?
          [ "$rc" = "3" ] || { echo "pipefail is NOT active: a failing left-hand side reported $rc — piped gates can report green while failing"; exit 1; }
          echo "pipefail active: a failing left-hand side propagates (rc=$rc)"
      # varve's rolling trust root rotated in v0.32.1. The published varve-realms.toml is
      # byte-identical to ours EXCEPT the trust-root line, so vendoring it reads as a
      # one-line no-op diff and would orphan our pin (`No valid signatures`) until layer
      # 2026.09.2 exists. This loop bumps pins on evidence; a rule that lives only in a
      # release note is one it will not see.
      - name: varve realm/pin agree (trust root can verify the pinned layer)
        # This job checks out to `path: jess`, so every step that touches the repo needs
        # working-directory. Omitting it cost a red run: exit 127, "No such file or
        # directory", which reads like a missing script rather than a wrong cwd.
        working-directory: jess
        run: |
          tools/varve/check-realm.sh --self-test
          tools/varve/check-realm.sh
      # ITS OWN STEP, deliberately. Folded into the step above, its execution could only be
      # INFERRED — the step succeeded, GitHub's default shell is `bash -e`, therefore the
      # command exited 0 — and when I went to confirm it had run, the log fetch came back
      # empty and inference was all I had. That is a thin position for a gate whose whole
      # subject is gates that do not run (AFD-137). A named step appears in the job's step
      # list, so "did it run" is answerable by looking rather than by reasoning.
      #
      # ci.yml vs artifacts.pins is a comparison between two COMMITTED files, so it needs no
      # varve and runs HERE, unlike the full drift check which refuses without a resolvable
      # layer. This is the assertion five comments in this file already claimed was enforced;
      # nothing invoked it until AFD-137.
      - name: ci.yml and artifacts.pins agree on every tool version (AFD-045, AFD-137)
        working-directory: jess
        run: tools/varve/check-drift.sh --committed-only
      # The falcon ESTIMATOR pin names the real estimator, not the legacy Mahony filter.
      #
      # From falcon v1.140.0 the bundle ships TWO components exporting the IDENTICAL string
      # `pulseengine:falcon-cascade/ekf@0.11.0` — falcon-iekf (role=flight-core-stage, the
      # invariant EKF, Kani-harnessed) and falcon-ekf (role=legacy-stage, a Mahony attitude
      # filter that relay's own manifest.json calls "not the estimator the falcon flight core
      # uses"). ifacever.find_export matches a version-AGNOSTIC suffix by design (AFD-121), so
      # it cannot discriminate: pin the wrong one and every oracle downstream stays green
      # against the wrong filter. The pin is the LAST place the two differ, so the assertion
      # lives there. Static — two committed files, no network, no artifacts — so it runs here.
      # --self-test carries 1 positive and 4 negative controls; it is run, not just defined.
      - name: the falcon ekf pin names falcon-iekf, not the legacy filter (AFD-140)
        working-directory: jess
        run: |
          tools/deps/check-estimator-identity.sh
          tools/deps/check-estimator-identity.sh --self-test
      # The repository's license claims, enforced rather than stated. README.md says jess is
      # Apache-2.0 and that every Rust crate declares it; that sentence is true when written and
      # silently false the day a crate lands without a `license` field — the prose-beside-nothing
      # shape this campaign keeps finding. Static (committed files only), so it runs here.
      # Pins LICENSE to the canonical apache.org text by digest and derives the manifest set from
      # `git ls-files`. --self-test carries 1 positive and 5 negative controls.
      - name: LICENSE is canonical Apache-2.0 and every crate declares it
        working-directory: jess
        run: |
          tools/license/check-license.sh
          tools/license/check-license.sh --self-test
      - name: rivet sync + validate
        working-directory: jess
        run: |
          rivet --version
          rivet sync
          rivet validate
        env:
          GH_TOKEN: ${{ github.token }}
      # `rivet validate` reports an out-of-vocabulary field value as a WARNING and
      # exits 0, so the step above CANNOT go red on one — 37 of 61 ai-found-defect
      # artifacts (60%) were out of vocabulary and this job stayed green (AFD-062,
      # pulseengine/rivet#885). This converts that warning into an error. Retire it
      # when rivet ships `validate --strict`.
      - name: triage-status vocabulary gate (AFD-062)
        working-directory: jess
        run: tools/rivet/triage-gate.sh
      # The catalogue is the SHARED VOCABULARY between jess and gale; the registries are
      # host-local. A registry naming a device the catalogue does not contain lets two agents
      # name the same hardware differently, so neither lock excludes the other — the AFD-082
      # vacuous-lock failure gale hit on first contact with `stlink-v1-f100`.
      #
      # LIVES HERE, not in bench-tool: it verifies every `measured-by` citation names a real
      # artifact, which needs `rivet` on PATH. bench-tool does not install it, so the first
      # placement failed closed with "CANNOT VERIFY" — correct refusal, wrong job.
      - name: hardware catalogue agrees with the registry (+ its own negative controls)
        working-directory: jess
        run: tools/bench/check-catalog.sh --self-test
      # AFD-124: a pin-path rename left three consumers on the OLD path, and two of them passed
      # locally against the stale artifact still sitting in .scratch — the bump was reported green
      # against the very artifact it replaced. This asserts every .scratch directory a script
      # names is either pin-owned or a declared build output, so an orphaned one cannot survive.
      - name: pin consumers — no script points at an orphaned .scratch directory (AFD-124)
        working-directory: jess
        run: tools/deps/check-consumers.sh --self-test
      # The workflow's own two static defects, each of which cost a CI round-trip before being
      # gated: a step that cannot reach its script (exit 127, surfacing as a gate that FAILED
      # rather than one that never ran — AFD-124), and a Renode oracle step whose `env:` block
      # was detached by an insertion, so it SKIPped with exit 2 (AFD-125).
      - name: ci.yml is self-consistent — scripts reachable, Renode steps have RENODE
        working-directory: jess
        run: tools/ci/check-workflow.sh --self-test
      # AFD-134's two instruments. Both are classifiers, and a classifier nobody has watched
      # MIS-sort is a classifier nobody has checked — so what is gated is each one's
      # both-directions self-test, not merely that it runs. linmem-differential must put 1 ulp
      # in ULP-CLOSE and a sign flip in DIVERGENT, and must keep the sign flip divergent at an
      # absurd threshold (otherwise the classification collapses to one bucket and the headline
      # "six of six differ in sign" would be an artefact of the tool). memtrace's analyser must
      # FIND an injected stale copy, must NOT find one in the one-variable control, and must
      # report a non-distinctive value as SKIPPED rather than as "none found".
      # Hardware-free and dependency-free on purpose: the self-tests need no QEMU and no
      # wasmtime, so they gate on every run rather than only where a bench exists.
      - name: AFD-134 instruments — both classifiers self-test in BOTH directions
        working-directory: jess
        run: |
          set -euo pipefail
          tools/cascade-differential/linmem-differential.py --self-test
          hardware/qemu/memtrace/analyse.py --self-test
          # gravity-residual has THREE outcomes, and its self-test requires the third one to
          # fire: a series at half n*g*dt and a quadratic series must both come back NEITHER.
          # Without those, a classifier that always answered UNCOMPENSATED would pass the
          # positive case, and the AFD-134 headline rests on that classifier.
          tools/cascade-differential/gravity-residual.py --self-test
          # The fit itself, re-run from the sixteen COMMITTED words rather than from a 20 MB
          # trace, so the finding is checked on every run and not only when a bench exists. It
          # exits 1 by design (a side IS uncompensated), which is the finding, so invert it —
          # and a 0 or a 2 must both fail, because 2 is "could not determine".
          # No line continuations here: a backslash-continued line inside a `run: |` block
          # dedents out of the block scalar and the whole workflow stops parsing. Measured —
          # the first version of this step did exactly that, and check-workflow.sh refused.
          # BOTH horizons. The 16-tick series is where the defect was first fitted; the
          # 1024-tick series is what makes it a measurement rather than an extrapolation, and
          # it is also the one that caught the COMPENSATED bound being mis-scaled to a single
          # tick's gravity. Checking only the short one would let that regress unseen.
          for spec in "16:repro/synth-1436/veld-arm-16ticks.txt" \
                      "1024:repro/synth-1436/veld-arm-1024ticks.txt"; do
            n="${spec%%:*}"; words="${spec#*:}"
            rc=0
            tools/cascade-differential/gravity-residual.py --arm-words "$words" --ticks "$n" >/dev/null || rc=$?
            if [ "$rc" != 1 ]; then
              echo "gravity-residual on $words (N=$n) returned $rc, want 1 (UNCOMPENSATED)."
              echo "  rc 0 would mean the committed series no longer shows the defect."
              echo "  rc 2 means it could not be read at all, which is NOT a pass."
              exit 1
            fi
            echo "  gravity-residual N=$n: the committed vel-d series still fits n*g*dt (AFD-134)"
          done
      # FEATURE-012 (compliance report) — publish jess's own traceability/V&V
      # compliance report to the job summary, and GATE on a coverage floor so the
      # right side of the V can't silently regress. jess cuts no binary release, so
      # this CI-published report + floor gate is the "own compliance report" (TEST-PIX-024).
      - name: compliance report + coverage-floor gate (FEATURE-012 / TEST-PIX-024)
        working-directory: jess
        run: |
          tools/compliance/gen.sh | tee -a "$GITHUB_STEP_SUMMARY"
          rivet coverage --fail-under 60
      # Non-gating visibility: the open-defect punch-list + the V-gap
      # (non-draft requirements no test-spec verifies), emitted to the job
      # summary on every run via `rivet sql`. The gate is `validate` above;
      # this reports state so the V's right side can't drift open unseen.
      - name: rivet sql snapshot (punch-list + V-gap)
        if: always()
        working-directory: jess
        run: tools/rivet/snapshot.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # The shared-bench claim (AFD-081, DD-027) is the one BINARY jess ships, and gale runs it
  # on the same bench. A lock that silently fails to exclude is worse than no lock: both
  # agents then believe they hold the probe. So the tool's own `--self-test` is a CI gate,
  # not a thing someone remembers to run — it asserts exclusion under contention, release on
  # crash, refusal of an unregistered name, and the opposite-order pair completing without
  # deadlock. Negative-controlled: see the module header in src/main.rs for which mechanism
  # that last check actually discriminates on (it is hold-and-wait, not the sort).
  bench-tool:
    name: with-device (${{ matrix.os }})
    # BOTH platforms, because the tool ships on both and the difference is not theoretical:
    # the suite's `--version`-after-`--` case passed on macOS and FAILED on ubuntu, since GNU
    # coreutils `echo` interprets `--version` itself while BSD echo prints it. A single-platform
    # gate would have let that divergence through in either direction. The same asymmetry exists
    # in the subject under test — a second flock(2) on one fd succeeds on BSD and blocks on
    # Linux — so a same-device-twice bug would be invisible on a mac-only run.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: build + self-test
        working-directory: tools/bench/with-device
        run: |
          set -euo pipefail
          cargo build --release
          B=target/release/with-device
          # CLI baseline (pulseengine-cli-conventions): --version/-V and --help exit 0,
          # an unknown flag exits 2 with usage on stderr.
          test "$($B --version)" = "with-device $(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)"
          $B --help >/dev/null
          $B -V >/dev/null
          # `rc=0; cmd || rc=$?` and NOT `cmd; rc=$?` — under `set -e` the latter aborts the
          # step on the very failure it is trying to measure, so the assertion never runs.
          rc=0; $B --no-such-flag -- true 2>/dev/null || rc=$?
          test "$rc" = 2 || { echo "unknown flag rc=$rc, want 2"; exit 1; }
          $B --self-test
      # The actual test suite. `--self-test` is the FIELD check that ships in the binary and
      # runs where there is no source tree; it is not a substitute for this. The split is not
      # academic: the suite's first run found that mode flags were matched across the whole
      # argv, so `with-device probe -- mytool --version` printed with-device's own version and
      # exited 0 WITHOUT RUNNING mytool — and --self-test was green throughout, because it
      # never wraps a command containing a flag with-device also understands (AFD-084).
      - name: cargo test (unit + behavioural)
        working-directory: tools/bench/with-device
        run: cargo test --all
      - name: clippy + fmt
        working-directory: tools/bench/with-device
        run: |
          cargo fmt --check
          cargo clippy --release --all-targets -- -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
        if: matrix.os == 'ubuntu-latest'
      # Floor matched to what the suite actually achieves (96.8% lines locally), not set far
      # below it — a coverage gate parked well under the real number passes no matter what
      # rots, which is the vacuous-gate failure in yet another costume.
      # Once, on linux — the coverage number does not differ by platform and installing
      # llvm-cov twice buys nothing.
      - name: coverage floor
        if: matrix.os == 'ubuntu-latest'
        working-directory: tools/bench/with-device
        run: |
          cargo llvm-cov --summary-only --fail-under-lines 90 | tee -a "$GITHUB_STEP_SUMMARY"

  # The spar/AADL model of the Phase-2 platform must stay parseable + instantiable.
  spar-model:
    name: spar model (Pixhawk 6X-RT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned spar release
        run: |
          set -euo pipefail
          gh release download "$SPAR_VERSION" --repo pulseengine/spar \
            --pattern 'spar-*-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern 'SHA256SUMS.txt' --dir /tmp/spar
          cd /tmp/spar
          exp=$(grep 'x86_64-unknown-linux-gnu.tar.gz' SHA256SUMS.txt | awk '{print $1}')
          act=$(sha256sum ./*x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          test -n "$exp" && test "$exp" = "$act" || { echo "checksum mismatch"; exit 1; }
          tar xzf ./*x86_64-unknown-linux-gnu.tar.gz
          install -m755 "$(find . -name spar -type f | head -1)" /usr/local/bin/spar
        env:
          GH_TOKEN: ${{ github.token }}
      - name: spar parse + instance
        run: |
          spar parse hardware/pixhawk6x-rt.aadl
          spar instance --root Pixhawk6XRT::Pixhawk6XRT.v2a hardware/pixhawk6x-rt.aadl
      # REQ-PIX-007 / TEST-PIX-023 — the inter-core WIT contracts are DERIVED from
      # the AADL via spar (feature-loop step 2, never hand-written). Assert the
      # committed wit/ matches spar codegen from the model: a hand-edit or an
      # un-regenerated AADL change fails here. spar codegen is deterministic.
      - name: WIT-derivation gate (wit/ == spar codegen from AADL)
        run: tools/wit/regen.sh --check

  # REQ-PIX-010 oracle — the MAVLink bench decoder against a real committed
  # 6X-RT sample (CRC-gated, board-free, deterministic).
  mav-bench:
    name: mav_bench oracle (REQ-PIX-010)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mav_bench oracle over the committed sample
        run: python3 tools/bench/test_mav_bench.py

  # REQ-PIX-005 oracle — the hand-authored i.MX RT1176 Renode platform boots a
  # bring-up firmware to a banner on LPUART1 (CPU + ITCM/DTCM + UART end-to-end).
  renode-smoke:
    name: Renode RT1176 smoke (REQ-PIX-005)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Renode (pinned portable)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o renode.tgz https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable.tar.gz
          # Trust-on-first-use digest (Renode publishes none); same pin as release.yml.
          echo "1a532d4b5b82de0dd154970c401e0c7b0e498d17304b2cecc007e306c8f9617c  renode.tgz" | sha256sum -c -
          mkdir -p renode && tar xzf renode.tgz -C renode --strip-components=1
      - name: renode-test deps
        run: pip install -r /tmp/renode/tests/requirements.txt
      - name: RT1176 smoke (Robot)
        run: /tmp/renode/renode-test hardware/renode/rt1176-smoke.robot
      # The Renode model RELEASE ASSET (jess#299), exercised on every PR rather than first on a
      # real tag. A release-only step is a step whose first run is the release: if it is broken,
      # the tag is already pushed. So the same pack + consumer-verify the release runs, here.
      #   - packed TWICE from the same commit and required byte-identical (determinism)
      #   - unpacked fresh and run from cwd / as `renode --console --disable-xwt
      #     rt1176-smoke-check.resc` — plain Renode, NO host Python, no renode-test (maintainer
      #     decision on #299). The .resc asserts the boot line itself; a pass is exit 0 AND its
      #     "SMOKE PASS" line, because Renode exits 0 when the script path does not exist.
      #   - --self-test: 1 positive + 5 negative controls (an assertion the firmware never
      #     satisfies -> exit 3; the old repo-root paths -> exit 4 via the watchdog; three
      #     exact-set violations). The watchdog control waits out the .resc's 120 s on purpose.
      # The model's self-test is checked on BOTH Renode runtimes, because they behave
      # differently exactly where it matters (measured on this job, 2026-10-28):
      #   .NET  — fully conforming: boot line 0, line missing 3, load error 4.
      #   Mono  — the legacy linux-portable build installed above: line missing still 3, but a
      #           LOAD error exits 0, WITHOUT the "SMOKE PASS" line; nothing raised from
      #           ProcessExit changes the code on Mono. The pass contract (exit 0 AND the line)
      #           still rejects it. Documented limitation, accepted on jess#299.
      # verify.sh detects the runtime from the files beside the binary and grants the Mono
      # allowance only to a detected Mono, so .NET regressing to the Mono symptom fails here.
      # .NET is Renode's primary runtime (the only build for macOS, Windows and arm64 Linux).
      - name: Renode .NET build as well (the model self-test runs on both runtimes)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o renode-dotnet.tgz https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable-dotnet.tar.gz
          # Trust-on-first-use digest (Renode publishes none); two agreeing fetches, 2026-10-28.
          echo "00e113cdbd0f5354cf2f64bbe3f5a070d8958409542fca66e45ac97d982938c0  renode-dotnet.tgz" | sha256sum -c -
          # Installed OUTSIDE /tmp. In the first both-runtimes run, /tmp/renode-dotnet was present
          # after this step (digest OK, tar exit 0) and GONE by the time the .NET iteration ran,
          # after the Mono iteration — "renode not found". Leading hypothesis: Renode's temporary-
          # file cleanup (cf. its --keep-temporary-files) removing /tmp/renode-* on Linux. Not
          # reproduced on macOS .NET, so the canary below MEASURES it rather than assuming it.
          mkdir -p "$HOME/rn-dotnet" && tar xzf renode-dotnet.tgz -C "$HOME/rn-dotnet" --strip-components=1
          test -x "$HOME/rn-dotnet/renode"
          mkdir -p /tmp/renode-canary-jess && echo canary > /tmp/renode-canary-jess/f
      - name: Renode model asset — reproducible, and boots unpacked from cwd / on Mono AND .NET (jess#299)
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct HEAD)"
          C="$(git rev-parse HEAD)"
          python3 tools/renode-model/pack.py --version 0.0.0-ci --commit "$C" --out /tmp/model-a
          python3 tools/renode-model/pack.py --version 0.0.0-ci --commit "$C" --out /tmp/model-b
          cmp /tmp/model-a/jess-renode-rt1176-0.0.0-ci.tar.gz /tmp/model-b/jess-renode-rt1176-0.0.0-ci.tar.gz \
            || { echo "the Renode model archive is NOT reproducible from one commit"; exit 1; }
          echo "reproducible: two packs of $C are byte-identical"
          for rt in mono:/tmp/renode/renode dotnet:$HOME/rn-dotnet/renode; do
            echo "════ runtime: ${rt%%:*} (${rt#*:}) ════"
            RENODE="${rt#*:}" tools/renode-model/verify.sh /tmp/model-a/jess-renode-rt1176-0.0.0-ci.tar.gz
            RENODE="${rt#*:}" tools/renode-model/verify.sh --self-test /tmp/model-a/jess-renode-rt1176-0.0.0-ci.tar.gz
          done
          echo "the model self-test passes on 2 of 2 Renode runtimes (.NET fully; Mono with its documented load-error limitation)"
          if [ -e /tmp/renode-canary-jess/f ]; then
            echo "canary /tmp/renode-canary-jess SURVIVED the Renode runs — the cleanup hypothesis is NOT confirmed"
          else
            echo "canary /tmp/renode-canary-jess was DELETED during the Renode runs — Renode removes /tmp/renode-* here"
          fi
      - name: RT1176 bulk-memory OOB-trap oracle (synth#374 / AFD-026)
        run: /tmp/renode/renode-test hardware/renode/rt1176-bulkmem.robot
      - name: br_table selector-honored oracle (synth#507 / AFD-032, TEST-PIX-020)
        run: /tmp/renode/renode-test hardware/renode/synth507-brtable/brtable-507.robot
      # AFD-088: assert the image FITS the real part before running it on the model. m3.repl
      # used to declare 256 KB of SRAM while an STM32F100 has 8 KB, so an image whose stack
      # sat at 0x20020000 — outside physical RAM — passed this gate for six weeks. The
      # geometry check is cheap and runs first; if it fails, the robot's green would be about
      # a machine that cannot exist.
      # The geometry gate disassembles <entry> to read the linear-memory base. A plain x86_64
      # binutils cannot decode ARM, and the check then prints "(not located in <entry>)" and
      # passes — a check that silently does not check, which is the shape this whole gate
      # exists to catch. ~15 s of apt buys the assertion actually running.
      - name: arm-none-eabi binutils (so the geometry gate can decode ARM)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq binutils-arm-none-eabi
      # NEGATIVE CONTROL, because the first version of this gate was itself vacuous: it shelled
      # out to objcopy, which on a runner without ARM binutils cannot read the ELF, and then
      # reported "initial MSP: 0000000000  ok" and exited 0 — a PASS on a file it never parsed.
      # Assert it still REFUSES a file it cannot read before trusting anything it says.
      - name: F100 geometry gate — negative control (must refuse an unreadable file)
        run: |
          if hardware/renode/gust-m3/check-fits-real-f100.sh /dev/null; then
            echo "the geometry gate reported success on an unparseable file — it is vacuous"; exit 1
          fi
          echo "negative control OK: the gate refuses what it cannot parse"
      # SECOND control, the other direction: the first proves the gate refuses what it cannot
      # read; this proves it can still go RED on an image it CAN read. Shrinking the assumed
      # SRAM makes the committed (good) image fail the linmem-base check. Without this, a gate
      # that had quietly become incapable of failing would still pass both other steps.
      - name: F100 geometry gate — red control (must fail a good image on a shrunken SRAM)
        run: |
          if SRAM_SIZE_OVERRIDE=1024 hardware/renode/gust-m3/check-fits-real-f100.sh; then
            echo "the geometry gate PASSED an image that does not fit — it can no longer go red"; exit 1
          fi
          echo "red control OK: the gate still fails an image that does not fit"
      - name: F100 geometry gate — the image fits real silicon (AFD-088)
        run: hardware/renode/gust-m3/check-fits-real-f100.sh
      - name: gust F100/M3 byte-exact pass-through oracle (REQ-PIX-004 PART-P02, TEST-PIX-028)
        run: /tmp/renode/renode-test hardware/renode/gust-m3/passthrough-m3.robot
      - name: inter-core NavState crossing oracle (REQ-PIX-007, TEST-PIX-030)
        run: /tmp/renode/renode-test hardware/renode/navstate-xcore/navstate-crossing.robot
      - name: FUSED falcon cascade on the RT1176 M7 (TEST-PIX-031)
        run: /tmp/renode/renode-test hardware/renode/cascade-m7/falcon-cascade-m7.robot

  # TEST-PIX-032 / TEST-PIX-033 — the ON-TARGET oracles, promoted from local evidence to a
  # GATE. AFD-064 D4 recorded that none of the cascade-invoke oracles ran in CI, so every
  # on-target result this campaign reported was hand-run. The blocker was that the synth pin
  # was a single Mach-O digest no linux runner could satisfy; artifacts.pins now carries one
  # line per platform (AFD-071) and the linux digests were proven from macOS via
  # HOST_PLATFORM_OVERRIDE before this job was written.
  #
  # The toolchain here is FETCHED rather than varve-dispatched, because varve is not on the
  # runner. Those fetched binaries are byte-identical to what varve dispatches locally
  # (verified), so a CI result is comparable to a developer-machine result, and build.sh
  # judges ON-PIN by digest rather than by "an override was used".
  on-target-oracles:
    name: on-target cascade oracles (TEST-PIX-032 / TEST-PIX-033)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: arm-none-eabi toolchain
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-arm-none-eabi binutils-arm-none-eabi
          arm-none-eabi-gcc --version | head -1
      - name: Renode (pinned portable)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o renode.tgz https://github.com/renode/renode/releases/download/v1.16.1/renode-1.16.1.linux-portable.tar.gz
          # Trust-on-first-use digest (Renode publishes none); same pin as release.yml.
          echo "1a532d4b5b82de0dd154970c401e0c7b0e498d17304b2cecc007e306c8f9617c  renode.tgz" | sha256sum -c -
          mkdir -p renode && tar xzf renode.tgz -C renode --strip-components=1
          test -x /tmp/renode/renode
      - name: oras (for the gale-nano OCI pin)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          mkdir -p orasbin && tar xzf oras.tgz -C orasbin
          sudo install -m755 orasbin/oras /usr/local/bin/oras
          oras version | head -2
      - name: wasm-tools (pinned to the version used locally)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o wt.tgz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          mkdir -p wt && tar xzf wt.tgz -C wt --strip-components=1
          sudo install -m755 wt/wasm-tools /usr/local/bin/wasm-tools
          wasm-tools --version
      - name: wasmtime python module
        run: pip install -q -r tools/cascade-differential/requirements.txt
      # PREFLIGHT. The first run of this job failed at build step 2 with "wasm-tools not on
      # PATH" — a dependency this job simply did not install. Failing there wastes a full
      # fetch and build; worse, it names one missing tool at a time. Assert the whole set up
      # front so a gap is reported once, by name, before any work is done.
      - name: preflight — every tool the oracles invoke
        run: |
          set -euo pipefail
          missing=""
          for t in arm-none-eabi-gcc arm-none-eabi-ld arm-none-eabi-nm arm-none-eabi-objcopy \
                   arm-none-eabi-objdump wasm-tools perl python3 oras gh; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          [ -x /tmp/renode/renode ] || missing="$missing renode"
          python3 -c 'import wasmtime' 2>/dev/null || missing="$missing python-wasmtime-module"
          if [ -n "$missing" ]; then echo "MISSING:$missing" >&2; exit 1; fi
          echo "all oracle dependencies present"
      - name: fetch every pinned artifact from a clean checkout
        run: tools/deps/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: build the cascade image (pinned toolchain, fetched)
        run: |
          set -euo pipefail
          REQUIRE_ON_PIN=1 MELD=.scratch/meld/meld LOOM=.scratch/loom/loom \
            hardware/renode/cascade-invoke/build.sh
      # The gate. A wrong lowering, a broken embedder promise, or a stale image all fail here.
      # RQ-62-VERIFYEMBED (synth #1132). jess's embedder objects are compiled with
      # -ffixed-r9/-r10/-r11 and the contract was BELIEVED on the strength of those flags —
      # synth's own help names the hazard exactly: "a flag that silently stopped applying looks
      # exactly like one that works". This checks the EMITTED code instead.
      #
      # CHECKED AND BUILT with the SAME pinned synth (0.64.0). This used to fetch 0.62.0
      # separately because the pin (0.60.0) predated verify-embedder; the pin now carries it, so
      # the second download was pure accretion — a stale version left behind by a bump is exactly
      # the drift this repo keeps finding.
      #
      # _reset is the legitimate establishment site (boot.S sets R9/R10/R11 before the first
      # export runs); --allow-writer records that a human accepted that obligation for exactly
      # that symbol, and for no other.
      - name: embedder ABI — no code writes R9/R10/R11 outside the establishment site
        run: .scratch/synthpin/synth verify-embedder --allow-writer _reset .scratch/invoke/invoke.elf
      # NEGATIVE CONTROL: the check must still REFUSE when the establishment site is not
      # acknowledged. Without this, a verify-embedder that had quietly become incapable of
      # refusing would pass the step above and prove nothing.
      - name: embedder ABI — negative control (must refuse without --allow-writer)
        run: |
          if .scratch/synthpin/synth verify-embedder .scratch/invoke/invoke.elf; then
            echo "verify-embedder ACCEPTED an image whose boot code writes R9/R10/R11 — it can no longer refuse"; exit 1
          fi
          echo "negative control OK: unacknowledged reserved-register writes are refused"
      # The embedder-init rung (AFD-107). extract_init.py emitted tables that NOTHING
      # consumed; apply_init.c is the loop that consumes them. CI builds and gates the
      # image; the SILICON leg cannot run here (no ST-Link on a hosted runner) and that
      # gap is named rather than implied — see hardware/silicon/f100-init/README.md.
      - name: embedder-init — parser self-test (incl. a must-refuse negative control)
        run: python3 tools/embedder-init/extract_init.py --self-test
      - name: embedder-init — build the F100 image on the PIN, gated by verify-embedder
        run: |
          set -euo pipefail
          REQUIRE_VERIFY=1 SYNTH=.scratch/synthpin/synth SYNTH_VERIFY=$PWD/.scratch/synthpin/synth \
            hardware/silicon/f100-init/build.sh
      # The tables must be NON-EMPTY. An extractor that silently produced a zero-segment,
      # zero-global init would satisfy the obligation vacuously and link just as cleanly.
      - name: embedder-init — the cascade's real tables are non-empty and link clean
        run: |
          set -euo pipefail
          python3 tools/embedder-init/extract_init.py .scratch/invoke/c.loom.wasm \
            --out-c /tmp/ct.c --out-manifest /tmp/ct.json
          segs=$(python3 -c "import json;print(len(json.load(open('/tmp/ct.json'))['segments']))")
          globs=$(python3 -c "import json;print(len(json.load(open('/tmp/ct.json'))['globals']))")
          echo "cascade tables: $segs segment(s), $globs global(s)"
          [ "$segs" -gt 0 ] && [ "$globs" -gt 0 ] || { echo "EMPTY init tables — vacuous"; exit 1; }
          CPU="-mcpu=cortex-m4 -mfpu=fpv4-sp-d16 -mfloat-abi=hard -mthumb"
          arm-none-eabi-gcc -c $CPU -ffreestanding -O2 /tmp/ct.c -o /tmp/ct.o
          arm-none-eabi-gcc -c $CPU -ffreestanding -O2 hardware/silicon/f100-init/apply_init.c -o /tmp/ap.o
          .scratch/synthpin/synth compile .scratch/invoke/c.loom.wasm -t cortex-m4f --cortex-m \
            --relocatable --embedder-data-init --embedder-global-init -o /tmp/casc.o
          arm-none-eabi-ld -r /tmp/casc.o /tmp/ap.o /tmp/ct.o \
            "$(arm-none-eabi-gcc $CPU -print-libgcc-file-name)" -o /tmp/linked.o
          test -f /tmp/linked.o
          n=$(arm-none-eabi-nm /tmp/linked.o | wc -l)
          [ "$n" -gt 0 ] || { echo "nm saw no symbols — the next check would be vacuous"; exit 1; }
          u=$(arm-none-eabi-nm /tmp/linked.o | awk '$1=="U"||$2=="U"{print $NF}' | sort -u)
          [ -z "$u" ] || { echo "undefined after linking: $u"; exit 1; }
          # NOTE: 0 undefined holds only because libgcc is linked in above; the cascade
          # object alone leaves __aeabi_f2lz/__aeabi_l2f/__aeabi_ul2f — the known AFD-046
          # obligation, not a regression.
          echo "cascade + generic apply loop (with libgcc): $n symbols, 0 undefined"
      # EXECUTE the apply loop, do not merely link it. Clean-room verification showed the
      # step above still passes with jess_wasm_apply_init gutted to `return;` — it gates
      # LINKABILITY, not CONSUMPTION. This runs the real loop over the real cascade tables
      # on the host and compares the result against wasmtime's own instantiated memory,
      # plus an anti-splat check that a byte outside every declared segment is untouched.
      - name: embedder-init — the apply loop is EXECUTED and matches wasmtime
        run: |
          set -euo pipefail
          cc -O2 -o /tmp/hostapply /tmp/ct.c hardware/silicon/f100-init/apply_init.c \
            tools/embedder-init/host_apply_main.c
          /tmp/hostapply /tmp/mem.bin /tmp/glob.bin
          python3 tools/embedder-init/check_apply.py .scratch/invoke/c.loom.wasm \
            /tmp/ct.json /tmp/mem.bin /tmp/glob.bin
      # NEGATIVE CONTROL: a no-op apply loop must be REFUSED. Without this row the step
      # above could quietly lose its ability to detect exactly what it exists to detect.
      - name: embedder-init — negative control (a gutted apply loop must FAIL)
        run: |
          set -euo pipefail
          printf 'typedef unsigned char u8; typedef unsigned int u32;\nvoid jess_wasm_apply_init(u8*l,u32*g){(void)l;(void)g;}\n' > /tmp/noop.c
          cc -O2 -o /tmp/hostnoop /tmp/ct.c /tmp/noop.c tools/embedder-init/host_apply_main.c
          /tmp/hostnoop /tmp/nmem.bin /tmp/nglob.bin
          if python3 tools/embedder-init/check_apply.py .scratch/invoke/c.loom.wasm \
               /tmp/ct.json /tmp/nmem.bin /tmp/nglob.bin; then
            echo "a NO-OP apply loop PASSED the check — it can no longer detect non-consumption"; exit 1
          fi
          echo "negative control OK: a gutted apply loop is refused"
      # synth#1189 (AFD-114). The pin was bumped on the strength of a two-binary differential
      # whose evidence lived only as prose in a findings file — nothing could re-run it.
      # This asserts the property directly on the pinned synth: the if/else join must not
      # alias a param's home register. Potency verified both ways (passes on 0.64.0, fails
      # on 0.60.0 with `adds r3, r0, r0`).
      - name: lowering — synth#1189 join-alias signature is absent from the pinned synth
        run: tools/lowering/joinalias/check.sh
        env:
          SYNTH: .scratch/synthpin/synth
      # H3 first half (AFD-109). gust:hal read32/write32 as REAL MMIO. CI builds and gates
      # the image and asserts the SEAM exists; the silicon leg needs an ST-Link and is
      # hand-run against the bench (see hardware/silicon/f100-gust-hal/README.md).
      - name: gust:hal — build the F100 MMIO image on the PIN, gated by verify-embedder
        run: |
          set -euo pipefail
          REQUIRE_VERIFY=1 SYNTH=.scratch/synthpin/synth SYNTH_VERIFY=$PWD/.scratch/synthpin/synth \
            hardware/silicon/f100-gust-hal/build.sh
      # NEGATIVE CONTROL for the seam assertion: a probe that does NOT call out to gust:hal
      # must be REFUSED. Without this, the "seam present" check could quietly stop detecting
      # a probe that had been inlined or stubbed, and the rung would measure nothing.
      - name: gust:hal — negative control (a probe with no HAL imports must be refused)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          printf '(module (func (export "read_idcode") (result i32) (i32.const 66)))\n' > "$d/probe.wat"
          cp hardware/silicon/f100-gust-hal/{gust_hal.c,boot.S,link.ld,build.sh} "$d/"
          if SYNTH=$PWD/.scratch/synthpin/synth OUT="$d/out" "$d/build.sh" >"$d/log" 2>&1; then
            echo "a probe with NO gust:hal imports was ACCEPTED — the seam assertion is vacuous"; exit 1
          fi
          grep -q 'gust:hal seam is absent' "$d/log" \
            || { echo "refused, but NOT for the seam reason:"; tail -5 "$d/log"; exit 1; }
          echo "negative control OK: a probe that never calls gust:hal is refused, by that reason"
      # The gale-nano lowering claim, verified against the PINNED artifact rather than the
      # brief. NOTE the embedder-init flags: without them synth correctly refuses (#1041,
      # 11 active data segments) and the result reads as "gale-nano does not lower".
      - name: gust:hal — gale-nano lowers ALL exported functions on all 3 cores (counts, not a word-grep), residual by symbol
        run: |
          set -euo pipefail
          G=.scratch/galenano/gale-nano.wasm
          test -f "$G"
          for core in cortex-m3 cortex-m4f cortex-m7dp; do
            .scratch/synthpin/synth compile "$G" -t $core --cortex-m --relocatable --all-exports \
              --embedder-data-init --embedder-global-init -o /tmp/gn.$core.o > /tmp/gn.$core.log 2>&1
            # ASSERT THE DENOMINATOR, not the absence of a word. This used to be
            #     n=$(grep -ci 'skip' log || true); [ "$n" = 0 ] || exit 1
            # which grep-scraped synth's PROSE — and this repo's own CLI conventions say why
            # that is wrong: "Grep-scraping human output is how gates go vacuous."
            # NEGATIVE-CONTROLLED 2026-10-21 (AFD-139), four cases, one variable each:
            #   real log                      old PASS   new PASS (21/21 lowered)
            #   decline worded "declining"    old PASS   new FAIL (20 of 21)   <- BLIND
            #   decline worded "skipping"     old FAIL   new FAIL (20 of 21)
            #   EMPTY log                     old PASS   new CANNOT DETERMINE  <- BLIND
            # Both blind phrasings are literals in the PINNED synth binary — `loud-declining
            # (#851)`, `loud-declining (#1072)`, `refusing rather than emitting` — so the old
            # gate was potent for one wording of a decline and silent for synth's own others.
            # The empty-log case is worse and was not predicted: a truncated or absent log gave
            # a CLEAN PASS over no evidence at all.
            # synth states its own denominator — "Found N exported functions" and "Compiled N
            # functions" — so a declined function makes Compiled < Found whatever it is CALLED.
            # Missing either number is CANNOT DETERMINE and fails, never a quiet zero.
            f=$(grep -oE 'Found [0-9]+ exported functions' /tmp/gn.$core.log | grep -oE '[0-9]+' | head -1)
            c=$(grep -oE '^Compiled [0-9]+ functions' /tmp/gn.$core.log | grep -oE '[0-9]+' | head -1)
            if [ -z "$f" ] || [ -z "$c" ]; then
              echo "$core: CANNOT DETERMINE — synth's log states no function counts"
              echo "  found='$f' compiled='$c'. That is 'could not read the evidence', NOT"
              echo "  '0 skips'. If synth changed its summary wording, FIX THIS GATE rather"
              echo "  than letting it pass over a log it can no longer parse."
              cat /tmp/gn.$core.log; exit 1
            fi
            [ "$f" = "$c" ] || { echo "$core: lowered $c of $f exported functions"; cat /tmp/gn.$core.log; exit 1; }
            echo "$core: exit 0, $c/$f exported functions lowered, $(stat -c%s /tmp/gn.$core.o) B"
          done
          u=$(arm-none-eabi-nm /tmp/gn.cortex-m3.o | awk '$1=="U"||$2=="U"{print $NF}' | sort -u | tr '\n' ' ')
          echo "gale-nano native residual: $u"
          # read32 must be among them: it is the symbol this rung supplies for real, and if it
          # stopped appearing the H3 burn-down above would be describing something else.
          echo "$u" | grep -qw read32 || { echo "read32 is NOT in gale-nano's residual"; exit 1; }
      - name: TEST-PIX-032 — cascade stage executes and matches relay's SIL reference
        run: hardware/renode/cascade-invoke/run-oracle.sh
        env:
          RENODE: /tmp/renode/renode
      - name: TEST-PIX-033 — 64-tick soak tracks the wasmtime reference
        run: hardware/renode/cascade-invoke/run-soak-oracle.sh
        env:
          RENODE: /tmp/renode/renode
      # TEST-PIX-035 — the ESTIMATOR rung, NOW GATED. This comment used to end "Wire the
      # oracle in when it passes", and it passes on synth 0.88.0, so it is wired.
      #
      # It was deliberately UNGATED from 2026-09-30 until now because it FAILED: the estimator
      # executed on emulated RT1176 with only 10 of 14 state words bit-exact (AFD-125). An
      # "expected-fail" gate would have been a vacuous gate — green the moment the divergence
      # changed shape rather than when it was fixed — so it stayed out and said so.
      #
      # synth 0.88.0 fixes the lowering defect (synth#1436, closed COMPLETED: a float
      # `local.tee` could overwrite a local's home register while an earlier copy was still on
      # the operand stack). Measured before this step was added, with the criterion registered
      # in advance: 0.87.0 gives 10/14 at tick 1 and 8/14 at tick 16; 0.88.0 gives 14/14 at
      # BOTH horizons and reproduces wasmtime's fold 6ec49e30 exactly.
      #
      # So this gate is potent by construction: the pinned-synth-minus-one case is a measured
      # RED, which is the negative control the gate-potency rule asks for.
      - name: TEST-PIX-035 — the ESTIMATOR matches wasmtime on emulated RT1176 (AFD-125 closed)
        run: hardware/renode/cascade-invoke/run-ekf-oracle.sh
        env:
          RENODE: /tmp/renode/renode
      - name: ekf reference vacuity guards self-test (AFD-125)
        run: python3 tools/cascade-differential/ekf_ref.py --self-test
      # The observer-seam decoder constants (DD-028). Only --self-test is gated: relay has NOT
      # published @0.11.0 (nothing tagged; two independent reviews returned DO-NOT-TAG), so the
      # real check exits 2 = CANNOT RUN rather than passing. The self-test is the part that is
      # decidable today, and its negative control is jess's OWN wrong layout — which would have
      # aliased `valid` onto `failed-rotor`, whose 0xFF no-fault sentinel reads as "all fields
      # valid" on a healthy vehicle and 0x00 as "nothing measured" on a real rotor failure.
      # Wire the artifact check in when a tag carries the seam.
      - name: observer-seam decoder offsets — guards self-test (DD-028)
        run: python3 tools/abi/check-observer-layout.py --self-test

  # The COMPONENT-LEVEL oracles, promoted from local evidence to a gate.
  #
  # AFD-071 put the two cascade oracles in CI and that was read as closing AFD-064 D4. It
  # did not: an exact-path audit of ci.yml found NINE oracles that CI never runs, so most of
  # this campaign's component-level claims still rested on hand-run evidence (AFD-074).
  # These four are the wasmtime-level ones — no Renode, so they are cheap — and they cover
  # the composed stack (AFD-044), the dispatch contract (AFD-067) and the timer/flight-loop
  # experiments that DD-025 rests on.
  #
  # tools/fusion-matrix/run.sh is deliberately NOT here: it invokes `varve run` directly and
  # has no MELD/LOOM/SYNTH override, so it cannot run without varve on the runner. That is a
  # named gap, not an oversight.
  component-oracles:
    name: component oracles (composition, dispatch, timer)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: rust wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: wasm-tools / wac / wasmtime (pinned to the versions used locally)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o wt.tgz https://github.com/bytecodealliance/wasm-tools/releases/download/v1.245.1/wasm-tools-1.245.1-x86_64-linux.tar.gz
          mkdir -p wt && tar xzf wt.tgz -C wt --strip-components=1
          sudo install -m755 wt/wasm-tools /usr/local/bin/wasm-tools
          curl -fsSL -o wac https://github.com/bytecodealliance/wac/releases/download/v0.10.1/wac-cli-x86_64-unknown-linux-musl
          sudo install -m755 wac /usr/local/bin/wac
          curl -fsSL -o wasmtime.tar.xz https://github.com/bytecodealliance/wasmtime/releases/download/v42.0.1/wasmtime-v42.0.1-x86_64-linux.tar.xz
          mkdir -p wtm && tar xJf wasmtime.tar.xz -C wtm --strip-components=1
          sudo install -m755 wtm/wasmtime /usr/local/bin/wasmtime
          wasm-tools --version && wac --version && wasmtime --version
      - name: oras (for the gale-nano OCI pin)
        run: |
          set -euo pipefail
          cd /tmp
          curl -fsSL -o oras.tgz https://github.com/oras-project/oras/releases/download/v1.2.0/oras_1.2.0_linux_amd64.tar.gz
          mkdir -p orasbin && tar xzf oras.tgz -C orasbin
          sudo install -m755 orasbin/oras /usr/local/bin/oras
      - name: wasmtime python module
        run: pip install -q -r tools/cascade-differential/requirements.txt
      # Assert the whole dependency set up front. AFD-072: discovering missing tools one at a
      # time, after a full fetch and build, wastes a run per gap and names only one of them.
      - name: preflight — every tool these oracles invoke
        run: |
          set -euo pipefail
          missing=""
          for t in cargo wac wasm-tools wasmtime oras gh python3; do
            command -v "$t" >/dev/null 2>&1 || missing="$missing $t"
          done
          python3 -c 'import wasmtime' 2>/dev/null || missing="$missing python-wasmtime-module"
          rustup target list --installed | grep -q wasm32-unknown-unknown || missing="$missing wasm32-target"
          if [ -n "$missing" ]; then echo "MISSING:$missing" >&2; exit 1; fi
          echo "all component-oracle dependencies present"
      - name: fetch every pinned artifact from a clean checkout
        run: tools/deps/fetch.sh
        env:
          GH_TOKEN: ${{ github.token }}
      # MELD/LOOM are supplied because varve is not on the runner; appcompose derives its
      # fused core from the pinned stage components rather than depending on an unreproducible
      # file (AFD-075).
      # The baked interface version must agree with what the PINNED artifacts export.
      #
      # AFD-141. AFD-121's rule — do not hardcode the falcon interface version — was enforced
      # in ONE leg only: ifacever.find_export resolves it agnostically for the Python/synth
      # path. WIT imports and WAC plug expressions name the version LITERALLY and have no
      # agnostic form, so that leg had no mechanism and nothing said so. The v1.139 -> v1.140
      # pin bump left 18 literal sites across 10 files on 0.10.0; 8 of 9 checks went green and
      # `wac compose` failed with "the instance has no export named …/rate@0.10.0", which also
      # SKIPPED three further oracles in this job — unverified, not fine.
      #
      # Runs AFTER the fetch (it derives the expected version from the artifact, never from a
      # constant here) and BEFORE the compose, so the message names the cause instead of
      # surfacing as a wac resolution error. --self-test carries 1 positive and 3 negative
      # controls, including the per-line-vs-per-match blindness NC2 caught before this shipped.
      - name: baked interface version agrees with the pinned artifacts (AFD-141)
        run: |
          tools/abi/check-iface-version.sh
          tools/abi/check-iface-version.sh --self-test
      - name: the full wasm stack composes and RUNS (AFD-044)
        run: |
          set -euo pipefail
          MELD=.scratch/meld/meld LOOM=.scratch/loom/loom \
            tools/appcompose/build-and-verify.sh
      - name: gale-nano dispatch contract — poll-round drains through poll-task (AFD-067)
        run: tools/dispatch/run.sh
      - name: flight-loop composition (DD-025)
        run: tools/flight-loop/run.sh
      - name: timer probe — the clock behaviour DD-025 rests on (AFD-047)
        run: tools/timer-probe/run.sh

  # REQ-PIX-018 leg b (TEST-PIX-022) — the DO-333 sound-static-analysis leg of
  # the V, on the CONSUMED (stripped) falcon wasm: fetch a pinned falcon
  # component -> meld fuse -> scry (scry-sai-core) analyze -> assert the analysis
  # completes with ZERO unsound-fallback (every call_indirect edge resolved
  # soundly). Complements relay's source-level MC/DC (jess can't run it on the
  # stripped release); deviation at hub pulseengine.eu#98.
  scry-gate:
    name: scry sound-analysis (REQ-PIX-018 / TEST-PIX-022)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch pinned meld release
        run: |
          set -euo pipefail
          gh release download "$MELD_VERSION" --repo pulseengine/meld \
            --pattern 'meld-*-x86_64-unknown-linux-gnu.tar.gz' \
            --pattern 'SHA256SUMS.txt' --dir /tmp/meld
          cd /tmp/meld
          exp=$(grep 'x86_64-unknown-linux-gnu.tar.gz' SHA256SUMS.txt | awk '{print $1}')
          act=$(sha256sum ./*x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          test -n "$exp" && test "$exp" = "$act" || { echo "checksum mismatch"; exit 1; }
          tar xzf ./*x86_64-unknown-linux-gnu.tar.gz
          install -m755 "$(find . -name meld -type f | head -1)" /usr/local/bin/meld
        env:
          GH_TOKEN: ${{ github.token }}
      - name: scry gate (fuse + sound-analysis assert)
        run: tools/scry-gate/run.sh | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      # TEST-PIX-026 — fused-core byte-reproducibility (meld#325): two --reproducible
      # fusions of the same falcon component must be byte-identical (negative-controlled
      # against default no-flag fusion). Prerequisite for a re-verifiable REQ-PIX-018
      # attestation + sigil-signable FIRST-FLASH set. Reuses the meld installed above.
      - name: fused-core reproducibility gate (TEST-PIX-026)
        run: tools/repro/fuse-repro-oracle.sh | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
      # TEST-PIX-029 — sigil attestation (DD-023 terminal rung): keygen -> sign the
      # path-independent reproducible fused core -> verify==true; a 1-byte tamper must
      # verify==false. Builds sigil-run (wasmtime host over sigil's wsc signing component);
      # reuses the meld installed above.
      - name: sigil attestation gate (TEST-PIX-029)
        run: tools/sigil-gate/run.sh | tee -a "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

  # NOTE: a third job building the hermetic falcon firmware chain
  # (bazel build //:falcon-validate //:falcon-optimized //:falcon-fused
  # //:falcon-firmware against the pinned rules_wasm_component v1.1.0) is the
  # next CI addition — deferred until validated in the runner environment
  # (it fetches the rwc git_override + the wasm toolchain bundle + the relay
  # http_file asset). Tracked alongside REQ-PIX-001.
