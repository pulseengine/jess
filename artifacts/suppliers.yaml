  - id: EXTERNALANCHOR-006
    type: external-anchor
    title: loom optimizer — supplier boundary
    status: accepted
    description: >
      loom is the wasm optimizer used in the jess forward chain. It is an external supplier; its internal implementation is not traced in this repository. A defect was found against loom v0.3.0 prebuilt during the jess bootstrap forward-chain experiment on falcon-flight-v1.26.wasm and recorded as an ai-found-defect in findings.yaml.
    tags: [supplier, optimizer]
    fields:
      expected-derived-types: ["ai-found-defect"]
      received-status: not-received
      source-of-truth: {"org": "pulseengine", "doc-id": "loom-optimizer-interface"}
    links:
      - type: traces-to
        target: REQ-001

  - id: EXTERNALANCHOR-007
    type: external-anchor
    title: wit-bindgen (PulseEngine fork) — binding generator supplier boundary
    status: accepted
    description: >
      pulseengine/wit-bindgen is the PulseEngine fork of the WebAssembly interface-types binding generator (synced to upstream 0.58.0). It is the SOURCE of the guest-side canonical-ABI code (cabi_realloc, lifting/lowering, async stream helpers) that jess's all-wasm components carry into the meld -> loom -> synth MCU lowering. An external supplier; its internal implementation is not traced here. Defects affecting jess's on-target (no-grow / no_alloc / real-time) line are recorded as ai-found-defects against this boundary.
    tags: [supplier, wit-bindgen, codegen, on-target]
    fields:
      expected-derived-types: ["ai-found-defect"]
      received-status: not-received
      source-of-truth: {"org": "pulseengine", "doc-id": "wit-bindgen-fork-interface"}
    links:
      - type: traces-to
        target: REQ-001

  - id: EXTERNALANCHOR-008
    type: external-anchor
    title: spar (AADL→WIT/analysis) — architecture-model supplier boundary
    status: accepted
    description: >
      pulseengine/spar is the AADL modeling + analysis tool: jess's hardware/pixhawk6x-rt.aadl is the source of truth for the 3-core + peripheral architecture, and `spar codegen --format wit` DERIVES the inter-core WIT contracts from it (REQ-PIX-007 / TEST-PIX-023, the WIT-derivation CI gate). An external supplier; its internal implementation is not traced here. Defects affecting jess's model->WIT derivation (e.g. structured data types) are recorded as ai-found-defects against this boundary.
    tags: [supplier, spar, aadl, wit, codegen]
    fields:
      expected-derived-types: ["ai-found-defect"]
      received-status: not-received
      source-of-truth: {"org": "pulseengine", "doc-id": "spar-codegen-wit"}
    links:
      - type: traces-to
        target: REQ-PIX-007
