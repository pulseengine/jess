  - id: REQ-PIX-012
    type: requirement
    title: Bind the relay-hal peripheral seams (RegBus/SerialBus/PwmOut/AdcIn/CanBus) to i.MX RT1176 silicon - BSP + embedded-hal impls + on-silicon validation
    status: draft
    release: v0.7.0
    description: >
      jess's half of the relay<->jess HAL contract (jess#62 / relay#214, DD-012):
      relay owns the portable verified peripheral ABSTRACTION (the bus/peripheral
      seam traits + protocol bodies + WIT wiring); jess owns the BINDING to real
      silicon. Deliver: (1) the RT1176 BSP (clock tree, pinmux, the 6X-RT bus
      topology - which sensor on which LPSPI/LPI2C); (2) embedded-hal-grade impls
      of each relay-hal seam over the RT1176 peripherals - RegBus->LPSPI(IMUs)+
      LPI2C(baro/mag/FRAM), SerialBus->LPUART(GPS/telem, DMA), PwmOut->FlexIO+eDMA
      (DShot, frame-based) / eFlexPWM (duty), AdcIn->LPADC(battery/current),
      CanBus->FlexCAN(CAN-FD); each with DMA + IRQ + bus-error recovery; (3)
      per-board calibration values (accel/gyro/mag mounting remap, baro NVM trim);
      (4) on-silicon validation the protocol-only Kani harnesses can't reach
      (timing, FIFO/data-ready IRQs, bus-error recovery); (5) first HIL bring-up.
      Phase-1 = on-FMU peripherals (SPI/I2C sensors, LPADC battery, FlexIO DShot);
      Phase-2 = external via connectors (LPUART GPS/telem, FlexCAN DroneCAN).
      Feeds REQ-PIX-003 (on-silicon ICM-42688-P sensor validation) and REQ-PIX-006
      (DroneCAN/CAN-FD). Gated on relay freezing the relay-hal trait shapes
      (DD-012 resolves the 3 open questions: single-core M7 first / carrier-
      transparent seams; FlexIO+eDMA frame-based DShot; async P3-stream traits).
      SCOPE = THREE silicon targets (iter#38, architect corrected on jess#62 - RT1176
      is dual-core): T1 RT1176 Cortex-M7 (falcon); T2 RT1176 Cortex-M4 (2nd on-die
      core, sensor-I/O offload, M4 side of relay#177); T3 STM32F100 Cortex-M3 (gust
      failsafe, REQ-PIX-009/DD-011) binding a subset (PwmOut duty, SerialBus RC/SBUS,
      relay#177 carrier) via gust's minimal-sync 5-import TCB narrowing. One seam
      contract across three cores; M7<->M4 and FMU<->IO are both relay#177 carriers.
    fields:
      category: functional
      priority: should
    links:
      - type: traces-to
        target: FEATURE-002

  - id: REQ-PIX-015
    type: requirement
    title: Firmware-update + non-volatile persistence architecture for the RT1176 target (must be modeled before finalizing the storage/ROM route)
    status: draft
    release: v0.8.0
    description: >
      jess must define how (a) parameters/calibration persist and (b) firmware is
      updated on the Pixhawk 6X-RT, BEFORE committing to the "own driver, no i.MX
      ROM API" storage route (DD-016) - because firmware update IS octal-NOR write,
      exactly what the ROM exists for. Grounded in the PX4 v6xrt source: persistence
      = FRAM (FM25V02A, MTD_PARAMETERS) over its own FlexSPI driver, NOT the ROM;
      firmware update = a bootloader that programs the app NOR over USB-DFU using
      ROM_FLEXSPI_NorFlash_Erase/ProgramPage (the genuinely-hard read-while-write
      octal-NOR path the ROM solves). The flight app's only ROM touch is a fast-XIP
      re-init (CONFIG_BOARD_BOOTLOADER_FIXUP) - performance-only, not required.
      jess must decide: the in-flight TCB carries NO ROM (verified falcon+gale+FRAM
      driver); the on-ground UPDATE TCB (bootloader) either reuses the ROM NOR
      driver (update-time-only opaque code) or ships jess's own verified NOR driver;
      integrity (the safety-critical part) is sigil-signed images + relay-sec
      authenticated transport + anti-rollback, regardless. See DD-016.
    fields:
      category: functional
      priority: should
    links:
      - type: traces-to
        target: FEATURE-002

  - id: REQ-PIX-014
    type: requirement
    title: PX4-on-Renode HITL — boot the real fmu-v6xrt firmware on the RT1176 model, then co-simulate with Gazebo physics in lockstep
    status: draft
    release: v0.8.0
    description: >
      Take the Renode RT1176 platform from boot-a-stub-firmware (REQ-PIX-005) to
      running the REAL PX4 fmu-v6xrt firmware, then to a hardware-in-the-loop
      co-simulation against a Gazebo physics model - per DD-008's staged method and
      the full-arc scope (user, iter#39). Stages: (2) boot PX4 to the nsh console -
      the boot->unhandled-access->stub/model loop over clock (ANADIG/CCM/LPCG, done),
      timers, console LPUART, and the rest; (3) sensor-in-the-loop - ICM-42688-P over
      LPSPI+eDMA (Renode RESD), baro/mag over LPI2C, so PX4's EKF sees live sensors;
      (4) multi-core - the M4 + MU and the STM32F100 IO-MCU as a second machine (the
      DD-012 three targets); (5) Gazebo HITL - bridge sensor-in / actuator-PWM-out
      between Renode (real firmware on the M7) and a Gazebo physics model in lockstep
      via a custom C# proxy peripheral or the SystemC renode_bridge over a socket
      (no off-the-shelf Renode<->Gazebo exists - original integration). Each stage
      SIL-differential gated (runbook 3a). Harness lives in hardware/renode/px4/.
      Status iter#39: stage 2 in progress - PX4 boots, clock bring-up cleared,
      frontier at timer/AON peripheral init. Renode installed locally for the
      interactive loop; CI stays the hermetic regression gate.
      Status iter#43: PX4 BUILT FROM SOURCE (pinned Arm GNU 12.3.Rel1 + full python
      deps, /Volumes/Home) -> symbol'd ELF (20314 syms). Boot path fully DECODED: the
      post-console blocker is imxrt_octl_flash_initialize -> the i.MX RT1176 BOOT-ROM
      ROM-API (FlexSPI-NOR). Exact ABI captured (chip-ver reg 0x40C84800==0x001170A0;
      ROM tree @ base+0x1C; tree+12->driver; driver+4->init). A stub to this ABI moved
      the abort 0xFFFFFFFE (null tree) -> 0x00220000 (firmware calls a REAL boot-ROM fn
      past the stub) - i.e. the boot ROM is the gate. Two clean paths to nsh (next iter):
      (1) rebuild PX4 with imxrt_octl_flash_initialize no-op'd for a Renode board variant
      (FlexSPI is plain memory in the model -> romapi unneeded) - PREFERRED, source+
      toolchain now set up; (2) full romapi/boot-ROM stub. Decode + recipe in
      hardware/renode/px4/README.md + anadig_stub.py.
    fields:
      category: functional
      priority: should
    links:
      - type: traces-to
        target: FEATURE-002

  - id: TEST-PIX-010
    type: test-spec
    title: mav_bench decodes a real 6X-RT MAVLink sample (CRC-valid), identifies PX4, extracts attitude
    status: valid
    description: >
      Host oracle (tools/bench/test_mav_bench.py) over the committed real sample
      repro/pixhawk-bench/mavlink-sample.bin (8424 B captured from the connected
