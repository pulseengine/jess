      hardware. Full HIL (falcon firmware + cross-validation vs the real board) is
      REQ-PIX-011.
    tags: [phase-2, renode, hil, smoke]
    links:
      - type: verifies
        target: REQ-PIX-005

  - id: TEST-PIX-016
    type: test-spec
    title: gust boots + runs N poll rounds on a Renode stm32f103 (Cortex-M3) - hermetic silicon-shaped confirmation of the synth v0.11.51 8KB link
    status: draft
    description: >
      The silicon-confirm rung for REQ-PIX-009 (c), greenlit by the synth/gale side on
      gale#65 (avrabe, 2026-06-22): an intermediate hermetic confirmation between qemu
      (lm3s6965evb, where #383 was validated) and the physical STM32F100, using Renode's
      stm32f103 model (Cortex-M3 = thumbv7m, the same --target cortex-m3 path the shrink
      was validated on). Robot oracle (hardware/renode/ pattern, pinned Renode v1.16.1,
      no board write): load a hand-authored stm32f103 .repl + the linked gust 8KB image,
      boot, assert >=N stable poll rounds with correct mix() values (the gust superloop
      liveness oracle), and confirm the image fits RAM=8K.
