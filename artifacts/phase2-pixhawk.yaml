  - id: REQ-PIX-009
    type: requirement
    title: Maximal-wasm gale-nano on the STM32F100 I/O MCU - minimal verified gale subset + kiln async scheduler, synth-compiled, thin native register shim
    status: draft
    release: v0.9.0
    description: >
      gale-nano = {gale sem/mutex/msgq/timeout/event control primitives} +
      kiln-async scheduler + a ~4-item native shim (vector table+reset, one SysTick
      ISR for tick/fuel, the failsafe MMIO PWM/RC-SBUS/IPC-UART, and one net-new
      "wake-from-ISR" primitive = Embassy __pender), all fused (meld) + loom +
      synth-compiled to thumbv7m-none-eabi. No Zephyr, no preemptive kernel.
      GROUNDED in a measured op-set profile (iter#32-33 deep-dive, jess + gale-side,
      gale#65): kiln-async IS the scheduler (no_std, no_alloc, fuel-bounded, Verus +
      Lean/Aeneas-verified, scheduler-core shipped kiln v0.3.2; fuel = the same exec
      unit spar RTA/RMBound/EDF proofs use). The substrate's SUBSTRATE prerequisites
      are now both pinned and evidence-backed:
        (a) synth#372 (full i64.load/i64.store lowering) - the ONLY synth backend gap
            the substrate exercises (10 scheduler + 2 msgq sites; #275/#369/#180 are
            0 by profile). MET: shipped synth v0.11.47, jess + gale verified (AFD-025
            resolved).
        (b) kiln-error exposes a no_alloc/embedded build excluding recovery.rs, so the
            substrate links without a heap on 8KB SRAM. MET: kiln#338 fixed (#339),
            RELEASED kiln v0.3.4 (AFD-027 resolved 2026-06-21).
        (c) synth sizes the wasm .bss to the data high-water-mark, not the full declared
            memory page, so a large-memory module fits tiny RAM. MET: synth#383 CLOSED,
            shipped synth v0.11.51 (--shadow-stack-size under --native-pointer-abi) -
            gust's kernel dissolves to .bss 4240 (was ~1 MiB) and LINKS INTO 8 KB
            (~4.8 KB used), boots + 5000 poll rounds correct on qemu cortex-m3
            lm3s6965evb. Physical STM32F100 reflash PENDING (silicon-confirm rung is
            jess's - see Remaining).
      Kill-criterion: re-profiling the substrate wasm shows 0 unlowerable ops AND the
      cdylib links with no #[global_allocator]. FAILSAFE APP op-set: PROFILED 2026-06-18
      (iter#37, gale#65) - SBUS/IPC/tick all clean; clears all four synth gaps IFF the
      mixer is FIXED-POINT (a float mixer pulls 104 #369 ops, the only gap-pulling
      component) -> DD-011 fixes the mixer fixed-point. So with DD-011 + kiln#338, the
      whole gale-nano stack is synth-gap-free on v0.11.47. REALIZED: the gust mini-OS
      (gale feat/gust-mini-os, benches/gust + DOC-GUST-ARCH) BOOTS on Cortex-M3 (qemu
      lm3s6965evb): 5000 stable poll rounds, ~7.5KB free on 8KB SRAM, TCB = 5-import/
      2-export WIT world. Remaining to production (preconditions (a)/(b)/(c) all now MET):
      the meld->loom->synth DISSOLUTION (gust is native thumbv7m today, not yet
      maximal-wasm), SysTick timer wiring, and the SILICON-CONFIRM rung - synth v0.11.51's
      8 KB link is qemu-confirmed (lm3s6965evb) but NOT literal-silicon-confirmed; the
      physical STM32F100 reflash is jess's rung (jess has the Pixhawk 6X-RT with the F100
      IO-MCU + the Renode stm32f1 path as a hermetic intermediate). NOTE: physical F100
      reflash is a board WRITE - gated on explicit greenlight (board stays READ-ONLY by
      default); the Renode stm32f103 confirmation runs hermetically with no board write.
      Offered on gale#65. Caveat: F100 = Cortex-M3 = thumbv7m (no DSP/FPU) - confirm synth
      M3 path + recalibrate fuel->cycles (kiln R4).
    fields:
      category: functional
      priority: could
    links:
      - type: traces-to
        target: FEATURE-002

