  - id: TEST-PIX-019
    type: test-spec
    title: Renode multi-node vehicle (Track B) - THREE-CORE M7+M4+F100 co-execute in one emulation with a live M7<->M4 shared-mem link (real-hardware mirror of TEST-PIX-018)
    status: draft
    description: >
      hardware/renode/vehicle/run-vehicle-multinode.sh - the Renode (real ISA) mirror of
      the wasmtime combined harness (TEST-PIX-018), DD-019, now the FULL THREE-CORE
      topology of the 6X-RT (Stage 4): mach "rt1176" = rt1176-dualcore.repl with cpu_m7
      (smoke bring-up -> LPUART1 banner) + cpu_m4 (Cortex-M4 FPv4-SP, the on-die
      SENSOR-OFFLOAD core, DD-018 T2) on the SHARED RT1176 sysbus, plus an OCRAM-adjacent
      SHMEM ring @ 0x20400000 (relay-bus carrier region, DD-009) + an MU mailbox stub;
      mach "f100-io" = gale gust_m3_8k.repl + gust_wasm.elf (the real dissolved failsafe).
      Per-core NVIC via Renode BusPointRegistration (dual-core pattern, cf.
      renesas-da14592). rt1176-dualcore.repl is SEPARATE from the CI-gated pixhawk6xrt.repl
      (M7-only smoke), left untouched.
      CONFIRMED 2026-06-25 (jess local, Renode v1.16.1): all THREE cores co-execute -
      cpu_m7 boots smoke -> LPUART1 "JESS-RT1176 boot OK"; cpu_m4 boots the heartbeat
      firmware (vectors/text/stack in OCRAM @0x20240000, SP 0x20250000) and WRITES AN
      ADVANCING HEARTBEAT to the SHMEM ring @0x20400000 (read back ~0xA2C29 after 0.02s
      sim) - proving the on-die M7<->M4 SHARED-MEMORY LINK is LIVE, not just that the M4
      instantiates; f100-io (gust) co-executes. ORACLE PASS (M7 banner + M4 heartbeat>0).
      DEFERRED (honest scope, hence status=draft): the REACTIVE failsafe handoff (gust
      consuming the M7/M4 heartbeat over ipc-rx + tripping on loss) needs a gust build
      whose ipc-rx is wired to a connectable transport (gale's gust_m3_8k.repl has only a
      SemihostingUart) - asked gale for the driver + access (gale#65). Real falcon on the
      M7 + real sensor drivers on the M4 are bring-up STUBS until the synth poles clear
      (#369 hard-float/AFD-024, #275 dispatch/AFD-008); the M4 heartbeat stands in for the
      sensor-offload workload.
      DOORBELL 2026-06-25: the M7<->M4 link now carries the REAL NXP MU model
      (Miscellaneous.IMXRT700_MessagingUnit, same MU IP family as RT1176) replacing the
      plain-memory stub - per-core instances (aInstance=cpu_m7 @0x40C4C000, bInstance=cpu_m4
      @0x40C4D000) + the cross-core doorbell IRQ lines (AInstanceIRQ->nvic_m7, BInstanceIRQ
      ->nvic_m4). This is the NXP IPCF/RPMsg mechanism modeled faithfully: MU = the doorbell,
      the SHMEM ring @0x20400000 = the RPMsg vring/payload (the relay-bus carrier, relay#177,
      maps onto exactly this on the on-die link). The 3-core harness still PASSES with the
      MU wired (no regression). REMAINING for an interrupt-DRIVEN doorbell (vs the live
      polled SHMEM ring): firmware to drive the MU's two-sided TR/RX-IE protocol needs the
      RT1170/RT700 MU register map (TR offset, RX-interrupt-enable bit, IRQ number) - not
      extractable from this Renode AOT build (no model source/robot), so asked gale for the
      MU register access + the gust ipc-rx side (gale#65). Until then the doorbell hardware
      is wired + the SHMEM ring is the live link; the reactive handoff is orchestration-
      modeled. Track A (TEST-PIX-018) carries the handoff LOGIC end-to-end - together the
      DD-010/DD-019 SIL-differential at vehicle scale.
      DOORBELL DRIVEN 2026-07-09: the MU register map that was the open ask (gale#65) was
      SOURCED from the Renode IMXRT700_MessagingUnit model itself (TR0..3 @0x200/4/8/C write=
      transmit; RR0..3 @0x280/4/8/C read=receive; SR @0xC bit6 RFP; RCR @0x128 bits0-3 RIE),
      so the firmware side is no longer blocked. The M4 boot firmware now RINGS THE DOORBELL:
      m4_boot.S writes a sentinel (0xBEEF) to bInstance TR0 (0x40C4D200); the MU model delivers
      it to aInstance RR0 (0x40C4C280, M7 side) and asserts AInstanceIRQ. The multinode oracle
      now ASSERTS the delivery: reads aInstance RR0 with cpu_m7 context == 0x0000BEEF, alongside
      the M7 banner + M4 SHMEM heartbeat. VERIFIED GREEN 2026-07-09 (jess local, Renode v1.16.1):
      RR0 = 0x0000BEEF; negative-controlled RED with a no-doorbell M4 build (RR0 != sentinel ->
      FAIL). So the MU mailbox DATAPATH (M4 bInstance TR0 -> M7 aInstance RR0) is now firmware-
      DRIVEN + asserted, not just wired. Posted the register map + the working recipe on gale#65
      so gust's ipc-rx side can use the same offsets. REMAINING (still gale#65): the reactive
      IRQ-handler side (M7 taking AInstanceIRQ + gust consuming over ipc-rx with a connectable
      transport) - the datapath is proven; the ISR-driven consume is the next rung. Local Track-B
      oracle (needs Renode + the gale gust fetch), not one of the 5 CI gates - consistent with
      this test's draft/local status.
    tags: [phase-2, simulation, renode, multi-node, vehicle, on-target, mu-doorbell, inter-core]
    links:
      - type: verifies
        target: REQ-PIX-017

