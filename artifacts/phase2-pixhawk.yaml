  - id: TEST-PIX-025
    type: test-spec
    title: DD-018 TCB-link model - minimal demonstration that a --relocatable+native-pointer-abi wasm links against a thin native TCB shim into a complete ARM image (the falcon on-target linking mechanism, independent of #369)
    status: valid
    description: >
      hardware/renode/tcb-link/ - proves the gale-maximal-wasm on-target LINKING MODEL (DD-018)
      on a minimal example, INDEPENDENT of the falcon #369/#275 poles. The falcon on-target path
      is --relocatable + TCB-link (native trusted base + fused wasm), NOT the self-contained
      --cortex-m ELF. seam.wat = a minimal wasm compute()=tcb_seed()+1 importing the native
      primitive env::tcb_seed (a stand-in for a gale/WASI TCB primitive); tcb.S = a thin native
      TCB shim providing tcb_seed. RECIPE (the ABI gust uses): `synth compile seam.wasm -t
      cortex-m7dp --relocatable --native-pointer-abi --shadow-stack-size 1024` - --native-pointer-abi
      makes the module BASE-INDEPENDENT (host-pointer drop-in, linmem base=0), so it links against
      a thin native shim, not a full wasm runtime. ORACLE (build.sh, exits non-zero on failure):
      synth emits compute (defined) + tcb_seed (UNDEFINED = the TCB seam); the shim provides it;
      they link (arm-none-eabi-ld) into a complete ARM ELF with ZERO undefined symbols. CONFIRMED
      GREEN 2026-07-10 (jess local, synth v0.37.0); NEGATIVE-CONTROLLED: linking without the shim
      errors on undefined tcb_seed (the seam is real - synth emits it as a relocation the native
      trusted base must satisfy). Local oracle (needs synth), not a CI gate. Verifies the LINK
      mechanism of REQ-PIX-002 (gale primitives as the M7 native base, maximal-wasm). NEXT RUNG
      (not yet green, not shipped red): booting the linked image in Renode to assert compute()
      RUNS on real ARM (0xCAFF @0x20010000) - a boot hang under investigation; the link is proven,
      on-target EXECUTION of the minimal image is the follow-on. Minimal analogue of
      tools/bench/falcon-reloc-spike.sh point 1.
    tags: [phase-2, dd-018, relocatable, tcb-link, native-pointer-abi, on-target, gale-maximal-wasm, oracle]
    links:
      - type: verifies
        target: REQ-PIX-002
      - type: traces-to
        target: DD-018

  - id: REQ-PIX-018
    type: requirement
    title: jess CI gates the falcon wasm with witness (MC/DC branch coverage) + scry (sound abstract interpretation), on the meld-fused core
    status: implemented
    release: v0.9.0
    description: >
      Inbound jess#91 (avrabe, org release-consistency campaign; hub pulseengine.eu#98):
      jess builds/consumes wasm firmware but gates CI only on rivet + spar - add the
      DO-178C/DO-333 verification legs witness (structural coverage) + scry (sound static
      analysis) on the falcon wasm. Aligns with jess's verification posture + the
      experience report pulseengine.eu#90 (close the right side of the V).
      FEASIBILITY CONFIRMED 2026-06-23 (jess investigated locally):
        - witness: instruments only CORE modules, not the falcon COMPONENT - but jess
          ALREADY produces the meld-fused core in scripts/jess-build.sh (falcon.fused.wasm).
          `witness instrument falcon.fused.wasm` succeeds (witness v0.36.0, SHA/sig-verified
          darwin release) -> 1407 BRANCHES, 0 DWARF-correlated decisions. The released
          falcon wasm is STRIPPED (no .debug_* DWARF, only a `name` section), so jess's
          witness gate is structural BRANCH coverage on the fused core, NOT DWARF-correlated
          MC/DC decisions. Running the instrumented core needs a harness (kilnd, which
          jess-build.sh already has).
        - scry: ships scry-1.17.0-wasm32-wasip2.wasm + a crates.io lib (synth-cli already
          consumes it for the #383 shadow-stack analysis); runnable on the falcon core.
      DEVIATION (raised at the hub pulseengine.eu#98, per the campaign rule): because jess
      CONSUMES the released stripped falcon wasm (no source/DWARF), its witness gate is
      branch-coverage + scry sound-analysis on the fused core - COMPLEMENTING relay's
      source-level DWARF-correlated MC/DC gate (relay builds falcon with debuginfo), not
      duplicating it. sigil-signing is N/A (jess cuts no release; blocked on sigil#164).
      PLAN: add (a) a witness branch-coverage gate (meld fuse -> witness instrument -> run
      via kilnd -> report -> assert no branch-coverage regression) and (b) a scry
      sound-analysis gate, both on the fused falcon core, to .github/workflows/ci.yml -
      the deliberate follow-on feature (not rushed in a supervisory tick).
      REFRESH 2026-07-02 (cron loop, current tooling): re-ran the witness leg on
      falcon-flight-v1.110 with witness v0.38.0 (SHA-verified darwin release) - meld fuse
      (100086 -> 78690 B) -> `witness instrument` succeeds -> manifest schema v2, 1412
      branches (was 1407 on witness 0.36.0 / older falcon; +5 as falcon grew to v1.110). The
      released wasm is still STRIPPED (name section only, no DWARF), so the gate stays
      structural branch-coverage on the fused core, complementing relay's source-level MC/DC.
      Feasibility CONFIRMED on current tooling; the gate implementation remains the deliberate
      follow-on. Evidence: /tmp witness run (falcon.fused.wasm sha256 03a6b806).
      MECHANICS PROVEN + GAP SCOPED 2026-07-02 (cron loop, next step): witness's full
      instrument->run->report path works end-to-end (verified on the WASI-free br_table fixture:
      `witness run --invoke entry` -> `witness report` = 1/4 branch coverage with a per-branch
      uncovered list, MC/DC-capable). The falcon-specific gap is now EXACT: `witness run`'s
      embedded wasmtime CANNOT run the meld-fused core directly ("unknown import
      wasi:io/error@0.2.6::[resource-drop]error" - the 19 WASI/host imports, same set as the
      DD-018 TCB-seam). So the falcon gate must use `witness run --harness <cmd>` (subprocess
      mode: spawn a runner with WITNESS_MODULE/MANIFEST/OUTPUT env, runner writes the counter
      snapshot before exit) with a WASI-providing harness (kilnd) that ALSO emits the witness
      counter snapshot. THAT harness bridge (kilnd runs the instrumented core invoking
      run-stabilization + dumps __witness_* counters to WITNESS_OUTPUT) is the one remaining
      integration piece; the instrument + report halves are proven.
      PATH FULLY MAPPED 2026-07-03 (cron loop, witness v0.38): witness 0.38 added a COMPONENT
      mode (#110, `instrument --in-place`: rewrite the inner core + re-emit the component so it
      runs through wasmtime/kiln's component API - which WOULD supply WASI and dodge the
      fused-core import wall). Tried it on falcon-flight-v1.112: REJECTED - "3 embedded core
      modules (a preview1->p2 adapter is likely present); single-module auto-unbundle does not
      apply". So `--in-place` needs a SINGLE-core component; the released falcon component is
      multi-core (wasip1->p2 adapter). Confirmed no bare-core/wasip1 falcon artifact is released
      (only the multi-core `falcon-flight-v*.wasm` component + a components tarball). NET - the
      witness gate on falcon needs ONE of: (a) meld-fuse the component to a single core then
      `witness run --harness <kilnd/wasmtime runner that dumps __witness_* counters to
      WITNESS_OUTPUT>` - the counter-snapshot harness bridge (kilnd runs it but has no counter
      dump; the snapshot-JSON writer is the missing piece), OR (b) relay shipping a single-core
      wasm32-wasip2 falcon so `witness instrument --in-place` + component-run works directly.
      This is a deliberate feature (harness bridge OR an upstream ask to relay), not a
      supervisory-tick job - but the recipe + exact blocker are now pinned.
      LEG B DELIVERED 2026-07-08 (feature loop, TEST-PIX-022): the scry sound-analysis gate
      is BUILT + GREEN + WIRED into CI (the `scry-gate` job) - tools/scry-gate/ fetches a
      pinned falcon, meld-fuses to a Core module, and runs scry-sai-core 1.18.0 `analyze()`,
      asserting the analysis COMPLETES with ZERO unsound-fallback (0 unsound call-edges over
      12 call_indirect sites, 0 unsound diagnostics on the v1.112 core = 771 pts/175 funcs).
      That closes the DO-333 sound-static-analysis leg of the V unilaterally (no supplier
      dependency - scry is released, the crate is on crates.io, the fused core is producible).
      REMAINING: leg a (witness branch-coverage) still needs the counter-snapshot harness
      bridge OR a relay single-core wasip2 build; this requirement reaches `verified` only
      when BOTH legs gate. Moved draft->implemented to reflect the delivered scry half.
    fields:
      category: process
      priority: should
    links:
      - type: traces-to
        target: REQ-PIX-001

  - id: REQ-PIX-019
    type: requirement
    title: Hardware-first root-of-trust on the 6X-RT - bind the SE050 secure element + HAB secure boot, with an automatic software fallback (sigil/relay-sec) gated on hardware presence/health
    status: draft
    release: v0.8.0
    description: >
      jess implements the DD-020 hardware-first / software-fallback root-of-trust on the
      Pixhawk 6X-RT. Two layers:
      (A) BOOT-CHAIN: support i.MX RT HAB secure boot (fused SRK + CSF-signed loader) as
      the silicon root that verifies before execution; when HAB is open/unprovisioned, the
      loader falls back to verifying the sigil image signature in software + relay-sec
      anti-rollback (DD-016). The certified-flight build provisions HAB; dev/unprovisioned
      units run the software gate (a reported lower-assurance mode).
      (B) KEY VAULT + CRYPTO: bind the NXP SE050 (I2C4 @ 0x48) as a relay-hal I2c transport
      + a verified SE050 driver (DD-018 maximal-wasm), holding the image-verification public
      key + relay-sec long-term keys and performing ECDSA-verify/attestation in hardware;
      fall back to the software crypto backend (relay-sec software AEAD + protected-FRAM key)
      when the SE050 is absent/unenumerated/unhealthy. The HW/SW selection REUSES the
      DD-018 Presence/health + DD-014 health-vote mechanism - enumerate the SE050, check
      health, use it if present+healthy, else degrade to software with the downgrade LOGGED
      as a health event (not silent).
      VERIFICATION: SE050 driver Kani-totality (relay-side, like the sensor drivers) +
      on-silicon enumeration/attestation on the connected 6X-RT (greenlit board access) +
      a Renode/SIL test of the fallback selection (SE050-present vs SE050-absent paths) +
      HAB provisioning validated on real silicon (fuse burn is irreversible -> gated on
      explicit greenlight, tested on a dev unit first). GROUNDED in the PX4 fmu-v6xrt
      research (SE050 @ I2C4 0x48, HAB IVT/CSF unsigned by default, sw_crypto default) -
      DD-020. NOTE: this is a NEW security surface jess had not modeled; sequenced after the
      core HAL binding (REQ-PIX-012) since the SE050 reuses the same embedded-hal-async I2c
      seam.
    fields:
      category: functional
      priority: should
    links:
      - type: traces-to
        target: REQ-PIX-001

