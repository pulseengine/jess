  - id: TEST-PIX-014
    type: test-spec
    title: Real PX4 fmu-v6xrt boots on the RT1176 Renode model far enough to drive the LPUART console
    status: implemented
    description: >
      Stage-2 console milestone oracle for REQ-PIX-014 (DD-008). hardware/renode/px4/
