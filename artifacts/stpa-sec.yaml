artifacts:
  # ---- STPA-Sec losses (CIA-scoped) ----
  - id: SL-001
    type: sec-loss
    title: Adversary causes loss of the vehicle via compromised control
    status: draft
    description: >
      An adversary, by breaching the integrity or availability of the control
      chain, causes the vehicle to depart controlled flight or fly away beyond
      recovery (the security analogue of the flight flyaway loss L-004).
    tags: [security, flight]
    fields:
      cia-impact: [integrity, availability]
      stakeholders: [operators, customers, regulators]
    links:
      - type: traces-to
        target: L-004

  - id: SL-002
    type: sec-loss
    title: Adversary issues unauthorized commands to the vehicle
    status: draft
    description: >
      An adversary injects unauthorized commands over the control or telemetry
      link, breaching command-path integrity and taking partial or full control
      of the vehicle.
    tags: [security, flight, command-link]
    fields:
      cia-impact: [integrity]
      stakeholders: [operators, regulators]

  # ---- STPA-Sec hazards ----
  - id: SH-001
    type: sec-hazard
    title: GNSS/GPS spoofing yields a false position estimate
    status: draft
    description: >
      An adversary spoofs GNSS/GPS signals so the position estimate is false,
      causing the controller to drive the vehicle to an attacker-chosen location
      or out of the geofence (flyaway). NOTE - relay ships a falcon-hitl-rfspoof
      harness, so this attack is real and exercisable in HIL.
    tags: [security, flight, gnss]
    fields:
      cia-impact: [integrity]
      severity: critical
    links:
      - type: leads-to-sec-loss
        target: SL-001

  - id: SH-002
    type: sec-hazard
    title: Command injection over the control/telemetry link yields unauthorized commands
    status: draft
    description: >
      An adversary on the control or telemetry link injects forged or replayed
      commands that the vehicle accepts as authentic, gaining unauthorized
      control authority.
    tags: [security, flight, command-link]
    fields:
      cia-impact: [integrity]
      severity: critical
    links:
      - type: leads-to-sec-loss
        target: SL-002

  - id: SH-003
    type: sec-hazard
    title: Firmware or component tampering in the supply chain yields compromised control
    status: draft
    description: >
      An adversary tampers with firmware or a component during the build or
      supply chain so the deployed control software is compromised. Ties to
      sigil attestation - the integrity of the deployed image must be attested.
    tags: [security, supply-chain, firmware]
    fields:
      cia-impact: [integrity]
      severity: critical
    links:
      - type: leads-to-sec-loss
        target: SL-001

  # ---- STPA-Sec constraints (inverse of each sec-hazard) ----
  - id: SSC-001
    type: sec-constraint
    title: Position estimate shall be robust to and detect GNSS spoofing
    status: draft
    description: >
      The estimator shall detect and reject spoofed GNSS/GPS signals (e.g. via
      cross-checks against inertial/other sensors and plausibility bounds) so a
      spoofed signal cannot drive a false position estimate.
    tags: [security, flight, gnss]
    links:
      - type: prevents-sec-hazard
        target: SH-001

  - id: SSC-002
    type: sec-constraint
    title: Control and telemetry commands shall be authenticated and replay-protected
    status: draft
    description: >
      Commands over the control and telemetry link shall be authenticated and
      protected against replay so only authorized commands are accepted.
    tags: [security, flight, command-link]
    links:
      - type: prevents-sec-hazard
        target: SH-002

  - id: SSC-003
    type: sec-constraint
    title: Deployed firmware integrity shall be attested before execution
    status: draft
    description: >
      The integrity and provenance of the deployed firmware and its components
      shall be attested (sigil) before execution so tampered images are detected
      and rejected.
    tags: [security, supply-chain, firmware]
    links:
      - type: prevents-sec-hazard
        target: SH-003

  # ---- STPA-Sec UCA (adversarial) ----
  - id: SU-001
    type: sec-uca
    title: FlightCore acts on a spoofed position estimate, commanding the vehicle off-geofence
    status: draft
    description: >
      Under GNSS spoofing, the FlightCore controller provides motor commands
      computed from a false position estimate, driving the vehicle toward an
      attacker-chosen location.
    tags: [security, flight, gnss]
    links:
      - type: issued-by
        target: C-001
      - type: leads-to-sec-hazard
        target: SH-001
    fields:
      uca-type: providing
      context: >
        While GNSS is being spoofed and no spoof-detection trips, the controller
        treats the false position as truth and acts on it.
      adversarial-causation: >
        An external RF adversary transmits counterfeit GNSS signals (exercisable
        via relay's falcon-hitl-rfspoof harness) that the receiver locks onto,
        injecting a false position into the estimator that the controller then
        acts on.
      attacker-type: external-network

  # ---- STPA-Sec scenario ----
  - id: SS-001
    type: sec-scenario
    title: RF spoofing injects a false position the estimator accepts
    status: draft
    description: >
      An RF adversary spoofs GNSS so the receiver locks onto counterfeit signals;
      with no spoof detection, the estimator accepts the false position (SU-001)
      and the controller drives the vehicle off-geofence, reaching SH-001.
    tags: [security, flight, gnss]
    links:
      - type: caused-by-sec-uca
        target: SU-001
      - type: leads-to-sec-hazard
        target: SH-001
    fields:
      scenario-type: adversarial-feedback-injection
      attack-vector: physical
      attacker-type: external-network
      cia-impact: [integrity]
      causal-factors:
        - GNSS receiver accepts counterfeit signals (no anti-spoof)
        - estimator lacks cross-sensor plausibility checks
        - controller has no geofence-violation safe-state response
