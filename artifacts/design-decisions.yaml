artifacts:
  - id: DD-001
    type: design-decision
    title: Anchor safety case to STPA + ISO 26262 (score), defer DO-178C to Phase 3
    status: accepted
    description: >
      Toolchain is ISO-26262-aligned today (gale is ASIL-D); the drone is the demonstrator. STPA is the methodology spine; the score schema (tenet/assertion) plus safety-case (safety-goal/fmea-entry) carry the ISO 26262 argument. DO-178C (rivet preset) is added when the airborne Phase 3 needs it.
    tags: [safety, standards]
    fields:
      rationale: Standards selection drives schema choices for the entire spine. ISO 26262 is already supported by the toolchain; committing to it now avoids rework. DO-178C is deferred to avoid premature complexity.
      release: v0.1.0
    links:
      - type: satisfies
        target: META-REQ-001

  - id: DD-002
    type: design-decision
    title: HIL build-flash mechanics are a separate Phase-1 spec
    status: accepted
    description: >
      How falcon is compiled through meld->loom->synth->kiln and flashed to the STM32F4 target is out of scope for the tracking spine; it is brainstormed as its own spec.
    tags: [scope]
    fields:
      rationale: Keeping build-flash mechanics separate prevents the tracking spine from becoming a build-system spec. A dedicated Phase-1 document keeps responsibilities clean.
      release: v0.1.0
    links:
      - type: satisfies
        target: META-REQ-001

  - id: DD-003
    type: design-decision
    title: Drive jess firmware build via rules_wasm_component and rules_renode emulation
    status: accepted
    tags: [build, bazel, toolchain]
    fields:
      rationale: Track the falcon firmware build hermetically through rules_wasm_component (pinned wasm toolchain bundle + meld_fuse/synth_compile) and run on-target tests via rules_renode EMULATION rather than hand-rolled installs or the physical board. Emulation-only keeps jess from contending with gale's hardware rig. Verus/rocq/lean proof toolchains are intentionally NOT jess build deps (jess builds firmware, not proofs).
      release: v0.2.0
    links:
      - type: satisfies
        target: REQ-001

  - id: DD-004
    type: design-decision
    title: Build falcon from relay source as the resilient integration input
    status: accepted
    tags: [resilience, build, relay]
    fields:
      rationale: >-
        relay dropped the released falcon-flight wasm asset for 5 consecutive
        releases (v1.28-v1.32; relay#100/AFD-006). Tying jess integration to a
        release artifact that can vanish is fragile. Decision - jess builds the
        falcon-flight component from relay's pinned SOURCE (relay/wasm/cm/flight
        via cargo component build) as the primary input, and consumes the
        published release asset only as an additional cross-check when present.
        This keeps the goal (falcon onto hardware) progressing regardless of
        release-pipeline state.
      release: v0.1.0
    links:
      - type: satisfies
        target: REQ-003

  - id: DD-005
    type: design-decision
    title: jess targets DO-178C DAL-A, ISO 26262 ASIL-D, IEC 61508 SIL-4 with STPA and STPA-Sec
    status: accepted
    tags: [safety, standards, integrity]
    fields:
      rationale: >-
        jess seeds its safety V at the highest integrity across three domains -
        DO-178C Design Assurance Level A (catastrophic), ISO 26262 ASIL-D, and
        IEC 61508 SIL-4 - with STPA and STPA-Sec as the hazard spine. This
        mirrors the falcon/relay six-domain ambition and matches gale's ASIL-D
        toolchain integrity, so the demonstrator is held to the same bar as the
        platform it certifies. DO-178C is therefore brought forward, not
        deferred. DD-001 is SUPERSEDED with respect to its DO-178C-timing aspect
        (DD-001 deferred DO-178C to Phase 3); the STPA + ISO 26262 spine of
        DD-001 is retained and extended with STPA-Sec for the security
        dimension. NOTE - rivet 0.15.0 ships no do-178c or iec-61508 schema or
        preset (the 13 built-in schemas are common, dev, research, supply-chain,
        stpa, stpa-sec, stpa-ai, safety-case, aspice, cybersecurity, aadl,
        score, eu-ai-act), so the DAL-A and SIL-4 assignments are recorded here
        in this decision rather than as dedicated DO-178C/IEC-61508 artifacts.
        The ISO 26262 ASIL-D assignment is carried on the safety goals via the
        safety-case schema asil field (set to D); DAL-A and SIL-4 are noted in
        each safety goal description.
      alternatives: >-
        Defer DO-178C to Phase 3 (DD-001 original position) - rejected because
        the demonstrator should validate the airborne assurance posture from
        commit one. Target a single domain only - rejected because falcon/relay
        carry multi-domain ambition.
      release: v0.1.0
    links:
      - type: satisfies
        target: REQ-003
      - type: traces-to
        target: DD-001

  - id: DD-006
    type: design-decision
    title: gale-maximal-wasm - drivers compile to wasm components; native trusted base is gale primitives plus a thin bus interface
    status: accepted
    description: >
      jess's stack is based on gale (the formally verified Verus/Rocq/Lean
      ASIL-D replacement for Zephyr kernel primitives), and the architecture
      maximizes what is built AS WASM. Drivers (Rust no_std no_alloc, e.g. the
      ImuDriver/RegBus pattern from relay's falcon-imu-icm42688) are compiled as
      wasm32-unknown-unknown components too - not left as host-side native rlibs.
      meld fuses driver components with the falcon core; the open imports that
      remain after fusion ARE the host-component interface jess requires from
      gale/Zephyr - bus primitives (SPI transfer / register read-write-burst),
      time, and motor PWM out. That native surface is small and sits directly on
      gale's verified primitives. Consequence for testing (jess as the
      system-above authority) - the SAME driver component bytes run against a
      mock-bus host on wasmtime/kiln in host CI and against the real SPI on
      target, giving a backend-swap differential identical in shape to the
      SimBackend-inside vs HardwareBackend-outside cascade differential.
    tags: [architecture, gale, wasm, drivers]
    fields:
      rationale: >-
        Everything compiled to wasm is portable, deterministic, host-testable,
        and travels through the verified toolchain (meld, loom, synth) - so
        maximizing the wasm surface minimizes the native trusted base down to
        gale's formally verified primitives plus the thinnest bus/MMIO host
        functions. Relay's host-side rlib seam is the upstream interim pattern,
        not jess's end state.
      alternatives: >-
        Host-side native driver rlibs behind the ImuDriver seam (relay's current
        pattern) - rejected as the end state because it grows the unverified
        native surface and forks the test path between host and target.
      release: v0.4.0
    links:
      - type: satisfies
        target: REQ-002
      - type: traces-to
        target: DD-003

  - id: DD-008
    type: design-decision
    title: Phase-2 bring-up methodology - Renode reuse + PX4/NuttX reference + C# peripheral reimpl, staged, SIL-differential gated
    status: accepted
    description: >
      The proven jess bring-up method, applied to the Pixhawk 6X-RT (i.MX
      RT1176): (1) gather schematics/HW description (DD-007); (2) seed a Renode
      platform from the NXP RT1176 Zephyr devicetree via dts2repl and re-base the
      existing imxrt1064 peripheral C# models (~70-80% reusable by class:
      CortexM/NVIC+SysTick, NXP_LPUART, IMXRT_LPSPI, LPI2C, IMX_GPTimer,
      NXP_eDMA, IMXRT_FlexSPI, IMXRT_GPIO) to the fmu-v6xrt address map; (3) boot
      PX4/NuttX as the reference firmware, run the boot->unhandled-access-log->
      implement/stub/Tag loop to discover what the peripherals need; (4)
      reimplement the missing peripherals (Renode models them in C#) - notably
      the ICM-42688-P / ICM-42686-P / BMI088 SPI sensors (fed via RESD) and the
      classic NXP MU for M7<->M4; (5) gate every stage with the SIL behavioral
      differential (runbook 3a). Staged: M7-only boot to nsh (high confidence) ->
      PX4 boot + serial/sensorless (medium) -> sensor-in-the-loop, the eDMA-SPI
      hard part (low-medium) -> multi-core M7+M4 + STM32F100 IO MCU as a second
      Renode machine over a 1.5 Mbaud UART hub. No PX4-in-Renode exists today, so
      this is original work; fmu-v6xrt's spi.cpp/defconfig give the exact sensor
      wiring + memory map to drive both the .repl and jess's own drivers.
    tags: [phase-2, methodology, renode, px4, bring-up]
    fields:
      rationale: >-
        It's the team's proven path and it de-risks the AFD-018 Renode gap
        incrementally - reuse the 70-80% that exists, learn the peripheral needs
        from a known-good firmware (PX4), and only hand-write the delta. Staging
        means M7-boot value lands early without waiting on the hard sensor/DMA
        and multi-core work.
      alternatives: >-
        Skip Renode, go straight to EVK/real silicon via Zephyr - viable
        fallback (kept open) but loses the hermetic CI emulation jess relies on.
        Wait for upstream Renode RT1176 support - rejected: none is planned.
      release: v0.6.0
    links:
      - type: satisfies
        target: REQ-PIX-005
      - type: traces-to
        target: DD-003

  - id: DD-009
    type: design-decision
    title: Inter-core comms - fuse same-core (meld), WIT-typed RPC cross-core over a shared-memory transport; NOT the wRPC crates
    status: accepted
    description: >
      Architecture for "per-thread fused async component, multiple fused systems
      across cores" (the gale-maximal-wasm direction on the RT1176's M7+M4+IO).
      Same WIT contract, two deployments: SAME CORE = meld fusion (direct calls,
      nanoseconds); CROSS CORE = RPC over a transport. Decision on the RPC layer
      (from sourced research): the wRPC reference crates are host/cloud-only
      (hard tokio + wasmtime, no no_std) and NOT embeddable - but the wRPC IDEA
      is the north star and its maintainers bless reuse: WIT-typed contracts +
      the Component-Model value-definition encoding over a transport we build.
      So jess's three layers: (1) CONTRACT = WIT authored in spar/AADL (one
      interface per cross-core connection); (2) CODEC = CM value encoding (stays
      meld-fusion byte-compatible) or postcard (no_std/no_alloc) pragmatically;
      (3) TRANSPORT = a shared-memory ring + MU mailbox IRQ on gale (Zephyr
      ipc_service/ICMsg-class or hand-rolled SPSC), with explicit RT1176
      cache-coherency handling, and the LPUART6 px4io-class link for the IO MCU,
      CAN-FD/DroneCAN for off-board nodes. spar is the architecture source: each
      core's fused stack = an AADL process bound to a processor, cross-core
      connections bound to a transport bus (modeled in hardware/pixhawk6x-rt.aadl).
      spar gaps to make this real are filed: connection-aware WIT codegen
      (spar#282, AFD-020) and the wrpc-binding false-positive (spar#281,
      AFD-019). gale gaps (no executor/spawn/host/AMP) filed as the gale#63 epic.
      No bare-metal multi-core wasm-component-RPC precedent exists - this is
      green-field; ADDITIONAL HELP needed on the verified no_std executor, the
      cache-coherent cross-core transport, and spar's connection-aware codegen.
    tags: [phase-2, architecture, wrpc, wit, multi-core, gale-maximal-wasm]
    fields:
      rationale: >-
        Keeps one WIT contract for both fused and distributed deployment (the
        Component-Model fuse-vs-distribute duality), so the same verified cascade
        runs same-core (fast) or split across M7/M4 without rewriting interfaces.
        Reusing the wRPC encoding idea (not the crates) avoids a std/tokio/wasmtime
        dependency that can't exist on an MCU while keeping CABI byte-compatibility
        with meld fusion.
      alternatives: >-
        REUSE RELAY'S EXISTING IPC - strong candidate, UNDER EVALUATION
        (REQ-PIX-008, deep-dived 2026-06-14 - GROUNDED in relay source): relay
        has THREE distinct comms mechanisms, do not conflate. (a) Software Bus
        WIT seam (wit/interfaces/relay-software-bus/bus.wit): transport-neutral
        typed streams, intended mapping stream<T> -> Gale ring_buf - NO E2E. (b)
        Software Bus host router (host/relay-sb/src/core.rs): cFE-mapped
        pub/sub, but std-only (Vec/VecDeque), NO E2E, and the bare-metal falcon
        path bypasses it (calls FlightCore::step directly). (c) **relay-sec**
        (crates/relay-sec/) - the real prize: no_std/no_alloc, already runs on
        Cortex-M7 + M0+, Kani-proven, a genuine safety E2E profile (monotonic
        counter + RFC-6479 sliding-window replay/loss/reorder + Ascon-AEAD MAC +
        SPI/channel binding + session rekey) - STRONGER than AUTOSAR-E2E
        (cryptographic). NB (iter#19, grounded in wohl source): relay-sec is
        reusable but NOT yet integrated in any downstream - wohl reuses relay's
        CCSDS codec + cFS app services + stream model but has NO relay-sec dep,
        despite relay-sec's description claiming 'shared by falcon and wohl'
        (relay#175). So jess would be the FIRST to wire relay-sec as
        inter-component E2E - reusable code, but new integration ground. CORRECTION to an earlier claim: relay's MAVLink (X.25
        CRC only, seq is a passthrough - detection-only) and the Software Bus
        (no integrity) do NOT carry safety E2E; relay-sec does, and it is the C2
        link layer NOT wired to the bus. So the grounded plan: REUSE relay-sec
        as the E2E wrapper on each inter-core hop (jess then inherits proven
        safety-grade protection for the DD-005 bar); use the WIT stream<T> seam
        as the contract; the TRANSPORT (Zephyr ipc_service/ICMsg or Gale
        ring_buf over shared memory + MU mailbox) is NET-NEW - relay has no
        shared-memory/ipc_service backend. Reuse relay-mavlink for the off-board
        GCS link only (not inter-core). The std-only SB router and the empty
        relay-es/evs/time host stubs are NOT reusable. spar should model the
        stream connections + relay-sec-protected channels (user ask; needs the
        spar#282 connection-aware codegen). DD-009 stays PROVISIONAL: the
        recommended path is relay-sec(E2E) + WIT-stream-contract + net-new
        Zephyr-ipc transport, pending a small spike. Other alternatives: port the wRPC crates to no_std -
        rejected (tokio+wasmtime non-starter); DroneCAN for inter-core -
        rejected (inter-NODE bus, wrong layer for M7<->M4 on one die);
        hand-rolled ad-hoc messaging with no contract - rejected (loses the
        typed/fuse-or-distribute property).
      release: v0.7.0
    links:
      - type: satisfies
        target: REQ-PIX-007
      - type: traces-to
        target: DD-006
