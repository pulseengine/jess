artifacts:
  - id: DD-001
    type: design-decision
    title: Anchor safety case to STPA + ISO 26262 (score), defer DO-178C to Phase 3
    status: accepted
    release: v0.1.0
    description: >
      Toolchain is ISO-26262-aligned today (gale is ASIL-D); the drone is the demonstrator. STPA is the methodology spine; the score schema (tenet/assertion) plus safety-case (safety-goal/fmea-entry) carry the ISO 26262 argument. DO-178C (rivet preset) is added when the airborne Phase 3 needs it.
    tags: [safety, standards]
    fields:
      rationale: Standards selection drives schema choices for the entire spine. ISO 26262 is already supported by the toolchain; committing to it now avoids rework. DO-178C is deferred to avoid premature complexity.
    links:
      - type: satisfies
        target: META-REQ-001

  - id: DD-002
    type: design-decision
    title: HIL build-flash mechanics are a separate Phase-1 spec
    status: accepted
    release: v0.1.0
    description: >
      How falcon is compiled through meld->loom->synth->kiln and flashed to the STM32F4 target is out of scope for the tracking spine; it is brainstormed as its own spec.
    tags: [scope]
    fields:
      rationale: Keeping build-flash mechanics separate prevents the tracking spine from becoming a build-system spec. A dedicated Phase-1 document keeps responsibilities clean.
    links:
      - type: satisfies
        target: META-REQ-001

  - id: DD-003
    type: design-decision
    title: Drive jess firmware build via rules_wasm_component and rules_renode emulation
    status: accepted
    release: v0.2.0
    tags: [build, bazel, toolchain]
    fields:
      rationale: Track the falcon firmware build hermetically through rules_wasm_component (pinned wasm toolchain bundle + meld_fuse/synth_compile) and run on-target tests via rules_renode EMULATION rather than hand-rolled installs or the physical board. Emulation-only keeps jess from contending with gale's hardware rig. Verus/rocq/lean proof toolchains are intentionally NOT jess build deps (jess builds firmware, not proofs).
    links:
      - type: satisfies
        target: REQ-001

  - id: DD-004
    type: design-decision
    title: Build falcon from relay source as the resilient integration input
    status: accepted
    release: v0.1.0
    tags: [resilience, build, relay]
    fields:
      rationale: >-
        relay dropped the released falcon-flight wasm asset for 5 consecutive
        releases (v1.28-v1.32; relay#100/AFD-006). Tying jess integration to a
        release artifact that can vanish is fragile. Decision - jess builds the
        falcon-flight component from relay's pinned SOURCE (relay/wasm/cm/flight
        via cargo component build) as the primary input, and consumes the
        published release asset only as an additional cross-check when present.
        This keeps the goal (falcon onto hardware) progressing regardless of
        release-pipeline state.
    links:
      - type: satisfies
        target: REQ-003

  - id: DD-005
    type: design-decision
    title: jess targets DO-178C DAL-A, ISO 26262 ASIL-D, IEC 61508 SIL-4 with STPA and STPA-Sec
    status: accepted
    release: v0.1.0
    tags: [safety, standards, integrity]
    fields:
      rationale: >-
        jess seeds its safety V at the highest integrity across three domains -
        DO-178C Design Assurance Level A (catastrophic), ISO 26262 ASIL-D, and
        IEC 61508 SIL-4 - with STPA and STPA-Sec as the hazard spine. This
        mirrors the falcon/relay six-domain ambition and matches gale's ASIL-D
        toolchain integrity, so the demonstrator is held to the same bar as the
        platform it certifies. DO-178C is therefore brought forward, not
        deferred. DD-001 is SUPERSEDED with respect to its DO-178C-timing aspect
        (DD-001 deferred DO-178C to Phase 3); the STPA + ISO 26262 spine of
        DD-001 is retained and extended with STPA-Sec for the security
        dimension. NOTE - rivet 0.15.0 ships no do-178c or iec-61508 schema or
        preset (the 13 built-in schemas are common, dev, research, supply-chain,
        stpa, stpa-sec, stpa-ai, safety-case, aspice, cybersecurity, aadl,
        score, eu-ai-act), so the DAL-A and SIL-4 assignments are recorded here
        in this decision rather than as dedicated DO-178C/IEC-61508 artifacts.
        The ISO 26262 ASIL-D assignment is carried on the safety goals via the
        safety-case schema asil field (set to D); DAL-A and SIL-4 are noted in
        each safety goal description.
      alternatives: >-
        Defer DO-178C to Phase 3 (DD-001 original position) - rejected because
        the demonstrator should validate the airborne assurance posture from
        commit one. Target a single domain only - rejected because falcon/relay
        carry multi-domain ambition.
    links:
      - type: satisfies
        target: REQ-003
      - type: traces-to
        target: DD-001

  - id: DD-006
    type: design-decision
    title: gale-maximal-wasm - drivers compile to wasm components; native trusted base is gale primitives plus a thin bus interface
    status: accepted
    release: v0.4.0
    description: >
      jess's stack is based on gale (the formally verified Verus/Rocq/Lean
      ASIL-D replacement for Zephyr kernel primitives), and the architecture
      maximizes what is built AS WASM. Drivers (Rust no_std no_alloc, e.g. the
      ImuDriver/RegBus pattern from relay's falcon-imu-icm42688) are compiled as
      wasm32-unknown-unknown components too - not left as host-side native rlibs.
      meld fuses driver components with the falcon core; the open imports that
      remain after fusion ARE the host-component interface jess requires from
      gale/Zephyr - bus primitives (SPI transfer / register read-write-burst),
      time, and motor PWM out. That native surface is small and sits directly on
      gale's verified primitives. Consequence for testing (jess as the
      system-above authority) - the SAME driver component bytes run against a
      mock-bus host on wasmtime/kiln in host CI and against the real SPI on
      target, giving a backend-swap differential identical in shape to the
      SimBackend-inside vs HardwareBackend-outside cascade differential.
    tags: [architecture, gale, wasm, drivers]
    fields:
      rationale: >-
        Everything compiled to wasm is portable, deterministic, host-testable,
        and travels through the verified toolchain (meld, loom, synth) - so
        maximizing the wasm surface minimizes the native trusted base down to
        gale's formally verified primitives plus the thinnest bus/MMIO host
        functions. Relay's host-side rlib seam is the upstream interim pattern,
        not jess's end state.
      alternatives: >-
        Host-side native driver rlibs behind the ImuDriver seam (relay's current
        pattern) - rejected as the end state because it grows the unverified
        native surface and forks the test path between host and target.
    links:
      - type: satisfies
        target: REQ-002
      - type: traces-to
        target: DD-003

  - id: DD-008
    type: design-decision
    title: Phase-2 bring-up methodology - Renode reuse + PX4/NuttX reference + C# peripheral reimpl, staged, SIL-differential gated
    status: accepted
    release: v0.6.0
    description: >
      The proven jess bring-up method, applied to the Pixhawk 6X-RT (i.MX
      RT1176): (1) gather schematics/HW description (DD-007); (2) seed a Renode
      platform from the NXP RT1176 Zephyr devicetree via dts2repl and re-base the
      existing imxrt1064 peripheral C# models (~70-80% reusable by class:
      CortexM/NVIC+SysTick, NXP_LPUART, IMXRT_LPSPI, LPI2C, IMX_GPTimer,
      NXP_eDMA, IMXRT_FlexSPI, IMXRT_GPIO) to the fmu-v6xrt address map; (3) boot
      PX4/NuttX as the reference firmware, run the boot->unhandled-access-log->
      implement/stub/Tag loop to discover what the peripherals need; (4)
      reimplement the missing peripherals (Renode models them in C#) - notably
      the ICM-42688-P / ICM-42686-P / BMI088 SPI sensors (fed via RESD) and the
      classic NXP MU for M7<->M4; (5) gate every stage with the SIL behavioral
      differential (runbook 3a). Staged: M7-only boot to nsh (high confidence) ->
      PX4 boot + serial/sensorless (medium) -> sensor-in-the-loop, the eDMA-SPI
      hard part (low-medium) -> multi-core M7+M4 + STM32F100 IO MCU as a second
      Renode machine over a 1.5 Mbaud UART hub. No PX4-in-Renode exists today, so
      this is original work; fmu-v6xrt's spi.cpp/defconfig give the exact sensor
      wiring + memory map to drive both the .repl and jess's own drivers.
      EXECUTION UPDATE 2026-06-19 (iter#39): stage 2 underway and converging.
      Renode v1.16.1 installed locally (macOS arm64, validated == CI on jess's
      smoke). The REAL PX4 fmu-v6xrt_default firmware BOOTS on the platform: image
      extracted from the .px4 wrapper, loaded at flash 0x30020000, entry from the
      i.MX RT IVT (vtable @0x30022000, SP 0x202587fc, Reset 0x300223a9). The
      boot->unhandled-access->stub loop is live (harness: hardware/renode/px4/
      {px4-boot.resc, pixhawk6xrt-px4-extras.repl, extract-px4-image.py, README}).
      Progress: CLOCK bring-up cleared - the 154x/324x/113x lock-poll spins on
      ANADIG (0x40C8_4000), 0x40CA_8000, and CCM/LPCG (0x40CC_0000) are stubbed
      (flipflop.py poll-pass); execution reached relocated ITCM code. Current
      frontier = peripheral init: GPT timers (0x4013_x000), the always-on domain
      (0x40C0_xxxx SNVS/RTWDOG), config blocks (0x400E_8000) - next stubs -> LPUART1
      console -> the nsh banner. Stubs are interim; real CCM/ANADIG/timer C# models
      (or re-based imxrt1064) replace them as semantics matter. Scope extended (user,
      iter#39) to the FULL ARC incl. a Gazebo HITL bridge (REQ-PIX-014, stage 5).
      ITER#40 UPDATE: AON/GPT/config switched flip-flop->plain memory (broad all-ones
      corrupts DATA reads - PX4 used 0xFFFFFFFF as a pointer, branched to 0xFFFFFFFE,
      abort; flip-flop now ONLY on the clock block's real lock polls). With that, PX4
      reaches the LPUART1 CONSOLE - emits its first byte ('B') deterministically (the
      low-level putc path works). TEST-PIX-014 (run-px4-boot.sh) is the oracle. nsh
      NOT yet reached: after 'B', PC 0x20242E72 reads 0x21001C (unmapped) then branches
      to 0xFFFFFFFE - a specific code path needing PX4 SYMBOLS to diagnose (raw .px4
      has none). Next iter: build PX4 from source (or boot the bootloader image) for
      symbols -> crack the branch -> nsh banner -> line-based robot oracle into CI.
    tags: [phase-2, methodology, renode, px4, bring-up]
    fields:
      rationale: >-
        It's the team's proven path and it de-risks the AFD-018 Renode gap
        incrementally - reuse the 70-80% that exists, learn the peripheral needs
        from a known-good firmware (PX4), and only hand-write the delta. Staging
        means M7-boot value lands early without waiting on the hard sensor/DMA
        and multi-core work.
      alternatives: >-
        Skip Renode, go straight to EVK/real silicon via Zephyr - viable
        fallback (kept open) but loses the hermetic CI emulation jess relies on.
        Wait for upstream Renode RT1176 support - rejected: none is planned.
    links:
      - type: satisfies
        target: REQ-PIX-005
      - type: traces-to
        target: DD-003

  - id: DD-009
    type: design-decision
    title: Inter-core comms - fuse same-core (meld), WIT-typed RPC cross-core over a shared-memory transport; NOT the wRPC crates
    status: accepted
    release: v0.7.0
    description: >
      Architecture for "per-thread fused async component, multiple fused systems
      across cores" (the gale-maximal-wasm direction on the RT1176's M7+M4+IO).
      Same WIT contract, two deployments: SAME CORE = meld fusion (direct calls,
      nanoseconds); CROSS CORE = RPC over a transport. Decision on the RPC layer
      (from sourced research): the wRPC reference crates are host/cloud-only
      (hard tokio + wasmtime, no no_std) and NOT embeddable - but the wRPC IDEA
      is the north star and its maintainers bless reuse: WIT-typed contracts +
      the Component-Model value-definition encoding over a transport we build.
      So jess's three layers: (1) CONTRACT = WIT authored in spar/AADL (one
      interface per cross-core connection); (2) CODEC = CM value encoding (stays
      meld-fusion byte-compatible) or postcard (no_std/no_alloc) pragmatically;
      (3) TRANSPORT = a shared-memory ring + MU mailbox IRQ on gale (Zephyr
      ipc_service/ICMsg-class or hand-rolled SPSC), with explicit RT1176
      cache-coherency handling, and the LPUART6 px4io-class link for the IO MCU,
      CAN-FD/DroneCAN for off-board nodes. spar is the architecture source: each
      core's fused stack = an AADL process bound to a processor, cross-core
      connections bound to a transport bus (modeled in hardware/pixhawk6x-rt.aadl).
      spar gaps to make this real are filed: connection-aware WIT codegen
      (spar#282, AFD-020) and the wrpc-binding false-positive (spar#281,
      AFD-019). gale gaps (no executor/spawn/host/AMP) filed as the gale#63 epic.
      No bare-metal multi-core wasm-component-RPC precedent exists - this is
      green-field; ADDITIONAL HELP needed on the verified no_std executor, the
      cache-coherent cross-core transport, and spar's connection-aware codegen.
    tags: [phase-2, architecture, wrpc, wit, multi-core, gale-maximal-wasm]
    fields:
      rationale: >-
        Keeps one WIT contract for both fused and distributed deployment (the
        Component-Model fuse-vs-distribute duality), so the same verified cascade
        runs same-core (fast) or split across M7/M4 without rewriting interfaces.
        Reusing the wRPC encoding idea (not the crates) avoids a std/tokio/wasmtime
        dependency that can't exist on an MCU while keeping CABI byte-compatibility
        with meld fusion.
      alternatives: >-
        REUSE RELAY'S EXISTING IPC - strong candidate, UNDER EVALUATION
        (REQ-PIX-008, deep-dived 2026-06-14 - GROUNDED in relay source): relay
        has THREE distinct comms mechanisms, do not conflate. (a) Software Bus
        WIT seam (wit/interfaces/relay-software-bus/bus.wit): transport-neutral
        typed streams, intended mapping stream<T> -> Gale ring_buf - NO E2E. (b)
        Software Bus host router (host/relay-sb/src/core.rs): cFE-mapped
        pub/sub, but std-only (Vec/VecDeque), NO E2E, and the bare-metal falcon
        path bypasses it (calls FlightCore::step directly). (c) **relay-sec**
        (crates/relay-sec/) - the real prize: no_std/no_alloc, already runs on
        Cortex-M7 + M0+, Kani-proven, a genuine safety E2E profile (monotonic
        counter + RFC-6479 sliding-window replay/loss/reorder + Ascon-AEAD MAC +
        SPI/channel binding + session rekey) - STRONGER than AUTOSAR-E2E
        (cryptographic). NB (iter#19, grounded in wohl source): relay-sec is
        reusable but NOT yet integrated in any downstream - wohl reuses relay's
        CCSDS codec + cFS app services + stream model but has NO relay-sec dep,
        despite relay-sec's description claiming 'shared by falcon and wohl'
        (relay#175). So jess would be the FIRST to wire relay-sec as
        inter-component E2E - reusable code, but new integration ground. MAXIMAL-REUSE STACK (grounded 2026-06-14, user direction 'IPC via CCSDS, sec alongside'): jess's inter-core IPC reuses relay AS-IS - app msg -> relay-ccsds (Space Packet encode, the IPC wire, no_std) -> relay-sec.wrap(packet_bytes) (E2E: header‖payload‖Ascon-tag; wrap already takes ARBITRARY bytes so no decoupling needed - relay#176 withdrawn) -> the ONLY net-new piece, a no_std shared-memory/ipc_service transport carrier (relay#177, co-design with gale#63's ring_buf). This is exactly falcon's C2 pattern (CCSDS+relay-sec) pointed at a shared-memory transport instead of the ground link. relay#175 (doc overclaim) fixed by maintainer. Net: reuse relay-ccsds + relay-sec wholesale; build only the carrier. CORRECTION to an earlier claim: relay's MAVLink (X.25
        CRC only, seq is a passthrough - detection-only) and the Software Bus
        (no integrity) do NOT carry safety E2E; relay-sec does, and it is the C2
        link layer NOT wired to the bus. So the grounded plan: REUSE relay-sec
        as the E2E wrapper on each inter-core hop (jess then inherits proven
        safety-grade protection for the DD-005 bar); use the WIT stream<T> seam
        as the contract; the TRANSPORT (Zephyr ipc_service/ICMsg or Gale
        ring_buf over shared memory + MU mailbox) is NET-NEW - relay has no
        shared-memory/ipc_service backend. Reuse relay-mavlink for the off-board
        GCS link only (not inter-core). The std-only SB router and the empty
        relay-es/evs/time host stubs are NOT reusable. spar should model the
        stream connections + relay-sec-protected channels (user ask; needs the
        spar#282 connection-aware codegen). DD-009 stays PROVISIONAL: the
        recommended path is relay-sec(E2E) + WIT-stream-contract + net-new
        Zephyr-ipc transport, pending a small spike. Other alternatives: port the wRPC crates to no_std -
        rejected (tokio+wasmtime non-starter); DroneCAN for inter-core -
        rejected (inter-NODE bus, wrong layer for M7<->M4 on one die);
        hand-rolled ad-hoc messaging with no contract - rejected (loses the
        typed/fuse-or-distribute property).
    links:
      - type: satisfies
        target: REQ-PIX-007
      - type: traces-to
        target: DD-006

  - id: DD-010
    type: design-decision
    title: Phase-2 verification ladder - SIL -> behavioral differential -> Renode hermetic HIL -> real-HW MAVLink bench, with Renode cross-validated against the real board
    status: accepted
    release: v0.6.0
    description: >
      How jess ensures things work on the way to flight, now that the physical
      6X-RT is connected (DD-007 milestone). Four rungs, each a gate:
      (1) SIL gate - wasmtime run-stabilization<0.1 / run-position-hold<0.6 on
      the falcon component (release-watch, runbook 3a).
      (2) Behavioral differential - meld->loom->kiln vs wasmtime, exact-match;
      mandatory before adopting any transform-tool release (caught loom#196/#220).
      (3) Renode hermetic HIL - the i.MX RT1176 .repl (DD-008 methodology;
      REQ-PIX-005) running the synth-compiled ELF in CI - no hardware contention,
      reproducible. Gap: Renode doesn't model RT1176 yet (AFD-018), so this rung
      is authored, not free.
      (4) Real-HW MAVLink bench - the connected 6X-RT over USB (REQ-PIX-010):
      ground truth. Read-only first (decode telemetry/state, identify PX4
      version/airframe), then falcon-as-MAVLink-peer, then (tethered, guarded)
      actuator-level. relay-mavlink is the reuse vehicle (DD-009).
      The KEYSTONE that ties it together (REQ-PIX-011): cross-validate the Renode
      RT1176 model against the real board - the emulation is trustworthy only
      when its behavior matches silicon on the same inputs. So Renode gives
      reproducible CI HIL; the real board is the oracle that keeps Renode honest.
      Order of attack now: the real-HW bench (rung 4, read-only) and the Renode
      seed (rung 3 via dts2repl) are BOTH startable today and neither needs
      synth#275 or gale#63 - so they lead; falcon-on-target (the gated work)
      follows as those upstreams land.
    tags: [phase-2, verification, hil, renode, mavlink, hardware]
    fields:
      rationale: >-
        A single verification method is a blind spot; the ladder is
        defense-in-depth (the PulseEngine stance). Critically, having BOTH a
        hermetic emulator (Renode, for CI/repro) and the real board (for ground
        truth) lets each check the other - Renode catches regressions cheaply,
        the board catches Renode's modelling errors. The real board also unblocks
        near-term Phase-2 work that doesn't depend on synth#275/gale#63.
      alternatives: >-
        Real hardware only - rejected: no hermetic CI, contends for the one
        board, slow. Renode only - rejected: an unvalidated emulator can be
        confidently wrong (the RT1176 model is hand-authored); the board keeps it
        honest. SIL/differential only - rejected: never exercises the real
        peripherals/timing.
    links:
      - type: satisfies
        target: REQ-002
      - type: traces-to
        target: DD-008

  - id: DD-011
    type: design-decision
    title: gale-nano (gust) failsafe mixer is FIXED-POINT (Q8) - keeps the STM32F100 path synth-gap-free
    status: accepted
    release: v0.9.0
    description: >
      The gale-nano failsafe app's mixer SHALL be fixed-point (Q8), not float.
      Grounded in a measured op-set profile (iter#37, gale-side on gale#65,
      answering jess's flagged failsafe-app profiling step): a px4io-class no_std
      failsafe (SBUS parse, mixer/PWM, IPC framing, failsafe tick) compiled to
      wasm32 and scanned vs the four synth on-target gaps clears ALL FOUR iff the
      mixer is fixed-point - a FLOAT mixer pulls 104 #369 ops (f32.mul/add/convert/
      compare for gain*ch + clamp) and is the ONLY component that pulls any gap;
      SBUS (shift/mask), IPC framing (small copies LLVM-inlined, no memory.copy),
      and the tick (integer branches) are all clean. So with a fixed-point mixer
      the entire gale-nano stack (kiln-async substrate + failsafe app) is
      synth-gap-free on synth v0.11.47 (#372 i64 already cleared), gated only on
      kiln#338 (no_alloc). This is realized: the gust mini-OS (gale repo,
      feat/gust-mini-os, benches/gust/ + DOC-GUST-ARCH) boots on Cortex-M3 (qemu
      lm3s6965evb) with a fixed-point-mixer failsafe task - 5000 stable poll
      rounds, mix(1024)=1500 mid-stick, ~5.1KB flash + 376B working-set + 20B
      static = ~7.5KB free on the F100's 8KB SRAM. TCB boundary (gust v0): a
      5-import/2-export WIT world (pwm-write/sbus-poll/ipc-tx/ipc-rx/fatal +
      boot/poll), wake-from-ISR done natively (BASEPRI-bounded pending word, no new
      wasm primitive, preserves kiln-async's no-atomics cooperative invariant).
      HAL ALIGNMENT (iter#38): gust's 5-import TCB is the STM32F100 (Cortex-M3)
      instantiation of the relay<->jess HAL contract (DD-012) - pwm-write=PwmOut
      (duty case), sbus-poll=SerialBus, ipc-tx/rx=the inter-core carrier
      (relay#177/relay-bus), fatal=fault seam; RegBus/AdcIn/CanBus don't apply to
      the failsafe IO-MCU. So jess binds the SAME seams on two nodes (RT1176 M7 +
      F100 M3, both under REQ-PIX-012); the gust TCB is a minimal-sync NARROWING of
      the async relay-hal traits (one source of truth, not a parallel invention).
      Synced on gale#65 + jess#62.
    tags: [phase-2, gale-nano, gust, fixed-point, on-target, stm32f100, hal]
    fields:
      rationale: >-
        The single design decision the failsafe app op-set collapses to. Choosing
        fixed-point removes the only app-side synth dependency (#369 hard-float)
        on the tiniest, least-capable node (Cortex-M3, no FPU, 8KB SRAM) - keeping
        gale-nano shippable on the CURRENT synth backend rather than waiting on
        GI-FPU-002. Consistent with engine_control's integer algos; a Cortex-M3
        has no FPU anyway, so float would be soft-float even once #369 lands.
      alternatives: >-
        Float (px4-faithful) mixer - rejected for the F100: pulls 104 #369 ops,
        making gale-nano gated on hard-float (GI-FPU-002) for no benefit on an
        FPU-less M3 (it would be soft-float regardless). Reserve float mixing for
        the M7 (where falcon already runs and an FPU exists). Caveat carried: the
        profile's IPC copies were small (<=22B, LLVM-inlined); a larger real
        IPC/telemetry frame could cross LLVM's memcpy threshold and pull #374 -
        re-profile against real frame sizes when the failsafe core firms up.
    links:
      - type: satisfies
        target: REQ-PIX-009

  - id: DD-012
    type: design-decision
    title: relay<->jess HAL contract - relay owns the verified peripheral abstraction (seams + protocol + WIT), jess owns the binding to RT1176 silicon
    status: accepted
    release: v0.7.0
    description: >
      The split for getting falcon's verified cascade onto the Pixhawk 6X-RT
      (jess#62 / relay#214). relay owns the hardware ABSTRACTION: the bus/peripheral
      seam traits (RegBus SPI/I2C, SerialBus UART, PwmOut, AdcIn, CanBus), the
      verified protocol bodies on them (sensor reg maps, UBX, DShot frame/CRC,
      DroneCAN codecs - all Kani-totality), the driver traits, and the WIT wiring -
      portable, no_std, verification-carrying. jess owns the BINDING to real
      silicon: concrete embedded-hal impls of those seams over the RT1176
      peripherals (register/DMA/pinmux/clock/IRQ), the board BSP, per-board
      calibration, and on-silicon validation. The seam in the middle is the thin
      agreed interface: relay can't break it without telling jess; jess can swap
      silicon under it without touching the flight stack (same pattern as
      relay#177/relay-bus for the inter-core carrier, and as the gust TCB host
      interface, DD-011). jess tracks the binding work as REQ-PIX-012.
      THREE trait-shape questions resolved (jess answered on jess#62, grounded):
        Q1 core split -> SINGLE-CORE M7 FIRST; freeze seams carrier-transparent in
          shape (handle/async, no same-core memory assumption) but don't require the
          M4 carrier (relay#177) day one. falcon already targets cortex-m7dp; PX4
          runs M7-only with M4 idle; M4 offload is a later measured optimization.
        Q2 DShot -> FlexIO + eDMA, so PwmOut is FRAME-based (sink an encoded DShot
          frame), not duty-based. Confirmed against PX4's own RT117x driver
          (platforms/nuttx/src/px4/nxp/imxrt/dshot/dshot.c drives FLEXIO1 SHIFTBUF/
          TIMIEN, DMA-fed - NOT eFlexPWM). eFlexPWM stays the duty-PWM degenerate
          case. Keeps falcon-esc-dshot frame encoding upstream; jess binds the
          FlexIO+DMA transport. (8 of the v6xrt's 12 PWM ports are DShot-capable.)
        Q3 trait shape -> ASYNC (P3 stream) from the start; sync-blocking as a
          degenerate bring-up impl. Matches relay's P3-async stack + the embedded
          DMA/completion-IRQ reality + the kiln-async cooperative model (gust).
      THREE BINDING TARGETS (iter#38, corrected by architect on jess#62 - the
      RT1176 is DUAL-CORE so it is two targets, plus the STM32F100):
        T1. RT1176 Cortex-M7 - falcon flight stack (the primary on-FMU target).
        T2. RT1176 Cortex-M4 - the second on-die core (sensor-I/O offload / co-
            processing; the M4-side of the relay#177 inter-core split). Same RT1176
            peripherals, bound from the M4 side; FPv4-SP not DP.
        T3. STM32F100 Cortex-M3 IO-MCU - the gust failsafe (DD-011/REQ-PIX-009),
            exercising a SUBSET (PwmOut duty case, SerialBus RC/SBUS, the FMU<->IO
            carrier relay#177); gust's 5-import TCB is a minimal-sync NARROWING of
            the async traits for the 8KB M3.
      So jess binds one seam contract across three cores; the M7<->M4 (on-die) and
      FMU<->IO(F100) links are both relay#177/relay-bus carriers. Requirement on the
      seam shapes: the async P3-stream traits must be narrowable to a sync
      O(1)-non-blocking projection (T3) and carrier-transparent across cores (T1/T2),
      so all three bind the same seams (relay's protocol bodies reusable across all),
      not parallel inventions. Synced on gale#65 + jess#62.
    tags: [phase-2, hal, relay, gust, on-target, stm32, imxrt1176, stm32f100, hardware-binding]
    fields:
      rationale: >-
        A clean abstraction/binding seam lets the verified flight stack stay
        silicon-agnostic and lets jess iterate on board bytes without risking the
        proofs - the core PulseEngine separation-of-concerns stance, and the only
        way the Kani-carried protocol bodies stay reusable across boards. Grounding
        the three trait-shape answers before relay freezes the traits avoids a
        later seam break: each answer is tied to evidence (falcon's M7 target;
        PX4's FlexIO DShot source; relay's P3-async + kiln-async).
      alternatives: >-
        jess re-implements drivers from scratch - rejected: throws away relay's
        Kani-totality protocol proofs + duplicates the register maps already in
        falcon-imu-icm42688/falcon-baromag. Dual-core M4+M7 from day one -
        deferred: couples bring-up to relay#177 for no Phase-1 benefit. Duty-based
        DShot via eFlexPWM - rejected: PX4's own RT117x path is FlexIO, which gives
        cleaner bit-timing; duty-PWM doesn't fit DShot framing. Sync-only traits -
        rejected: would break when DMA/IRQ completion is wired (it must be async).
    links:
      - type: satisfies
        target: REQ-PIX-012
      - type: traces-to
        target: REQ-PIX-009

  - id: DD-013
    type: design-decision
    title: Board layout is a PARAMETER, not a constant - the HAL binding is {SoC-family driver set} x {board topology/cal}, seams stay board-agnostic
    status: accepted
    release: v0.7.0
    description: >
      jess targets the Pixhawk 6X-RT now, but WILL face other boards with different
      layouts (architect, iter#40). The design must not hard-code one board. The
      Pixhawk open standards already draw the portable/variant line, and the HAL
      contract (DD-012) is what absorbs the variance:
      WHAT IS PORTABLE (reused across boards, never re-done per layout):
        - relay-hal SEAM traits + the Kani-proven protocol bodies (DD-012, relay).
        - The Pixhawk Connector Standard + Autopilot Bus Standard + the modular
          IMU/FMU/Base split (the 100-pin + 50-pin Pixhawk Bus). FMUv6X and
          FMUv6X-RT share the SAME FMUv6X standard - only the SoC differs
          (STM32H753 vs i.MX RT1176) - so everything ABOVE the SoC driver layer is
          common between them.
      WHAT VARIES PER BOARD (jess's binding, parameterized in two separable layers):
        (a) SoC-family peripheral drivers + the Renode .repl + the OS port - per SoC
            (i.MX RT1176 now; STM32H7 for 6X/6C; STM32F7 for 5X). Distinct register
            maps -> distinct C# Renode models + embedded-hal impls.
        (b) Board TOPOLOGY/BSP - which IMU/baro/mag on which bus INSTANCE, pinmux,
            clock tree, and per-board CALIBRATION (mounting remap, NVM trim). Variant
            DATA, not flight code.
      So a "different layout" = a new (SoC-driver-set x board-topology) pairing
      binding the SAME seams and reusing the SAME protocol bodies + Pixhawk-standard
      connector semantics. Consequence for jess artifacts: pixhawk6xrt.repl is the
      v6X-RT INSTANCE of a per-board-parameterized model; REQ-PIX-012's BSP + cal are
      per-variant; the spar model should carry the board as a configurable
      instance/variant; adding a board = new topology + SoC-driver + .repl + cal,
      NOT a flight-stack or seam rewrite. gust/F100 (DD-011) is the same pattern at
      the IO-MCU scale (a third SoC family, Cortex-M3).
    tags: [phase-2, hal, board-variant, portability, pixhawk-standard, hardware-binding]
    fields:
      rationale: >-
        Pixhawk is an open-standard ecosystem with many FMU variants; hard-coding
        one layout would forfeit the reuse the seam contract exists to provide and
        force a re-verification per board. Parameterizing the binding (SoC drivers x
        topology) keeps the verified flight stack + protocol bodies invariant across
        boards - only board-specific bytes change - which is the whole point of the
        relay-abstracts/jess-binds split (DD-012) and of the Pixhawk connector
        standard. It also means the RT1176 work transfers directly to a future
        STM32H7 6X (same FMUv6X standard above the SoC line).
      alternatives: >-
        Hard-code the fmu-v6xrt layout - rejected: every new board re-touches the
        flight-stack integration + re-verifies; throws away the standard's
        portability. A single mega-.repl/BSP with #ifdef-style branches - rejected:
        couples variants, defeats hermetic per-board CI; prefer one .repl + one BSP
        + one cal set per board, composed over the shared seams.
    links:
      - type: satisfies
        target: REQ-PIX-012

  - id: DD-014
    type: design-decision
    title: Redundancy architecture - isolated triple-IMU domains (SW voting in relay) + triple-source hardware-OR power (SW monitor-only)
    status: accepted
    release: v0.7.0
    description: >
      How jess deals with the 6X-RT's sensor + power redundancy (architect, iter#40;
      grounded in the FMUv6X standard). Two independent redundancy mechanisms, modeled
      in hardware/pixhawk6x-rt.aadl (spar parse+instance green, 35 components):
      SENSORS - triple IMU + double baro as ISOLATED DOMAINS: each IMU on its OWN SPI
      bus + its OWN LDO (independent power control). This is fault CONTAINMENT - a
      wedged bus or dead LDO kills ONE domain, not all. The redundancy LOGIC (voting /
      mid-value select / failure detection) is NOT jess's: it lives in relay's
      estimator (portable, verification-carrying) over the device set; PX4 "seamlessly
      switches" on failure. jess's binding MUST preserve the isolation (separate bus
      instances, never multiplexed) and surface per-sensor identity + health so the
      voter can select.
      POWER - triple source (POWER1 + POWER2 bricks + USB) diode/priority-ORed in
      HARDWARE onto the system rail -> failover is automatic with NO software in the
      path (the safety-critical property). Software (the INA228/PM0xD monitors over
      I2C) only MEASURES each rail for health/V/I and reports/logs; it NEVER gates the
      switchover. Per-IMU LDOs give each sensor domain independent power off the rail.
      EMV2 fault-tree shape (the property the model makes checkable): "loss of attitude"
      requires loss of ALL THREE IMU domains; "loss of FMU power" requires loss of ALL
      THREE sources - both single-fault-tolerant. The redundancy DEGREE (count of IMUs /
      power inputs) is a per-board-variant parameter (DD-013) - a different board
      enumerates a smaller set; relay's voting is set-size-agnostic.
    tags: [phase-2, redundancy, safety, sensors, power, fault-containment, emv2]
    fields:
      rationale: >-
        Isolation + voting is the standard avionics redundancy pattern and is what the
        FMUv6X hardware already implements; modeling it truthfully (separate buses +
        power rails, not one shared SPI) is what makes the SPOF structure analyzable.
        Keeping voting in relay (verified) and failover in hardware (no code) puts each
        mechanism where it is safest - software where it can be proven, hardware where
        it must be instantaneous.
      alternatives: >-
        One shared sensor bus (the old model) - rejected: hides the SPOF structure and
        defeats fault containment (one bus fault loses all IMUs). Software power
        failover - rejected: puts code in the safety-critical instantaneous path; the
        hardware OR is correct. Voting in jess - rejected: it is portable verified
        algorithm = relay's lane (DD-012), and would duplicate the EKF.
    links:
      - type: satisfies
        target: REQ-PIX-012
      - type: traces-to
        target: REQ-PIX-003

  - id: DD-015
    type: design-decision
    title: jess<->relay WIT seam is at the ISOLATED-TRANSPORT level - host provides per-bus transports, relay's wasm owns drivers + decode + voting
    status: accepted
    release: v0.7.0
    description: >
      The seam granularity for the host(jess native)<->guest(relay wasm) WIT contract
      (architect deliberated, iter#40; chosen option B of three). The seam is as LOW as
      practical: jess's native host provides the BARE isolated transports - per-bus
      RegBus/SerialBus transfer (one instance PER isolated bus, never multiplexed),
      per-rail AdcIn for the power monitors, a time source, and the actuator/PWM sink -
      plus an enumeration descriptor of WHAT IS PHYSICALLY PRESENT (count + per-device:
      which bus, part-id, health source). Everything ABOVE that is relay's portable
      wasm: the register-map DRIVERS (relay's Kani-proven falcon-imu-icm42688 etc.),
      sample decode, sensor VOTING/redundancy, and power-rail MONITORING logic.
      WHY (the same maximal-wasm principle, DD-006, three times): (1) push the seam low
      so the MOST logic is portable verified wasm; (2) keep relay's Kani-proven protocol
      bodies in relay - option C (host provides typed imu/baro/power resources with
      read-sample/health) would migrate those verified bodies into jess's native TCB;
      (3) name the isolated set in the contract so isolation + redundancy-degree are
      visible and board-variant (DD-013) - option A (one flat multiplexed RegBus, device
      = a parameter) hides the SPOF structure in the types. So "provide devices via WIT"
      = the host EXPOSES the enumerated isolated-transport SET, but relay gives it
      device SEMANTICS. Consistent with DD-011 (the gust TCB is the same tiny
      host-import shape) and DD-012 (relay abstracts / jess binds). Detailed per-seam
      spec posted to relay on jess#62.
      REFINED by DD-018: the transport trait SHAPE named here (bespoke RegBus/SerialBus,
      read-reg) is SUPERSEDED - the seam now anchors on embedded-hal-async SpiDevice/I2c
      + embedded-io-async at TRANSACTION granularity (register helpers move relay-side).
      The isolated-transport-LEVEL decision of this DD is unchanged; only the concrete
      trait shape is now the standard. See DD-018.
    tags: [phase-2, hal, seam, wit, maximal-wasm, host-guest, relay]
    fields:
      rationale: >-
        Maximal-wasm (DD-006): the native host is the bare-minimum register/DMA/ADC
        shim; drivers, decode, voting, redundancy, monitoring are portable verified
        wasm in relay. This maximizes reuse across boards (DD-013), keeps the Kani
        bodies + the EKF voting out of the native TCB, and makes isolation/redundancy
        first-class in the seam contract.
      alternatives: >-
        A - single flat multiplexed RegBus (device = param): rejected, hides isolation
        & redundancy degree in the types; the SPOF structure and board-variance are
        not expressed at the seam. C - host provides typed device resources
        (imu/baro/power with read-sample/health): rejected, pulls relay's Kani-proven
        protocol bodies + health interpretation into jess's native TCB, shrinking the
        portable verified surface and coupling jess to sensor semantics.
    links:
      - type: satisfies
        target: REQ-PIX-012

  - id: DD-016
    type: design-decision
    title: Update + persistence architecture - flight TCB carries NO i.MX ROM; persistence=FRAM-own-driver; the ROM question lives ONLY in the on-ground update bootloader
    status: accepted
    release: v0.8.0
    description: >
      Models jess's firmware-update + persistence path on the RT1176 (REQ-PIX-015),
      a PREREQUISITE for finalizing the storage/ROM route (the user's point: "we
      don't rewrite code-flash at runtime" only moves NOR-write to update time -
      update IS NOR-write = the ROM's job, so it must be designed first). Grounded
      in the PX4 v6xrt source (read directly):
      PX4 uses the i.MX boot-ROM for TWO things, ONE of them real:
        (A) app boot-time imxrt_octl_flash_initialize (CONFIG_BOARD_BOOTLOADER_FIXUP,
            .ramfunc): re-inits FlexSPI to fast octal-DDR via ROM_FLEXSPI_NorFlash_Init
            - PERFORMANCE ONLY (faster XIP), not functionally required; the adjacent
            imxrt_flash_setup_prefetch_partition pokes the same registers directly,
            proving the ROM isn't needed for it.
        (B) bootloader (imxrt_common/main.c): ROM_FLEXSPI_NorFlash_Erase/ProgramPage
            over USB-DFU - writes the app into octal NOR during UPDATE. This is the
            genuinely-hard read-while-write octal-NOR path; the ROM driver (RAM-
            resident, NXP-vetted) avoids writing+maintaining one. This is the ONLY
            real ROM need.
      Params -> FRAM (FM25V02A, MTD_PARAMETERS), its own FlexSPI driver, NOT the ROM.
      DECISION for jess (two TCBs):
        - FLIGHT TCB (in-flight): falcon + gale + a verified FRAM-over-FlexSPI param
          driver. NO i.MX ROM. The (A) fast-XIP re-init is simply DROPPED - jess does
          not need flash performance because falcon does NOT execute from the NOR:
          it is a small synth-fused image (.text ~63KB) that fits the M7's zero-wait
          ITCM/DTCM/OCRAM, so it is LOAD-TO-RAM (copied to TCM at boot, run from
          there); the octal NOR is purely a boot-time read source + an update-time
          write target, never on the execution path -> XIP speed is irrelevant. And
          for hard-real-time WCET it is the BETTER choice: TCM execution is
          deterministic, with none of the flash-fetch/cache-miss jitter XIP carries
          (what the spar RTA/WCET story wants). PX4 needs fast-XIP only because its
          big monolithic image runs in place from NOR; jess's maximal-wasm small
          image does not. (A faster boot-copy, if ever wanted, is direct FlexSPI
          register writes, no ROM.)
          DEPENDENCY (must formalize): this no-ROM/no-XIP/load-to-RAM conclusion holds
          ONLY if the M7 flight runtime is gale-MAXIMAL-WASM (gale verified primitives
          as the thin native base + kiln + falcon/drivers fused wasm, DD-006) - which
          gust just proved viable (gale runs without Zephyr on the M3). If instead the
          M7 runs gale-ON-FULL-ZEPHYR (a big RTOS image that XIP-executes from NOR and
          boots through the SoC/ROM init like PX4), then this DD's no-ROM/no-XIP claim
          is WRONG for the M7 and the romapi/XIP analysis re-enters. The M7 flight
          runtime (maximal-wasm vs gale-on-Zephyr) is a SEPARATE keystone decision to
          model (the spar model does not yet represent the gale runtime layer as a
          component - only app processes). Recommendation: maximal-wasm on the M7 too
          (unify M7+F100, smallest verified TCB, keeps this DD valid; Zephyr demoted to
          a bring-up/reference aid). If Zephyr is required on the M7, revise this DD.
        - UPDATE TCB (on-ground, at update time only, NOT in flight): a bootloader
          that programs the app NOR. THIS is the only place the ROM question lives.
          OPEN sub-decision (the one fork): (b1) reuse the i.MX ROM NOR driver in the
          bootloader - update-time-only opaque code, never in flight, low effort, the
          ROM solves the hard RWW; or (b2) ship jess's own verified octal-NOR driver -
          zero ROM anywhere, but jess owns the hard RWW/XIP-suspend problem.
        - INTEGRITY (the safety-critical part of update, same either way): sigil-signed
          images (embedded sig / Sigstore / SLSA provenance) + relay-sec authenticated/
          anti-replay transport + anti-rollback; the bootloader verifies before flashing.
          REFINED by DD-020: this sigil + relay-sec layer is the SOFTWARE FALLBACK of a
          HARDWARE-FIRST root-of-trust - the production/certified build anchors the boot
          chain in i.MX RT HAB (fused SRK + CSF-signed loader) and the keys in the SE050
          secure element, with this software path used when the hardware is open/
          unprovisioned/unhealthy. So integrity is no longer software-only; sigil + relay-sec
          stay as the fallback + the application-layer E2E, with HW as the root.
      So the storage/ROM route (jess owns its drivers, no ROM in flight) is CONFIRMED
      for flight; the only ROM use jess might keep is the update bootloader's NOR write
      (b1) - bounded, on-ground, integrity-gated. Renode fidelity follow-on: model the
      FlexSPI controller + FRAM device (currently FlexSPI2 = plain memory) so the
      verified FRAM param driver is exercisable; the boot-ROM romapi stays off the
      FLIGHT path either way.
    tags: [phase-2, update, persistence, bootloader, fram, security, tcb, on-target]
    fields:
      rationale: >-
        Separating flight TCB from update TCB lets the in-flight code stay fully
        verified (no opaque ROM) while not pretending the NOR-write problem vanished -
        it is real, but it lives only in the on-ground updater. The safety-critical
        part of update is integrity (authenticity/anti-rollback), which jess already
        owns via sigil + relay-sec; the mechanical NOR-write is where reusing the
        ROM (b1) is a defensible, bounded convenience. Decided BEFORE the storage
        route so we don't commit to "no ROM" and then have to switch back when the
        update path resurfaces it (exactly the failure the user flagged).
      alternatives: >-
        "No ROM, decided in isolation" - rejected: incomplete until update is modeled;
        update = NOR-write = the ROM's domain. ROM in the flight TCB (PX4's fast-XIP
        fixup) - rejected: perf-only, opaque code in the flight TCB, droppable. SWD/
        external-only update (no bootloader) - rejected: no field update. Skipping a
        signed-image/anti-rollback chain - rejected: integrity is the safety core of
        update.
    links:
      - type: satisfies
        target: REQ-PIX-015

  - id: DD-017
    type: design-decision
    title: M7 flight runtime = gale-MAXIMAL-WASM (standalone gale verified primitives + kiln + fused falcon, NO Zephyr in flight); Zephyr = reference/bring-up only
    status: accepted
    release: v0.7.0
    description: >
      The keystone the storage/boot story rests on (the gale-layer question): what runs
      on the M7 in flight. DECIDED via a gale deep-dive (iter#43, research-first):
      WHAT GALE IS (grounded in the gale repo): a "formally verified Rust REPLACEMENT
      for Zephyr kernel primitives" (Verus + Rocq + Lean), explicitly DUAL-TRACK:
        - STANDALONE: plain/*.rs (verus-stripped embeddable Rust crate, Rocq-proven) -
          the full kernel-primitive set (sem/mutex/condvar/event/msgq/mbox/pipe/fifo/
          lifo/futex/poll/heap/mem_slab/mempool/timeout/scheduler/thread_lifecycle +
          mpu/mmu/mem_domain). NO Zephyr.
        - ZEPHYR INTEGRATION: zephyr/*.c drop-in C replacement, validated on 36 upstream
          Zephyr test suites (QEMU M3 + MPS2/AN385 w/ MPU).
      gale ALSO compiles to WASM (release-wasm.yml, build-wasm-dist.sh, zephyr/wasm/
      trampolines) - so the DD-006 maximal-wasm path is REAL. And gust proved the
      standalone path runs on bare Cortex-M3 (no Zephyr).
      DECISION: the M7 flight runtime is gale-MAXIMAL-WASM - gale's verified primitives
      (as fused wasm / standalone native base) + the kiln scheduler + falcon + the
      relay-hal drivers, meld-fused -> loom -> synth -> ARM, LOAD-TO-RAM in TCM (DD-016).
      NO Zephyr in the flight image. Zephyr is demoted to: (a) gale's OWN validation
      track (the 36 QEMU suites - how gale proves its primitives), and (b) an optional
      EVK/bring-up reference (like PX4) - NOT the flight runtime. This:
        - CONFIRMS DD-016 (no-ROM/no-XIP/load-to-RAM holds - the flight image is small,
          RAM-resident, doesn't XIP from NOR or boot through the i.MX ROM).
        - RESOLVES the AFD-028 MPU question: gale provides mpu.rs + mem_domain, so the
          native trusted base HAS verified MPU enforcement of the linear-memory region
          (DD-006 posture confirmed - MPU is gale's, NOT synth's --safety-bounds).
        - UNIFIES the M7 and the gust/F100 on ONE architecture (gale-maximal-wasm at two
          scales: full primitive set on M7, the gale-nano subset on F100).
      OPEN sub-decision (per-workload, not blocking): falcon scheduling uses gale's
      thread scheduler (Zephyr-style periodic threads) vs kiln's async cooperative
      fuel-bounded scheduler (gust's choice) - both verified; pick by falcon's loop
      structure. Revises REQ-PIX-002 (was "gale on M7 via Zephyr").
    tags: [phase-2, gale, maximal-wasm, m7, runtime, tcb, zephyr, on-target]
    fields:
      rationale: >-
        gale is a primitive REPLACEMENT, not a Zephyr fork - its standalone (plain/)
        track + wasm distribution + gust's bare-M3 proof show it does not need Zephyr.
        Choosing maximal-wasm on the M7 gives the smallest verified TCB (DD-006), keeps
        DD-016's no-ROM/load-to-RAM flight model valid, puts MPU enforcement in gale
        (resolving AFD-028), and unifies M7+F100 on one model. Full Zephyr on the M7
        would add a large XIP/ROM-dependent image + a big unneeded surface (netstack/
        FS/shell) the control core does not use - against DD-006 and DD-016.
      alternatives: >-
        gale-ON-FULL-ZEPHYR on the M7 - rejected for flight: big XIP image, boots
        through the i.MX ROM (re-introduces the ROM/XIP analysis + breaks DD-016's
        no-ROM claim), and carries a large surface the control core does not need.
        Kept ONLY as gale's validation track + an optional bring-up reference. Bare
        hand-rolled primitives (no gale) - rejected: throws away gale's Verus/Rocq/Lean
        verification, the entire point.
    links:
      - type: satisfies
        target: REQ-PIX-002
      - type: traces-to
        target: REQ-PIX-012

  - id: DD-018
    type: design-decision
    title: The jess<->relay transport seam IS embedded-hal-async at TRANSACTION granularity, composed ALL-WASM (wac/meld/synth + TCB seam); maybe-async-cfg is relay's source-portability tool, NOT a jess native path - supersedes the bespoke RegBus shape of DD-015
    status: accepted
    release: v0.7.0
    description: >
      Concretizes the DD-015 isolated-transport seam onto an EXISTING standard instead
      of bespoke RegBus/SerialBus traits (architect dialogue iter#44-#45; firmed with
      relay on jess#62 / relay#214, both sides agreed, relay freezing + cutting traits).
      THE STANDARD: where a stable async trait exists, the seam targets it -
        - SPI register access -> embedded-hal-async SpiDevice / SpiBus
        - I2C -> embedded-hal-async I2c
        - the byte links (UBX / MAVLink / IO-MCU) -> embedded-io-async Read/Write
      Only where NO async standard exists does relay-hal define small custom async
      traits: a frame-sink PwmOut (encoded DShot frame; duty-PWM = the degenerate
      failsafe case), an AdcIn (channel -> raw count, INA228 per-rail, MONITOR-ONLY,
      no cross-seam failover - power is hardware-OR per DD-014), and a Presence/
      enumeration + per-device health/identity descriptor (the one thing
      embedded-hal-async has NO concept of - it carries DD-013 board-variance + the
      voter's device set + DD-014 health).
      GRANULARITY: the seam carries SpiDevice::transaction / I2c::transaction (raw
      transfers) - read_reg / read_burst, the reg|0x80 read-bit, big-endian burst are
      relay-SIDE helpers on top. So the seam is PURE BYTES, ZERO register semantics -
      strictly lower than DD-015's read-reg shape, shrinking the native TCB to
      transport+DMA and keeping ALL protocol knowledge in relay's Kani-proven bodies.
      WHY embedded-hal-async is the RIGHT anchor (relay's reasons, confirmed):
        - relay's driver bodies are ALREADY generic over the bus (Icm42688<B: RegBus>),
          so B: RegBus -> B: SpiDevice/I2c is mechanical, not a rewrite; relay uses no
          embedded-hal today so there is no migration conflict.
        - embedded-hal-async is FALLIBLE (Result<_, Error>) where RegBus was infallible:
          a wedged isolated bus surfaces as a transport error the driver threads up into
          the DD-014 health the estimator votes on - so fallibility IS the health source.
        - SpiDevice is per-instance BY CONSTRUCTION (one device = one isolated bus) -
          matches "separate transport per IMU domain, never multiplexed" natively.
      jess IS ALL-WASM - ONE PATH, NO NATIVE ALTERNATIVE (the correction to an earlier
      "two bind paths" framing; DD-006/DD-017 maximal-wasm taken literally): for jess
      EVERYTHING above the TCB is a wasm component - falcon, relay's drivers, the HAL,
      the kiln-async scheduler, and gale's primitives UP TO the TCB. The embedded-hal-async
      transaction seam is a WIT interface BETWEEN wasm components (driver imports it, the
      HAL component exports it; the HAL is wasm too - only its bottom register/DMA/IRQ/wake
      ops cross into the TCB). The graph is composed by wac, FUSED by meld (the WIT seams
      become direct calls - "moved down"), optimized by loom, and synth is the LAST and
      ONLY compile-to-ARM step, where it seams in the native TCB (the bottom WIT's host
      side - the bare register/DMA/IRQ/wake/time shim, the only native code; MPU = gale's
      per DD-017). So the WIT seam is a COMPOSE-TIME contract (how pieces are wired +
      verified + wit-bindgen'd), meld-fused to ZERO runtime cost - NOT a surviving ABI
      boundary on the metal. jess does NOT do native compilation of drivers/HAL/scheduler.
      (The native/direct-embedded-hal-async deployment is RELAY'S OTHER target - relay on
      Zephyr - not a jess path.)
      CONCURRENCY - jess CONSUMES THE ASYNC PROJECTION UNIFORMLY: async is component-model
      (P3) + kiln-async, in wasm, on ALL three cores INCLUDING gust (kiln-async-NANO, the
      cooperative no_alloc scheduler, DD-011) - the F100 is NOT a native-blocking/no-executor
      target in jess's end-state; it runs the same async projection synth-compiled to ARM.
      So relay's blocking/sync projection is NOT a jess path. maybe-async-cfg IS still
      endorsed, but as RELAY'S SOURCE-PORTABILITY tool so one driver source ALSO serves
      relay's non-wasm (Zephyr-native) deployments; jess always takes the async arm ->
      wasm -> wac -> meld -> synth. jess CONFIRMED no maybe-async pattern exists on the
      gale/gust side to match (kiln-async is a genuine P3-futures executor, NOT a
      dual-projection; no maybe-async-cfg precedent in the org), so relay owns the
      convention. M4 (T2) is first-class - the seam is core-agnostic; driver bodies do not
      assume M7. Same Icm42688<B> body across all cores.
      jess DELIVERS: the RT1176 embedded-hal-async surface as the HAL WASM COMPONENT
      (SVD -> svd2rust -> PAC informs the register logic; DMA + completion-IRQ -> wake) +
      the bottom TCB host iface that synth seams in natively; the WCET harness lands on the
      Renode RT1176 model first (REQ-PIX-005) as the hermetic CI gate, then real board.
      SPIKE-VALIDATED 2026-06-26 (tools/bench/falcon-reloc-spike.sh, falcon-v1.95 on synth
      0.16.0): the "synth is the last compile-to-ARM step seaming in the native TCB" claim is
      now evidenced. falcon (meld-fused -> loom -> synth) dissolves with `--relocatable
      --all-exports` to a VALID ELF relocatable object (`ELF 32-bit ... ARM ... relocatable`) -
      the TCB-link form, vs the self-contained `--cortex-m` ELF jess-build.sh/bazel emit today.
      The emitted functions are functionally identical between the two paths (conditional-branch
      count 780=780, incl. br_tables; func_41 byte-identical dispatch), so the path choice is the
      LINKING MODEL, not codegen correctness (it does NOT change the synth#507/AFD-032 picture).
      THE TCB-SEAM SURFACE made concrete = the relocatable object's 20 UNDEFINED symbols the
      native trusted base must provide: 19 WASI host primitives (output-stream write/flush/
      check-write/subscribe, pollable.block, the resource-drops, exit, get-std{in,out,err} +
      terminal accessors, get-environment) - exactly the "thin native register/DMA/IRQ/wake/time
      shim" this DD describes, here for the flight-demo world's WASI plumbing - PLUS one
      dangling `func_72` (a skipped function, AFD-030 i64-reg-pair, referenced by emitted code):
      so a COMPLETE self-contained link is blocked on BOTH paths equally by the #369/#275/#503
      skips creating unresolved refs, NOT by the path. NEXT RUNG: provide the 19 WASI primitives
      as a minimal TCB shim + clear the skip poles, then link -> Renode boot (the gust model at
      falcon scale). The maximal-wasm/TCB-link path is viable; the blockers are the synth poles.
    tags: [phase-2, hal, seam, embedded-hal-async, maybe-async, wit, wac, component-model, maximal-wasm, relay, m4]
    fields:
      rationale: >-
        Targeting an existing standard (embedded-hal-async / embedded-io-async) instead
        of bespoke RegBus makes relay's drivers OS-agnostic and reusable across the
        Zephyr deployment AND the maximal-wasm OS without forking - and the standard's
        fallibility is exactly the DD-014 health source. Transaction-level granularity
        pushes even the register-read convention into portable wasm, minimizing the
        native TCB (DD-006/DD-015). jess is all-wasm (DD-017): driver+HAL+kiln-async+gale
        are wasm components, the embedded-hal-async seam is a WIT interface meld-FUSED to
        zero runtime cost, and synth is the only native compile-down (seaming in the TCB) -
        so jess consumes the async projection uniformly (kiln-async on all cores incl.
        gust-nano). maybe-async-cfg is relay's source-portability tool for relay's non-wasm
        deployments, not a jess native-sync path.
      alternatives: >-
        Bespoke RegBus/SerialBus traits (DD-015 original shape) - superseded: reinvents
        embedded-hal-async, not reusable outside relay, infallible so no natural health
        source. Register-level seam (read-reg in the contract) - rejected: leaks register
        semantics (reg|0x80, burst endianness) into the native TCB; transaction-level
        keeps the seam pure bytes. "Two bind paths (WIT vs native-direct) for jess" -
        rejected/corrected: jess is single-path all-wasm (wac/meld/synth); the
        native-direct embedded-hal-async path is relay's Zephyr deployment, not jess.
        Native compilation of drivers/HAL/scheduler for jess - rejected: against the
        maximal-wasm thesis (DD-006/DD-017); only the TCB is native, seamed in by synth.
        Host provides typed device resources (DD-015 option C) - already rejected there:
        pulls Kani bodies into the native TCB.
    links:
      - type: satisfies
        target: REQ-PIX-012
      - type: traces-to
        target: REQ-PIX-002

  - id: DD-019
    type: design-decision
    title: Two-track simulation for the combined M7+F100 vehicle - wasmtime (hardware-free SIL) parallel to Renode (real-hardware model), same components, plus physical silicon
    status: accepted
    release: v0.9.0
    description: >
      The flight system is TWO cooperating nodes (M7 falcon + relay-hal = primary
      sensing/control/GCS-CAN; F100 gust = always-alive failsafe: RC-in, failsafe PWM,
      fatal), joined by the inter-node IPC (relay-bus carrier, relay#177 / DD-009). To
      develop + verify the WHOLE vehicle (not one piece), jess runs TWO simulation tracks
      IN PARALLEL on the same wasm/ARM artifacts:
        TRACK A - wasmtime (hardware-free SIL): the portable wasm components run in
          wasmtime, no board, no Renode wall-clock, every-PR-fast. falcon control already
          via the SIL gate (scripts/jess-build.sh); gust failsafe via sim/gust-wasmtime.sh
          (gust_mix(1024)==1500, the REFLASH silicon kill-criterion checked in software
          first) - PASSING. Next: a COMBINED harness (falcon+gust over a shared simulated
          plant + an IPC channel, exercising the M7-healthy->gust-passive /
          M7-fault->gust-failsafe handoff).
        TRACK B - Renode (real-hardware model): the actual synth->ARM binaries on modeled
          silicon. M7 = pixhawk6xrt.repl (REQ-PIX-005/TEST-PIX-013); F100 = gale's
          gust_m3_8k.repl (TEST-PIX-016, gale owns its CI). Next (Stage 4): a MULTI-NODE
          Renode emulation - RT1176 + the F100 machine in one mach, joined by the IPC
          link, with sensor (RESD) + motor (PWM-capture) models = the real-hardware
          simulation of the whole vehicle.
        TRACK C - physical silicon (staged): gust on the ordered STM32VLDISCOVERY
          (hardware/silicon/), the Pixhawk M7 READ-ONLY/greenlight-gated.
      WHY BOTH IN PARALLEL: wasmtime = fast hardware-free feedback on the portable logic;
      Renode = real-ISA/real-timing fidelity (the silicon contract + WCET). Running both
      on the same components means a DIVERGENCE localizes the bug - logic (Track A) vs the
      synth->ARM lowering (Track B). This is the SIL-differential discipline (DD-010)
      lifted from per-piece to the whole multi-node vehicle. The shared plant/scenario
      definition (sensors, motors, IPC, fault injection) is authored once and consumed by
      both tracks so they test the same system.
    tags: [phase-2, simulation, wasmtime, renode, multi-node, sil, hil, on-target]
    fields:
      rationale: >-
        A flight system is the two nodes + their IPC, not falcon alone; it must be
        simulatable as a whole, early, without waiting on hardware. wasmtime gives
        hardware-free speed (CI on every PR); Renode gives silicon fidelity; the two
        in parallel on identical components turn any divergence into a localized
        logic-vs-lowering signal (DD-010 at vehicle scale). Physical silicon (Track C)
        is the final confirmation, not the development loop.
      alternatives: >-
        Renode-only - rejected: too slow for every-PR feedback (M3/M7 RunFor is
        wall-clock-heavy) and needs the toolchain; wasmtime covers the logic in seconds.
        wasmtime-only - rejected: misses the synth->ARM lowering + real timing/WCET (the
        on-target gaps #369/#275 only show on the ARM path). Single-node sims only -
        rejected: the failsafe handoff + IPC are vehicle-level behaviors that only appear
        with both nodes present.
    links:
      - type: satisfies
        target: REQ-PIX-017


  - id: DD-020
    type: design-decision
    title: Root-of-trust = HARDWARE-FIRST (SE050 secure element + i.MX RT HAB secure boot) with a SOFTWARE FALLBACK (sigil + relay-sec) when the hardware is absent/unprovisioned/unhealthy
    status: accepted
    release: v0.8.0
    description: >
      The 6X-RT security root-of-trust decision (user direction: "hardware with a
      software fallback if the hardware does not provide"). GROUNDED in the PX4
      fmu-v6xrt source (read directly, research-first):
      WHAT THE BOARD HAS (two distinct hardware trust anchors, both PRESENT but neither
      ACTIVE in the stock dev build):
        - NXP SE050 EdgeLock SECURE ELEMENT on I2C4 @ 0x48 (PX4_I2C_OBDEV_SE050; init.c
          power/enable-sequences it via HW_VER_REV_DRIVE) - a tamper-resistant key vault
          + ECC/RSA/AES + ECDSA/ECDH + attestation + TRNG. BUT PX4's default v6xrt crypto
          backend is sw_crypto (src/drivers/sw_crypto) - the SE050 is wired, not the
          default trust anchor.
        - i.MX RT1176 HAB (High Assurance Boot) ROM secure boot: the IVT (struct ivt_s)
          carries a `csf` (Command Sequence File / signature) field, but on v6xrt
          CSF_ADDRESS=0 / csf=0 -> the default image is UNSIGNED (HAB "open" mode). HAB is
          a silicon capability (CAAM engine + OCOTP SRK-hash fuses + boot ROM); enforcing
          it = burn the SRK hash into OCOTP, sign with a CSF, "close" the device.
      DECISION (two layers, each HW-first / SW-fallback):
        (A) BOOT/LOAD-CHAIN INTEGRITY (is the flight image authentic before it runs):
            HW = HAB - fused SRK + CSF-signed loader, ROM verifies before execution
            (anchors the chain in silicon: ROM -> HAB-verified loader -> loads the
            sigil-verified flight image to TCM, DD-016 load-to-RAM). FALLBACK (HAB open /
            fuses not burned, e.g. dev + unprovisioned units) = the loader verifies the
            sigil signature IN SOFTWARE (DD-016's current posture) + relay-sec anti-replay/
            anti-rollback. Selection = device HAB state (closed -> HW enforces; open -> SW
            gate).
        (B) KEY STORAGE + CRYPTO OPS (where the verify keys + relay-sec long-term keys
            live, where ECDSA-verify/attestation runs): HW = SE050 - holds the
            image-verification public key + relay-sec keys, does verify/attest in the
            tamper-resistant element. In the maximal-wasm model (DD-018) the SE050 is just
            ANOTHER relay-hal I2c transport + a verified SE050 driver; the crypto ops are
            SE050 I2c commands. FALLBACK (SE050 absent / unenumerated / unhealthy) = the
            software crypto backend (relay-sec software AEAD + a key in protected FRAM/
            flash). The HW/SW SELECTION REUSES THE EXISTING MECHANISM: DD-018's Presence/
            health descriptor + DD-014's health-driven posture - "SE050 present & healthy
            -> use it; else degrade to software" is the same enumerate-and-vote pattern,
            with the downgrade LOGGED as a health event (monitor-visible, like DD-014
            power redundancy), not silent.
      HONEST CAVEAT (the safety/security trade): a SOFTWARE root is WEAKER - a software
      signature check can be bypassed by an attacker who replaces the loader itself, and a
      software key store lacks tamper resistance. So the software fallback is for (i) dev/
      bring-up, (ii) unprovisioned units, and (iii) graceful field degradation if the SE050
      fails - NOT the certified-flight target. The PRODUCTION / safety-certified
      configuration MUST provision the hardware (burn HAB SRK fuses, provision the SE050),
      and the fallback-active state is a reported, lower-assurance mode. This keeps dev
      velocity (no fuse-burning to iterate) while making the hardware root the default for
      shipped units.
      FITS THE STACK: SE050 -> relay-hal I2c transport (DD-018); HW/SW select ->
      Presence/health (DD-014/DD-018); HAB -> the boot/update-chain anchor for DD-016's
      update TCB; sigil + relay-sec stay as the software-layer integrity (DD-009/DD-016) -
      now positioned as the FALLBACK + the application-layer E2E, with HW as the root.
    tags: [phase-2, security, root-of-trust, se050, hab, secure-boot, attestation, relay-sec, sigil, fallback]
    fields:
      rationale: >-
        Hardware-first gives a tamper-resistant, silicon-anchored root (SE050 key vault +
        HAB-fused secure boot) appropriate for an ASIL-D / DO-178 posture, while the
        software fallback (sigil + relay-sec, already designed) keeps dev + unprovisioned +
        degraded-field units functional without fuse-burning. Reusing the DD-014/DD-018
        Presence/health pattern for the HW/SW selection means no new mechanism - the
        secure element is enumerated, health-checked, and voted exactly like a sensor, with
        the downgrade logged, not silent.
      alternatives: >-
        Software-only (sigil + relay-sec, no HW) - rejected as the production target: no
        silicon root-of-trust, software signature/key bypassable; kept only as the
        fallback. Hardware-only (require SE050 + HAB always) - rejected: blocks dev
        iteration (fuse-burn per change), bricks unprovisioned units, and gives no graceful
        degradation if the SE050 fails in the field. DPS/TPM or a different secure element -
        rejected: the SE050 is the part already on the 6X-RT (I2C4 @ 0x48) and PX4-supported;
        no reason to add another.
    links:
      - type: satisfies
        target: REQ-PIX-019

  - id: DD-021
    type: design-decision
    title: jess release roadmap + cut criteria - the rivet release field is the plan; readiness is a query; v0.6.0 = the RT1176 emulation + MAVLink bench milestone
    status: accepted
    release: v0.6.0
    description: >
      Makes the release plan live in rivet (the `release:` field) rather than in
      GitHub milestones alone, per the release-planning method: a release's SCOPE is
      the set of requirements tagged `release: vX.Y`; READINESS is the query "are all
      scope artifacts `verified`/`accepted` with the V closed?" (tools/rivet/snapshot.sh
      + the V-closure SQL); a release is CUTTABLE only when every artifact in its scope
      is verified. Roadmap (the substantive Phase-2 line; v0.1-v0.5 carried the early
      generic bootstrap requirements):
        - v0.1.0  spine            META-REQ-001 (accepted; TEST-META-001)
        - v0.6.0  RT1176 emu+bench REQ-PIX-005 + REQ-PIX-010  <- CUTTABLE (both accepted)
        - v0.7.0  on-target bring-up REQ-PIX-001/002/003/004/006/007/008/011/012
        - v0.8.0  PX4 HITL + persistence + root-of-trust  REQ-PIX-014/015/019
        - v0.9.0  gust/F100 + combined vehicle + witness/scry gates  REQ-PIX-009/017/018
      SCOPE DECISION logged here: REQ-PIX-001 ("compiles+links for Cortex-M7, fpv5-d16
      hard-float") MOVED v0.6.0 -> v0.7.0. Its "hard-float" claim cannot reach `verified`
      until synth#369 (GI-FPU-002 VFP lowering) + #275 (dispatch) land - both external -
      so keeping it in v0.6.0 would block a release that is otherwise done. v0.6.0 cuts on
      the two genuinely-complete, V-closed requirements: REQ-PIX-005 (the hand-authored
      RT1176 Renode platform boots bring-up firmware to the LPUART1 banner; TEST-PIX-005,
      + the synth#374 OOB oracle TEST-PIX-013 and the synth#507 br_table oracle TEST-PIX-020
      ride the same renode-smoke gate) and REQ-PIX-010 (the MAVLink CRC bench over the
      committed 6X-RT sample; TEST-PIX-010). CUT MECHANICS for jess (no published binary -
      it is the integration hub): an annotated git tag vX.Y on a green main + a GitHub
      release whose notes carry the FALSIFICATION STATEMENT for the milestone's behavior,
      and the scope requirements flipped verified -> accepted. RELEASES.md is the
      human-readable log. v0.7.0+ are driven by pulling `release: vX.Y` + status != verified
      and running each through the feature loop; they are gated on the synth poles
      (#369/#275/#503), gale#65, and hub#98, so they are PLANNED not yet cuttable.
      TOOLING ADOPTED 2026-06-27 (rivet v0.22.0, "Release planning, complete",
      REQ-232/233/234, #516): the release plan is now driven by first-class rivet commands,
      not hand-rolled SQL. MIGRATION: `release:` moved from a nested `fields:` child to a
      TOP-LEVEL artifact dimension across 85 artifacts (the nested form was invisible to the
      new tooling); the junk `AFD-026: release=falcon` was dropped (findings are not
      release-scoped). READINESS is now `rivet release status <ver>` (per-status burn-down;
      EXITS NON-ZERO when not cuttable) - this is the PRE-TAG CUT GATE, run at release time
      (the snapshot shows it informationally for v0.6.0-v0.9.0; not a per-PR gate since
      planning releases are intentionally red). `rivet list --release <ver>` is the scope
      view; `rivet release move <id> <ver>` logs scope changes. LESSON: the tool's
      FULL-SCOPE gate caught FEATURE-009 ("release-watch automation v1") still `draft` in
      v0.6.0 - a miss my earlier REQUIREMENT-ONLY readiness query did not see; FEATURE-009
      is genuinely delivered (the CI gates + snapshot + chain-measure + per-piece process
      all operate) so it was flipped accepted, and v0.6.0 is now `rivet release status` =
      Cuttable. GOING FORWARD a release is tagged only after `rivet release status vX.Y`
      exits 0 (full scope, not just requirements). Also assigned the backlog REQ-PIX-006
      -> v0.7.0 (now 9 reqs). KNOWN FOLLOW-UP: the stpa/stpa-sec/safety-goal artifacts were
      blanket-tagged release=v0.8.0 (foundational analysis, not v0.8.0 deliverables), so
      `release status v0.8.0` shows ~40 artifacts / 38 draft - a scope-hygiene cleanup
      (drop release: from the analysis layer, keep it on requirements/DDs) is owed before
      v0.8.0 planning is meaningful.
    tags: [phase-2, release-planning, rivet, roadmap, process, traceability, rivet-0.22]
    fields:
      rationale: >-
        The V-model artifacts should drive the roadmap and gate the cut, which is only
        possible if the plan lives in the trace (the `release:` field) where readiness is
        a query over verification state - not a spreadsheet or milestone divorced from it.
        Moving a blocked requirement out of a ready release (vs shipping it unverified or
        stalling the release) is the deliberate, logged scope move the method prescribes.
      alternatives: >-
        Plan only in GitHub milestones - rejected: the roadmap then can't be gated on
        verification state. Hold v0.6.0 until REQ-PIX-001 verifies - rejected: that bets a
        done milestone on external synth fixes (#369/#275) with no jess lever. Verify
        REQ-PIX-001 at the "compiles" bar now - rejected: its title claims hard-float,
        which is not met; verifying it would overclaim (the honest split is to defer).
    links:
      - type: satisfies
        target: META-REQ-001
