  - id: AFD-050
    type: ai-found-defect
    severity: major
    triage-status: closed
    detected-by: jess built the DD-025 periodic rung once AFD-049 unblocked it, 2026-09-02
    title: THE CASCADE NOW RUNS ON A SCHEDULE — 8/8 timer-paced periods, every wake fired, and the SAME image completes 0 periods once the clock stops ticking
    status: resolved
    description: >
      2026-09-02. AFD-047 claimed an application could not make its own wake fire; AFD-049 showed
      that rested on a stale artifact. This finding is what the correction unblocked: the falcon
      cascade driven ON A SCHEDULE rather than called once - the DD-025 structural rung.
      BUILT: app/flight-loop, a component SEPARATE from flight-app. flight-app's single-shot run()
      is the AFD-044 regression baseline whose exact fold the composition differential pins;
      widening its import surface to add the timer would risk that baseline for no gain.
      RESULT (8 iterations, 3 ticks per period, wasmtime): 8/8 completed, every wake fired, the fold
      varied, the clock advanced.
      *** THE ORACLE IS A DIFFERENTIAL ON THE CLOCK, NOT AN ASSERTION THAT THE LOOP RAN ***. The
      same composed image runs twice with exactly ONE thing changed - whether read32 ticks:
        TICKING   iters=8/8  all_fired=true   varied=true   clock=true
        CONSTANT  iters=0/8  all_fired=false  varied=false  clock=false
      Both directions are required for a PASS. A loop that "completes" under a frozen clock is
      SPINNING, not scheduling - exactly the confusion AFD-047 fell into - so the oracle refuses it
      rather than celebrating a completion count.
      TIED TO THE ESTABLISHED REFERENCE: iteration 1 reproduces the single-shot differential fold
      EXACTLY (0xABC6 = low half of 1068280774, which cascade_ref.py computes independently). The
      periodic path re-enters the arithmetic already pinned rather than forming a separate universe.
      THE `varied` BIT IS THE ANTI-VACUITY GUARD: falcon carries integrator state, so a fold that
      CHANGES across iterations is positive evidence the body genuinely re-executed. A constant fold
      over >1 iterations would mean the loop counted without computing. From iteration 2 the mixer
      SATURATES (sum = 4.0, all four motors at 1.0) because a constant 1 rad/s setpoint error winds
      the integrator up with no feedback - expected for an OPEN-LOOP drive, recorded so it is not
      misread as a control result.
      FOUND WHILE NEGATIVE-CONTROLLING THE ORACLE: `ticks-per-period = 0` degenerates to a BUSY LOOP.
      sleep(h,0) means "wake immediately", so all 8 iterations complete even under a frozen clock.
      The oracle catches it and it is deliberately NOT special-cased in the component - silently
      rewriting a caller's 0 into a 1 would hide the mistake rather than surface it.
      ORACLE NEGATIVE-CONTROLLED BOTH WAYS: sabotaging the PASS slot to use the constant HAL -> rc=1;
      ticks=0 -> rc=1 with the vacuity message; restored -> rc=0.
      NOT CLAIMED: wasmtime only, NOT the RT1176 and not Renode. The ticking read32 advances on every
      call, so this proves the LOOP STRUCTURE - arm, wait, compute, repeat - and NOT any timing
      property. Real rates need timer-thin owning a configured prescaler behind the gust:hal seam,
      which is gale's documented intent.
    tags: [dd-025, periodicity, timer, flight-loop, gale, clock-differential]
    links:
      - type: traces-to
        target: DD-025
      - type: traces-to
        target: REQ-PIX-007

  - id: AFD-049
    type: ai-found-defect
    severity: critical
    triage-status: closed
    detected-by: gale identified jess's own constant on gale#223; jess reproduced and root-caused it, 2026-09-02
    title: AFD-047's CENTRAL CONCLUSION WAS WRONG - the clock was frozen by a STALE ARTIFACT jess's own script selected, not by gale; with the ticking HAL the wake FIRES on the first poll and the timer path works end to end
    status: resolved
    description: >
      2026-09-02. AFD-047 reported that on shipped gale-nano 0.7.0 the clock does not advance, that
      an armed wake never fires in 10,000 polls, and - the load-bearing error - that "gale's
      time::now() does NOT read through gust:hal/mmio". gale disproved the last claim by pointing at
      their own one-line source, and jess reproduced the correction.
      *** THE CONSTANT WAS JESS'S OWN STUB, AND IT PROVES THE SEAM WORKS ***:
        gale: fn now() -> u64 { read32(TIM2_CNT) as u64 }   with TIM2_CNT = 0x4000_0024
        0x4000_0024 & 0xFF = 36 - exactly the constant AFD-047 reported as unexplained.
      So now() DOES call through gust:hal/mmio.read32 with the expected address, and the value came
      back out of jess's own address-derived stub. AFD-047's first instinct was right and its
      "correction" was wrong.
      *** ROOT CAUSE - A STALE ARTIFACT THE SCRIPT PREFERRED ALPHABETICALLY ***. jess DID build a
      ticking HAL variant to test exactly this, and concluded from it that the clock stayed frozen.
      That test never ran the ticking HAL. app/gust-hal-tick was created with `cp -r
      app/gust-hal-stub`, which copied the stub's target/ directory too, leaving a stale
      jess_gust_hal_stub.wasm beside the real jess_gust_hal_tick.wasm. Both the ad-hoc compose and
      the committed tools/timer-probe/run.sh selected `ls .../*.wasm | head -1`, and the stale STUB
      sorts first. Every "ticking" run silently composed the CONSTANT stub.
      *** THE CORRECTED RESULT - A CLEAN SINGLE-VARIABLE DIFFERENTIAL ***, everything identical but
      read32's return:
        CONSTANT stub    clock_advances=0  slept=0  polls=10000  elapsed_at=0
        TICKING hal      clock_advances=1  slept=1  polls=0      elapsed_at=1
      The probe is now 6/6 including its negative control, and THE WAKE FIRES ON THE FIRST POLL.
      *** WHAT THIS CHANGES ***: gale's timer path WORKS end to end on the shipped v0.7.0 -
      spawn.start -> timer.sleep -> timer.slept -> elapsed. PERIODICITY IS UNBLOCKED. The design gale
      documented is confirmed: the embedder supplies time through gust:hal/mmio, TIM2_CNT is a
      documented mock counter, and timer-thin is the driver meant to own the real prescaler behind
      that seam. gust:hal is the right home for jess's clock, as gale said.
      *** WHAT SURVIVES FROM AFD-047 ***: the reframing gale adopted for DD-025 - the constraint is
      not only who drives the EXECUTOR but who supplies the CLOCK - is still correct, and is now
      correct for a demonstrated reason rather than a mistaken one: time enters the graph ONLY
      through the host's read32. An application in pure wasm cannot manufacture it. Also confirmed by
      gale: 7f09ada touches only the world and the example, no runtime.
      *** THE LESSON, and it is the third instance of the same shape this campaign ***: AFD-048
      found a control that measured statefulness instead of input sensitivity; this one ran a
      control that never applied its variable at all. Both PASSED and both were wrong. A negative
      control must be shown to have ACTUALLY CHANGED the thing it names - here, that the artifact
      composed is the artifact intended. run.sh now names the tick artifact explicitly and REFUSES
      if a stale stub is present in that directory; the refusal is itself negative-controlled.
      NOT CLAIMED: this ran under wasmtime. The ticking read32 advances on every call, so the wake
      firing on poll 0 is a degenerate instant timer, not a realistic rate - it proves the MECHANISM,
      not a schedule.
    tags: [gale, dd-025, timer, clock, stale-artifact, vacuous-control, self-correction, periodicity]
    links:
