  - id: AFD-011
    type: ai-found-defect
    title: rivet list --format json omits custom fields - release readiness not natively queryable
    status: resolved
    description: >
      RESOLVED 2026-06-10 (loop iter#3): fixed upstream via `rivet list --full` (REQ-211, PR #507), shipped in rivet v0.16.0. Verified on the jess store: `rivet list --format json --full | jq '.artifacts[] | select(.fields.release)'` returns all 53 release-tagged artifacts, and `rivet list --filter '(= release "vX")'` filters without --full. Confirmed on rivet#511 (issuecomment-4667096156); jess can drop the YAML-parsing burndown workaround. ORIGINAL: rivet list --format json did not include the artifact fields map, so a custom field like release could not be queried/grouped from the CLI - the per-release readiness burndown had to be built by parsing YAML. Filed https://github.com/pulseengine/rivet/issues/511.
