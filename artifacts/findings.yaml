      CAMPAIGN IMPACT: the on-target rung for the COMPOSED stack is blocked upstream. Note this does
      NOT block the falcon cascade alone - that image still lowers 5/5 on m7dp and m4f (AFD-042). What
      is blocked is lowering the cascade TOGETHER WITH the runtime and the application, which is what
