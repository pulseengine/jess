  - id: AFD-008
    type: ai-found-defect
    title: synth arm backend compiles only exports not the reachable call graph
    status: open
    description: >
      synth arm backend compiles only exported functions, not the reachable call graph. falcon component gives 4 funcs; the meld-fused core (280 funcs) gives 24 funcs, ELF ~5KB. Internal cascade functions are absent, so the ELF cannot execute run-stabilization on-target (Renode/QEMU/hardware) - it runs fine in wasmtime and kiln where the whole module is present. Complete-firmware path is backend w2c2 plus --link (w2c2 + arm-none-eabi-gcc + kiln builtins), but w2c2 reports not installed. This is the real blocker for jess 0.2.0/0.3.0 on-target HIL, beyond Renode not being installed. Filed https://github.com/pulseengine/synth/issues/275 - supervising. UPDATE 2026-06-10 (loop iter#3): answered the maintainer's requested scoping input on the fused core - call_indirect count = 61, 2 funcref tables (15+34=49 slots), 187 funcs, 26 exports. This is the 'many' case the maintainer defined, confirming the blocker is the broken call_indirect DISPATCH (select_with_stack drop + R11 table-base collision), not a direct-call closure bug; reachability closure already fixed in v0.11.33. Comment synth#275 issuecomment-4667039061. UPDATE 2026-06-10 (iter#4): maintainer accepted the scoping and SCHEDULED the dispatch fix as synth v0.11.42 (10-release plan, #242). jess confirmed normal-queue priority is fine - not blocking Phase-1 HIL (falcon runs whole-module in wasmtime/kiln), but it is the long pole for the on-target Cortex-M milestone (jess 0.2.0/0.3.0); will ping to queue-jump if on-target becomes active before v0.11.42. Comment issuecomment-4671423102.
    tags: [release-watch, synth, on-target]
    fields:
      detected-by: jess on-target diagnosis (synth arm backend) on falcon fused core
      severity: major
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002

  - id: AFD-009
    type: ai-found-defect
    title: kiln does not terminate on falcon run-position-hold (fused core)
    status: resolved
    description: "RESOLVED 2026-06-10 (loop iter#3): kiln#270 CLOSED by maintainer; reduced-repro diagnosis independently re-verified (kiln F32 3.131192207 == wasmtime 3.1311922 on reduced-200step.fused.wasm) and captured upstream as design-decision SM-PERF-001 (kiln PR #290). No correctness defect: the tree-walker is the QM reference/validation runtime, fuel-bounded since 0.3.1 (slow is bounded, never an unbounded hang); real-time embedded control is the synth native path (synth#275) by architecture. ORIGINAL RECLASSIFICATION 2026-06-06: NOT a correctness/non-termination bug. Reduced 200-step repro shows kiln terminates AND matches wasmtime (3.131192207 == 3.1311922). The 30000-step run-position-hold is finite-but-slow on kiln's tree-walker (>1B instructions), not infinite. Fuel-bounding (bug b) fixed in kiln 0.3.1 (#276), so it is now safe (--fuel traps). Implication for jess: the kiln interpreter is correct but too slow for large real-time control loops; real-time embedded needs synth native compilation (synth#275). kiln#270 (a) is a performance characteristic, not a correctness defect."
    tags: [release-watch, kiln, simulation, critical]
    fields:
      detected-by: jess meld->kiln differential sim vs wasmtime (source-built fused falcon)
      severity: major
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-004

