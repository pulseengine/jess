  - id: AFD-026
    type: ai-found-defect
    title: synth arm backend cannot lower memory.copy/memory.fill - 19 sites, falcon's largest remaining on-target gap
    status: resolved
    description: >
      Found 2026-06-18 (iter#33) after synth#372 (i64 load/store) landed in v0.11.47:
      with i64 fixed, the largest remaining unlowered op-set in the falcon fused core
      is BULK-MEMORY - 11 memory.fill + 8 memory.copy = 19 sites - which the arm
      backend cannot lower (same `_ => None` decoder path; loud-skipped since GI-FPU-001).
      jess MINIMAL REPRO on synth v0.11.47: a module with cpy (memory.copy), fil
      (memory.fill), ld32 (i32.load, control) - `synth compile --target cortex-m7dp`
      skips cpy/fil ("unsupported operator MemoryCopy/MemoryFill") but compiles ld32.
      NOTE the maintainer's "#180/#185 tracked bulk-mem" refs are CLOSED and about
      other bugs (MemLoad ADD-register path; encoder PC-operand panic) - the
      memory.copy/fill LOWERING is untracked, so jess filed it. Impact: on falcon
      v1.80, of 41 remaining loud-skips, 19 are bulk-mem and ~19 are FP (#369); so
      once hard-float lands, bulk-mem is the last op gap before the firmware ELF is
      structurally complete (alongside dispatch #275). gale-nano substrate does NOT
      use bulk-mem (gale-side profile), so this is falcon-specific. Filed
      https://github.com/pulseengine/synth/issues/374 - supervising. Suggested: lower
      to a bounded inline loop or a linked __aeabi_memcpy/memset, with wasm OOB-trap
      semantics (bounds-checked vs the linear-memory limit, matching wasmtime).
      UPDATE 2026-06-19 (iter#38, cron): LOWERING IMPLEMENTED in synth #376
      (v0.11.49 prepped, tag held pending silicon confirm): fill -> STRB byte loop;
      copy -> memmove byte loop (dst>src copies BACKWARD for overlap correctness);
      --safety-bounds software -> END-EXCLUSIVE OOB trap (off+len>size or u32
      overflow trap; off+len==size in-bounds) matching wasmtime, via inline UDF ->
      UsageFault/HardFault -> Trap_Handler. memory 0 only (non-zero idx + RISC-V
      still loud-skip per GI-FPU-001 honesty). LOCAL value-level gate already green:
      maintainer's bulk_memory_374_differential.py = 16/16 vs wasmtime (forward,
      both overlap directions, self-copy, len==0, size boundaries no-trap, OOB
      trap, high-bit fill); frozen fixtures byte-identical. The ONE unicorn-blind
      path = the UDF->HardFault->Trap_Handler routing under --safety-bounds software
      -> jess can verify this HERMETICALLY on its Renode RT1176 platform (REQ-PIX-005
      pattern) without the physical board. Real-silicon flash = a greenlit follow-up.
      RESOLVED 2026-06-19 (iter#40): synth v0.11.49 RELEASED (= commit 39010ce, #374
      CLOSED); jess's Renode OOB-trap oracle (TEST-PIX-013) was the gate that closed
      it. jess adopted v0.11.49 (SHA-verified darwin release) and verified on the
      total on-target loud-skips 41->29, the remaining 29 ALL hard-float (#369). So
      falcon's on-target gap list collapses to JUST #369 (hard-float) + #275
      (dispatch). Committed oracle ELFs are the v0.11.49 content (no rebuild needed).
    tags: [release-watch, synth, bulk-memory, on-target, blocker]
    fields:
      detected-by: jess iter#33 minimal repro; RESOLVED synth v0.11.49 (#376, released 2026-06-19, #374 closed) - jess verified falcon v1.80 bulk-mem loud-skips 19->0 on the release + Renode OOB-trap oracle GREEN in CI (TEST-PIX-013); 16/16 maintainer differential
      severity: major
      triage-status: resolved
    links:
