                   required-backlink resolution ("let validate fail") does NOT newly fail jess.
        coverage   64.8% (0.36.0) vs 63.9% (0.32.0) on the SAME store — a real 0.9-point version delta.
                   Worth noting because ci.yml's comment cites "64.8% >= 60" as jess's evidence: that
                   number came from a different binary than the one on PATH, which is the drift hazard
