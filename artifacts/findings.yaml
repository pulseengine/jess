  - id: AFD-102
    type: ai-found-defect
    title: jess's release scheme forced a permanent fifth field into varve's layer format (tag != payload version), and with-device now publishes from TWO routes at different versions — the bench runs one the signed layer does not carry
    status: open
    description: |-
      2026-09-06. varve answered varve#130 with an admission and a recommendation, and both are right.
      Also, replying to it surfaced a drift jess itself created.

      *** varve's FINDING, accepted: jess's release scheme forced a permanent change on the layer format ***
      varve deposited `with-device 0.2.1` into layer 2026.09.1 before reading the issue. Ingesting it
      FORCED THEM TO EXTEND THE LAYER ENTRY FORMAT with a fifth field carrying the payload's own
      version — because every other payload has `tag == payload version` and jess's does not:
          v0.7.2 -> with-device 0.2.2     v0.7.1 -> 0.2.1     v0.7.0 -> 0.2.0
      Without the fifth field the SIGNED MANIFEST would have recorded version "0.7.1" for a binary that
      answers "0.2.1" — the layer stating something untrue about its own contents. That is permanent
      surface varve now maintains because a consumer repo ships a tool.
      jess's release list makes the confusion concrete: v0.6.0 is a FINDING ("RT1176 hermetic emulation
      + MAVLink bench"), v0.7.x are a TOOL. One tag line, two purposes, and no way for a reader or an
      assembler to tell which a tag is without opening it.
      jess's own argument for moving the tool was structural ("consumer repos ship findings"). varve's
      is a measured cost imposed on someone else, which is strictly better. ACCEPTED. varve also
      declines to host it themselves — "a realm whose signer also authors payloads is a concentration
      worth avoiding while it is still cheap to avoid" — which is the right instinct and jess agrees.

      *** THE DRIFT JESS CREATED, found while replying ***
      `with-device` now publishes from TWO routes at once, and the bench disagrees with the layer:
          jess release v0.7.2    -> 0.2.2   (latest, cosign + SLSA)
          varve layer 2026.09.1  -> 0.2.1   (deposited 2026-09-05)
          gale's pin             -> 0.2.1   (jess release v0.7.1)
          fourpi bench, RUNNING  -> 0.2.2   (updated after release)
      So the machine doing the work runs a version the signed layer does not carry, and the other
      consumer of that same bench pins a third route at the older one. Nobody is wrong; there are two
      publication paths for one artifact and they were never going to stay in step.
      TWICE JESS'S FAULT, stated plainly: (1) released v0.7.2 without knowing varve had deposited, and
      (2) told gale on gale#356 "0.2.2 is on main, NOT YET RELEASED; v0.7.1 remains the pin", then
      released it hours later and did not go back — so gale has been pinning a stale version on jess's
      say-so. Corrected on both threads.
      This is the same drift class as AFD-094 (ci.yml vs varve pin vs PATH), one level up: not three
      answers to "which version is installed" but two answers to "where does this artifact come from".
      And it argues varve's case further — two routes exist BECAUSE a consumer repo doubles as a tool
      publisher. Once the tool has its own repo, the layer is the route and the release is upstream of
      it: one line, not two.

      *** ALSO ANSWERED: the layer is NOT binaries-only ***
      Asked whether a script could be a payload. varve declined the easy exit now that with-device is a
      binary: `binfmt::check_platform` classifies a `#!` file as Script and REPORTS rather than refuses.
      What a script LOSES is the architecture check, and `REQ-PAYLOADSMOKE-001` clause 4 (execute the
      payload with a harmless argument, require a clean exit) IS NOT IMPLEMENTED — nothing in the
      producer runs a deposited payload. So for a script the layer would vouch for the bytes and for
      nothing else. Moot for with-device, but recorded: that is a far more useful answer than "binaries
      only", because it lets a consumer decide rather than guess.

      *** OPEN, NOT DECIDED HERE ***
      Creating a separate repo for with-device is an org-structural action and the operator's call, not
      jess's to take unilaterally. Put to them. The catalogue ask from earlier comments is unrelated to
      varve's three answers and remains open upstream.
    tags: [varve, with-device, release, drift, dual-publication, afd-094, upstream, repo-structure]
