  - id: AFD-101
    type: ai-found-defect
    title: rivet v0.36.0 is clean on jess's store, but REQ-320 (declare rules you do not model) does NOT cover jess's case — the guard correctly refused the declaration, and adopting it on the changelog line would have taken CI down
    status: open
    description: |-
