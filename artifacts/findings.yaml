  - id: AFD-033
    type: ai-found-defect
    title: synth call_indirect on falcon's fused table (20 funcs) - the full dispatch story #642->#650->#664->#676 RESOLVED v0.38.0 (0 declines verified); falcon on-target now #369-gated alone
    status: resolved
    description: >
      Found 2026-07-08 (release-watch, synth v0.33.1). synth's thumb-2 backend links only
      TABLE 0 (at R11); any call_indirect whose table index is >=1 is refused:
      "call_indirect: table index 1 is not supported (only table 0 is linked at R11) - #642".
      The new closed-world verifier additionally refuses element segments targeting a non-zero
      table ("closed-world type check failed - ... non-zero table ..."). SURFACED BY (not caused
      by) the #642 fix: on <=v0.33.0 these sites were SILENTLY miscompiled (an uncontrolled
      indirect branch - #642's own differential shows the decoy fn got called); v0.33.1 makes
      them an honest loud-decline. So this is a correctness WIN that reveals a residual pole,
      not a regression. jess IMPACT: the released falcon-flight v1.112 fused core (meld 0.33.0
      -> loom 1.1.18) has TWO funcref tables - (table 0: 7 entries) + (table 1: 41 entries) -
      and 20 of 146 functions dispatch through table 1, so on synth 0.33.1 -t cortex-m7dp the
      skip inventory is 46/146: #369 float 24, table-1 call_indirect 20 (THIS), #518 i64
      frame-param 1 (func_164), #503 i64 stack-arg 1. Multi-table dispatch is now the
      SECOND-largest on-target skip class after #369, a distinct dispatch pole alongside #275
      (self-contained path compiles only exports). Minimal hermetic repro:
      repro/synth-650-multitable/table1_ci.wat (two tables; call_indirect $t1 -> declines; the
      analogue of TEST-PIX-020/021). Fix directions offered upstream: (a) link table 1..N with
      a per-table base + extend closed-world verification to non-zero-table elem segments, OR
      (b) meld coalesces the component's funcref tables into a single table 0 during fusion
      (re-index call_indirect + elem). Not urgent - falcon on-target is #369-gated regardless -
      but the dispatch path must be complete when #369 lands. Filed synth#650. ALSO NOTED same
      run: register-exhaustion skips 3->0 and the #518 i64-regalloc tail shrank to a single
      function (func_164), so the i64-regalloc pole is nearly closed.
      UPDATE 2026-07-08 (synth v0.34.0, SAME-DAY fix): synth#650 (multi-table LINKING) SHIPPED
      + CLOSED - contiguous table region at R11, per-table base offsets, per-table bounds +
      closed-world type guards; single-table modules byte-identical by construction. Verified
      against the REAL falcon build: the "table index N not supported" decline is GONE (0
      occurrences), and the multi-table repro compiles. BUT the SAME 20 functions still decline
      one layer deeper - falcon's (table 1 41 41) is SPARSELY populated, so they now hit a
      closed-world NULL-FUNCREF-SLOT check: "table N slot M is uninitialized (null funcref) - a
      call_indirect reaching it must trap, and the raw code-pointer table has no runtime null/
      type id to check; refusing to emit an unchecked indirect branch." This is a DISTINCT root
      cause (reproduces on a SINGLE table with a partial elem segment; orthogonal to multi-table)
      -> filed synth#664 with a minimal repro (repro/synth-650-multitable/nullslot_ci.wat) + the
      real-build report on #650 as the maintainer requested. Fix directions offered: (1) fill
      null slots with a trap-trampoline sentinel address (call->UDF traps), or (2) a per-slot
      null/type-id sidecar checked before the BLX. NET: falcon skip inventory UNCHANGED at 46/146
      on v0.34.0 (24 #369 float + 20 null-funcref-slot [#664] + 1 #518 + 1 #503). The multi-table
      pole moved from LINKING (resolved, #650) to NULL-SLOT LOWERING (open, #664) - still 20 funcs,
      still all behind #369. status stays open, tracking the residual under #664.
      UPDATE 2026-07-09 (synth v0.37.0; #664 FIXED in v0.36.0, CLOSED): null-slot dispatch shipped
      ("sparse tables dispatch; null slots trap"), #650 linking stays fixed. Verified v0.37.0 on
      the real falcon build: the SAME 20 funcs decline one layer DEEPER - the closed-world check
      now reports a TYPE-SIGNATURE MISMATCH ("table 1 entry (function 93, type 7) has a different
      signature than expected type 3 - a runtime type check is not implementable on the raw
      code-pointer table"). ROOT CAUSE: falcon's fused (table 1 41) is a SINGLE HETEROGENEOUS elem
      segment of 40 funcs spanning multiple signatures (types 3, 7, ...) - a vtable-style table.
      Each call_indirect expects one type; at runtime the index always selects a correctly-typed
      entry (falcon passes wasmtime SIL - heterogeneous tables are VALID wasm, type mismatch is a
      RUNTIME trap per 4.4.8), but synth can't prove it statically and won't emit a runtime type
      check -> declines all 20. TERMINAL layer of the dispatch story: index (#650 ✓) -> null-slot
      (#664 ✓) -> type-heterogeneity (synth#676, OPEN). Minimal repro hetero_ci.wat. Fix offered:
      a per-slot TYPE-ID SIDECAR (u32 type_id[] beside the code-pointer table; call_indirect =
      bounds + load type_id[idx] + CMP expected + BNE->UDF + BLX) - the WASM-mandated runtime
      check, which also subsumes #664's null-trap (reserved type_id=0). falcon inventory UNCHANGED
      at 46/146 (24 #369 + 20 hetero-table [#676] + 1 #518 + 1 #503), all behind #369. Aside on
      #676: meld emits 31 type decls for 25 distinct signatures (6 structural dups) - harmless
      (synth compares structurally).
