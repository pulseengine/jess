  - id: AFD-007
    type: ai-found-defect
    title: wasm_optimize LoomOptimize action cannot find a fetched symlinked input
    status: resolved
    description: >
      wasm_optimize runs loom.wasm under wasmtime with --dir=. and reports 'Input file not found' for a fetched/symlinked component input; wasm_validate on the same adopted target succeeds. Likely WASI-preopen/symlink staging. Non-critical for jess (loom inert on falcon, AFD-002) and validate works. Filed https://github.com/pulseengine/rules_wasm_component/issues/490 — supervising. UPDATE 2026-06-13 (iter#13): maintainer pushed a fix (PR #497, loom_wrapper EvalSymlinks+preopen) and asked jess to verify the falcon adopt+optimize path. jess repointed git_override to the branch (d3da86c), re-enabled //:falcon-optimized, and ran bazel build (9.1.1, darwin arm64): ORIGINAL SYMPTOM RESOLVED (zero 'Input file not found') but it surfaced a NEW runfiles gap one step later - loom_wrapper can't find wasmtime at its expected runfiles path (+wasmtime+wasmtime_toolchain/wasmtime) though the toolchain exists in external/ as rules_wasm_component++wasmtime+wasmtime_toolchain. Suggested adding wasmtime to the wrapper's data/runfiles + runfiles-lib resolution. Reported on rwc#490 (issuecomment-4698839528). Temp bazel edits reverted - jess keeps //:falcon-optimized disabled until the fix lands on a merged/pinnable SHA; will re-verify on push. RE-VERIFIED + RESOLVED (pending merge) 2026-06-13 (iter#13b): maintainer pushed f4eb4f8 (pass the wasmtime binary as an action input instead of a hardcoded runfiles Rlocation - root/dep-agnostic). jess rebuilt //:falcon-optimized on f4eb4f8: SUCCESS - loom runs end-to-end, 4/4 core modules, 101207->97351 (3.8%), output wasm-tools VALID and SIL gate EXACT (0.023399856 / 0.1317415 raw vs optimized). Confirmed on rwc#490 (issuecomment-4699241295). On #497 merge jess bumps the git_override to main + re-enables //:falcon-optimized permanently. Side note: the stable-2026-03 wasm bundle ships loom v0.3.0 (predates loom#172/#196 fixes) - bundle loom pin worth bumping. RESOLVED 2026-06-13 (iter#14): PR #497 MERGED to rwc main (5c452c11). jess bumped its git_override b6a641a -> 5c452c11 and re-enabled //:falcon-optimized PERMANENTLY (durable, no longer temp). bazel build //:falcon-validate //:falcon-optimized green on main; SIL gate exact on the optimized artifact. rwc#490 closed. The hermetic fetch->validate->optimize chain is now real in jess.
    tags: [release-watch, rules_wasm_component, bazel]
    fields:
      detected-by: jess 0.2.0 bazel build //:falcon-optimized (rwc main b6a641a)
      severity: minor
      triage-status: open
