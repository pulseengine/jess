  - id: AFD-045
    type: ai-found-defect
    severity: major
    triage-status: confirmed
    detected-by: jess attempted to lower the newly-composed DD-026 stack for the RT1176, 2026-08-27
    title: THE COMPOSED STACK HAS NO MCU LOWERING PATH — multi-memory validates but has no single-address-space lowering, and shared+address-rebase emits INVALID wasm with exit 0 (meld#390, distinct from #351/#326/#339)
    status: open
    description: >
      2026-08-27, immediately after AFD-044 closed the composition gap. The natural next rung was to
      lower the composed image for the RT1176. It does not lower today, and the reason is a meld
      defect that jess found, minimised and filed as meld#390.
      THE FORK, and both tines are currently dead ends:
        --memory multi (the `auto` choice)     VALIDATES and RUNS CORRECTLY, but meld itself states
                                               multi-memory "has no single-address-space (MCU)
                                               lowering" (meld#172). Cannot reach the RT1176.
        --memory shared --address-rebase       the ONLY single-address-space route, and it emits a
                                               module that FAILS wasm-tools validate. meld EXITS 0.
      MINIMAL REPRO — two components, not the 19-component graph:
        meld fuse flight-app.wasm rate.wasm --memory shared --address-rebase   -> exit 0
        wasm-tools validate                                                    -> func 14 failed:
          "type mismatch: values remaining on stack at end of block (at offset 0x840)"
      *** DISTINCT FROM THE KNOWN REBASE ISSUES *** and this is why it was filed rather than added to
      one: meld#351 states explicitly that "the fused module validates cleanly", and #326/#339 are
      likewise about WRONG ADDRESSES IN A VALID MODULE. Here the module is not valid at all and meld
      reports success. The only warning printed is the standard #326 unsoundness note, which points
      at computed addresses - not at malformed output.
      WHAT SEPARATES PASS FROM FAIL (the discriminating table, all measured):
        flight-app alone / rate alone            valid
        rate + mixer                             VALID   <- both record-carrying, but neither imports
                                                            the other: no call crosses the boundary
        flight-app + gale-nano                   VALID   <- a call DOES cross, but gust:os/time is
                                                            scalar-only (u64/bool)
        flight-app + rate                        INVALID (func 14)
        flight-app + mixer                       INVALID (func 12)
        full 19-component composition            INVALID (func 72, "expected f32, found i32")
      HYPOTHESIS OFFERED TO MELD AS A SEARCH AIM, NOT AS A DIAGNOSIS: the trigger is a wired
      cross-component call whose signature passes or returns a RECORD via linear memory - exactly the
      calls the rebase pass must touch. jess has not read the rebase implementation and did not claim to.
      RULED OUT BEFORE FILING: not relocation-driven (rebuilding flight-app WITHOUT --emit-relocs
      reproduces the identical func 14 failure); not a wac artefact (fusing the four raw components
      with no wac step fails identically); not general toolchain breakage (the pre-existing falcon
      fused cascade still validates); not a bad input (the default path produces a valid module that
      RUNS and reproduces the AFD-044 reference value 1348 exactly).
      *** A NARROWING ERROR WAS MADE AND CORRECTED MID-INVESTIGATION *** - recorded because the wrong
      version was briefly believed. The first narrowing pass reported "INVALID" for cases where meld
      had actually FAILED TO PRODUCE OUTPUT AT ALL: validate was run on a non-existent file and its
      failure was scored as an invalid module. Two different failures were being conflated under one
      label. Re-run with meld's exit code and wasm-tools' exit code checked SEPARATELY, which is what
      produced the table above. The corrected run happens to reach the same conclusion, but the first
      pass was not evidence for it.
      *** THIS FINDING WAS FIRST WRITTEN AGAINST STALE TOOLING - A PROCESS FAILURE, RECORDED ***: the
      investigation and the initial meld#390 report were run on meld 0.41.3 while 0.52.0 IS LATEST -
      eleven minor versions. "Run a supplier's DOCUMENTED pipeline before reporting a failure against
      it" is a standing rule and it was broken. Re-run in full on 0.52.0 and meld#390 corrected in a
      comment. THE DEFECT IS REAL AND REPRODUCES EXACTLY on 0.52.0 (same func 14, same offset 0x840),
      so the conclusion survives - but it was not earned until the re-run, and three specifics were wrong:
        (a) BROADER THAN FILED: `--pack-rebase` did not exist in 0.41.3 and was never tested. It fails
            IDENTICALLY. That matters because --pack-rebase is the path the campaign actually uses.
        (b) LESS SEVERE THAN FILED: meld already ships `--validate`, which CATCHES this (exit 1,
            "Validation failed"). The "silent, exit 0" framing was an overstatement - it is silent only
            by DEFAULT, and jess should have checked for the flag before characterising it.
        (c) the version citation in the report header was wrong.
      MATRIX RE-MEASURED ON MELD 0.52.0:
        rate + mixer            --pack-rebase      VALID    <- the falcon-only cascade path is NOT affected
        flight-app + rate       --pack-rebase      INVALID
        full composition        --pack-rebase      INVALID
        full composition        --address-rebase   INVALID
        full composition        --memory multi     VALID (but no MCU lowering)
      The `rate + mixer` row is the important one: this does NOT regress the existing cascade lowering.
      It specifically breaks fusing the cascade TOGETHER WITH an application that imports it.
      *** SECOND-ORDER FINDING - JESS'S TOOLCHAIN IS UNPINNED AND DRIFTED ***: local meld was 0.41.3,
      CI pins MELD_VERSION v0.41.3, and latest is 0.52.0. Nothing detected the drift because JESS HAS
      NO VARVE PIN. This is the concrete cost of that gap: an upstream report filed against tooling
