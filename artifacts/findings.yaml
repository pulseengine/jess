  - id: AFD-014
    type: ai-found-defect
    title: loom v1.1.11 element remap scrambles the function-pointer table - valid-but-wrong code, SIL gate fails
    status: open
    description: >
      CRITICAL silent miscompilation found 2026-06-10 (iter#5) by running the
      BEHAVIORAL differential that the structural checks missed. loom v1.1.11's
      element-section fix (loom#172) makes module 0 encode correctly, but the
      rebuilt element segment holds the wrong functions in the wrong slot order
      (slot 1: core::fmt float Debug -> libm atan2f; entries shifted, substituted,
      last slot cabi_realloc -> cabi_realloc_wit_bindgen_0_41_0). Since the slot
      index IS the function-pointer value, all 61 call_indirect sites dispatch to
      wrong signature-compatible functions - wasm-tools validate and loom --verify
      both pass. SIL gate catches it - run-stabilization 0.023->0.329 rad (FAIL
      <0.1), run-position-hold 0.132->593.8 m (FAIL <0.6). Deterministic
      (byte-identical re-runs), input-independent (v1.34 and v1.44 give identical
      wrong values), not in any per-module pass (all 16 --passes selections
      reproduce it -> the unconditional component fused/remap path). v1.1.10 was
      accidentally SAFE: its invalid encoding triggered the fallback to original
      bytes. Worst failure class for jess - flight code that compiles, validates,
      and flies wrong. DECISION - loom v1.1.11 quarantined from the jess chain;
      loom adoption now gated on the SIL differential (runbook updated). Filed
      https://github.com/pulseengine/loom/issues/196 - supervising. Correction
      posted on loom#172 retracting the premature structural confirmation.
      UPDATE 2026-06-11 (iter#7): maintainer's re-trace confirmed the corruption
      is DEEPER than the element remap - loom's whole parse->optimize->re-encode
      of table-bearing modules was behaviorally unsound; v1.1.12 fixes by
      SKIPPING any core module with a function-referencing element segment
      (deliberate return to safe inertness). jess re-ran the SIL gate on the
      v1.1.12 code (built with v1.1.11 dep pins due to the broken tag, AFD-015):
      EXACT behavioral match (0.023399856 / 0.1317415 both sides), module 0
      safely inert. Confirmed on loom#196 (issuecomment-4677414075). Quarantine
      lifts when loom#198 (broken tag, no release binaries) ships a buildable
      release. Cosmetic: log still claims 'Module 0 optimized successfully' for
      a skipped module - noted on the issue. QUARANTINE LIFTED 2026-06-11
      (iter#8): loom v1.1.13 from-tag locked build succeeds and the behavioral
      gate is green on falcon v1.34 AND v1.44 (exact match 0.023399856 /
      0.1317415, structural valid, table module safely inert). v1.1.13 adopted
      into the jess chain; confirmed on loom#198 (issuecomment-4677880669).
    tags: [release-watch, loom, miscompilation, critical, sil-gate]
