  - id: AFD-097
    type: ai-found-defect
    title: "clean-room pass: 17/17 claims confirmed by an independent verifier that EXECUTED them — and a demonstrated false-FAIL/false-PASS in jess's own geometry gate, the third defect in that one script"
    status: open
    description: |-
      2026-09-06. Clean-room verification (fresh-context verifier, no inherited framing) over BOTH
      today's work and the campaign machinery — overdue: ~10 features had landed since the last pass
      against a mandated cadence of one every ~2.

