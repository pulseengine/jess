  - id: AFD-027
    type: ai-found-defect
    title: kiln-error forces a global allocator transitively (recovery.rs alloc), breaking kiln-async no_alloc on the 8KB-SRAM STM32F100
    status: resolved
    description: >
      Found 2026-06-18 (iter#33) during the gale-nano deep-dive (gale#65). kiln-async
      is documented + built as no_std + NO-alloc, but linking it to wasm32/bare-metal
      transitively REQUIRES a global allocator: kiln-error/src/recovery.rs does
      `extern crate alloc` and puts String / Vec<String> / BTreeMap<String,String> in
      ErrorContext/recovery types, which kiln-async pulls in via the unified error
      type. Surfaced by the architect (avrabe) in a gale-side gale-nano profile and
      reproduced (the cdylib won't link without a #[global_allocator]). Impact for
      jess: the gale-nano target is the Pixhawk 6X-RT STM32F100 I/O MCU (Cortex-M3,
      8KB SRAM); a mandatory heap there is a hard blocker independent of any synth
      backend gap. With synth#372 (i64) now fixed in v0.11.47, this alloc dependency
      is the SOLE remaining blocker for the gale-nano scheduler substrate compiling to
      thumbv7m-none-eabi (REQ-PIX-009 precondition b). Filed
      https://github.com/pulseengine/kiln/issues/338 - supervising. Suggested: a
      no_alloc/embedded Cargo feature on kiln-error gating out the recovery module
      (and String/Vec/BTreeMap payloads) so ErrorContext degrades to a fixed/&'static
