  - id: AFD-071
    type: ai-found-defect
    title: The on-target oracles are now a CI GATE, not hand-run evidence — the single-platform synth pin that blocked it is gone, and the linux digests were proven from macOS before CI depended on them
    status: resolved
    description: |-
      2026-09-04. AFD-064 D4 recorded that NONE of the cascade-invoke oracles run in CI, so every
      on-target result this campaign has reported was hand-run evidence rather than an enforced gate.
      AFD-065 named the blocker: tools/deps/artifacts.pins carried ONE digest for the synth binary, a
      Mach-O arm64 one, which a linux runner can NEVER satisfy. This removes that blocker and promotes
      TEST-PIX-032 and TEST-PIX-033 to CI.
      *** PLATFORM-AWARE PINS ***: artifacts.pins now carries ONE LINE PER PLATFORM for every compiled
      binary (synth, and now meld and loom), each tagged platform=<triple>. check.sh and fetch.sh act only
      on the line matching the running host and SKIP the others VISIBLY - a silent skip would make a
      platform-incomplete pin set look complete.
      *** THE LINUX DIGESTS WERE PROVEN BEFORE CI DEPENDED ON THEM ***, not after. Added
      HOST_PLATFORM_OVERRIDE to both scripts and used it to fetch the x86_64-unknown-linux-gnu synth FROM
      MACOS: the fetch pulled the linux tarball, extracted the binary, and its digest matched the new pin
      line. That is a real verification of the CI path from a machine that cannot run it. The chain for
      every new digest is release signature -> tarball -> extracted binary; none was typed in by hand.
      *** meld AND loom ARE NOW PINNED TOO, and the reason matters ***: varve is not available on a CI
      runner, so CI must supply them as fetched binaries. VERIFIED 2026-09-04 that the binaries inside the
      meld v0.52.0 / loom v1.4.0 release tarballs are BYTE-IDENTICAL to what `varve which meld` and
      `varve which loom` resolve to locally. So a CI measurement is comparable to a developer-machine one
      rather than merely similar - without that check, "CI runs the pinned toolchain" would have been an
      assumption.
      *** AN OVERRIDE IS NO LONGER TREATED AS OFF-PIN ***. build.sh previously announced OFF-PIN whenever
      MELD/LOOM were supplied at all, which would have made EVERY CI run declare itself a candidate
      differential and drained the banner of meaning. It now judges by DIGEST against the pins file:
      matching -> "ON-PIN", not matching -> the OFF-PIN banner naming the digest. Both directions observed
      - pinned binaries report ON-PIN, loom 1.4.1 still reports OFF-PIN.
      *** A PORTABILITY BUG FIXED BEFORE IT COULD FAIL IN CI ***: check.sh, fetch.sh and build.sh all
      hardcoded `shasum`, which macOS ships (perl) and Linux does not guarantee. On a runner without perl
      every one of them would have failed for a reason unrelated to the artifacts. All three now select
      shasum or sha256sum at startup and refuse if neither exists.
      *** WHAT IS AND IS NOT VERIFIED ***: everything above was exercised on macOS, including the linux
      PIN via the override. The linux JOB ITSELF - apt gcc-arm-none-eabi, the Renode portable tarball,
      oras, and the oracles running under them - is UNTESTED until this PR's CI runs. That is the honest
      status: the PR is the test. If it fails, the failure is the finding.
    tags: [ci-gate, afd-064-d4, platform-pins, reproducibility, toolchain-pinning, portability, on-target]
    fields:
      detected-by: jess closing AFD-064 D4, the last named blocker to enforcing the on-target oracles, 2026-09-04
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-04T10:48:46Z

  - id: AFD-072
    type: ai-found-defect
    title: CI and clean-room found DIFFERENT defects in the same PR — a vacuous control inside the step that was being promoted to a gate, and an ON-PIN report for a binary that does not exist
    status: resolved
    description: |-
      2026-09-04. Two independent checks ran against PR #218 at once — CI (empirical, on a real linux
      runner) and clean-room verification (adversarial, reading the same code). They found DIFFERENT
      defects, which is the argument for running both.
      *** WHAT CI FOUND ***: the new on-target job failed at build step 2 with `FAIL: wasm-tools not on
      PATH`. A dependency the job simply did not install. Everything before it WORKED FIRST TRY on linux:
      apt gcc-arm-none-eabi, the Renode portable tarball, oras, tools/deps/fetch.sh fetching and verifying
      ALL pins including the linux synth/meld/loom digests that had only been proven via
      HOST_PLATFORM_OVERRIDE from macOS, and build step 1 reporting ON-PIN for both fetched binaries. So
      AFD-071's core - platform-aware pins, and CI's toolchain being the same bytes as varve's - is now
      validated on the platform it was written for.
      FIX: install wasm-tools pinned to 1.245.1 (the local version, so CI and local are not silently
      different toolchains) plus a PREFLIGHT asserting every required tool up front. The real defect was
      not the missing tool: it was that the job discovered missing dependencies ONE AT A TIME, after a
      full fetch and build.
      *** D1 (WORST, and it was in a step this PR had just made a CI GATE): run-oracle.sh's NC2 control
      was VACUOUS. *** Its else-branch accepted "the harness did not complete" as an acceptable outcome
      and then printed the full PASS banner claiming the embedder init is load-bearing. Driven by
      substituting a NON-ELF for nc2.elf: the read returned nothing, the control was silently waived, and
      the oracle exited 0 with the attribution intact. The soak oracle hard-fails the same case; this one
      did not. FIXED: no else-branch - no data is now a hard failure. ALSO added the all-zero guard the
      soak has: nc2's real output IS all-zero, which is what ANY image that produced nothing reports, so
      it is now labelled LIVENESS ONLY rather than counted as attribution. Same class as AFD-048 and
      AFD-064 D1, and it had survived both previous clean-room rounds.
      *** D2: build.sh reported ON-PIN for a binary that DOES NOT EXIST. *** `grep -q "^$1/$1 *$d "` with
      an empty digest collapses to `^meld/meld * ` and matches the real pin line. Three reachable paths,
      all demonstrated: a nonexistent binary; any binary at all on a host lacking both shasum and
      sha256sum (announce_tool had no refusal branch, unlike check.sh/fetch.sh); and a LINUX digest on a
      Darwin host, because the match ignored platform=. FIXED: require an executable file, refuse when no
      hasher exists, reject a non-64-hex digest before matching, anchor on whitespace, and verify the
      matched line's platform equals the host. All three repros now report OFF-PIN; the legitimate case
      still reports ON-PIN.
      *** D3: a typo'd platform triple silently removed a pin from verification on EVERY host, green. ***
      `aarch64-apple-darwinn` matches no host, so the line is skipped everywhere and nothing verifies that
      artifact - check.sh still printed "all N present and matching". Sharpest form: delete the host's
      line, put an arbitrary binary at the path, still green. FIXED with two invariants: platform triples
      are validated against a known set (unknown -> exit 1), and a path whose EVERY line was skipped is
      reported as covered by nothing (-> exit 1). Both repros verified.
      *** ALSO FIXED ***:
        - fetch.sh wrote OUTSIDE DEST: a pin path of `../../ESCAPED/rate.wasm` landed outside the tree and
          still reported success. artifacts.pins is PR-editable and fetch.sh now runs in CI with a token,
          so this is a supply-chain-shaped hole, not a tidiness issue. Now refused.
        - check.sh and fetch.sh DISAGREED about their own file's grammar: check parsed platform= from
          locator+remainder, fetch only from the remainder, so a tag placed before the locator made one
          skip silently while the other hard-failed. Unified.
        - check.sh hardcoded PINS while fetch.sh honoured an override, which is also why a pin-file
          variant could not be tested without moving the real file aside. Now overridable.
        - mktemp -t (BSD/GNU divergent) -> mktemp -d in both renode oracles, ahead of them running on
          linux for the first time.
        - `gh` added to the CI preflight; fetch.sh requires it.
      *** NOT FIXED, recorded ***: tools/rivet/triage-gate.sh misses two exotic-but-valid YAML spellings
      (`triage-status:\n  bogus` and `!!str bogus`) and its field count drops silently when it does. Low
      severity - nobody hand-writes those - but it is the structural limit of a regex-over-text gate, and
      the honest fix is rivet#885's `validate --strict`, not more regex.
    tags: [clean-room, ci-gate, vacuous-control, on-pin, platform-pins, path-traversal, portability, self-correction]
