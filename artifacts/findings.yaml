      because it needed a vendoring-or-pin decision, not a script edit.
      *** PROVENANCE VERIFIED BEFORE PINNING, because pinning a lookalike is worse than not
      pinning ***: the five falcon components sitting in .scratch/v1341 were compared against
      relay's PUBLISHED falcon-v1.134.1 assets. All five are BYTE-IDENTICAL. So the pins record what
      actually produced AFD-046/-051/-052, not a local rebuild that resembles it.
      INDEPENDENT CORROBORATION: the gale-nano pin, 546531952a5cf0ed..., is the same digest gale
      themselves quoted for the ghcr blob on gale#224. Two parties, one artifact, one hash.
      LANDED: tools/deps/artifacts.pins (7 artifacts - five falcon components, gale-nano 0.7.0,
      synth 0.60.0) and tools/deps/check.sh, wired as a PREFLIGHT into all four oracles.
      THREE EXIT CODES, because the failures are not the same failure:
        0  every pinned artifact present and matching
        1  present but NOT matching - the DANGEROUS case. A lookalike produces results that read
           reproducible and are not, which is strictly worse than a missing file.
        2  absent - the honest case; the checker names the path and the source to fetch from.
