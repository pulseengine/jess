  - id: AFD-028
    type: ai-found-defect
    title: synth --safety-bounds is a NO-OP on the optimized path (main i32/i64 memory access) - flight bounds-safety hole
    status: open
    description: |-
      Surfaced 2026-06-19 (iter#38) by the synth maintainer (synth#377) while answering jess's question about pinning --safety-bounds for the falcon flight build. Per-path behavior verified: on the OPTIMIZED path (the bulk of a flight loop - i32/i64 loads/stores) --safety-bounds {none,mpu,software} emit BYTE-IDENTICAL code (movw/movt/add/str) with NO inline bounds check and NO MPU programming - `software` is a no-op there; `mpu` programs zero MPU regions (it only writes a .safety-manifest.json the codegen never enforces). Inline checks are emitted ONLY via the direct selector (the declined ops: bulk-mem #374, i64 #372, floats). So #374's bulk-mem traps correctly (inline UDF), but the main memory path is unprotected. Impact for jess: pinning --safety-bounds software on the falcon M7 firmware would give a FALSE sense of memory-safety - it protects only decline-path ops, not the primary load/store path; `mpu` is worse (looks enforced, isn't). jess's posture (DD-006 maximal-wasm + the gust TCB boundary): hardware-MPU enforcement of the wasm linear-memory region belongs in the NATIVE TRUSTED BASE (a register/MMIO concern owned by gale's verified primitives), with synth's inline bounds as defense-in-depth - so for jess `software` was intended as belt-and-suspenders, NOT the sole mechanism. But #377 means jess must (a) NOT treat synth bounds as load-bearing on the main path, and (b) confirm/own MPU programming of the linear-memory region in the native base. RESOLVED-(b) iter#43: gale provides a VERIFIED MPU primitive (gale/src/mpu.rs + mem_domain.rs + mmu.rs, Verus/Rocq-proven) - so the native trusted base (gale-maximal-wasm, DD-017) DOES own MPU enforcement of the linear-memory region; synth's --safety-bounds stays defense-in-depth only, as the DD-006 posture held. So the flight memory-safety guarantee = gale's MPU (verified), not synth bounds. Tracking https://github.com/pulseengine/synth/issues/377; scoping with the maintainer. Suggested: synth should either emit real inline checks on the optimized path under `software`, or program real MPU regions under `mpu`, or clearly document that bounds enforcement is the embedder's (native base's) responsibility so `software`/`mpu` aren't mistaken for enforcement.

      *** CORRECTION 2026-09-04 (AFD-076) — THE RESOLUTION ABOVE OVERSTATES WHAT gale PROVIDES. ***
      The sentence "the flight memory-safety guarantee = gale's MPU (verified)" was written from gale's
      SOURCE. Asked directly (gale#348), gale answered and three things narrow it:
        1 NOT SHIPPABLE AS AN ARTIFACT THE WAY sem/mutex/msgq ARE. MPU enforcement is a PRIVILEGED PPB
          REGISTER WRITE (MPU_RBAR/MPU_RASR at 0xE000ED9C) and no wasm component can perform it. gale
          puts it behind one trusted atom (mpu-thin, one undefined symbol `mpu-write`). If gale ships it,
          jess receives the VERIFIED REGION-TABLE COMPUTATION and FSM; THE REGISTER WRITE IS JESS'S
          OBLIGATION. Part of the guarantee moves to jess's side of the line.
        2 THE SCOPE IS FAULT-CONTAINMENT, NOT SECURITY-CONTAINMENT. Per gale, VER-OS-ISO-001's demo
          tenant runs PRIVILEGED and the PPB is NOT MPU-checked, so a privileged tenant can reprogram the
          MPU. It supports "an accidental out-of-grant access is contained"; it does NOT support "a
          compromised tenant cannot escape".
          FOR AFD-028 THAT SCOPE IS THE RIGHT ONE AND SHOULD BE STATED: this finding arose from synth#377,
          a MISCOMPILATION concern (--safety-bounds is a no-op on the optimized path). Fault-containment
          is exactly the threat model that concern needs. The overstatement was calling it "the flight
          memory-safety guarantee" without qualification, not the choice of mechanism.
        3 IT WILL NOT SHIP IN v0.7.x. gale is scoping it after the privileged/PPB question, deliberately,
          to avoid inviting the reading that the artifact enforces by itself.
      AND JESS CANNOT VALIDATE ITS OWN HALF IN EMULATION (AFD-076): Renode 1.16.1 models the Cortex-M7
      MPU REGISTER FILE but does not ENFORCE regions. So the register-write obligation is currently
      untestable off silicon.
      STATUS: remains open. It is NOT resolved-(b); that half is now a stated obligation on jess plus a
      pending gale artifact, and the enforcement leg needs hardware.
    tags: [release-watch, synth, safety-bounds, memory-safety, on-target, flight-safety]
    fields:
      detected-by: synth#377 (maintainer, answering jess's --safety-bounds question) - {none,mpu,software} byte-identical on the optimized path, no check / no MPU; jess confirmed flight-relevant
      severity: major
      triage-status: scoping
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002
      - type: traces-to
        target: REQ-PIX-001

  - id: AFD-029
    type: ai-found-defect
    title: wit-bindgen-generated cabi_realloc emits memory.grow - blocks meld --memory shared single-address-space MCU lowering (the maximal-wasm on-target path)
    status: open
    description: >
      Surfaced 2026-06-21 (cron loop) reviewing the pulseengine/wit-bindgen fork's
      embedded issues. A NEW on-target blocker on jess's maximal-wasm punch-list,
      distinct from the synth (#369 AFD-024 / #275 AFD-008) and kiln-no_alloc
      (AFD-027) items - it lives at the BINDING-GENERATOR layer.
      THE DEFECT: the guest cabi_realloc wit-bindgen generates
      (cabi_realloc_wit_bindgen_* -> crate::rt::cabi_realloc) is backed by the global
      GROWING allocator, so any component built with these bindings emits memory.grow
      (canonical-ABI realloc + Vec/String lift/lower, AND - per the now-closed
      wit-bindgen#6 - even a fully-SCALAR world still EXPORTS a grow-able cabi_realloc
      behind $sbrk). That single opcode blocks the embedded lowering chain:
        - meld#299: `meld fuse --memory shared --address-rebase` (single-address-space
          MCU mode) FAIL-LOUDS on memory.grow (a frozen shared static layout can't
          survive a runtime grow) -> a component with one memory.grow is NOT
          MCU-lowerable.
        - gale#89: gale-app-demo / gale-kiln each carry exactly one memory.grow "from
          the default Rust/wit-bindgen wasip2 allocator"; the multi-memory fallback is
          not MCU-lowerable (2x1088KB, synth rejects). This directly blocks the jess ->
          Pixhawk 6X-RT all-wasm pipeline (DD-017/DD-018: component -> wac -> meld
          --memory shared -> synth -> ARM + TCB seam).
      A second related async-layer source is wit-bindgen#1/#5: StreamReader::next /
      StreamWriter::write_one heap-allocate per item (real-time control-loop churn /
      WCET) - the maintainer's branches make the scalar path amortized- then
      true-zero-heap (Miri-gated). jess on-target nuance (posted on #5): the inline
      zero-heap path is gated on-silicon by synth - f32 payloads still loud-skip
      (#369/AFD-024) so it helps fixed-point (gust Q8, DD-011) NOW and float once #369
      lands.
      RESOLUTION SPLIT (two halves, both in flight):
        (1) wit-bindgen#4 (OPEN): a build-time mode retargeting cabi_realloc to an
            embedder-provided no-grow symbol (e.g. __cabi_arena_realloc / a bounded
            static arena, fail-loud/trap on exhaustion) so components are born
            MCU-lowerable. jess endorsed the extern-symbol shape (= the maximal-wasm
            TCB host-interface model) and proposed backing it with gale's
            Rocq/Verus-VERIFIED mem_slab/mempool, giving a formally-verified bounded
            cabi_realloc (issuecomment-4761323601).
        (2) wit-bindgen#6 (CLOSED -> meld#298): for the dual-runtime requirement
            (same artifact must link on wasmtime AND lower for MCU) wit-bindgen keeps
            emitting standard cabi_realloc; the REMOVAL of the vestigial export +
            $sbrk + memory.grow happens in meld (un-export on the --memory shared
            fused core) + loom (DCE). This matches DD-018 (the WIT seam meld-fused to
            ZERO runtime cost).
      jess STAKE + OWED VERIFICATION: jess is the downstream MCU gate. (a) verify the
      meld#298 un-export + loom DCE actually yields a memory.grow-free, synth-lowerable
      fused core on the RT1176 path; (b) offer the Renode RT1176 OOB-trap oracle
      (TEST-PIX-013, the harness that closed synth bulk-mem #374) as the hermetic
      trap-on-arena-exhaustion gate for #4. Budgets: gust/F100 = 8KB SRAM (~7.5KB
      free), M7 = load-to-RAM in TCM (DD-016). Comments posted on wit-bindgen #4/#5/#6.
      VERIFIED 2026-06-21 (jess tested the fork branch integration/embedded-rt-no-grow,
      a2d46c4): the cabi-realloc-extern feature does clear the kill-criterion. Built a
      minimal wasm32-unknown-unknown cdylib exercising wit_bindgen::rt::cabi_realloc
      (rustc 1.94.1, wasm-tools 1.245.1, lto, panic=abort) two ways:
        - default (growing global allocator): memory.grow x2.
        - --features cabi-realloc-extern + a bounded no-grow arena backing both the
          #[global_allocator] and __cabi_arena_realloc (traps on exhaustion): memory.grow
          x0, cabi_realloc export retained, __cabi_arena_realloc wired in.
      So a component built this way clears meld#299's --memory shared --address-rebase
      precondition AT THE SOURCE. Branch test suite also green here: default 19+15;
      --features cabi-realloc-extern,async 20 incl. cabi_realloc_routes_to_extern_arena,
      next/write_one_inline_blocked_then_cancel_no_uaf, *_true_zero_heap_scalar. Result
      posted on wit-bindgen#4 (issuecomment-4761824958). SCOPE of this check: validates
      the cabi_realloc MECHANISM on a raw module + the feature is not(target_env=p2)-gated
      (correct - wasip2 uses wasi-libc's cabi_realloc; the no-grow path applies to the
      wasm32-unknown-unknown embedded target MCU lowering uses). NEXT RUNG (still owed):
      a full generate!-world -> component -> meld --memory shared -> synth run on a
      componentized no-grow artifact for RT1176, end-to-end. Stays open until that lands.
      UPDATE 2026-06-23 (cron loop): synth v0.12.0 RELEASED (#418/#420) LOCKS the
      `cabi-arena-realloc -> __cabi_arena_realloc` linkability in synth's dissolution path
      (test(dissolve): lock cabi-arena-realloc linkability) - so the synth side of the
      no-grow chain (consuming the wit-bindgen extern-arena symbol when dissolving a
      component to the MCU) is now a released, regression-locked contract. So of the
      no-grow halves: wit-bindgen#4 extern-arena (jess-verified on the branch, #85) +
      synth linkability (now released v0.12.0) advance the source/dissolution side; the
      meld#298 un-export + loom DCE half (closed-#6 path) is the remaining wasm-rewrite
      piece. AFD-029 stays open on the end-to-end RT1176 rung.
    tags: [release-watch, wit-bindgen, memory-grow, no-alloc, maximal-wasm, on-target, blocker]
    fields:
      detected-by: jess cron-loop review of the pulseengine/wit-bindgen fork embedded issues (#1/#4/#5/#6); cross-repo chain meld#299/#298 + gale#89; jess comments #4 issuecomment-4761323601, #5, #6
      severity: major
      triage-status: scoping
