    description: >
      2026-08-27 release-watch. Five suppliers moved (gale 0.6->0.7, loom 1.2->1.4.1, rivet 0.32->0.34,
      spar 0.35->0.40, sigil 0.10->0.11). Tested the two that sit in the pipeline.
      *** JESS TOOLING DEFECT - FOUND BEFORE IT CAUSED A FALSE REPORT (third such catch) ***: the
      publish-gate C5 check reported __heap_base MISSING on gale-nano 0.7.0. Verified independently
      first (strings / grep -a / wasm-tools print all found it, 5 occurrences) - THE GATE WAS WRONG.
      ROOT CAUSE: the script runs `set -o pipefail` and C5 piped `strings -a FILE | grep -q PATTERN`.
      `grep -q` exits on first match, SIGPIPEs the producer, and with pipefail the pipeline returns 141
      -> the `if` takes the else branch -> FALSE FAIL. Whether it bites depends on WHERE in the file the
      symbol occurs, so it is ARBITRARY PER-ARTIFACT: gale-nano 0.7.0 (30 KB) wrongly failed while
      relay's mixer (12 KB) passed. Demonstrated: rc=0 without pipefail, rc=141 with it, on the same
      file. FIXED by matching the binary directly (`grep -qa PATTERN "$f"`) with no pipe.
      RE-VERIFIED EVERY PRIOR CLAIM with the fixed gate: relay v1.134.1 all six still CONSUMABLE (the
      report to relay was correct - luck, not judgement); gale-nano 0.6.0 still fails C4+C5 (that report
      was correct too); the negative control (v1.129 core-module) still bites on C1+C2. So no prior
      upstream report was wrong - but the next one would have been.
      GALE-NANO 0.7.0 - PASSES. Component, digest OK, 30,476 B (0.6.0: 20,741). Gate C1-C5 ALL PASS:
      gale added BOTH --emit-relocs (C4, which 0.6.0 failed) AND __heap_base (C5). WIT world unchanged
      and still matches the DD-026 three-layer contract (exports gust:os/{time,log,spawn,exec,timer},
      imports gust:hal/mmio + gust:os/taskdisp).
      ACCEPTANCE INVARIANT RE-VERIFIED, AND THIS TIME SOUNDLY: 0 skips on all three cores with residual
      EXACTLY `poll-task read32 write32`; 7,785 B (m7dp/m4f), 7,781 B (m3). The 0.6.0 result was obtained
      via plain `--memory shared`, which SILENTLY OVERLAPPED data segments; 0.7.0 goes through
      `--pack-rebase`, which does not.
      *** MELD#370 IS FIXED AND ENFORCING *** - meld 0.52 now HARD-REFUSES the plain `--memory shared`
      fuse: "overlapping data segments in fused output (10 overlapping pair(s)) ... this silently
      corrupts data. use --address-rebase (page-granular) or the compact --pack-rebase". That is the
      exact command jess ran on 0.6.0 and had to retract a claim over (AFD-038 correction). The tool now
      makes that mistake impossible.
      *** SYNTH v0.59's THREE GATES MECHANICALLY ENUMERATE THE JESS EMBEDDER CONTRACT *** - a genuinely
      useful by-product for the unstarted gust:hal work. Hitting them in sequence on gale-nano says
      exactly what jess-as-embedder must provide:
        (1) the IMPORTS - gust:hal/mmio read32/write32 + gust:os/taskdisp poll-task (the residual);
        (2) #1041 DATA-SEGMENT population - `--embedder-data-init` declares the embedder populates the
            module's active data segments at instantiation;
        (3) #1052 GLOBAL-INITIALIZER evaluation - `--embedder-global-init` declares the embedder
            evaluates the module's 6 global initializers and seeds the R9 globals table BEFORE any
            export runs (the documented contract assigns only the table BASE to the embedder, never
            initializer evaluation).
      Each refuses loudly rather than silently reading whatever target memory holds. So the gust:hal
      specification is no longer guesswork: it is (1)+(2)+(3).
      LOOM 1.4.1 (from 1.2.0) - NEUTRAL for the falcon gate. Re-optimized the fused packed cascade:
      wasm 64,486 -> 61,216 B (5% SMALLER), but skip counts IDENTICAL on all three targets (m7dp 3,
      m4f 5, m3 12) and the self-contained ARM image slightly LARGER (65,723 vs 65,576, +147 B). Smaller
      input does not imply smaller output; recorded because the opposite is the natural assumption.
      Consistent with GI-FPU-002 being a synth register-allocation limit no upstream optimizer can remove.
    tags: [release-watch, gale, gale-nano, loom, meld, synth, publish-gate, embedder-contract, gust-hal]
    fields:
      detected-by: jess release-watch 2026-08-27 on gale 0.7.0 + loom 1.4.1 against the real artifacts
      severity: info
      triage-status: closed
    links:
      - type: traces-to
        target: REQ-PIX-001

  - id: AFD-039
    type: ai-found-defect
    title: synth v0.59 adds TWO honest-refusal gates (#952 missing-export, #1041 unmaterialized data segments) — falcon numbers unchanged, but #1041 means jess's --relocatable objects were never executable
    status: resolved
    description: >
      2026-08-26 release-watch. synth jumped v0.55 -> v0.59 (four releases). NO GI-FPU-002 / VFP work
      landed - PR#1073 (the AEABI increment 1 for synth#1069) is still OPEN - so the falcon skip counts
      are UNCHANGED on the real fused packed cascade: cortex-m7dp 3, cortex-m4f 5, cortex-m3 12, with
      the same two exports (rate@0.7.0#tick, mixer@0.7.0#mix). Verified against the real build, not the
      changelog.
      TWO NEW GATES, both of the honest-refusal class jess has been arguing for all campaign:
        #952 - synth now EXITS NON-ZERO rather than emitting an object silently missing a public export:
          "3 of 6 requested export(s) were skipped ... Exiting non-zero rather than shipping an object
          that is silently missing a public entry point - a build gating on $? would otherwise accept
          it." Escape hatch `--allow-skipped-exports` for deliberate partial sweeps.
        #1041 - the ARM RELOCATABLE path now REFUSES a module carrying active data segments, because
          the object does not materialize them: "a load from the initialized region would silently read
          whatever the target memory holds at runtime" (the gale#278 0xFF class). Escape hatches:
          compile self-contained, --native-pointer-abi, or --embedder-data-init.
      *** WHAT #1041 MEANS FOR JESS'S OWN PAST REPORTING - stated plainly ***: every `--relocatable`
      object jess produced across this campaign (the per-stage sweeps, the fused-core counts) carried
      NO data segments. The fused cascade has 13 active segments. So those objects were NEVER
      EXECUTABLE - any load from initialized memory would have read target garbage. The SKIP COUNTS
      remain valid (which functions compile is orthogonal to data-segment materialization) and every
      comparative claim built on them stands. But the objects themselves were measurement artifacts,
      not runnable images, and jess should not have implied otherwise.
      CRUCIALLY THE EXECUTION PATH WAS CORRECT: TEST-PIX-031 - the only jess artifact that actually
      RUNS - uses the SELF-CONTAINED path (`--cortex-m`), which ships the segments and copies them at
      reset (#758). That is exactly what the oracle verifies (53,345 B copied to 0x20000100, checked at
      non-zero probes). So the one thing jess executed was built the right way; the confusion would only
      have arisen had jess tried to run a --relocatable object.
      REGRESSION CHECK: the committed v0.55-built image still PASSES TEST-PIX-031 (both assertions OK).
      On v0.59 the same source rebuilds to 65,576 B (v0.55: 65,452, +124 B) with `--allow-skipped-exports`,
      identical export set. The committed image is NOT bumped this tick: the oracle is green and stable,
      and a bump requires re-verifying the non-zero memory probes against the new data layout.
      NOTE the improved diagnostics now name the D8..D15 point jess raised on #881: "D0..D7 all live;
      D8..D15 are callee-saved and never allocated here", and "the backend retries with VFP spilling
      (#881) and this surfaces only if that also fails".
    tags: [release-watch, synth, honest-refusal, data-segments, exports, falcon, on-target]
    fields:
      detected-by: jess release-watch on synth v0.59.0 against the real fused cascade, 2026-08-26
      severity: info
      triage-status: closed
    links:
      - type: traces-to
        target: REQ-PIX-001

  - id: AFD-038
    type: ai-found-defect
    title: KILL-CRITERION PASSES on falcon-v1.134.1 — all three meld fuse modes accept, --pack-rebase is worth 5x on the M7, the fused cascade lowers; GI-FPU-002 is the sole remaining gate
    status: resolved
    description: >
      2026-08-26. relay shipped v1.134.1 carrying every marker the fuse needs (__heap_base, __data_end,
      per-stage __stack_pointer taken from jess's scry bounds: flight 16384 / iekf 8192 / rest 512, plus
      reloc+linking sections). jess ran relay's SWREQ-FALCON-OCI-P02 KILL-CRITERION on the real published
      artifacts. RESULT - PASSES.
      meld 0.52.0 over the five fused stages (iekf position attitude rate mixer):
        --address-rebase  accepts, 1 memory, 5 pages = 320 KB
        --pack-rebase     accepts, 1 memory, 1 page  =  64 KB
        --share-stack     accepts, 1 memory, 1 page  =  64 KB
      All three paths work for the first time. THE PACKING IS LOAD-BEARING, not cosmetic: 320 KB EXCEEDS the
      M7's 256 KB DTCM (forcing the cascade to slow OCRAM and spending the inner-loop latency margin DD-026
      was designed around); 64 KB FITS DTCM comfortably. 64 KB is one wasm page = the format minimum = the floor.
      AND IT LOWERS: --pack-rebase output -> loom -> synth 0.55 --relocatable gives cortex-m7dp 3 skips /
      18 functions / 11,811 B; cortex-m4f 5 skips; cortex-m3 12 skips. TWO ENTRY POINTS are real defined
      symbols in the FUSED object: pulseengine:falcon-cascade/mixer@0.7.0#mix and
      pulseengine:falcon-cascade/rate@0.7.0#tick. The namespace rename is confirmed on the PULLED ARTIFACT,
      not merely in relay's source.
      *** ALL THREE REMAINING SKIPS ARE GI-FPU-002 *** - VFP register-file exhaustion, two phase-1 (S0..S15)
      and one phase-2 (D0..D7). Nothing supplier-side remains in that list. GI-FPU-002 is now LITERALLY THE
      ONLY THING between the fused cascade and a complete M7 image, which makes synth#881 the single remaining
      gate - and #881 was CLOSED without the register-pressure half resolved. Re-raise upstream.
      JESS TOOLING DEFECT FOUND AND FIXED, reported to relay unprompted: jess's publish-gate C5 check reported
      __heap_base MISSING on 5 of 6 components. THAT WAS JESS'S BUG, NOT RELAY'S - C5 grepped `wasm-tools
      print` TEXT output, but __heap_base lives in the `linking` custom-section SYMBOL TABLE, which prints as
      an opaque @custom blob. Reading the RAW BYTES instead: present on all six, exactly as relay claimed.
      Gate fixed to read the binary rather than the pretty-printer; the negative control (the v1.129
      core-module bug) still bites on C1+C2. This mattered because jess had offered that script to BOTH
      suppliers as a CI gate - A GATE THAT FAILS A CORRECT BUILD IS WORSE THAN NO GATE. Second
      tooling-honesty catch in two days, after the vacuous crc_ok metric (AFD-037).
      SCOPE HELD: this is "the fuse accepts and the output lowers" - it is NOT "it executes correctly".
      Nothing has run on silicon; the Pixhawk was not attached this tick. The on-target differential against
      relay's SIL reference (0.193 s, |err| 0.0059 rad/s) remains outstanding, so OCI-P05/P06 should stay
      `implemented` - jess said so upstream rather than let a green fuse read as a green behaviour claim.
      CORROBORATION: relay's cascade timing baseline (full tick 1.2413 us, iekf 1.1256 us = 91% of it) agrees
      with jess's scry static stack bounds (iekf 4192 B vs 16-112 B for the rest) that the ESTIMATOR CARRIES
      THE MASS - two independent methods, same conclusion, and directly useful for partition placement.
    tags: [fuse, meld, pack-rebase, kill-criterion, falcon, on-target, gi-fpu-002, publish-gate, oci]
    fields:
      detected-by: jess kill-criterion run on falcon-v1.134.1 published artifacts, meld 0.52.0, 2026-08-26
      severity: info
      triage-status: closed
    links:
      - type: traces-to
        target: REQ-PIX-001

  - id: AFD-037
    type: ai-found-defect
    title: FIRST LIVE-HARDWARE VALIDATION - jess's MAVLink decoder (REQ-PIX-010) run against the real Pixhawk 6X-RT, read-only; live and committed samples decode identically (the "ZERO CRC failures" phrase once in this title was VACUOUS and is withdrawn - see the body)
    status: resolved
    description: >
      2026-08-25: the physical Holybro Pixhawk 6X-RT came online (USB "PX4 FMU v6XRT_x",
      Dronecode Project idVendor 0x3641, CDC node /dev/cu.usbmodem01). This is the FIRST time any
      jess software has been exercised against the ACTUAL TARGET BOARD rather than an emulator or a
      committed recording.
      SCOPE - STATED PRECISELY so this is not overclaimed: the software under test (tools/bench/
      mav_bench.py) runs on the HOST and consumes LIVE telemetry FROM the board. This is NOT
      jess-built code EXECUTING ON the board - that remains gated on greenlight plus the fused-image
      chain. What it validates is REQ-PIX-010's decoder against real silicon output.
      METHOD - STRICTLY READ-ONLY, honouring the standing vehicle constraint: opened the CDC callout
      node O_RDONLY|O_NONBLOCK and only ever read; no writes, no ioctl, no control-line manipulation,
      and specifically NO 1200-baud touch (PX4's bootloader-entry gesture). 6-second passive capture.
      RESULT - 77,034 bytes captured; 1,828 frames decoded; 1,496 frames yielded with a VALID CRC.
      *** CORRECTION 2026-08-25, same day: the original wording of this finding claimed "0 CRC-INVALID"
      and reported a "crc_BAD" column of zeroes. THAT METRIC IS VACUOUS AND THE CLAIM IS WITHDRAWN. ***
      parse_frames() yields a frame only `if ok is not False` (mav_bench.py:64,80) - i.e. CRC-FAILING
      FRAMES ARE SILENTLY SKIPPED AND NEVER YIELDED. The `crc_ok` field can therefore only ever be True
      or None, NEVER False. A count of zero CRC failures is structurally guaranteed by the instrument
      regardless of the data, so it is not evidence of anything. Confirmed empirically: the set of
      crc_ok types the parser can emit on a valid frame is {NoneType/bool-True} only.
      WHAT THE EVIDENCE ACTUALLY SUPPORTS (and this is still strong): the decoder independently
      REPRODUCED the board's X.25 CRC, with the correct per-message CRC_EXTRA, for 1,496 live frames.
      The CRC routine itself is sound - verified directly, bypassing the parser: a correct frame's
      computed CRC matches the stored one (0x4168), and a ONE-BIT corruption in the payload yields a
      different CRC (0x4543) i.e. it is rejected. So the positive claim holds; only the "zero failures"
      framing was unsupported.
      TOOLING GAP THIS EXPOSES (jess's own): mav_bench cannot SURFACE a CRC failure - it drops the frame
      and resyncs. For a bench oracle that is a real weakness: a board emitting corrupt frames would look
      identical to a clean one. The parser should COUNT rejected frames and the oracle should assert on
      that count. Filed as follow-up work; the CI oracle's assertions are unaffected (it asserts on
      CRC-VALID frames existing, which remains meaningful).
      sysid=1 (single autopilot), 7 HEARTBEATs. The independent check is the MAVLink X.25 CRC: the
      board computed it and the decoder either reproduces it with the right CRC_EXTRA or it does not.
      It did, for every frame of every known message type.
      DIFFERENTIAL vs the committed CI fixture (repro/pixhawk-bench/mavlink-sample.bin):
        committed  8,424 B   201 frames   166 crc-valid   35 unknown-msgid  (crc_BAD column withdrawn - vacuous)
        LIVE      77,034 B  1,828 frames  1,496 crc-valid  332 unknown-msgid  (crc_BAD column withdrawn - vacuous)
      IDENTICAL valid-msgid SET on both: [0,1,30,31,32,74,105,230,241,245] - HEARTBEAT, SYS_STATUS,
      ATTITUDE, ATTITUDE_QUATERNION, LOCAL_POSITION_NED, VFR_HUD, HIGHRES_IMU, ESTIMATOR_STATUS,
      241, EXTENDED_SYS_STATE. Zero CRC failures on both, at ~9x the frame volume live.
      TWO CONSEQUENCES: (1) the decoder is validated against real silicon, not just a recording;
      (2) the committed CI fixture is CONFIRMED REPRESENTATIVE of the real board - which retroactively
      validates the board-free CI oracle that has been gating REQ-PIX-010 all along. The CI oracle
      still passes unchanged (exit 0: "201 frames, 166 CRC-valid, 1 HEARTBEAT; autopilot=PX4
      type=QUADROTOR sysid=1").
      Live capture committed as repro/pixhawk-bench/live-6xrt-2026-08-25.bin for future differentials.
      NOTE the msgids the board actually streams are exactly the signals DD-026's data-flow design is
      about - HIGHRES_IMU (105) and ATTITUDE (30) dominate the traffic - so this capture is also a
      real reference for the seam work.
    tags: [hardware, pixhawk-6xrt, mavlink, req-pix-010, live-silicon, read-only, first-hardware]
    fields:
      detected-by: jess read-only live capture from the physical 6X-RT, 2026-08-25
      severity: info
      triage-status: closed
    links:
      - type: traces-to
        target: REQ-PIX-010

  - id: AFD-036
    type: ai-found-defect
    title: spar codegen WIT structuring - the data-IMPLEMENTATION record path works today (jess modeling error, now corrected); the Data_Representation=>Array path was a real gap (spar#346)
    status: resolved
    description: >
      Found 2026-07-23 (feature-loop step 2, deriving the inter-core WIT for REQ-PIX-007). The 3-core
      partition's M4->M7 crossing is a NavState = 16 x f32 (64 B) message (byte-exact crossing PROVEN
      in TEST-PIX-030). Tried to make the WIT CONTRACT structured (a record / list<f32>) by enriching
      the AADL VehicleState data type, so the typed ABI reflects the real payload. spar codegen maps
      EVERY AADL data type to `type X = list<u8>` regardless of structure - verified on TWO spar
      versions (v0.24.0 = CI pin, and v0.30.0 = latest) x TWO AADL constructs: (a) Data_Model
      properties (Data_Representation=>Array, Base_Type=>Float, Dimension=>16) and (b) a data
      implementation with Base_Types::Float subcomponents. Both drop the structure and emit
      `type vehicle-state = list<u8>`. So REQ-PIX-007's "WIT-typed contracts" can only be OPAQUE bytes
      with spar's current codegen; jess must NOT hand-write a structured WIT (that violates the
      derived-from-spar-never-hand-written discipline + breaks the TEST-PIX-023 derivation gate). Filed
      spar#345 (respectful question/friction; spar HAS a data-plane marshalling feature
      REQ-CODEGEN-WIT-DATAPLANE-001, so this may be a missing construct rather than a pure gap) with the
      exact repro + jess impact + the suggested mapping (data-impl subcomponents -> WIT record;
      Data_Model Array+Float+Dimension -> list<f32>). jess CONSEQUENCE: the byte-exact NavState crossing
      is proven (TEST-PIX-030) but the TYPED-contract half of REQ-PIX-007 is spar-GATED - the current
      opaque `list<u8>` WIT is the state until spar#345 lands or the construct is clarified. NOT
      blocking the on-target path (falcon is #369-gated regardless), but blocks the REQ-PIX-007 refinement.
      RESOLVED 2026-07-23 (spar maintainer answered spar#345, honestly split into a real gap + a jess
      modeling error): (b) the data-IMPLEMENTATION record path ALREADY WORKS on the CI-pinned spar
      v0.24.0 (REQ-CODEGEN-WIT-RECORDS-001) - my case-(b) failure was a MODELING ERROR: I bound the PORT
      to the BARE type (`out data port VehicleState`) while the subcomponents lived on the IMPLEMENTATION
      (VehicleState.nav). Binding the port to `.nav` + typing fields via a local `data F32` (Data_Size =>
      4 Bytes; Data_Representation => Float) emits the record TODAY. jess ADOPTED this: VehicleState.nav
      (16xf32) + ActuatorCmd.pwm (4xf32) in hardware/pixhawk6x-rt.aadl, ports bound to the impls, wit/
      regenerated -> `record vehicle-state-nav {qw:f32..baz:f32}` + `record actuator-cmd-pwm {m0..m3:f32}`;
      the WIT-derivation gate (TEST-PIX-023) passes. So REQ-PIX-007's typed-contract half is now DELIVERED,
      NOT gated. (a) the `Data_Representation=>Array` path was a genuine gap (element type/Base_Type/
      Dimension dropped to list<u8>) - the maintainer fixed it in spar PR#346 (-> `list<f32, 16>`, needs
      Float_32 not the unsized Float); jess does not need it since the record path is cleaner. Corrects
      the original "opaque for EVERY data type" framing - that held only for my mis-bound port.
    tags: [feature-loop, spar, aadl, wit, codegen, inter-core, navstate, req-pix-007, resolved]
    fields:
      detected-by: jess feature-loop (REQ-PIX-007 WIT-typing); spar#345 answered - record path was a jess modeling error (bind port to the data IMPLEMENTATION), Array path fixed in spar PR#346; jess adopted the record path
      severity: minor
      triage-status: resolved
    links:
      - type: defect-against
        target: EXTERNALANCHOR-008
      - type: traces-to
        target: REQ-PIX-007
