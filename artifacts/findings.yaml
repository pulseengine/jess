  - id: AFD-019
    type: ai-found-defect
    title: spar wrpc-binding false-positives - correctly bus-bound cross-processor connection still warns
    status: open
    description: >
      Found 2026-06-14 (iter#18) while architecting the jess multi-core wRPC
      topology in spar (hardware/pixhawk6x-rt.aadl). A cross-processor port
      connection that IS bound to a bus via
      'Actual_Connection_Binding => (reference (bus)) applies to <conn>' still
      triggers spar's wrpc-binding warning ('crosses processor boundary ... but
      has no Actual_Connection_Binding to a bus'). Tried both plain and
      Deployment_Properties:: qualified forms; both warn. Root cause in
      crates/spar-analysis/src/wrpc_binding.rs: the check reads the OWNING
      component's flat property map (owner_props.get("Deployment_Properties"/"",
      "Actual_Connection_Binding")) and never resolves the per-connection
      'applies to <conn>' binding, so it is always false for the standard idiom -
      the analysis cannot be satisfied by a correct deployment. Impact: this is
      the analysis jess wants to gate the wRPC topology (cross-core connections
      must name a transport); right now it is a guaranteed false-positive. Filed
      https://github.com/pulseengine/spar/issues/281 - supervising.
    tags: [phase-2, spar, wrpc, analysis, false-positive]
    fields:
      detected-by: jess Phase-2 wRPC modeling - spar analyze on hardware/pixhawk6x-rt.aadl (v0.17.0)
      severity: major
      triage-status: open
    links:
      - type: traces-to
        target: REQ-PIX-007

  - id: AFD-020
    type: ai-found-defect
    title: spar codegen does not turn AADL connections into aligned cross-component WIT contracts
    status: open
    description: >
      Found 2026-06-14 (iter#18) evaluating spar as the architecture source for
      inter-core wasm-component RPC. spar's wit_gen emits a WIT world PER PROCESS
      from that process's own ports and never walks ConnectionInstances, so an
      inter-process connection does NOT become a shared interface that the
      producer exports and the consumer imports - the 'A.export == B.import'
      alignment needed for cross-core RPC contracts is absent in codegen (the
      type-level transform/wit.rs + wac.rs machinery exists but isn't wired to
      the instance connection graph). This is the single highest-value change to
      make spar architect a meld-fuse-or-RPC component system. Requested
