  - id: AFD-062
    type: ai-found-defect
    title: jess's CORE CI GATE could not fail on a schema violation — 60% of ai-found-defect artifacts carried a triage-status 'rivet add' REFUSES to write, while 'rivet validate' warned and exited 0
    status: resolved
    description: |-
      2026-09-03. Found while adding AFD-061: `rivet add --field triage-status=closed` was REJECTED as a
      hard error, copying a value from the artifact directly above it in the same file.
      *** DEFECT (rivet 0.34.0, filed pulseengine/rivet#885) ***: the SAME schema allowed-values
      constraint is enforced at two severities depending on the command.
        rivet add      -> hard ERROR, non-zero exit, artifact not written
        rivet validate -> WARNING, "Result: PASS", exit 0
      MEASURED IN JESS: 61 ai-found-defect artifacts; schema allows [open, accepted, rejected,
      deduplicated]; 37 of 61 (60%) carry a value `rivet add` REFUSES to write — closed(21), resolved(5),
      confirmed-upstream(4), scoping(2), confirmed(2), resolved-upstream, reported-upstream,
      filed-upstream. `rivet validate` exits 0 with 268 warnings over them.
      *** THE GATE THIS BLINDED ***: .github/workflows/ci.yml runs a job whose stated purpose is "the
      rivet artifact spine is jess's substance - this is the core gate", executing bare `rivet validate`
      and gating on its exit code. That gate is STRUCTURALLY INCAPABLE of failing on a schema-value
      violation. 60% of the artifacts it guards were non-conforming and it had never gone red. Same
      vacuous-gate class as AFD-048/AFD-053/AFD-061 - a check whose failing case cannot be observed.
      *** A SECOND, SHARPER HAZARD ***: the schema documents "The `ai-defects-open` oracle gates release
      on this field." jess references that oracle NOWHERE (verified bare, not through a pipe). And the
      vocabulary has no notion of non-terminal-but-not-open: AFD-028 sits in `scoping` - genuinely
      unresolved, jess must still confirm MPU ownership of the linear-memory region per synth#377 - and
      any gate reading only `triage-status == open` would count it as done.
      *** FIX, jess side ***: vendored schemas/common.yaml at rivet tag v0.34.0 (the version in use;
      `rivet schema sources` now reports common as on-disk, and this also PINS the schema, which is
      otherwise "compiled into rivet - changes on upgrade"). CONTROL: the vendored copy before any edit
      reproduced "Result: PASS (268 warnings)" EXACTLY, proving equivalence to the embedded schema.
      Then widened triage-status to jess's real 12-value vocabulary with an explicit NON-TERMINAL /
      TERMINAL split documented in the schema. 268 -> 231 warnings, exactly 37 cleared. `rivet add
      --field triage-status=closed` now succeeds.
      The vocabulary was WIDENED rather than the artifacts flattened, deliberately: the campaign reports
      most of its defects to OTHER repos, and collapsing confirmed-upstream/filed-upstream onto `accepted`
      would erase which repo it went to and whether they acted. rivet's own diagnostic help offers this
      ("widen the schema only if the value is legitimate").
      *** NEW ORACLE ***: tools/rivet/triage-gate.sh, wired into CI beside rivet validate. It reads the
      allowed set FROM the schema (never hardcoded - a second copy is a second thing to drift), refuses to
      pass on an empty corpus or an unparseable vocabulary, and asserts the NON_TERMINAL list is a subset
      of the schema vocabulary so a rename cannot silently make a state unreachable.
      CONTROLS, all four observed: bogus value -> rc=2 with the offending value named; empty corpus ->
      rc=3 "gate would be vacuous"; unparseable schema -> rc=3; real corpus -> rc=0, 61/61 in vocabulary,
      33 non-terminal reported.
      *** TWO HARNESS BUGS THE CONTROLS CAUGHT, both in the CHECKER ***: (1) the first negative control
      did not inject at all - BSD sed has no `0,/re/` address form - and the run reported PASS; caught only
      because the script printed the injection count. (2) `set -euo pipefail` made the empty-corpus guard
      UNREACHABLE: `grep` returns 1 on no match, killing the script with rc=1 and no message before the
      vacuity check could fire - the guard was absent in exactly the case it guarded. Both fixed; controls
      re-run green. Continues the pattern that jess's defects are in its CHECKERS, not its subjects.
    tags: [rivet, rivet-885, vacuous-gate, schema, triage-status, ci-gate, negative-control, checker-bug, schema-pinning]
    fields:
      detected-by: rivet add refusing a value 21 committed artifacts already carried, while rivet validate passed over it, 2026-09-03
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-03T11:09:24Z

  - id: AFD-063
    type: ai-found-defect
    title: The falcon chain now runs 64 TICKS on emulated RT1176 bit-exact — and closing the V found that the campaign's on-target test IDs were hand-invented, never rivet IDs, and one was doubly claimed
    status: resolved
    description: |-
      2026-09-03. AFD-060 executed ONE invocation of the rate->mixer chain. One invocation cannot
      distinguish a correctly lowered integrator from one whose state update was DROPPED - both produce
      the same first tick. This runs 64 consecutive ticks and folds every motor-pwm word, so the
      state evolution itself is the observable.
      *** RESULT, emulated RT1176 Cortex-M7 (Renode 1.16.1), synth 0.60.0 --relocatable ***:
        tick 1   pwm 0x00000000 0x00000000 0x3EB2AF18 0x3F800000   (equals AFD-060's single-tick value)
        tick 64  pwm 0x3ED89353 0x3EB9A587 0x3F176935 0x3F1F7A5F
        fold     0x3466E91F   FNV-1a over all 256 motor-pwm words, in order
      All three match tools/cascade-differential/soak_ref.py over the SAME c.loom.wasm. One module, two
      backends: a divergence is a lowering defect, not a modelling difference (DD-026 P2).
      *** NOT A SIMULATOR ***. The input vector is held CONSTANT across all 64 ticks and no vehicle model
      is integrated; what evolves is the cascade's own integrator state. Closing a loop around a plant is
      relay's SIL. jess proves the lowered code still tracks it.
      *** NON-VACUITY ESTABLISHED BEFORE THE HARNESS WAS WRITTEN ***, not after: a wasmtime probe showed
      tick 1 is a large transient and ticks 2..64 drift monotonically (m1 0x3ED9565C -> 0x3ED89353). Had
      the cascade saturated to a constant, the soak would have been reproducible by a build with a frozen
      integrator and the whole feature would have been worthless. That check was the go/no-go.
      *** FOUR CONTROLS, ALL OBSERVED TO FIRE ***:
        1 COMPLETION - sentinel 0x1E55B0A5 is written only after tick N, so a truncated run cannot be
          mistaken for a lowering defect. RUNFOR is otherwise a guess.
        2 N-SENSITIVITY - fold(63) 0xD1EDC289 != fold(64) 0x3466E91F. An inert fold would pass for any N.
        3 ENDPOINT MOTION - tick1 != tickN. soak_ref.py REFUSES to emit a reference where they are equal,
          and that guard has its own --self-test, so it is known to be reachable rather than assumed.
        4 ON-TARGET DISCRIMINATION - the identical soak with the embedder init short-circuited COMPLETES
          (sentinel present) and folds 0xE6A1D1C5. Without this, nothing showed the oracle could fail ON
          TARGET; everything else only compares one target run to a reference. This is also what keeps
          AFD-051's embedder promises load-bearing across a whole run, since synth emits BYTE-IDENTICAL
          code with or without --embedder-data-init / --embedder-global-init.
      *** THE SOAK IS A SEPARATE IMAGE ON PURPOSE ***. The chain image has already advanced the cascade
      one tick by the time it parks its result, so appending a soak would offset every tick against the
      reference by one - the same class of error as AFD-060's accidental double rate#tick.
      *** THE -ffixed-r9/-r10/-r11 RESERVATION EARNED ITS KEEP ***. build.sh's own comment predicted this
      case verbatim: "the moment the shim grows a body (a soak loop, a log line) the guarantee evaporates
      silently". jess_call_soak has a real loop body where jess_call_rate compiled to a bare tail-branch,
      so GCC now faces genuine register pressure. The emitted-code assertion (objdump, not the flag)
      passes, and a new assertion checks jess_call_soak actually contains a BACKWARD BRANCH - -O2 could
      otherwise unroll or hoist the body and the soak would silently run once.
      *** A TRACEABILITY DEFECT FOUND WHILE CLOSING THE V ***: the harness has carried hand-invented
      identifiers TEST-PIX-034 / TEST-PIX-035 in its source since AFD-057, and NEITHER was ever a rivet
      ID - rivet's next free test-spec id was 032. Worse, TEST-PIX-035 was DOUBLY CLAIMED: measure-stack.sh
      (the AFD-058 footprint measurement) and the new soak both used it for different tests. Three
      test-spec artifacts now exist and the source is reconciled to them: TEST-PIX-032 single invocation,
      TEST-PIX-033 the 64-tick soak, TEST-PIX-034 the linear-memory footprint. The campaign's first
      on-target execution had an OPEN right side of the V for a week. rivet next-id is the only source of
      truth for these; a hand-typed identifier in a comment is not traceability.
    tags: [renode, rt1176, soak, n-tick, integrator, on-target, sil-differential, negative-control, traceability, test-ids, milestone]
    fields:
      detected-by: jess extending the single-invocation chain to an N-tick soak, 2026-09-03
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-03T18:54:07Z

  - id: AFD-064
    type: ai-found-defect
    title: Clean-room verification of the N-tick soak found FIVE defects BEFORE merge — including a degenerate control whose claim was false, and a vacuous acceptance hole in the gate shipped hours earlier
    status: resolved
    description: |-
      2026-09-03. Clean-room verification (fresh-context subagent, no inherited framing) over AFD-061..063
      and the campaign machinery, run BEFORE the PR was merged. It found five defects. Four are in
      CHECKERS rather than in the code being checked - the campaign's standing pattern - and one is a
      false claim in a safety artifact, which is the AFD-048 pattern recurring.
      *** D1 (WORST): AFD-063's "control 4" was DEGENERATE and its claim was FALSE. ***
      The init-skipped soak folds 0xE6A1D1C5, which is exactly FNV-1a over 256 ZERO WORDS - the image
      produced NO output for 64 ticks. The clean-room built a third image keeping the embedder promises
      ENTIRELY and dropping only the argument write: it folds IDENTICALLY. Three materially different
      breakages, one indistinguishable fold. So the control did NOT show "the embedder promises are
      load-bearing across a whole run"; it showed only that something ran and produced nothing.
      FIX: added soak_nc1 - perturb wy, keep the init entirely - which completes and folds 0x511234FF,
      different from the reference AND from the all-zero fold, i.e. a PLAUSIBLE wrong answer. That is the
      control that actually attributes. The init-skipped image is kept, relabelled LIVENESS ONLY, and the
      oracle now asserts it equals the all-zero fold so its meaning cannot silently drift.
      *** D2: the "jess_call_soak has a backward branch" build assertion was VACUOUS. ***
      The grep matched ANY intra-function branch and was satisfied by the forward early-exit -O2 emits.
      An address-comparing rewrite was ALSO vacuous - satisfied by the INNER 4-word fold loop with the
      outer soak loop removed. Both attempts were verified vacuous by building a straight-line soak.
      FIX: the static check is DELETED, with the reason recorded in build.sh. Replaced by a DYNAMIC trip
      counter the loop increments and writes after the loop, which -O2 cannot restructure away. This also
      fixes a related overstatement: o[0] previously held the REQUESTED n written before the loop, so a
      soak that ran once would still have reported 64.
      *** D3: tools/rivet/triage-gate.sh - shipped in AFD-062 the same day - ACCEPTED bad values. ***
      Its extractor `grep -o "triage-status: *[A-Za-z-]*"` truncates at the first non-letter, so open9,
      open.x and resolved2 all passed as their legal prefix. It ALSO rejected the legal quoted spelling
      "open", and its schema regex could cross into the NEXT field and return that field's allowed-values
      (the clean-room got "red green blue" out of it).
      FIX: python extractor taking the whole value, YAML-correct comment stripping (a comment needs
      whitespace before '#', so 'closed#' is a valid scalar and is now REJECTED), and the schema search
      bounded to the triage-status field's own block. All five cases verified failing/passing correctly.
      Fixing it also hit a bash trap worth recording: a heredoc nested inside $( ) is parsed by bash's
      substitution scanner and broke the script; the vocabulary read is now a function.
      *** D4: NONE of the cascade-invoke oracles run in CI. ***
      ci.yml's renode-smoke job runs six .robot tests; run-oracle.sh, run-soak-oracle.sh and
      measure-stack.sh are not among them, and the workflow installs neither arm-none-eabi-gcc nor the
      synth binary they need. TEST-PIX-032/033/034 are LOCAL-ONLY EVIDENCE, NOT GATES. Recorded in each
      spec rather than quietly implied. Promotion to a renode-test .robot is an open item in
      hardware/renode/tcb-link/README.md.
      *** D5: the PR that fixed one vacuous-gate instance introduced another. ***
      TEST-PIX-032/033/034 were created with `--field release=v0.7.0`, but `release` is a TOP-LEVEL key on
      test-spec, not a schema field. rivet reported it as INFO with exit 0 - weaker even than the WARN
      that AFD-062 was about - so nothing went red. FIXED via --set-release plus removal of the duplicate
      fields.release. NOTE: rivet has NO unset-field flag, so removing a wrongly-added field cannot be
      done with rivet's own mutation commands; that is friction to report.
      *** ALSO: the paint band claim in harness.c was FALSE. *** PAINT_LO 0x400 was documented as "above
      the static data the segments occupy". __data_end is 0x45A1 and a segment spans [0x290,0x22B1), so
      the paint overwrites ~7 KiB of applied segment data. It is harmless only because those bytes are
      zero and never read - a property of today's module, not a guarantee. The comment is corrected and
      build.sh now ASSERTS [0x400,0x2000) is all-zero after instantiation.
      *** ALSO: the oracles wrote fixed /tmp/tp34.resc and /tmp/tp35.resc *** - named after the
      hand-invented ids AFD-063 had just reconciled away, and clobbering each other on concurrent runs.
      Now mktemp with a trap.
      *** SCOPE CORRECTION carried into TEST-PIX-033 ***: both sides of the soak differential run the SAME
      c.loom.wasm, so the reference is an independent BACKEND, not an independent artifact. It covers
      SYNTH'S LOWERING ONLY - a defect in falcon's source, meld's fusion or loom's optimisation would be
      invisible because both backends would agree on it. The commit headline read stronger than the
      evidence and has been corrected.
      WHAT THIS ROUND CONFIRMS: holding the merge for the clean-room was the right call. Every one of
      these would otherwise have landed in main, and D1 would have been a false attribution claim inside a
      merged safety artifact - exactly what AFD-048 recorded and what this campaign keeps re-learning.
    tags: [clean-room, verification, vacuous-control, vacuous-gate, soak, triage-gate, ci-coverage, self-correction, rivet-friction]
    fields:
      detected-by: clean-room verification subagent with no inherited context, 2026-09-03
      severity: critical
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-03T19:15:47Z

  - id: AFD-065
    type: ai-found-defect
    title: The pins made jess's oracles CHECKABLE but not REPRODUCIBLE — nothing could fetch the pinned bytes, gale-nano is in no release at all, and the synth pin is unsatisfiable off macOS
    status: resolved
    description: |-
      2026-09-04. AFD-064 D4 recorded that no cascade-invoke oracle runs in CI. Investigating why found a
      prerequisite that had never been built: tools/deps/artifacts.pins recorded WHAT each oracle consumes
      and verified it by digest, but NOTHING COULD PRODUCE THOSE BYTES. .scratch/ is gitignored, so a
      fresh clone had seven pins and no way to satisfy any of them. The pins made the claims checkable;
      they did not make them reproducible.
      *** tools/deps/fetch.sh now reconstructs all seven from a clean checkout. *** Verified: fetching
      into an EMPTY tree pulls 7/7 and check.sh confirms every digest.
      *** TWO MAPPINGS THAT COST REAL TIME, ESTABLISHED BY DIGEST RATHER THAN BY GUESSING NAMES ***:
        1 The falcon stages are NOT standalone release assets. They live inside
          falcon-components-v1.134.tar.gz and are named falcon-<stage>-v1.134.wasm upstream, while jess
          stores them as <stage>.wasm. A first attempt looking for rate.wasm found NOTHING.
        2 gale-nano is in NO gale release - checked v0.7.0, v0.7.1 and v0.8.0; those carry only the
          msgq/mutex/sem primitives. It is an OCI artifact at ghcr.io/pulseengine/gale-nano:0.7.0, where
          its name is fused-gustos.component.wasm. Pulled it and the digest matched the pin exactly. The
          pin's old source field said "release-or-ghcr", which is a guess written down, not a locator.
      The locators now live IN the pins file, so there is one source of truth, and a wrong locator fails
      against the digest that is already there rather than silently installing a lookalike.
      *** WHY D4 IS STILL BLOCKED, NOW WITH A NAMED REASON ***: the fg60/synth pin is a MACH-O ARM64
      BINARY. Its digest is satisfiable only on aarch64-apple-darwin and can NEVER match on a linux
      runner. So tools/deps/check.sh cannot go green in CI for that entry, and promoting the on-target
      oracles to a CI gate requires verifying synth against the release's own signed SHA256SUMS.txt
      instead of against a single-platform digest. fetch.sh records platform= per pin and SKIPS a
      foreign-platform entry loudly rather than fetching bytes that cannot match.
      *** A DEFECT IN THIS SCRIPT, FOUND BY RUNNING THE CASE IT EXISTS FOR ***: fetch.sh ends by calling
      check.sh as the final authority. check.sh honours SCRATCH, not DEST - so with DEST pointing at a
      fresh tree it verified $ROOT/.scratch instead, and the clean-checkout run was "confirmed" by the
      pre-existing artifacts sitting next door. It PASSED FOR THE WRONG REASON. Fixed by passing
      SCRATCH="$DEST". Same family as AFD-064: the checker, not the code.
      *** CONTROLS, all observed ***:
        wrong locator (rate pin pointed at the mixer member) -> rc=1, mismatch named, bad file REMOVED
        empty pin set                                        -> rc=2, refuses to report success
        foreign-platform pin                                 -> skipped loudly, not fetched
        corrupted artifact                                   -> re-fetched and repaired
      *** END-TO-END ***: build.sh and both oracles now honour SCRATCH, so the whole chain runs off a
      freshly fetched, digest-verified tree. Building from the clean tree and running the soak reproduces
      tick 1 0x00000000 0x00000000 0x3EB2AF18 0x3F800000, tick 64 0x3ED89353 0x3EB9A587 0x3F176935
      0x3F1F7A5F and fold 0x3466E91F - BIT-IDENTICAL to the run from the working tree. That is the first
      time any jess on-target result has been reproduced from inputs fetched by digest rather than from
      whatever happened to be on disk.
      (Adding SCRATCH also produced a self-inflicted bug worth noting: a naive string replace of
      E="$ROOT/.scratch/invoke/ also matched inside NC1E= and NC2E=, mangling three lines. Caught because
      the oracle then failed; substring collisions in mechanical edits are not hypothetical.)
    tags: [reproducibility, supply-chain, pins, fetch, oci, ghcr, platform-specific, ci-blocker, checker-bug]
    fields:
      detected-by: jess investigating why AFD-064 D4 (oracles not in CI) could not simply be fixed, 2026-09-04
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-03T22:51:52Z

  - id: AFD-066
    type: ai-found-defect
    title: Release-watch was NOT EXECUTABLE — every preflight refused an off-pin build; with that fixed, synth v0.61.0 emits BYTE-IDENTICAL ARM to 0.60.0 on the real fused falcon
    status: resolved
    description: |-
      2026-09-04. Release-watch had slipped several ticks: the on-target oracles run synth 0.60.0 while
      v0.61.0 shipped. Testing a candidate toolchain turned out to be IMPOSSIBLE by construction - every
      preflight verifies all seven pins, so a deliberately off-pin build is indistinguishable from a
      corrupted tree and is refused. STEP 2 of the loop was not executable.
      *** MACHINERY ***: check.sh gains --only/--exclude; build.sh detects SYNTH pointing away from the
      pinned binary, sets that ONE pin aside explicitly, prints an OFF-PIN banner naming the version
      actually in use, and threads DEPS_EXCLUDE to the sub-oracles so there is exactly one place that
      decides which pin may be waived. INPUT pins stay enforced - a toolchain differential is meaningless
      if the inputs are not identical.
      *** RESULT — synth v0.61.0 PASSES ***, tested against the REAL fused falcon cascade, not a fixture:
        cascade.o   0.60.0 395fe6d4e5aa37b0…  0.61.0 395fe6d4e5aa37b0…  BYTE-IDENTICAL
        soak.elf    0.60.0 bf6d92927cadae7e…  0.61.0 bf6d92927cadae7e…  BYTE-IDENTICAL
        invoke.elf  identical
        64-tick soak on emulated RT1176: tick1, tick64 and fold 0x3466E91F all reproduce, every control
        fires. synth v0.61.0 changes NOTHING on jess's lowering path.
      *** A LATENT BUG FIXED WHILE HERE ***: build.sh called tools/deps/check.sh WITHOUT passing SCRATCH.
      It worked only because the child inherited it from the environment - so a caller setting SCRATCH as
      an unexported shell variable would have had its inputs verified against the DEFAULT tree. Exactly
      the defect AFD-065 found in fetch.sh, still latent in build.sh one file away. Now passed explicitly.
      *** THE MELD VARIANCE IS UNDERSTOOD, AND IT IS ALREADY-KNOWN, NOT NEW ***. The two builds' fused
      wasm differed (66,930 vs 70,125 B), which looked alarming next to identical ARM output. Localized:
        - code (16,862 B) and data (43,100 B) are BYTE-STABLE at identical offsets across all builds
        - run-to-run with identical paths, exactly 29 bytes differ, all inside
          custom "wsc.transformation.attestation" (0xEE24..0xEE46) - a timestamp
        - the size difference is meld embedding ABSOLUTE INPUT PATHS in custom "component-provenance":
          1,912 B (short path) -> 3,312 B (jess path) -> 6,152 B (long scratch path)
      The path-dependence is NOT a new finding: tools/repro/fuse-repro-oracle.sh already documents it as a
      KNOWN RESIDUAL verified on meld v0.39.0 and filed upstream. What is new is (a) it persists at 0.52.0,
      and (b) IT DOES NOT REACH THE FLIGHT ARTIFACT - synth's ARM output is invariant to it, which is why
      cascade.o is byte-identical across builds whose input wasm differs by 3 KB. Checked the existing
      oracle BEFORE reporting, rather than filing a duplicate.
      *** TWO OF MY OWN DEFECTS, BOTH CAUGHT BY RUNNING THE ORDINARY PATH ***:
        1 The DEPS_EXCLUDE plumbing used a bash ARRAY. Under `set -u`, bash 3.2 - what macOS ships -
          treats "${EMPTY_ARRAY[@]}" as unbound and aborts. The OFF-PIN path worked while the ORDINARY
          PINNED BUILD BROKE. Rewritten without an array.
        2 That breakage was MASKED: run-soak-oracle.sh reported PASS while build.sh was failing, because
          it reads a prebuilt ELF and a failed build leaves the previous image in place. The AFD-047
          staleness class again. Added a freshness guard - the oracle now refuses an image older than
          harness.c, boot-soak.S, link.ld or the module. Both directions observed: touching harness.c
          fires it, rebuilding clears it. Note the guard had to be written as "fail if an input is
          STRICTLY newer", because `-nt` is false for equal mtimes and one build.sh run writes the module
          and the ELF inside the same second - the naive form rejected a perfectly fresh build.
    tags: [release-watch, synth-0.61, toolchain, byte-identical, meld-nondeterminism, staleness, bash-3.2, checker-bug]
    fields:
      detected-by: jess acting on accumulated release-watch debt, 2026-09-04
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-04T02:51:23Z

  - id: AFD-067
    type: ai-found-defect
    title: gale-nano's poll-task return value is UNDOCUMENTED and load-bearing — jess's stubs asserted the polarity BACKWARDS, so a driven loop would have spun forever
    status: resolved
    description: |-
      2026-09-04. gale answered jess's dispatch-seam question on gale#223: exec.poll-round is already
      public and richer than the interface jess had asked to have promoted, and the seam splits into what
      the embedder IMPLEMENTS (gust:hal/mmio, gust:os/taskdisp) versus what it CALLS (gust:os/exec, time,
      timer, spawn, log). Both halves VERIFIED against the shipped, digest-pinned gale-nano 0.7.0 rather
      than taken on the claim: the component imports exactly {taskdisp, mmio} and exports exactly
      {time, log, spawn, exec, timer}. gale is right on every point.
      *** WHY A NEW COMPONENT WAS NEEDED ***: jess's existing taskdisp implementations returned 0 and
      recorded NOTHING, so "poll-round drained the task" and "poll-round did nothing at all" produced
      IDENTICAL observable state. The claim was untestable with what jess had. app/gust-dispatch-probe
      counts its own invocations; app/dispatch-driver sequences admit/poll-round/read-back INSIDE the
      component graph, because each `wasmtime run --invoke` is a fresh instantiation and the sequence
      cannot span three CLI calls. Each experiment is a separate export, so each runs in a FRESH instance -
      which is what makes with-admit/without-admit a real control pair and not two readings of one
      accumulating counter (the AFD-048 mistake).
      *** RESULT, executed in wasmtime against shipped gale-nano 0.7.0 (NOT on target) ***:
        with-admit()            1   a round after admit polls the task exactly once
        without-admit()         0   CONTROL - same round, no admit, poll-task NOT reached
        two-tasks-one-round()   2   "drain EVERY ready task" confirmed
      So gale#223's sentence is now a measurement.
      *** THE FINDING: taskdisp.poll-task's RETURN VALUE IS LOAD-BEARING AND UNDOCUMENTED ***. gale-nano
      0.7.0 ships `poll-task: func(id: u32) -> u32` with NO documented semantics - checked the shipped
      WIT directly. jess's stubs asserted a contract that was never specified, and asserted it BACKWARDS:
        app/gust-hal-stub and app/gust-hal-tick returned 0 with the comment
        "0 = task complete. The stub never reports pending, so a composed image cannot livelock."
      MEASURED, two independent observations agreeing:
        poll-task -> 1 : one-task-two-rounds = 1, exec.state 1 -> 2   (task completes, not re-polled)
        poll-task -> 0 : one-task-two-rounds = 2, exec.state stays 1  (task stays ready, re-polled forever)
      The second reading is gale's OWN exec.state accessor, so this does not rest on jess's counter.
      The polarity is INVERTED from what jess documented: 0 means "still ready, poll me again". A jess
      driver that admitted a task and looped would have spun forever - the precise failure the comment
      claimed to prevent.
      *** FIX ***: both stubs now return 1 with the measured semantics recorded. Behaviour-neutral for the
      existing oracles, verified rather than assumed - flight-loop, timer-probe and appcompose all still
      pass and their outputs are unchanged except cargo recompilation chatter.
      *** CONTROLS ***: the 0-returning probe is built by the oracle and asserted to differ byte-wise from
      the 1-returning one, so the control cannot be inert. The probe's last-id sentinel is 0xFFFF_FFFF,
      NOT 0, because gale hands out handle 0 first - initialising to 0 made "poll-task saw id 0" and
      "poll-task never ran" the same reading, and that collision was live, not theoretical. unpolled-id()
      returns the sentinel and observed-id() returns 0, so a reported id of 0 is a real handle.
      *** SCOPE ***: wasmtime, not silicon and not Renode. This is the dispatch CONTRACT established; the
      on-target rung is separate. DD-025 periodicity is not closed by this - what is closed is the
      question of which seam to drive and what its return value means.
    tags: [gale-223, dd-025, dispatch, taskdisp, poll-round, undocumented-contract, inverted-assumption, wasmtime, negative-control]
    fields:
      detected-by: jess turning gale#223's dispatch sentence into an executed measurement, 2026-09-04
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-04T06:53:36Z

  - id: AFD-068
    type: ai-found-defect
    title: meld v0.53.0 is a NO-OP on jess's fused cascade — exactly one byte differs, and it is the character in meld's own version string
    status: resolved
    description: |-
      2026-09-04. Release-watch, per-piece, against the REAL fused falcon cascade rather than a fixture.
      meld v0.53.0 vs the pinned 0.52.0, identical inputs (the five digest-pinned falcon v1.134.1 stage
      components), identical flags (--memory shared --pack-rebase), identical paths. Only the meld binary
      differed. Binary verified against the release's own signed SHA256SUMS.txt before use.
      *** THE NAIVE COMPARISON WAS NOT ATTRIBUTABLE ***: 30 differing bytes, all inside custom
      "wsc.transformation.attestation". But AFD-066 had already measured 29 bytes of RUN-TO-RUN variance
      inside that same section within a single meld version, so 30 bytes across versions is inside the
      noise. Reporting "meld 0.53.0 changes 30 bytes" would have been a measurement of the timestamp.
      *** THE CONFOUND REMOVED, AND THE REMOVAL ITSELF VERIFIED ***: re-fused both versions with
      `--reproducible` and SOURCE_DATE_EPOCH=0. SELF-CHECK FIRST - two 0.52.0 fusions under the flag are
      BYTE-IDENTICAL, so the flag actually suppresses the variance and the cross-version comparison is
      meaningful. Without that check, "identical" could have meant the flag did nothing and the two runs
      happened to agree.
      *** RESULT — EXACTLY ONE BYTE DIFFERS ***, at offset 0xF430 inside the attestation JSON:
        0.52.0   e":"meld","version":"0.52.0"},"metadata"
        0.53.0   e":"meld","version":"0.53.0"},"metadata"
        identical everywhere else: True
      That single byte is 0x32 -> 0x33, the '2'/'3' of meld's own version string. Every code byte, every
      data byte and every other metadata byte is identical. meld v0.53.0 is a NO-OP for jess's fused
      cascade.
      *** SCOPE, stated because it is easy to overread ***: this exercises the --memory shared
      --pack-rebase path jess uses for the FIVE-STAGE CASCADE. It does NOT test meld#393, the composed
      same-memory path with flight-app, which remains the open blocker for lowering the full stack. And it
      is a comparison of FUSION OUTPUT, not an execution claim - nothing was run on target here.
      Combined with AFD-066 (synth v0.61.0 emits byte-identical ARM), two of the four pending toolchain
      releases are now cleared against the real workload. Remaining: loom v1.4.1, rivet v0.35.0, and relay
      falcon-v1.135.0 - the last being the interesting one, since it changes the INPUTS rather than the
      toolchain and so cannot be byte-identical by construction.
    tags: [release-watch, meld-0.53, byte-identical, reproducible, confound-removed, self-checked-control]
    fields:
      detected-by: jess release-watch on the real fused falcon, 2026-09-04
      severity: info
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-04T07:54:47Z

  - id: AFD-069
    type: ai-found-defect
    title: loom v1.4.1 is behaviourally equivalent but STRUCTURALLY different — 4 more functions, +196 B of ARM, and the 64-tick flight result is bit-identical
    status: resolved
    description: |-
      2026-09-04. Release-watch, per-piece, against the REAL fused falcon cascade. Unlike synth v0.61.0
      (AFD-066) and meld v0.53.0 (AFD-068), which were byte-identical, loom v1.4.1 GENUINELY CHANGES ITS
      OUTPUT — and the flight answer is unchanged anyway, which is the stronger result because something
      could have broken.
      *** METHOD ***: the input was a `--reproducible` meld fusion, so the upstream nondeterminism
      characterised in AFD-066 could not confound the comparison. SELF-CHECK FIRST: loom 1.4.0 run twice
      on that fixed input is BYTE-IDENTICAL, so loom itself is deterministic and a cross-version
      difference is attributable.
      *** WHAT CHANGED (wasm) ***:
        loom 1.4.0   31 functions, code 15,926 B, module 61,167 B
        loom 1.4.1   35 functions, code 16,018 B, module 61,263 B
        data (43,100 B) and globals (84 B) IDENTICAL; 16,913 differing bytes overall
      1.4.1 retains FOUR MORE FUNCTIONS than 1.4.0 eliminated.
      *** WHAT CHANGED (ARM, cortex-m7dp via synth 0.60.0) ***:
        invoke.elf  89,752 B -> 89,948 B   (+196 B)
        soak.elf    89,704 B -> 89,900 B   (+196 B)
      *** WHAT DID NOT CHANGE — the point ***: the 64-tick soak on emulated RT1176 reproduces
        tick 1  0x00000000 0x00000000 0x3EB2AF18 0x3F800000
        tick 64 0x3ED89353 0x3EB9A587 0x3F176935 0x3F1F7A5F
        fold    0x3466E91F
      IDENTICALLY under both loom versions, and each build matches its OWN wasmtime reference bit-exact.
      So loom v1.4.1 is BEHAVIOURALLY EQUIVALENT AND STRUCTURALLY DIFFERENT on jess's path.
      *** THE FOOTPRINT DATUM IS WORTH REPORTING UPSTREAM ***: +196 bytes of ARM on a flight target, from
      four functions 1.4.0 removed and 1.4.1 keeps. loom may not know its optimiser change shows up that
      way downstream; jess is the consumer that can measure it.
      *** MACHINERY GAP THIS EXPOSED, NOW FIXED ***: AFD-066 made release-watch executable for SYNTH ONLY.
      meld and loom were hardcoded to `varve run`, so a loom candidate could not be tested without editing
      build.sh — this measurement had to be taken from a SCRATCH COPY of the script with its paths
      hardcoded, specifically to avoid contaminating an open PR. build.sh now takes MELD= and LOOM=
      overrides (empty = the varve-pinned dispatch) and ANNOUNCES any off-pin tool, on the pinned-synth
      path too, since an override is the only way those two can be off-pin. Verified both directions: the
      pinned path prints no banner, the loom override prints one and reproduces the same 89,900 B image
      the scratch copy produced.
    tags: [release-watch, loom-1.4.1, codegen-change, footprint, behaviour-preserved, self-checked-control, machinery-gap]
    fields:
      detected-by: jess release-watch on the real fused falcon, 2026-09-04
      severity: info
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-04T08:55:02Z

