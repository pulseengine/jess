  - id: AFD-025
    type: ai-found-defect
    title: synth arm backend cannot lower i64.load/i64.store (unsupported decoder op) - 39 sites block falcon on-target
    status: open
    description: >
      Found 2026-06-17 (iter#31) when synth v0.11.46's GI-FPU-001 loud-skip
      (AFD-024) surfaced the full inventory of ops synth's arm backend cannot
      lower on the falcon fused core. Beyond the floats (AFD-024/synth#369) and
      bulk-memory (memory.copy/fill, #180/#185), the core has 22 i64.load + 17
      i64.store = 39 sites that fall through the same `_ => None` decoder path and
      are now loud-skipped. jess MINIMAL REPRO on synth v0.11.46: a module with
      ld64 (i64.load), st64 (i64.store), ld32 (i32.load, control), add64 (i64.add,
      control) - `synth compile --target cortex-m7dp` skips ld64/st64
      ("unsupported operator I64Load/I64Store") but COMPILES ld32 and add64. So the
      gap is i64 MEMORY load/store specifically; i64 arithmetic and i32 load both
      work. Impact: a third independent on-target gap alongside synth#275
      (call_indirect dispatch) and synth#369 (hard-float) - on v0.11.46 the falcon
      fused core loud-skips 72 of ~176 funcs, 39 of them these i64 load/stores, so
      the firmware ELF stays structurally incomplete even once dispatch + hard-float
      land. Filed https://github.com/pulseengine/synth/issues/372 - supervising.
      Suggested: decode I64Load/I64Store to a lo/hi pair of i32 ldr/str into
      consecutive registers (memarg offset + {0,4}), reusing the existing i64
      register-pair regalloc (#171). UPDATE 2026-06-18 (iter#32): maintainer
      confirmed + deepened to a THREE-LAYER gap (deeper than the wiring fix jess
      suggested): (1) decoder gap - convert_operator decodes narrow I64Load8..32/
      I64Store8..32 + I32Load/Store but has no arm for FULL-WIDTH I64Load/I64Store
      (the `_ => None` jess found); (2) optimized-path stub - adding the decoder arm
      ALONE is net-negative: the default optimized path then drops it (ld64->`bx lr`,
      st64->`mov r0,r1`), reverting the honest loud-skip to a silent stub; needs an
      optimizer decline -> direct-selector fallback (#120/#188 pattern); (3) THE REAL
      BUG - the encoder (arm_encoder.rs:5303 I64Ldr/I64Str) uses addr.base+addr.offset
      but IGNORES addr.index, emitting [R11+offset]{,+4} and dropping the address
      operand. Proven numerically by maintainer: ld64(addr=16) returns mem[0]
      (0xaaaa..), NOT mem[16] - same class as #206. So i64 pair regalloc (#171) is
      fine; the memory ADDRESSING was never correct, it just never ran (decoder
      dropped the op first). Fix scoped as its own release (decoder arm + optimizer
      decline + encoder index materialization `ip=addr_reg+offset; ldr/str [R11,ip]`),
      gated on a committed numeric differential (scripts/repro/i64_load_store_372.*);
      maintainer will ping jess to re-flash falcon when it ships. RESOLVED 2026-06-18
      (iter#33): all three layers fixed + shipped in synth v0.11.47 (#373); #372
      CLOSED. jess independently verified on v0.11.47: the i64 repro now exits 0 with
      0 loud-skips (was 2), all funcs compile, and disasm confirms the encoder
      MATERIALIZES the address - ld64 emits `add.w ip, fp, r0` (frame+index reg) then
      `ldr.w r1,[ip]; ldr.w r2,[ip,#4]`; st64 the same with str.w - the addr.index r0
      is used, not dropped. Maintainer's unicorn value-level proof: ld64(16) now
      returns mem[16] not mem[0]. On the falcon v1.80 core the i64 loud-skips dropped
      39->0 (total 72->41); remaining gaps are FP (#369/AFD-024) and bulk-mem
      (#374/AFD-026).
    tags: [release-watch, synth, i64, on-target, resolved]
    status-note: resolved-verified
    fields:
      detected-by: jess iter#31 minimal repro; RESOLVED synth v0.11.47 (#373) - jess verified 0 skips + address materialized (add.w ip,fp,idx; ldr [ip],[ip,#4])
      severity: major
      triage-status: resolved
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002
      - type: traces-to
        target: REQ-PIX-001

