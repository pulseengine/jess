  - id: AFD-030
    type: ai-found-defect
    title: synth arm backend skips functions needing the AAPCS stack-arg path (>8 scalar params, or any 64-bit stack param) - not lowered
    status: resolved
    description: >
      Found 2026-06-26 measuring the falcon three-binary chain for the F100/M3 target
      (gale's 1.7x->0.7 perf ask, synth#494). On the arm backend, synth compile SKIPS
      (emits no code for) any function whose signature needs the AAPCS stack-argument
      path: more than 8 scalar params, or ANY 64-bit (i64/f64) param that would land on
      the stack. The function is dropped from the ELF rather than lowered - a
      completeness gap on the self-contained-firmware / synth#494 0.7x track, in the same
      class as #369 (float) and #275 (dispatch) but distinct from both.
      MINIMAL REPRO (verified on RELEASED synth v0.15.1, checksum-verified darwin binary):
      (func (export "sum10")(param i32 i32 i32 i32 i32 i32 i32 i32 i32 i32)(result i32) ...)
      -> "skipping function 'sum10': ... #359: function has 10 params; the AAPCS
      stack-argument path supports at most 8 scalar params". And
      (func (export "mix")(param i32 i32 i32 i32 i64)(result i64) ...) ->
      "#359: function has 5 params including a 64-bit (i64/f64) param; ... supports only
      i32 params". CONTROL: the same shape with 8 i32 params compiles cleanly + emits an
      ELF. The diagnostic cites #359, which is CLOSED and about a different bug (sret
      first-arg shift) - the stack-arg-path limitation itself had no open tracking issue.
      IMPACT (real workload): falcon-flight-v1.94 -> meld fuse -> loom v1.1.16 -> synth
      v0.15.1 compile -t cortex-m3 skips 29 of 145 fns; 3 fail on exactly this -
      func_57 (10 params), func_58 (25 params), func_163 (5 params incl 64-bit). These
      survive meld/loom as legitimate lowered helpers; only the arm arg-passing can't
      handle them. (Other 26 skips: 23 #369 float + 3 register-exhaustion.) Filed
      https://github.com/pulseengine/synth/issues/503 (per-AAPCS lowering + fix the
      stale #359 label). Supervising. Reproduce via tools/bench/chain-measure.sh.
      UPDATE 2026-06-26 (synth v0.16.0, PR #504/#505, built+verified from source 4a6b1ef):
      the maintainer shipped the >8-scalar-i32 stack-arg path (oracle sum10/sum25). jess
      re-measured falcon-v1.94 on 0.16.0: skips UNCHANGED at 29/145 - the fix unblocks 0 of
      the 3 named helpers, NOT 2, because all 3 carry i64 (the >8-scalar check had masked it
      in 0.15.1). Actual signatures: func_57 (i32x6,i64x3) + func_163 (i32,i64x4) = 64-bit
      STACK params, now correctly cite #503 (the open follow-up); func_58 fails DEEPER post-
      fix at "i64 register pair: no high register available for R8" - an i64-pair regalloc
      wall (#242 territory), not the stack-arg path. So the on-target win needs the 64-bit-
      stack-param lowering (#503) + the i64-pair fix. Diagnostic-precision + standalone
      >8-i32 capability confirmed; falcon skip-count not yet moved. Posted on synth#503
      (issuecomment-4806708182). #503 stays open.
      RESOLVED 2026-07-03 (synth v0.29.0, PR #605 "i64 stack params + pair spill-slot growth -
      direct-path completeness"): #503 CLOSED. jess verified on falcon v1.112 / 0.29.0 - func_58
      (the >8-param-with-i64 AAPCS case) NOW LOWERS + emits into the ELF; falcon AAPCS-classified
      skips 2 -> 0. func_164 is still skipped but RECLASSIFIED from #503 to #518 ("i64/f64 param
      in a frame-backing function - the param_slots path drops the high half"), a distinct
      follow-on. status -> resolved (the AAPCS stack-arg path lowers; the residual is #518, a
      separate i64-param lever tracked in AFD-016).
    tags: [release-watch, synth, arm, aapcs, calling-convention, on-target, perf-0.7]
    fields:
      detected-by: jess F100/M3 three-binary chain measurement (tools/bench/chain-measure.sh); minimal .wat repro on released synth v0.15.1; filed synth#503
      severity: major
      triage-status: confirmed-upstream
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002
      - type: traces-to
        target: REQ-PIX-001

  - id: AFD-031
    type: ai-found-defect
    title: loom default profile inflates falcon code +16% on the MCU path (inline pass, no -Os/size profile); --islands N returns larger than islands=1
    status: open
    description: >
      Found 2026-06-26 measuring the falcon chain for the F100/M3 size budget (8 KB SRAM,
      flash-bound; gale's 1.7x->0.7 ask, synth#494). On the meld-fused falcon-flight-v1.94
      core, CODE-SECTION sizes under loom v1.1.16 (latest; measured with wasm-tools objdump,
      attestation/custom sections excluded so this is real code not metadata):
        meld-fused (loom input)                       = 68322 B
        loom optimize (default: all passes, islands=1) = 79346 B  (+16.1%)
        loom optimize --islands 4                      = 80872 B  (+18.4%)
        loom optimize --passes <default minus inline>  = 68322 B  (+0.0%)
      Two observations: (1) ALL the growth is the `inline` pass, and there is no
      -Os/size/MCU optimization profile - the only way to avoid the +16% today is to
      hand-enumerate --passes and drop inline, which also loses the inlines that DO help
      (e.g. the gust hot-path seam, loom#226). A size-budgeted inline or an MCU profile
      would let flash-bound targets keep useful inlines without blanket inflation. (2)
      `--islands 4` returned a LARGER module than the islands=1 default (80872 > 79346 B)
      despite --islands being documented as "picks the smallest verified result" - its
      candidate pass-orderings don't include/beat the default for size on this input, so
      it is strictly worse on the metric it advertises. This is an OPTIMIZATION finding
      (not a miscompile): the chain is correct, but loom's default works against the
      F100/MCU size budget and the synth#494 0.7x parity goal. Reported as a measured
      data-point on loom#239 ("Make components small"), alongside #226/#219. Reproduce
      via tools/bench/chain-measure.sh.
    tags: [release-watch, loom, optimization, code-size, mcu, perf-0.7]
    fields:
