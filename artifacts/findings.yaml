  - id: AFD-023
    type: ai-found-defect
    title: loom dead-stores pass miscompiles the meld-fused falcon core (eliminates a live float store)
    status: resolved
    description: >
      Found 2026-06-14 (iter#20) by the behavioral SIL gate while moving jess to
      the meld -> loom -> synth order (loom now optimizes the FUSED core, not the
      per-component module). loom v1.1.13's output passes wasm-tools validate but
      is behaviorally WRONG on the meld-fused falcon-v1.59 core: kiln
      run-stabilization 0.023399856 -> 0.32916 (F32 1019195662 -> 1051232186),
      fails the <0.1 rad gate. Pass-bisected (kiln-checked each of the 16 loom
      passes): every pass EXCEPT dead-stores is correct; dead-stores alone (and
      the default set) produce the wrong value, deterministically. Likely cause:
      dead-stores treats a float store as dead when it is actually live (loom
      logs 'vacuum: verification skipped: unverifiable float load/store' on this
      module) - unsound store-elimination under unverifiable aliasing. Same class
      as AFD-014/loom#196, different trigger (loom-on-fused-core via dead-stores).
      Committed byte-exact repro repro/loom-dead-stores/falcon-v1.59.fused.wasm
      (sha256 fca83e85...). Filed https://github.com/pulseengine/loom/issues/220
      - supervising. INTERIM FIX: jess BUILD.bazel runs wasm_optimize with all
      passes except dead-stores (SIL-verified correct); drop the override when
      loom#220 lands. The meld->loom->synth order (DD-006) is preserved. RESOLVED 2026-06-15 (iter#21): fixed in loom PR #221 (merged main 5fd7443, 'skip functions with unverifiable float memory') - jess built loom main and re-verified on the committed repro: dead-stores AND full-default loom now both return the correct 0.023399856 (was 0.32916). Confirmed on loom#220. NOT yet in a loom release; jess keeps the passes-without-dead-stores override + SIL gate until a release carries #221 and the rwc bundle bumps loom off v0.3.0. UPDATE 2026-06-15 (iter#22): loom RELEASED the fix in v1.1.14. jess installed the v1.1.14 release binary and re-verified: dead-stores AND the full meld->loom(all passes)->kiln chain on falcon v1.62 are behaviorally EXACT (0.023399856 both sides). The standalone CLI path is now clean with full passes. The bazel path still uses the rwc BUNDLE loom v0.3.0, so the BUILD passes-override stays until rwc bumps the bundle loom to v1.1.14 - filed rwc#512. FULLY CLOSED 2026-06-16 (iter#24): rwc#514 merged (native loom 1.1.14 @loom_toolchain). jess bumped the rwc pin to main post-#514 and REMOVED the BUILD passes-override; bazel build //:falcon-optimized green and the SIL differential is EXACT (fused == fused+loom == 0.023399856, full default passes incl dead-stores). The bazel meld->loom->synth path now runs full loom optimization correctly.
    tags: [release-watch, loom, miscompilation, dead-stores, critical, sil-gate]
    fields:
      detected-by: jess loop iter#20 (2026-06-14) - behavioral SIL pass-bisect (kiln) on the meld-fused falcon-v1.59 core
      severity: critical
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-006
      - type: traces-to
        target: REQ-002

  - id: AFD-024
    type: ai-found-defect
    title: synth arm backend SILENTLY MISCOMPILES every scalar f32/f64 op to wrong value (decoder drops them) - correctness hazard, not soft-float
    status: open
    description: >
      Found 2026-06-17 (REQ-PIX-001) taking the falcon firmware to cortex-m7.
      ORIGINAL framing (superseded): synth emits no VFP and m4f/m7/m7dp are
      byte-identical, read as inline-integer soft-float / a performance risk.
      RECLASSIFIED 2026-06-17 after the synth maintainer (synth#369) diagnosed it
      against the v0.11.45 tree AND a jess value-level numeric oracle confirmed
      it: this is a SILENT WRONG-VALUE MISCOMPILE, not soft-float. Every scalar
      f32/f64 arithmetic op is DROPPED, so the function returns a stale operand.
      Root cause (maintainer): map_operator in crates/synth-core/src/wasm_decoder.rs
      decodes only the SIMD F32x4* family and has no arm for any scalar f32.*/f64.*
      op, so they fall through `_ => None` (wasm_decoder.rs:782) and are dropped
      before the selector ever runs - the SAME `_ => None` line that silently drops
      memory.copy (the tracked bulk-memory gap; #180/#185 contract: an unlowerable
      op must Err, never None/continue). The reason there are 0 VFP and 0 __aeabi_*
      float-lib insns is that there is NO float arithmetic at all - it is gone.
      jess INDEPENDENT REPRO (the value-level check the maintainer requested):
      synth compile of (func (param f32 f32)(result i32) local.get 0 local.get 1
      f32.add i32.reinterpret_f32) --target cortex-m7dp emits `mov r0,r1; bx lr`
      (returns operand b, NOT a+b); f32.mul emits the same `mov r0,r1`; and a
      constant 1.5+2.25 fold emits a bare `bx lr` (computation vanished). wasmtime
      gives 3.75 (i32 1081081856); synth gives the wrong operand. Impact: falcon's
      cascade is 2044 f32 + 480 f64 ops - on synth-compiled ARM it would SILENTLY
      compute wrong control outputs (a flight-control correctness hazard), not just
      miss deadlines. This is a HARD on-target blocker independent of synth#275
      (dispatch). Filed https://github.com/pulseengine/synth/issues/369 -
      supervising; maintainer split the fix into GI-FPU-001 (decoder honesty:
      unsupported FP ops must Err/link-fail loudly, frozen-safe - no frozen fixture
      uses floats) and GI-FPU-002 (real VFP lowering in select_with_stack, falcon
      numeric-oracle gated). REQ-PIX-001's 'fpv5-d16 hard-float' is unachievable
      until GI-FPU-002 lands; correctness is unsafe until at least GI-FPU-001.
      UPDATE 2026-06-17 (iter#31): the SILENT-MISCOMPILE half is RESOLVED in synth
      v0.11.46 (PR #371, GI-FPU-001) and jess verified it with the value-level
      oracle: `synth compile fp-add-mul.wat --target cortex-m7dp` now exits 1 with
      `warning: skipping function 'addf': contains an unsupported operator (F32Add)
      ... rather than a silent miscompile (#369)` for each FP function and emits NO
      ELF ("Error: no functions compiled successfully") - the `mov r0,r1`
      wrong-value stub is gone. On the full falcon v1.76 fused core, v0.11.46
      loud-skips 72 of ~176 functions (104 compiled+emitted) with a clean op
      inventory: 8 F32Load, 5 I32ReinterpretF32, 3 F64PromoteF32, 1 F32Eq, 1
      F32Const, 1 F64Const (the FP set GI-FPU-002 must lower) + 22 I64Load / 17
      I64Store (NEW gap, AFD-025/synth#372) + 9 MemoryFill / 5 MemoryCopy
      (bulk-mem, #180/#185). Net: no more silent wrong values (severity drops from
      critical to major); the OPEN remainder is GI-FPU-002 (real VFP hard-float)
      for REQ-PIX-001 to actually work rather than loudly-refuse. Confirmation
      posted on synth#369.
      UPDATE 2026-06-20 (cron loop, falcon-v1.81.0 = relay-hal v1, synth v0.11.50):
      per-piece gate GREEN on the sha256-verified released falcon-flight-v1.81.wasm -
      SIL PASS (run-stabilization 0.0234 rad < 0.1, kiln == wasmtime), meld/loom/synth
      ELF all produced. Loud-skip inventory on the released component = 3 of 18, ALL
      #369 hard-float: 2x F32Load (run-position-hold, func_34) + 1x F32Const
      (run-stabilization). BULK-MEM CLEAN: 0 memory.copy / memory.fill across the
      released, meld-fused, AND loomed artifacts - confirms AFD-026/#374 holds on
      v1.81/v0.11.50. i64 clean (AFD-025). So GI-FPU-002 (#369 real VFP hard-float) is
      now the SOLE remaining unlowered op-class in falcon's flight-control core (the
