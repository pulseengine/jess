      cannot silently recur a third time. Filed https://github.com/pulseengine/relay/issues/140
      - supervising. Recurrence of AFD-006. UPDATE 2026-06-11 (iter#7): regression
      WIDENED to 10 releases - v1.45.0 through v1.54.0 all ship zero wasm assets
      (v1.54.0 re-checked). jess stays pinned to v1.44.0; range update posted on
      relay#140 (issuecomment-4677414340).
    tags: [release-watch, relay, regression]
    fields:
