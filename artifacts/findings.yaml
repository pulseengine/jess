  - id: AFD-008
    type: ai-found-defect
    title: synth arm backend compiles only exports not the reachable call graph
    status: open
    description: >
      synth arm backend compiles only exported functions, not the reachable call graph. falcon component gives 4 funcs; the meld-fused core (280 funcs) gives 24 funcs, ELF ~5KB. Internal cascade functions are absent, so the ELF cannot execute run-stabilization on-target (Renode/QEMU/hardware) - it runs fine in wasmtime and kiln where the whole module is present. Complete-firmware path is backend w2c2 plus --link (w2c2 + arm-none-eabi-gcc + kiln builtins), but w2c2 reports not installed. This is the real blocker for jess 0.2.0/0.3.0 on-target HIL, beyond Renode not being installed. Filed https://github.com/pulseengine/synth/issues/275 - supervising.
    tags: [release-watch, synth, on-target]
    fields:
      detected-by: jess on-target diagnosis (synth arm backend) on falcon fused core
      severity: major
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002

  - id: AFD-009
    type: ai-found-defect
    title: kiln does not terminate on falcon run-position-hold (fused core)
    status: open
    description: "RECLASSIFIED 2026-06-06: NOT a correctness/non-termination bug. Reduced 200-step repro shows kiln terminates AND matches wasmtime (3.131192207 == 3.1311922). The 30000-step run-position-hold is finite-but-slow on kiln's tree-walker (>1B instructions), not infinite. Fuel-bounding (bug b) fixed in kiln 0.3.1 (#276), so it is now safe (--fuel traps). Implication for jess: the kiln interpreter is correct but too slow for large real-time control loops; real-time embedded needs synth native compilation (synth#275). kiln#270 (a) is a performance characteristic, not a correctness defect."
    tags: [release-watch, kiln, simulation, critical]
    fields:
      detected-by: jess meld->kiln differential sim vs wasmtime (source-built fused falcon)
      severity: major
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-004
