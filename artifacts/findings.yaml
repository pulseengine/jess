  - id: AFD-017
    type: ai-found-defect
    title: synth arm backend silently skips functions on a wasm-tools-valid module (false value-stack underflow on Select/LocalSet)
    status: open
    description: >
      Found 2026-06-13 (iter#11) by class-breaking the synth skip warnings:
      synth's component validator reports a wasm value-stack underflow and
      silently drops 2 functions of the falcon flight core, on a module that
      wasm-tools validate accepts as fully valid - so it is synth's internal
      abstract-stack model under-counting, not a malformed input. func_39 at op
      2 (Select) 'would pop 3 from depth 2'; func_30 at op 21 (LocalSet(2))
