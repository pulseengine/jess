  - id: AFD-076
    type: ai-found-defect
    title: Renode models the Cortex-M7 MPU REGISTER FILE but does not ENFORCE it — every register reads back perfect while an out-of-region write lands, so jess cannot validate the gale#348 obligation off silicon
    status: resolved
    description: |-
      2026-09-04. gale answered gale#348 and handed jess an obligation: if the verified MPU primitive
      ships, jess receives the region-table computation and THE PRIVILEGED REGISTER WRITE
      (MPU_RBAR/MPU_RASR at PPB 0xE000ED9C) becomes jess's to implement. Before building to that, jess
      asked whether the obligation can be VALIDATED in emulation.
      *** IT CANNOT, AND THE WAY IT FAILS IS THE TRAP ***. Measured on emulated RT1176 Cortex-M7
      (Renode 1.16.1) with a 24-instruction probe that programs ONE 32 KB region and then writes outside
      it, with the background region DISABLED:
        MPU_TYPE   0x00000800   -> DREGION = 8. The model ADVERTISES eight MPU regions.
        MPU_CTRL   0x00000001   -> reads back ENABLED, PRIVDEFENA=0
        MPU_RBAR   0x20000000   -> reads back exactly as written
        MPU_RASR   0x0300001D   -> reads back exactly as written (AP=3, 32 KB, ENABLE)
        inside  write @0x20001000 -> 0x1111AAAA   landed, as it must
        outside write @0x20008000 -> 0x2222BBBB   *** ALSO LANDED ***
        CFSR       0x00000000   no fault
        MemManage handler        never entered
      So every register exists, accepts writes and reads back correctly, and NOTHING IS ENFORCED. Renode
      models the MPU REGISTER FILE, not the MPU.
      *** WHY THIS IS THE VACUOUS SHAPE AND NOT MERELY A MISSING FEATURE ***: a test that programmed the
      MPU and then CHECKED THE REGISTERS would report complete success. MPU_TYPE says eight regions,
      MPU_CTRL says enabled, RASR reads back byte-perfect. Every observable short of an actual
      out-of-region access agrees that memory protection is active. Only the access itself distinguishes
      them, and that is precisely the observation a register-level test omits.
      *** CONSEQUENCE FOR THE SAFETY CASE ***: AFD-028 recorded "the flight memory-safety guarantee =
      gale's MPU (verified)". Corrected there today. The mechanism is right for the threat AFD-028
      actually arose from - synth#377 is a MISCOMPILATION concern and gale's scope is fault-containment,
      which matches - but the guarantee now has three qualifiers it did not have: it depends on a jess-side
      register write that does not exist, on a gale artifact that will not ship in v0.7.x, and its
      enforcement leg CANNOT BE TESTED OFF SILICON. That last one is new and is jess's own finding.
      *** COMMITTED AS A CHARACTERIZATION TEST, NOT A GATE ***: hardware/renode/mpu-probe/run-oracle.sh
      asserts the CURRENT behaviour and FAILS LOUDLY if Renode ever starts enforcing - because that would
      be good news that jess must act on, and a probe that passed either way would tell us nothing. It
      also refuses if MPU_TYPE reads zero (cannot distinguish "not enforced" from "not present") or if the
      configuration does not read back (a non-fault would then prove nothing).
      *** A PARSING DEFECT FOUND WHILE BUILDING IT ***: Renode terminates monitor lines with \r\r\n, so
      `/^B$/` never matches and an awk-based parse silently yielded ZERO words while the log plainly held
      seven. The sibling oracles avoid this only because their python parser rstrips. Fixed with `tr -d
      '\r'`; recorded because the failure mode is an empty result that looks like a clean read.

      *** WITHDRAWN 2026-09-05 — THE CENTRAL CONCLUSION OF THIS FINDING IS WRONG. See AFD-078. ***
      Renode DOES enforce the v7-M MPU. This finding's probe ran PRIVILEGED, and Renode treats a
      PRIVILEGED BACKGROUND access - an address matching no enabled region - as granted, i.e. as if
      PRIVDEFENA were permanently 1. That single narrow gap was mistaken here for "the MPU is not
      enforced at all".
      Corrected by measurement on jess's own RT1176 model, same probe, one variable changed
      (CONTROL.nPRIV=1 immediately before the access under test):
        PRIVILEGED    hole 0x2222BBBB  CFSR 0x00000000  FELL THROUGH
        UNPRIVILEGED  hole 0x00000000  CFSR 0x00000082  DENIED (DACCVIOL+MMARVALID)
      gale caught this (gale#348) and retracted their own matching claim; jess verified it independently
      rather than accepting it. Region permissions and XN ARE enforced, including for privileged code.
      THE PRACTICAL REVERSAL: the gale#348 register-write obligation IS validatable in emulation, provided
      the tenant runs UNPRIVILEGED. The "hardware-gated, only closable on silicon" conclusion recorded
      here is WRONG and must not be cited.
    tags: [renode, mpu, gale-348, afd-028, vacuous-observable, characterization-test, emulation-limit, safety-case]
    fields:
      detected-by: jess testing whether the MPU register-write obligation gale assigned can be validated in emulation, 2026-09-04
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-04T18:49:11Z

  - id: AFD-077
    type: ai-found-defect
    title: RENODE'S OWN MPU REGRESSION SUITE PASSES ON A PLATFORM WITH NO MPU ENFORCEMENT — measured both halves on the same platform, and jess's first probe would have mis-measured any platform that did enforce
    status: resolved
    description: |-
      2026-09-05. AFD-076 found that Renode does not enforce the Cortex-M MPU. gale (gale#348)
      independently confirmed it on the NIGHTLY (master, renode-1.16.1+20260904git63d4e2dd5) across m3,
      m4 and m7 - so the finding is not "pending a release", it holds against current master. gale then
      declined to paper over a tension: Renode SHIPS tests/unit-tests/mpu.robot, which runs four Zephyr
      memory-protection suites and requires PROJECT EXECUTION SUCCESSFUL. Either those tests do not depend
      on enforcement, or something differs. This resolves it.
      *** FIRST, A DEFECT IN JESS'S OWN PROBE (AFD-076's), which would have MIS-MEASURED any platform
      that DOES enforce ***: with PRIVDEFENA=0 a single data region is not enough. The markers sat at
      0x20030000, OUTSIDE the only grant, and _stack_top was 0x20040000, also outside. On an enforcing
      platform the probe would have faulted on its own bookkeeping or on exception entry - never reaching
      the access under test - and reported an escalated HardFault that looks nothing like the real answer.
      The result it gave was right by luck, because nothing enforced anything. REDESIGNED to gale's spike
      shape: grant CODE and DATA, put stack and markers inside the grant, leave a HOLE granted to nobody,
      write into the hole. A distinct 0x1E55DEAD escalation marker now catches exactly the mistake the
      first version made.
      *** THE DECISIVE MEASUREMENT — same Renode build, minutes apart ***:
        platform             MPU_TYPE    granted     hole        CFSR   verdict
        RT1176 M7            0x00000800  0x1111AAAA  0x2222BBBB  0      FELL THROUGH
        stm32f4_discovery-kit 0x00000800 0x1111AAAA  0x2222BBBB  0      FELL THROUGH
      stm32f4_discovery-kit is RENODE'S OWN PLATFORM for its OWN MPU test.
      Then ran that suite, on this machine, on that platform:
        Should Pass Zephyr mem_protect Test   OK   2.06s
        Should Pass Zephyr protection Test    OK   0.87s
        Should Pass Zephyr stackprot Test     OK   1.04s
        Should Pass Zephyr userspace Test     OK   1.21s
        renode-test rc=0
      *** CONCLUSION: RENODE'S OWN MPU REGRESSION SUITE PASSES ON A PLATFORM WHERE AN UNGRANTED WRITE
      DEMONSTRABLY LANDS. *** The suite does not detect absent MPU enforcement. Both halves measured on
      the same platform, same Renode build, minutes apart - so this is not an inference across
      configurations. gale's tension is resolved in the direction of "those tests do not depend on
      enforcement", and "Renode has MPU tests and they pass" is not evidence that the MPU works.
      Why the Zephyr suites still pass is NOT established here and is not claimed: the plausible reading
      is that the prebuilt ELFs were configured without CONFIG_ARM_MPU so the protection cases never
      execute, but jess did not inspect the binaries. What IS established is the implication, which does
      not depend on the cause.
      *** WHAT THIS SETTLES FOR JESS ***: the enforcement leg of the gale#348 register-write obligation
      is HARDWARE-GATED against current Renode master, and no amount of emulation configuration reaches
      it. AFD-028's memory-safety argument therefore has a leg that can only close on silicon. That is a
      sharper reason for the H1-H4 rungs than any previously recorded.
      *** UPSTREAM ***: renode/renode#177 has been open since 2021-01-31; its maintainer reply says
      partial support existed internally and was "tested with Zephyr" - which is precisely the suite shown
      here not to discriminate. Three independent measurements now stand against it: jess's RT1176 M7,
      gale's M3, and gale's nightly sweep across m3/m4/m7.

      *** WITHDRAWN 2026-09-05 — THE CENTRAL CONCLUSION OF THIS FINDING IS WRONG. See AFD-078. ***
      Renode DOES enforce the v7-M MPU. This finding's probe ran PRIVILEGED, and Renode treats a
      PRIVILEGED BACKGROUND access - an address matching no enabled region - as granted, i.e. as if
      PRIVDEFENA were permanently 1. That single narrow gap was mistaken here for "the MPU is not
      enforced at all".
      Corrected by measurement on jess's own RT1176 model, same probe, one variable changed
      (CONTROL.nPRIV=1 immediately before the access under test):
        PRIVILEGED    hole 0x2222BBBB  CFSR 0x00000000  FELL THROUGH
        UNPRIVILEGED  hole 0x00000000  CFSR 0x00000082  DENIED (DACCVIOL+MMARVALID)
      gale caught this (gale#348) and retracted their own matching claim; jess verified it independently
      rather than accepting it. Region permissions and XN ARE enforced, including for privileged code.
      THE PRACTICAL REVERSAL: the gale#348 register-write obligation IS validatable in emulation, provided
      the tenant runs UNPRIVILEGED. The "hardware-gated, only closable on silicon" conclusion recorded
      here is WRONG and must not be cited.
    tags: [renode, mpu, renode-177, gale-348, vacuous-test, upstream-finding, characterization, hardware-gated, self-correction]
    fields:
      detected-by: jess resolving the tension gale flagged on gale#348 rather than leaving it, 2026-09-05
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T04:11:40Z

  - id: AFD-078
    type: ai-found-defect
    title: "WITHDRAWAL: Renode DOES enforce the MPU — jess measured one narrow gap (privileged background accesses) and generalised it to the whole mechanism, and wrongly called Renode's own suite vacuous"
    status: resolved
    description: |-
      2026-09-05. WITHDRAWS the central conclusion of AFD-076 and AFD-077. Both said Renode does not
      enforce the Cortex-M MPU. IT DOES. jess measured one gap and generalised it to the whole mechanism.
      *** THE ERROR ***: jess's probe ran PRIVILEGED. Renode treats a PRIVILEGED BACKGROUND access - an
      address matching no enabled region - as GRANTED, i.e. as if PRIVDEFENA were permanently 1. That is
      one narrow, real defect. jess read it as "the MPU register file is modelled but nothing is
      enforced", which is a much larger claim and is false.
      *** THE MEASUREMENT THAT SETTLES IT ***, jess's own RT1176 and Renode's stm32f4_discovery-kit, one
      variable changed (CONTROL.nPRIV=1 immediately before the access under test):
        platform   privilege     hole write   CFSR        verdict
        RT1176 M7  PRIVILEGED    0x2222BBBB   0x00000000  FELL THROUGH
        RT1176 M7  UNPRIVILEGED  denied       0x00000082  DENIED (DACCVIOL+MMARVALID)
        stm32f4    PRIVILEGED    0x2222BBBB   0x00000000  FELL THROUGH
        stm32f4    UNPRIVILEGED  denied       0x00000082  DENIED
      Identical on both platforms. The enforcement is real; the privilege level was the missing variable.
      *** AFD-077's SECOND CLAIM IS ALSO WITHDRAWN ***: it said Renode's tests/unit-tests/mpu.robot
      "passes on a platform with no MPU enforcement" and therefore "does not detect absent enforcement".
      The suite is NOT vacuous. gale reproduced it with fault counts: mem_protect 49 PASS / 11 MPU faults,
      protection 5/5, stackprot 2/0, userspace 39/14, and all four carry zassert_unreachable negative
      controls ("Write to rodata did not fault", "Execute from stack did not fault") that did NOT trip.
      `protection` has no CONFIG_USERSPACE and runs entirely PRIVILEGED, and Renode still raised 5 real
      faults. So Renode enforces region permissions and XN for privileged code too - the gap is ONLY the
      background region.
      jess's inference was structurally wrong in a way worth naming: the suite passing and jess's probe
      falling through are BOTH TRUE and are NOT in tension, because they exercise different things. jess
      resolved an apparent contradiction by concluding the other party's test was vacuous, when the
      actual resolution was that jess's own probe had an uncontrolled variable. Reaching for "their check
      is vacuous" is a hazard specific to a campaign that keeps correctly finding vacuous checks.
      *** THE PRACTICAL REVERSAL, and it is the useful half ***: the gale#348 register-write obligation
      IS VALIDATABLE IN EMULATION, provided the wasm tenant runs UNPRIVILEGED. That is the correct
      configuration for isolation regardless - it is precisely what gale's own security-containment
      caveat asks for, since a privileged tenant can reprogram the MPU. So AFD-028's memory-safety leg is
      NOT hardware-gated. Recorded in AFD-076/077 as such and now retracted there.
      *** PROCESS ***: gale caught this and retracted their own matching claim first. jess did not take it
      on trust - the correction above is jess's own measurement on jess's own model, with exactly one
      variable changed from the run that produced the wrong answer. The oracle now pins BOTH behaviours
      across both platforms and fails if EITHER changes.
