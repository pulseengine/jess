  - id: AFD-018
    type: ai-found-defect
    title: Renode does not model the i.MX RT1170/RT1176 - HIL emulation gap for the Pixhawk 6X-RT
    status: resolved
    description: >
      Found 2026-06-14 (iter#18) during Pixhawk 6X-RT porting research: Renode
      has no platform for the NXP i.MX RT1170/RT1176. renode/platforms/cpus ships
      only imxrt1064.repl and imxrt500.repl (plus RT700 EVK); the RT11xx family
