artifacts:
  - id: AFD-001
    type: ai-found-defect
    title: synth graph unresolvable — broken CTRL-RA ref plus synth-sigil cycle
    status: open
    description: >
      During jess external-integration setup (Task 8/9 of the rivet tracking
      spine), `rivet validate` was run against the synth upstream repo
      (pulseengine/synth) to test whether it could be consumed as a cross-repo
      external. Validation failed with multiple graph errors.

      Detection method: `rivet validate` (rivet's own graph-resolution machinery)
      during jess external integration on 2026-06-04.

      Root causes identified:
      1. Broken internal cross-reference `CTRL-RA` in
         synth/safety/stpa/code-generation-ucas.yaml — the target artifact does
         not exist in the synth artifact store, leaving the graph dangling.
      2. A dependency cycle between the synth and sigil repos (synth references
         sigil artifacts and sigil references synth artifacts), making external
         graph resolution impossible for either repo in isolation.
      3. Dangling `kiln:` prefix links in sigil's artifact files that cannot be
         resolved without kiln being fully loaded, compounding the cycle.

      Because the graph does not resolve, none of synth, meld, kiln, or sigil can
      currently be consumed as rivet cross-repo externals. Traceability for all
      four is anchored at supplier-boundary external-anchor artifacts until the
      upstream graphs are fixed.

      Status: largely resolved 2026-06-10 (jess loop iter#3). The concrete
      broken ref is fixed upstream: CTRL-RA is now a defined artifact in
      synth/safety/stpa/control-structure.yaml (`- id: CTRL-RA`), so the
      dangling internal reference no longer exists. The synth↔sigil cross-repo
      cycle could not be re-confirmed this iteration (requires a full
      externals sync of synth+sigil+kiln) — left for a future iteration before
      attempting cross-repo external consumption again. No upstream issue filed:
      the citable defect (CTRL-RA) was already fixed by the time it was checked.
    tags: [supplier, upstream, graph-error, blocked]
    fields:
      severity: major
      triage-status: open
      detected-by: rivet validate (graph resolution during cross-repo external integration)
      discovered-at: "2026-06-04"
      notes: >
        Affects synth (primary), and transitively meld, kiln, sigil due to the
        cross-repo cycle. Filed against EXTERNALANCHOR-002 (synth). All four
        supplier anchors are tagged `blocked` in suppliers.yaml. The upstream
        issue URL field will be updated once the GitHub issue is created against
        pulseengine/synth.
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002
      - type: traces-to
        target: REQ-003
    provenance:
      created-by: ai-assisted
      model: claude-sonnet-4-6
      timestamp: 2026-06-04T17:47:53Z

  - id: AFD-002
    type: ai-found-defect
    title: loom fused pass invalidates core module 0 (section size mismatch)
    status: resolved
    description: >
      RESOLUTION AMENDED 2026-06-10 (iter#5): the v1.1.11 encoding fix is real but
      unmasked a CRITICAL behavioral regression in the same remap path - the rebuilt
      element table holds wrong functions in wrong slots, scrambling call_indirect
      dispatch (SIL gate: position-hold 0.13m -> 593.8m). Tracked as AFD-014 /
      loom#196; correction posted on loom#172. v1.1.10's invalid-module fallback was
      accidentally protecting correctness. ORIGINAL RESOLUTION (structural only,
      premature): fixed in loom v1.1.11 (closes loom#172).
      Root cause: remap_element_section_refs extracted the wasm_encoder payload as if
      it had an id+len section header and skipped a phantom id byte, stripping the
      element segment-count prefix. Re-verified on the same artifact
      (falcon-flight-v1.34.wasm, sha256 3213a135...): 4/4 core modules now optimize
      (was 3/4), component 101207->97256 bytes (0.2%->3.9%), output passes
      wasm-tools validate. Confirmed on loom#172 (issuecomment-4671422858). ORIGINAL:
      RE-TESTED 2026-06-10 on loom v1.1.10 (jess loop iter#3): module 0 STILL
      fails the fused optimization pass with 'section size mismatch: unexpected
      data at the end of the section (at offset 0x252)' and falls back to original
      bytes; module 1's old 'unknown local 18: local index out of bounds' is now
      FIXED (modules 1-3 optimize cleanly). Net reduction ~0.2% because module 0
      (the ~96KB hot module) is untouched. Reproducible on the public asset
      falcon-flight-v1.34.wasm (sha256 3213a135...). Filed upstream:
      https://github.com/pulseengine/loom/issues/172 — supervising.
    tags: [loom, optimizer, wasm, upstream]
    fields:
      severity: major
      triage-status: open
      detected-by: "jess bootstrap forward-chain experiment (loom v0.3.0 prebuilt) on falcon-flight-v1.26.wasm"
      discovered-at: "2026-06-04"
      notes: >
        Affects two of four wasm inner modules in falcon-flight-v1.26.wasm. Module 0
        fails with 'section size mismatch: unexpected data at the end of the section'
        after the fused optimization pass. Module 1 fails with 'unknown local 18:
        local index out of bounds' after loop_invariant_code_motion. Both fall back
        to original bytes, resulting in only 0.1% net reduction. Upstream issue URL:
        TODO — to be filed against pulseengine/loom.
    links:
      - type: defect-against
        target: EXTERNALANCHOR-006
    provenance:
      created-by: ai-assisted
      model: claude-sonnet-4-6
      timestamp: 2026-06-04T20:55:00Z

