  - id: AFD-032
    type: ai-found-defect
    title: synth optimized (non-relocatable) path silently miscompiles br_table — selector elided, all arms fall through
    status: resolved
    description: >
      Found 2026-06-26 while measuring the gust 1.81x codegen gap (gale COMPARE.md /
      gust_codegen_bench) for the 1.7x->0.7 ask. On the OPTIMIZED (non-relocatable)
      path, synth 0.16.0 silently miscompiles br_table: the selector is never read and
      ALL arms execute in fall-through sequence. No skip/warning, exit 0 - a silent
      wrong-code that violates synth's #180/#185 "unlowerable => Err, never silently
      continue" contract (same class as AFD-024). Minimal repro brtable2.wat
      (br_table 0 1 2 3, each arm stores a distinct const then returns): wasmtime oracle
      gives mem[0]=10/20/30/40 selected by the param; synth -t cortex-m3 --cortex-m emits
      NO cmp/branch, never loads local 0, runs all four stores => always 40. Reproduced
      across 3 br_table shapes (sequential, shared-tail, value-returning arms).
      CRITICAL SCOPE (the bug is PATH-specific, not component-specific): the --relocatable
      path lowers the IDENTICAL module CORRECTLY (cmp r0,#0/#1/#2;beq to distinct arms);
      the non-relocatable/optimized (--cortex-m) path drops it. gust dissolves --relocatable
      (linked into a native host image) so its one br_table (kiln_async TaskTable::transition,
      func_0) lowers correctly - gust is SAFE. SCOPE REFINED 2026-06-26 (falcon-reloc-spike,
      tools/bench/falcon-reloc-spike.sh - SUPERSEDES the earlier "falcon affected" correction):
      the #507 drop is a NARROW STRUCTURAL case (the minimal repro: br_table arms that
      store-then-return / a memory-loaded selector). falcon has 18 br_table-bearing functions
      (3 skipped for #369 floats; 15 EMITTED). The 15 emitted ones lower CORRECTLY AND
      IDENTICALLY on BOTH paths - verified func_41 disassembles byte-for-byte equal on
      --cortex-m and --relocatable (same cmp/bne/subs dispatch; only absolute addrs differ),
      and total conditional-branch count is EQUAL (780 = 780). So falcon's REAL br_tables are
      NOT hit by #507 on either path - falcon is neither actively nor latently miscompiled by it.
      NET: #507 is a real silent-miscompile of VALID wasm (worth fixing; same family as OPEN
      synth#500 / CLOSED synth#483) but is NOT currently exercised by falcon OR gust code. The
      earlier "third on-target blocker / forces falcon to --relocatable" framing was WRONG and
      is retracted: the --cortex-m-vs--relocatable choice is the LINKING MODEL (self-contained
      ELF vs gale-maximal-wasm TCB-link, DD-018), not br_table correctness. TEST-PIX-020 remains
      a valid regression oracle for the bug. Filed synth#507; corrections posted.
      The PERF side of the same gust hot path (br_table-as-linear-cmp-chain on the
      relocatable path, gust_poll 3.9x) is already covered by synth#390/#428 - not re-filed.
      RESOLVED 2026-06-26: synth v0.17.0 (PR #508, "optimized path declines br_table to the
