  - id: AFD-008
    type: ai-found-defect
    title: synth arm backend compiles only exports not the reachable call graph
    status: open
    description: >
      synth arm backend compiles only exported functions, not the reachable call graph. falcon component gives 4 funcs; the meld-fused core (280 funcs) gives 24 funcs, ELF ~5KB. Internal cascade functions are absent, so the ELF cannot execute run-stabilization on-target (Renode/QEMU/hardware) - it runs fine in wasmtime and kiln where the whole module is present. Complete-firmware path is backend w2c2 plus --link (w2c2 + arm-none-eabi-gcc + kiln builtins), but w2c2 reports not installed. This is the real blocker for jess 0.2.0/0.3.0 on-target HIL, beyond Renode not being installed. Filed https://github.com/pulseengine/synth/issues/275 - supervising. UPDATE 2026-06-10 (loop iter#3): answered the maintainer's requested scoping input on the fused core - call_indirect count = 61, 2 funcref tables (15+34=49 slots), 187 funcs, 26 exports. This is the 'many' case the maintainer defined, confirming the blocker is the broken call_indirect DISPATCH (select_with_stack drop + R11 table-base collision), not a direct-call closure bug; reachability closure already fixed in v0.11.33. Comment synth#275 issuecomment-4667039061. UPDATE 2026-06-10 (iter#4): maintainer accepted the scoping and SCHEDULED the dispatch fix as synth v0.11.42 (10-release plan, #242). jess confirmed normal-queue priority is fine - not blocking Phase-1 HIL (falcon runs whole-module in wasmtime/kiln), but it is the long pole for the on-target Cortex-M milestone (jess 0.2.0/0.3.0); will ping to queue-jump if on-target becomes active before v0.11.42. Comment issuecomment-4671423102. UPDATE 2026-06-14 (iter#16): the scheduled v0.11.42 SHIPPED but with #313 (if/else-with-result reconciliation), NOT the dispatch - the dispatch slipped ('shifts with gale interleaves', as warned). Still pending; posted a respectful no-pressure status touch restating it as jess's on-target long pole (issuecomment-4700483727). 61 call_indirect sites unchanged; jess keeps the falcon fused core as a standing fixture for when it lands. UPDATE 2026-06-14 (iter#17): maintainer placed #275 as one of TWO co-equal on-target long poles, behind synth#345 (struct-return .data/abs-reloc, the active next pick - silicon-gated, gates 51 repr(C) decides on the gale side). Dispatch scheduled right after #345. No jess action; watching both. UPDATE 2026-06-17 (iter#29): maintainer picked #275 up as THE gating on-target long pole and root-caused it deterministically as FOUR layers (GI-CI-001): Layer-0 = call_indirect is SILENTLY DROPPED on the runnable self-contained Cortex-M ELF path (build_multi_func_cortex_m_elf, no --relocatable - falcon's actual firmware path) -> body compiles to `bx lr`, SAME silent-drop class as AFD-024/synth#369/memory.copy (the optimizer doesn't decline it); the --relocatable object emits a dispatch but it is broken three more ways - Layer-1 wrong shift (asr#32 not lsl#2), Layer-2 R11 collision (loads fp-pointer from linear-memory base not a table), Layer-3 no .rodata func-pointer table + missing Thumb bit0 (blx UsageFaults on silicon). Fix: optimizer declines call_indirect (mirrors #120/#188) + per-table __synth_func_table_{0,1} arrays written directly with bit0=1 + movw/movt R12 base + bounds check. KEY for jess: the Thumb-bit (Layer-3) correctness is NOT decidable on unicorn, so the maintainer will HOLD the fix for jess's G474RE/RT1176 SILICON as the final gate even when the local differential is green - jess's connected Pixhawk 6X-RT (RT1176) is now the named silicon gate; maintainer will ping with an increment to flash against falcon-v1.56.fused.wasm. This unifies #275 Layer-0 with AFD-024 as one silent-drop contract violation (unlowerable op must Err, never continue).
    tags: [release-watch, synth, on-target]
    fields:
      detected-by: jess on-target diagnosis (synth arm backend) on falcon fused core
      severity: major
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002

  - id: AFD-009
    type: ai-found-defect
    title: kiln does not terminate on falcon run-position-hold (fused core)
    status: resolved
    description: "RESOLVED 2026-06-10 (loop iter#3): kiln#270 CLOSED by maintainer; reduced-repro diagnosis independently re-verified (kiln F32 3.131192207 == wasmtime 3.1311922 on reduced-200step.fused.wasm) and captured upstream as design-decision SM-PERF-001 (kiln PR #290). No correctness defect: the tree-walker is the QM reference/validation runtime, fuel-bounded since 0.3.1 (slow is bounded, never an unbounded hang); real-time embedded control is the synth native path (synth#275) by architecture. ORIGINAL RECLASSIFICATION 2026-06-06: NOT a correctness/non-termination bug. Reduced 200-step repro shows kiln terminates AND matches wasmtime (3.131192207 == 3.1311922). The 30000-step run-position-hold is finite-but-slow on kiln's tree-walker (>1B instructions), not infinite. Fuel-bounding (bug b) fixed in kiln 0.3.1 (#276), so it is now safe (--fuel traps). Implication for jess: the kiln interpreter is correct but too slow for large real-time control loops; real-time embedded needs synth native compilation (synth#275). kiln#270 (a) is a performance characteristic, not a correctness defect."
    tags: [release-watch, kiln, simulation, critical]
    fields:
      detected-by: jess meld->kiln differential sim vs wasmtime (source-built fused falcon)
      severity: major
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-004

