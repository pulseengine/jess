  - id: AFD-012
    type: ai-found-defect
    title: rivet 0.16.0 canonical status enum is breaking - no migration, drops 'accepted', misfits ai-found-defect
    status: open
    description: >
      Adopting rivet 0.16.0 flips the jess store from PASS (4 warnings) on 0.15.0 to FAIL (21 errors) with no artifact changes - all 21 are the new canonical status enum (PR #419 / #352): status values accepted (x12), open (x7), resolved (x2) are no longer allowed; the enum is [draft, proposed, approved, implemented, verified, released, deprecated, rejected]. Three friction points: (1) breaking with no migration path - a previously-valid store needs 21 manual edits; (2) 'accepted' was the documented terminal lifecycle state (draft->...->verified->accepted in rivet's own release/agent guidance) and is now gone; (3) one global document-lifecycle enum doesn't fit ai-found-defect, whose natural vocabulary is open/triaged/resolved/wontfix. Suggested: ship a status remap (rivet migrate / validate --fix) + documented mapping, reconcile 'accepted', and allow per-schema status enums. jess stays on rivet 0.15.0 for now to keep the store valid and defect semantics correct. Filed https://github.com/pulseengine/rivet/issues/522 - supervising. UPDATE 2026-06-10 (iter#4): maintainer triaged and confirmed all three points as independently actionable; at their request jess added an Acceptance-Criteria block to the issue for slice 2 (re-add 'accepted' to the canonical enum - clears 12 of 21 errors, one-line schema change), with slices 1 (rivet migrate / validate --fix) and 3 (per-schema defect status enum) scoped out for separate PRs. jess stays on 0.15.0 until at least slice 2 ships. UPDATE 2026-06-10 (iter#6): slice-2 draft PR rivet#525 verified PRE-MERGE against the jess store - built pr525 head 117e9c7 and ran validate: accepted errors 13 -> 0, remaining 13 are exactly the out-of-scope slice-3 vocabulary (open x7, resolved x6 on ai-found-defect). Posted the verification table on rivet#522 (issuecomment-4673352099); PR is parked as draft only on the pulseengine.eu blog 503 process gate. jess upgrades off 0.15.0 once slice 2 ships in a release.
    tags: [release-watch, rivet, schema, breaking]
    fields:
      detected-by: jess loop iter#3 (2026-06-10) - rivet 0.16.0 validate on the jess store
      severity: major
      triage-status: open
    links:
      - type: traces-to
        target: REQ-003

