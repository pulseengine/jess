  - id: AFD-008
    type: ai-found-defect
    title: synth arm backend compiles only exports not the reachable call graph
    status: open
    description: >
      synth arm backend compiles only exported functions, not the reachable call graph. falcon component gives 4 funcs; the meld-fused core (280 funcs) gives 24 funcs, ELF ~5KB. Internal cascade functions are absent, so the ELF cannot execute run-stabilization on-target (Renode/QEMU/hardware) - it runs fine in wasmtime and kiln where the whole module is present. Complete-firmware path is backend w2c2 plus --link (w2c2 + arm-none-eabi-gcc + kiln builtins), but w2c2 reports not installed. This is the real blocker for jess 0.2.0/0.3.0 on-target HIL, beyond Renode not being installed. Filed https://github.com/pulseengine/synth/issues/275 - supervising. UPDATE 2026-06-10 (loop iter#3): answered the maintainer's requested scoping input on the fused core - call_indirect count = 61, 2 funcref tables (15+34=49 slots), 187 funcs, 26 exports. This is the 'many' case the maintainer defined, confirming the blocker is the broken call_indirect DISPATCH (select_with_stack drop + R11 table-base collision), not a direct-call closure bug; reachability closure already fixed in v0.11.33. Comment synth#275 issuecomment-4667039061.
    tags: [release-watch, synth, on-target]
    fields:
      detected-by: jess on-target diagnosis (synth arm backend) on falcon fused core
      severity: major
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002

  - id: AFD-009
    type: ai-found-defect
    title: kiln does not terminate on falcon run-position-hold (fused core)
    status: resolved
    description: "RESOLVED 2026-06-10 (loop iter#3): kiln#270 CLOSED by maintainer; reduced-repro diagnosis independently re-verified (kiln F32 3.131192207 == wasmtime 3.1311922 on reduced-200step.fused.wasm) and captured upstream as design-decision SM-PERF-001 (kiln PR #290). No correctness defect: the tree-walker is the QM reference/validation runtime, fuel-bounded since 0.3.1 (slow is bounded, never an unbounded hang); real-time embedded control is the synth native path (synth#275) by architecture. ORIGINAL RECLASSIFICATION 2026-06-06: NOT a correctness/non-termination bug. Reduced 200-step repro shows kiln terminates AND matches wasmtime (3.131192207 == 3.1311922). The 30000-step run-position-hold is finite-but-slow on kiln's tree-walker (>1B instructions), not infinite. Fuel-bounding (bug b) fixed in kiln 0.3.1 (#276), so it is now safe (--fuel traps). Implication for jess: the kiln interpreter is correct but too slow for large real-time control loops; real-time embedded needs synth native compilation (synth#275). kiln#270 (a) is a performance characteristic, not a correctness defect."
    tags: [release-watch, kiln, simulation, critical]
    fields:
      detected-by: jess meld->kiln differential sim vs wasmtime (source-built fused falcon)
      severity: major
      triage-status: open
    links:
      - type: defect-against
        target: EXTERNALANCHOR-004

  - id: AFD-010
    type: ai-found-defect
    title: rivet lacks DO-178C and IEC 61508 schemas - DAL-A/SIL-4 not natively modelable
    status: open
    description: >
      jess targets DO-178C DAL-A + IEC 61508 SIL-4 + ISO 26262 ASIL-D. rivet models ASIL natively (safety-goal asil field) but has no DO-178C or IEC 61508 schema, so DAL-A/SIL-4 are recorded only in DD-005 + descriptions, not as typed checkable artifacts. Tracked upstream at rivet#102 (closed enhancement) - commented with jess's concrete pull. Workaround in place; revisit if the domain-schema packages land.
    tags: [rivet, safety, schema]
    fields:
      detected-by: jess bootstrap-verification (rivet 0.15.0 has 13 schemas, no DO-178C/IEC-61508)
      severity: minor
      triage-status: open
    links:
      - type: traces-to
        target: DD-005

  - id: AFD-011
    type: ai-found-defect
    title: rivet list --format json omits custom fields - release readiness not natively queryable
    status: resolved
    description: >
      RESOLVED 2026-06-10 (loop iter#3): fixed upstream via `rivet list --full` (REQ-211, PR #507), shipped in rivet v0.16.0. Verified on the jess store: `rivet list --format json --full | jq '.artifacts[] | select(.fields.release)'` returns all 53 release-tagged artifacts, and `rivet list --filter '(= release "vX")'` filters without --full. Confirmed on rivet#511 (issuecomment-4667096156); jess can drop the YAML-parsing burndown workaround. ORIGINAL: rivet list --format json did not include the artifact fields map, so a custom field like release could not be queried/grouped from the CLI - the per-release readiness burndown had to be built by parsing YAML. Filed https://github.com/pulseengine/rivet/issues/511.
    tags: [rivet, release-planning]
    fields:
      detected-by: jess release-planning (assigning the release field, building burndown)
      severity: minor
      triage-status: open
    links:
      - type: traces-to
        target: REQ-003

  - id: AFD-012
    type: ai-found-defect
    title: rivet 0.16.0 canonical status enum is breaking - no migration, drops 'accepted', misfits ai-found-defect
    status: open
    description: >
      Adopting rivet 0.16.0 flips the jess store from PASS (4 warnings) on 0.15.0 to FAIL (21 errors) with no artifact changes - all 21 are the new canonical status enum (PR #419 / #352): status values accepted (x12), open (x7), resolved (x2) are no longer allowed; the enum is [draft, proposed, approved, implemented, verified, released, deprecated, rejected]. Three friction points: (1) breaking with no migration path - a previously-valid store needs 21 manual edits; (2) 'accepted' was the documented terminal lifecycle state (draft->...->verified->accepted in rivet's own release/agent guidance) and is now gone; (3) one global document-lifecycle enum doesn't fit ai-found-defect, whose natural vocabulary is open/triaged/resolved/wontfix. Suggested: ship a status remap (rivet migrate / validate --fix) + documented mapping, reconcile 'accepted', and allow per-schema status enums. jess stays on rivet 0.15.0 for now to keep the store valid and defect semantics correct. Filed https://github.com/pulseengine/rivet/issues/522 - supervising.
    tags: [release-watch, rivet, schema, breaking]
    fields:
      detected-by: jess loop iter#3 (2026-06-10) - rivet 0.16.0 validate on the jess store
      severity: major
      triage-status: open
    links:
      - type: traces-to
        target: REQ-003
