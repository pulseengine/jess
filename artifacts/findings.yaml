      reduction only 0.1%. Reproducible. Upstream issue: TODO (file against
      pulseengine/loom).
    tags: [loom, optimizer, wasm, upstream]
    fields:
      severity: major
      triage-status: open
      detected-by: "jess bootstrap forward-chain experiment (loom v0.3.0 prebuilt) on falcon-flight-v1.26.wasm"
      discovered-at: "2026-06-04"
      notes: >
