      two suppliers; reported on gale#223, gale filed meld#370 + gale#266.
      *** BUT --emit-relocs IS THE EASY HALF AND IS ALREADY SOLVED *** (gale, on meld#370): the flag works,
      survives `wasm-tools component new` (2 reloc sections/component), and --address-rebase then accepts and
      rebases CORRECTLY with all segments disjoint. THE REAL BLOCKER IS REBASE GRANULARITY - meld rebases each
      component to its DECLARED linear-memory extent, which is PAGE-granular, and A WASM PAGE IS 64 KB.
      gale's measured matrix (3 components, STM32F100RB 8192 B SRAM): `--memory shared` (what ships) accepts
      SILENTLY with 4 OVERLAPPING data-segment pairs, .bss 2,688, FITS - and fits BECAUSE it overlaps;
      `shared --address-rebase` without relocs REJECTS; with relocs at 17 declared pages -> disjoint but .bss
      2,230,708 (272x over); with relocs shrunk to the 1-page wasm MINIMUM -> disjoint but .bss 133,556 (16x
      over). Actual used extent ~2,057 bytes. So the ONLY shippable build is the one that overlaps, and
      page-granular rebasing CANNOT be tuned to fit an MCU at any component count >= 1. gale's revised ask:
      rebase to each component's ACTUAL USED EXTENT (meld already knows it), or an opt-in --pack-rebase /
      --rebase-extent=used for targets that can prove static-offset-only addressing (meld#326 computed-pointer
      case is the soundness caveat).
      *** JESS'S OWN CONTRIBUTION - THE PER-CORE BUDGET *** from hardware/pixhawk6x-rt.aadl (jess owns the
      memory map, so only jess can state this): M7 = 256 KB DTCM + ~1.5 MB OCRAM; M4 = OCRAM; F100 = 8 KB SRAM.
      Applying the 64 KB-per-component floor:
        F100 (8 KB SRAM): ONE component needs 64 KB = 8x the ENTIRE SRAM. IMPOSSIBLE at any component count.
          Page-granular rebasing can NEVER serve the failsafe core.
        M7 DTCM (256 KB): gale-nano alone (1 component) = 64 KB FITS; but the fused flight set (5 cascade
          stages + gale-nano = 6 components) = 384 KB EXCEEDS DTCM.
