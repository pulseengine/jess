  - id: AFD-057
    type: ai-found-defect
    severity: major
    triage-status: closed
    detected-by: jess building the invocation harness AFD-056 showed was missing, 2026-09-02
    title: A FALCON CASCADE STAGE EXECUTES ON EMULATED RT1176 AND REPRODUCES RELAY'S SIL REFERENCE BIT-EXACT — first stage execution on this target; the embedder ABI is confirmed BY RESULT and the init tables are proven load-bearing
    status: resolved
    description: >
      2026-09-02. AFD-056 established that the self-contained image never enters a stage - it
      initialises and spins, and TEST-PIX-031's instruction count was satisfied by a memcpy. This
      is the harness that actually calls one, and the answer it returns is the point.
      *** rate@0.7.0#tick EXECUTED on emulated RT1176 Cortex-M7 (Renode 1.16.1) ***:
        tx      0x3F800000  = 1
        ty      0x3EF1EC81  = 0.472507507
        tz      0xBE168816  = -0.147003502
        thrust  0x3F000000  = 0.5
      BIT-EXACT against relay's SIL reference and against jess's own wasmtime differential. Four
      words, all four matching, on a completely different execution substrate.
      HOW: the DD-018 tcb-link pattern - a custom boot.S plus a synth --relocatable object. The
      harness enables the FPU, applies BOTH embedder obligations from AFD-051's extracted tables,
      establishes the registers, calls the stage, and parks the returned torque plus a completion
      sentinel at 0x20011000. Completion is asserted on the sentinel and on PC reaching the spin at
      0x52 (verified by disassembly to be `b.n 52`, the instruction after the sentinel store) -
      not on "it ran".
      *** THE EMBEDDER ABI IS NOW CONFIRMED BY RESULT, NOT ASSUMED ***. synth#1131 asked which
      register carries the linear-memory base. AFD-056 read the answer off synth's own reset
      handler and confirmed it at runtime: fp(r11)=0x20000000 base, sl(r10)=0x10000 size,
      r9=0x20010100 globals. This harness sets exactly those and gets the reference torque to the
      last bit. A wrong base does not produce a plausible-but-wrong number; it produces garbage. So
      the reading is now falsified-if-wrong rather than inferred. synth#1131 stays open for
      confirmation that this is the CONTRACT and not an artifact of the self-contained path.
      *** NC2 IS THE MOST VALUABLE PART: THE INIT TABLES ARE LOAD-BEARING ***. synth emits
      BYTE-IDENTICAL code with or without --embedder-data-init / --embedder-global-init, so nothing
      about the object can tell you whether the promises were kept. Building the same image with
      jess_init() short-circuited returns tx=ty=tz=thrust=0x00000000. That is the only available
      demonstration that AFD-051's 13 data segments and 12 R9 globals are necessary rather than
      ceremonial - and it passes.
      NC1: perturbing wy in the argument moves ty from 0x3EF1EC81 to 0x3F214856 while tx, tz and
      thrust hold. So the stage reads its argument; a constant-returning stage would have matched
      the reference forever.
      TWO TOOLING NOTES worth keeping: the export symbol contains ':' '@' and '#', and '@' begins a
      comment in ARM assembly, so a GCC __asm__ label truncates it mid-name ("garbage following
      instruction"). Renamed with objcopy --redefine-sym instead, and build.sh ASSERTS the rename
      landed rather than trusting it. Separately, Renode cannot drive this: setting cpu PC after a
      RunFor leaves the CPU neither halted nor advancing, and `cpu Step` does not move it either -
      which is why the harness is linked into the image rather than injected.
      NOT CLAIMED: this is RENODE, not silicon. One stage, one invocation, one input vector - not a
      soak, not the full cascade, and not a timing result. The composed application+cascade image
      remains blocked on meld#393.
    tags: [renode, rt1176, execution, sil-differential, embedder-abi, synth-1131, milestone]
    links:
      - type: traces-to
        target: REQ-PIX-021
      - type: traces-to
        target: DD-026

  - id: AFD-056
    type: ai-found-defect
    severity: critical
    triage-status: closed
    detected-by: jess pursuing the P06 shadow-stack measurement and finding there was no footprint to measure, 2026-09-02
    title: NO CASCADE STAGE EXECUTES IN THE COMMITTED RT1176 IMAGE — PC only ever takes two values, both in the reset path; the ">100k instructions" assertion is satisfied entirely by a memcpy. And synth's own reset handler ANSWERS synth#1131.
    status: resolved
    description: >
      2026-09-02. AFD-055 established that painting cannot measure this image's shadow stack.
      Pursuing the correct method - a flash-vs-RAM differential - produced a much larger result:
      THERE IS NO EXECUTION FOOTPRINT TO MEASURE, because the cascade never runs.
      *** THREE INDEPENDENT OBSERVATIONS, ALL AGREEING ***:
        (1) PC SAMPLED 120 TIMES across the run takes exactly TWO values: 0xa0 and 0x16c.
            0xa0 is inside the reset handler's 53,345-iteration byte-copy loop; 0x16c is the
            terminal spin. It NEVER reaches a stage entry - mixer#mix 0x17c, rate#tick 0x7a4,
            attitude#tick 0x1290, position#tick 0x1d6c, ekf#estimate 0x4ebc.
        (2) POST-RUN LINEAR MEMORY EQUALS THE INIT SOURCE BYTE-FOR-BYTE - 53,345 of 53,345,
            100.00%. Execution left no residue anywhere in linear memory.
        (3) THE ARM STACK IS UNTOUCHED - 0 of 512 probed bytes below the initial SP (AFD-055),
            and both uncovered linear-memory regions read entirely zero.
      *** WHAT THIS MEANS FOR TEST-PIX-031 ***: its ">100k instructions retired + PC inside .text"
      assertion is satisfied ENTIRELY by the copy loop plus the spin. 213,439 instructions is about
      what a 53,345-byte bytewise copy costs on its own. The assertion DOES discriminate "image
      booted" from "image faulted or never started" - that much is real and was worth having - but
      it does NOT discriminate "the cascade ran" from "the cascade never started", and the test's
      NAME said "Fused falcon cascade executes". Renamed to "...image RUNS ITS RESET PATH...", with
      the non-claim written into the header rather than left to be inferred.
      *** AND A CORRECTION OWED TO relay ***: jess offered "the image executes" as partial evidence
      for SWREQ-FALCON-OCI-P06 on 2026-09-02. That was too generous. The image boots and initialises;
      the cascade does not execute. P06 asks for the image under load, and there is currently no
      invocation at all. Corrected on relay#202 rather than left standing.
      *** CORRECTED 2026-09-03 (AFD-059): "synth's OWN RESET HANDLER ANSWERS synth#1131" IS THE
      WRONG FRAMING. *** synth has since published docs/embedder-abi-relocatable-arm.md and lists
      "reading the contract off the self-contained reset handler at all" as CATEGORY (c) INCIDENTAL -
      observed, guaranteed by nothing. The handler happens to agree with the relocatable contract for
      R9/R10/R11 today, but the same image also carries OPTIMIZED_LINMEM_BASE = 0x2000_0100, which is
      0x100 ABOVE that handler's R11. jess read one of two bases and got the right one. The values
      below are jess's own layout CHOICE (which the contract permits), not a derivation of the ABI.
      Retained as written because it is what was believed; read AFD-059 for the contract.
      *** THE FIND, correctly framed - the reset handler CORROBORATED an ABI jess then had to ask
      for ***. Disassembling the
      reset path to explain the PC values exposed the embedder register contract jess had asked
      synth to document, in synth's own generated code:
        0x80  r0 = 0x9cbc          init SOURCE
        0x88  r1 = 0x20000100      init DEST
        0x90  r2 = 53345           length
        0xc0  sl (r10) = 0x10000   linear-memory SIZE
        0xc8  fp (r11) = 0x20000000  LINEAR MEMORY BASE   <- the register #1131 asked about
        0xd0  r9 = 0x20010100      GLOBALS TABLE BASE     <- the documented one
        0xd8+ seeds the R9 table
      So `fp` carries the linear-memory base and `sl` its size. Reported on synth#1131 as DERIVED
      FROM THEIR OUTPUT, asking them to confirm it is the contract rather than an artifact of the
      self-contained path - the question was raised precisely to avoid encoding a guess.
      *** AFD-051 INDEPENDENTLY CORROBORATED ***: the reset handler seeds twelve globals whose
      values AND SLOT ORDER match jess's extractor exactly, compared like-for-like on the same
      module. An earlier comparison against the COMMITTED ELF showed the same twelve values in a
      DIFFERENT permutation, which would have meant the embedder-init table seeded every global into
      the wrong slot. It did not: the committed ELF is a different fusion. The mismatch was NOT
      reported as a defect because the like-for-like check was run first.
      *** ALSO CORRECTED ***: the robot documented the init source as flash 0x2ac8. That address
      holds ARM CODE. The real source is 0x9cbc, read from r0 at Reset_Handler+0x0 and confirmed by
      the 100% byte match. The wrong address stood in a file whose own header says it is the
      evidence cited upstream.
      NOT CLAIMED: none of this is a defect in synth, meld, loom or relay. The image is exactly what
      a self-contained lowering with no invocation harness should be. The defect is in what jess's
      oracle and jess's upstream reporting SAID about it.
    tags: [renode, vacuous-metric, test-pix-031, synth-1131, abi, relay-p06, self-correction]
    links:
