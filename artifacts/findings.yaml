  - id: AFD-034
    type: ai-found-defect
    title: meld fuse --reproducible output depends on the input file PATH (identical bytes at different paths -> different sha) - residual after the meld#325 UUID/timestamp fix
    status: resolved
    description: >
      Found 2026-07-11 (release-watch, meld v0.39.0). CONTEXT: meld#325 (fused output
      byte-nondeterministic) was CLOSED by `meld fuse --reproducible` (v0.38.0) - id from output
      content + timestamp from SOURCE_DATE_EPOCH instead of a random UUID + wall clock. VERIFIED
      the fix against the real falcon core: WITH --reproducible, two fusions of the same component
      at the SAME PATH are byte-identical (falcon-v1.112 -> 20bb33bc...); WITHOUT the flag they
      differ run-to-run. So the dominant nondeterminism (UUID/timestamp) IS gone. RESIDUAL found
      while verifying: --reproducible output still depends on the input file's full PATH - copy the
      byte-identical component to /tmp/pa/falcon.wasm and /tmp/pb/falcon.wasm and the two fusions
      produce DIFFERENT sha256 (f0cf6a82 vs 1cc0f5c2); same path -> identical; even same filename in
      a different directory differs. So something path-derived is embedded (a producers/source
      section, or the content hash seeding the attestation id is computed over a buffer that includes
      the source path). jess IMPACT: a PORTABLE / cross-machine attestation sha for the FIRST-FLASH
      fused core (REQ-PIX-018 re-verifiable attestation + sigil-signable image set + deterministic
      replay REQ-PIX-022) is not yet achievable - the scry gate therefore keeps keying on scry
      soundness invariants (version- and path-independent), not the fused sha. NOT URGENT (invariant
      gate is unaffected). Fix offered upstream: derive the id purely from module CONTENT (+
      SOURCE_DATE_EPOCH) and strip/normalize any embedded input path, so identical bytes -> identical
      output regardless of location. Filed meld#341 (follow-up to #325) with the exact repro; offered
      to test a fix against the real falcon core. jess side: tools/repro/fuse-repro-oracle.sh asserts
      the fixed-path guarantee (green) and reports the cross-path dependence as a diagnostic
      (TEST-PIX-026); scry-gate + chain-measure now fuse --reproducible to remove the random-UUID churn.
      RESOLVED 2026-07-21 (meld v0.41.3): meld#341 FIXED - re-verified against the real build, the
      SAME falcon-flight-v1.124 bytes at two different paths (/tmp/mp/a vs /tmp/mp/b) now fuse
      --reproducible to the IDENTICAL sha256 (615c8b49...). So `--reproducible` is now fully
      path-INDEPENDENT: identical CONTENT -> identical fused artifact regardless of location. This
      unblocks a PORTABLE / cross-machine attestation sha for the FIRST-FLASH fused core (the sigil
      rung of REQ-PIX-018 / DD-023). DONE 2026-07-22 (PR#156, f533ce4): CI MELD_VERSION bumped
      v0.39.0 -> v0.41.3 (meld#341-fixed) and tools/repro/fuse-repro-oracle.sh's cross-path check
      upgraded from a diagnostic to a hard ASSERTION - path-independence is now CI-gated (verified
      teeth: passes on v0.41.3, fails on v0.39.0). Remaining next rung: promote the path-independent
      reproducible fused sha to a sigil-signed portable attestation key on the FIRST-FLASH set.
    tags: [release-watch, meld, reproducibility, fused-core, determinism, attestation, on-target, resolved]
    fields:
      detected-by: jess release-watch (meld v0.39.0) verifying the #325 --reproducible fix against the real falcon-v1.112 core; found residual input-path dependence; filed meld#341; RESOLVED on meld v0.41.3 (path-independent, verified)
      severity: minor
      triage-status: resolved-upstream
