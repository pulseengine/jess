    title: AFD-047's CENTRAL CONCLUSION WAS WRONG - the clock was frozen by a STALE ARTIFACT jess's own script selected, not by gale; with the ticking HAL the wake FIRES on the first poll and the timer path works end to end
    status: resolved
    description: >
      2026-09-02. AFD-047 reported that on shipped gale-nano 0.7.0 the clock does not advance, that
      an armed wake never fires in 10,000 polls, and - the load-bearing error - that "gale's
      time::now() does NOT read through gust:hal/mmio". gale disproved the last claim by pointing at
