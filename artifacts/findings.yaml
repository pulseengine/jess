  - id: AFD-021
    type: ai-found-defect
    title: gale is models-only - no executor/spawn/wasm-host/AMP to host per-thread fused async components
    status: open
    description: >
      Found 2026-06-14 (iter#18) surveying gale for the per-thread-fused-async-
      component architecture (REQ-PIX-002/007, DD-009). gale provides verified
      MODELS (sched/thread/timer/timeout/msgq/pipe/mbox + symmetric SMP
      smp_state/cpu_mask/ipi) but NO executable substrate: no scheduler runtime,
      no thread spawn/dispatch (ThreadTracker::create only counts), no async
      executor/futures, no wasm host, and no hardware-capability WIT. The
      'gale hosts a wasm component' story is gale's research-stage Kiln path
      (docs/research/kiln-direct-rust-linking.md, all draft; no wit/ or
      gale-kiln crate yet). The M7/M4 split is AMP, which gale's symmetric SMP
      models do not address. ALSO recorded here (verdict): the wRPC reference
      crates are NOT embeddable (hard tokio+wasmtime, no no_std) - only the
      WIT-typed-contract + CM-value-encoding IDEA is reusable. Filed the gale
      capability epic https://github.com/pulseengine/gale/issues/63 (Kiln host
      path, spawn/dispatch, verified no_std executor, host/bus capability WIT,
      AMP core-pinning). ADDITIONAL HELP needed on the verified executor + the
      cache-coherent cross-core transport. Note the relay-IPC-reuse alternative
      (cFS SB + MAVLink, E2E-protected, over Zephyr ipc_service) may reduce the
