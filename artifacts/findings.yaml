  - id: AFD-084
    type: ai-found-defect
    title: the shipped binary reported SUCCESS for commands it never ran — mode flags were matched after `--`, and --self-test was green throughout because it never wraps a command carrying one
    status: open
    description: |-
      2026-09-05. Operator: "ensure we do the right testing similar to our other tools it might further
      evolve." Surveyed what the PulseEngine Rust tools actually do rather than guessing: rivet, loom,
      meld, synth, ordeal and sigil all carry a `tests/` integration directory plus in-crate `#[test]`
      units, run `cargo test --all` in CI, and gate on `cargo llvm-cov --fail-under-lines`. with-device
      had NONE of that - only its own `--self-test` subcommand.

      *** WHAT THE FIRST RUN OF THE NEW SUITE FOUND, IN THE SHIPPED BINARY ***
      with-device matched its mode flags across the ENTIRE argv, including everything after `--`. So a
      wrapped command containing a flag with-device also understands hijacked the invocation. Verified
      against the v0.7.0 RELEASE asset, not the working tree:
        $ with-device d --registry reg.yaml -- echo --version
        with-device 0.2.0                  <- printed its OWN version
        rc=0                               <- and reported SUCCESS
        $ with-device d --registry reg.yaml -- echo --status
          no claims                        <- printed its OWN status
        rc=0
        $ with-device d --registry reg.yaml -- ls -h
        <usage text>                       <- `-h` in the command opened its OWN help
      Affected: -h, --help, -V, --version, --status, --self-test anywhere in the wrapped command.
      SEVERITY. This is the tool's worst possible failure shape and the one it exists to prevent: a
      caller gets exit 0 for a command THAT NEVER RAN, with the device claimed and released around
      nothing. `with-device probe -- some-tool --version` in a version-check step, or any command
      carrying `-h`, silently does nothing and reports success. A gate wrapped this way is vacuous.
      FIX: split on `--` FIRST; mode flags are looked for only in the head. Everything after `--`
      belongs to the command and is never interpreted.

      *** WHY --self-test WAS GREEN THROUGHOUT, WHICH IS THE REAL LESSON ***
      The self-test wraps `sleep`, `true`, and `sh -c kill -9 $$`. None carries a flag with-device also
      understands, so the entire bug class sat outside every path it walks. It passed 5/5 on the
      release asset WHILE the binary was hijacking commands. An in-binary acceptance check can only
      ever assert the paths it happens to take; it is not a test suite, and treating it as one is how
      this shipped. AFD-083 recorded the same shape one layer up (a negative control that did not
      discriminate); this is that lesson applied to coverage rather than to a single control.

      *** THE SUITE ***: 35 tests. 18 unit over the now-extracted pure core (argument parsing,
      registry parsing, status rendering) and 17 behavioural in tests/cli.rs that spawn the real
      binary, because the properties that matter are PROCESS properties - what the kernel does with an
      flock when a holder is SIGKILLed, whether a refused claim ran anything, whether a blocked
      claimant is sitting on devices it is not using. Line coverage 96.81%, gated at 90 (a floor
      parked far under the real number passes no matter what rots).
      Structural change: src/lib.rs (testable core) + a thin src/main.rs. Previously everything was in
      main() where nothing but --self-test could reach it.

      *** TWO PROPERTIES NOW ASSERTED THAT NEVER WERE ***
        1. A BLOCKED CLAIMANT HOLDS NOTHING. AFD-083 identified no-hold-and-wait as the load-bearing
           deadlock mechanism, and --self-test does not check it. Now directly asserted: while a
           claimant waits on dev-b, a third party must still be able to claim dev-a.
        2. rc 3 MEANS NOTHING RAN. Asserted by the ABSENCE of a side effect (the refused command would
           touch a marker), not merely by the exit code.
      Also new: repeated device names must not self-block (`with-device d d -- cmd` - on BSD a second
      flock on the same fd succeeds, so this bug would be invisible on macOS and appear on Linux);
      partial failure leaves nothing claimed; --wait genuinely waits and genuinely gives up; a refused
      name creates no lock file; fail-closed with no registry; the holder record does not outlive the
      command.

      *** TWO BUGS IN MY OWN TESTS, both of which first LOOKED like tool bugs ***
        1. Readiness by polling with a real claim (`run(...) == 3`) RACES the holder: when the probe
           wins the lock, the HOLDER is the one refused, so the device is never held and the test
           fails for a reason unrelated to the tool. Replaced with a marker the holder touches after
           acquiring - observing the state without perturbing it.
        2. The test scratch dir was named with `{:?}` of ThreadId, which renders `ThreadId(12)`. Those
           parentheses are shell syntax, so every `sh -c` holder died at parse time and surfaced as
           "holder never acquired" - pointing at the tool. Now shell-safe by construction and asserted
           as such.
      No flakes across 6 consecutive full runs.

      *** RELEASE CONSEQUENCE ***: v0.7.0 / with-device 0.2.0 carries the hijack bug and its assets
      were already recommended for pinning to varve#130 and gale#356. Superseded by 0.2.1; both
      threads corrected rather than left standing.
    tags: [bench, with-device, testing, vacuous-check, self-correction, cli, release, afd-083, afd-082]
    fields:
      detected-by: the first run of the new cargo test suite, 2026-09-05
      severity: critical
      triage-status: confirmed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T11:32:11Z
    links:
      - type: corrects
        target: AFD-083

  - id: AFD-085
    type: ai-found-defect
    title: "jess's release was unsignable and therefore un-ingestable: varve's deposit is fail-closed on a cosign-signed SHA256SUMS, and v0.7.0 published neither signature nor provenance nor SBOM"
    status: open
    description: |-
      2026-09-05. Operator: "check also with the other releases as other stuff is also needed sign and
      so." Audited jess's release workflow against the org's shared pattern (synth / loom / ordeal /
      rivet / spar / sigil). jess's had FOUR of the six phases missing, and one of the gaps makes the
      whole varve ask unfulfillable.

      *** THE FINDING THAT MATTERS: jess v0.7.0 COULD NOT HAVE BEEN INGESTED BY VARVE AT ALL ***
      ordeal's release.yml says it in its own comment: "varve's deposit workflow consumes exactly this,
      FAIL-CLOSED" - "this" being SHA256SUMS.txt plus its cosign bundle. varve's README confirms the
      consumer side: it fetches SHA256SUMS.txt AND SHA256SUMS.txt.cosign.bundle and cosign-verifies
      before extracting anything.
      jess v0.7.0 published NEITHER. So the varve#130 request - "here are the digests, please pin" -
      was unfulfillable on its own terms, and I did not know that when I made it. I had reasoned that
      the blocker was "it is a script, not a binary", fixed exactly that, and declared the objection
      gone. The actual blocker was one layer past where I stopped looking. A plain SHA256SUMS.txt is
      not a supply-chain control: an attacker who can replace an asset can replace the checksum file
      beside it. That is why the org signs the manifest, and why the consumer refuses without it.

      *** WHAT WAS MISSING, now added, matching the org phase order exactly ***
        1. permissions: id-token: write + attestations: write   (absent - keyless signing impossible)
        2. CycloneDX SBOM, generated BEFORE the checksums so its digest lands in the manifest and the
           signature transitively covers it                     (absent)
        3. SHA256SUMS.txt                                        (present, but see below)
        4. SLSA v1 build provenance via actions/attest-build-provenance, keyless, Rekor-recorded
                                                                 (absent)
        5. cosign sign-blob over SHA256SUMS.txt -> .cosign.bundle + .sig + .pem
                                                                 (absent - THE fail-closed gap)
        6. publish                                               (present)
      Also aligned: `sha256sum ./*` rather than `sha256sum *.tar.gz`. The `./` prefix is not cosmetic -
      varve's documented consumer greps for `" ./<asset>$"`, so the un-prefixed manifest jess published
      would not have matched even had it been signed.

      *** WHAT JESS ADDS THAT THE ORG PATTERN DOES NOT HAVE ***
      A `verify` job that re-downloads the PUBLISHED release into a clean runner and checks it the way
      a consumer would: cosign verify-blob bound to this workflow's identity; `sha256sum -c` with NO
      --ignore-missing (a dropped asset must fail, not pass quietly); an assertion that the manifest
      actually covers all four targets and the SBOM; `gh attestation verify` per archive; and finally
      EXECUTING the linux x86_64 binary. "cosign sign-blob exited 0" and "the published release
      verifies" are different claims - they diverge whenever the wrong file was signed, an asset was
      clobbered after signing, or an upload dropped the bundle. Only the second is evidence. This is
      the same distinction as AFD-084 (--self-test green while the binary was broken), applied to
      release plumbing.

      *** THE aarch64-linux GAP IS CLOSED RATHER THAN DOCUMENTED ***
      v0.7.0 cross-built aarch64-unknown-linux-gnu and SKIPPED its self-test, shipping the Raspberry Pi
      target unexecuted. I had written that caveat into the workflow, the release notes and two
      upstream issues, which is honest but is not a fix. jess is a PUBLIC repo, so `ubuntu-24.04-arm`
      runners are free: the target is now built and fully tested on a host that executes it. All four
      assets now have their own test suite run on matching hardware. Writing the caveat down three
      times was easier than removing it, and I did the easy thing first.
    tags: [release, supply-chain, cosign, slsa, sbom, varve, with-device, afd-084, self-correction]
    fields:
      detected-by: auditing jess's release.yml against the org shared pattern at the operator's prompt, 2026-09-05
      severity: major
      triage-status: confirmed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T11:44:14Z
    links:
      - type: corrects
        target: AFD-084

  - id: AFD-086
    type: ai-found-defect
    title: "H1 UNBLOCKED on Linux: the RT1176 ROM answers stock sdphost and the replies are not echoes — but no memory has been read yet, and three of my hypotheses were wrong (one self-inflicted)"
    status: open
    description: |-
      2026-09-05. Operator moved the Pixhawk to a Raspberry Pi 4 (fourpi, Debian 13 trixie, aarch64)
      and said ssh should work. It did - as pi@fourpi.local; the .box name does not resolve from the
      Mac, mDNS .local does. This tick is the H1 retest on Linux, and the AFD-080 blocker IS BROKEN.

      *** THE RESULT: THE RT1176 ROM ANSWERS ON LINUX ***
      Every step that failed on macOS now works, and the evidence is the wire log, not an exit code:
        TX-CMD: ReadStatus                             RX-PACKET: Response: 0x000C00A0
        TX-CMD: Read(address=0x00200000, length=16)    RX-PACKET: Response: 0x000000A0
        TX-CMD: Read(address=0x20240000, length=16)    RX-PACKET: Response: 0x000C00A0
      The responses VARY between commands and contain NONE of the addresses sent. That is the exact
      discriminator AFD-082 needed and failed: on macOS the "reply" was this session's own command
      echoed back, containing my own address and count. It is not an echo this time.
      STOCK TOOLING, NO BYPASS: `sdphost -u 0x1fc9,0x013d error-status` returns a PARSED response
      ("Status (HAB mode) = UNKNOWN ERROR"), not "No devices found". Plain spsdk 3.11 on Linux finds
      and talks to the ROM.
      ROOT CAUSE OF THE MACOS FAILURE, now understood from both sides: the ROM presents interface
      class 0x03 (HID) with 1021-byte endpoints (ep 0x81 IN / 0x02 OUT). macOS binds class 0x03 to
      IOHIDDevice, so libusb can never claim it. Linux lets the driver be detached - and, more
      importantly, spsdk does not need libusb at all: it enumerates via libusbsio HIDAPI_Enumerate()
      over /dev/hidraw0.

      *** H1 IS NOT DONE, AND THE HONEST BOUNDARY MATTERS ***
      The channel opens and the device responds, but NO MEMORY HAS BEEN READ. Every sdp.read() returns
      None, and the HAB status decodes as "UNKNOWN ERROR" rather than either documented code
      (0x12343412 closed / 0x56787856 open). So the blocker MOVED from "cannot communicate at all" to
      "communicates, but reads return no data". Claiming H1 complete here would be the same error as
      claiming it on the macOS echo.
      Two open leads, neither verified: (a) the USB product string is "SE Blank RT Family" - SE as in
      EdgeLock secure enclave - and such a part may refuse SDP reads by policy; (b) originally recorded here as
      "spsdk 3.11's read-register CLI is broken, COUNT defaults to None". THAT WAS WRONG AND IS
      WITHDRAWN. Reading spsdk/apps/sdphost.py settles it:
          response = sdp.read_safe(address, count, item_length)
          if not response:
              raise SPSDKAppError(f"Error: invalid sub-command or arguments 'read-register ...'")
      The message is NOT a CLI parse error. It is raised when the READ RETURNS NOTHING, and spsdk
      blames the arguments for an empty device response. read-register was failing for exactly the
      same reason the API path was - no data came back - so it is one symptom, not two, and the CLI
      is not defective. I nearly filed an upstream bug on this; checking the supplier's source before
      reporting is what stopped it, and it is the third hypothesis of mine this session that the
      evidence killed. What IS worth reporting upstream is much smaller: a misleading error message
      that names the wrong cause and would send anyone else down the same path.

      *** FOUR WRONG HYPOTHESES I HELD ALONG THE WAY, ALL FALSIFIED BY MEASUREMENT ***
        1. "spsdk has no USB ids for RT117x, so the family filter matches nothing." The RT117x
           database.yaml files genuinely carry no vid/pid while mimxrt1010/1040/1189/595s do, so this
           looked airtight. It is wrong: NXPUSBDeviceFilter.compare() on the real record returns True.
        2. "vars(dev) returns an unusable ctypes object, so enumerate() drops it." Also wrong -
           vars(dev) is a clean dict with vendor_id, product_id, path, the lot.
        3. "spsdk's read-register CLI is broken." Wrong - see above; it is the same no-data symptom
           wearing a misleading error message.
        4. The real cause of every "No devices found" I saw was SELF-INFLICTED: my first script
           detached the kernel HID driver via pyusb to prove libusb could claim it. That succeeded -
           and made the device invisible to hidapi, which is what spsdk actually uses. I then spent
           three rounds diagnosing spsdk for a hole I had dug. Re-attaching the driver made stock
           sdphost work immediately.
           LESSON: a diagnostic that MUTATES the system under test becomes part of the system under
           test. The detach was a legitimate experiment; leaving it in place while testing something
           else turned it into an uncontrolled variable, and I read the result as a property of spsdk.

      *** THE BENCH IS NOW REAL, AND with-device WAS CONSUMED AS A CONSUMER WOULD ***
      Installed on the Pi from the v0.7.1 release the way an outside user would: fetched cosign,
      verified the SIGNATURE over SHA256SUMS.txt before trusting the checksums, checked the digests,
      extracted, ran. Result: Verified OK, digests OK, and --self-test 5/5 PASS on REAL aarch64
      hardware. That closes the thread AFD-085 opened - the Pi target had been built on a GitHub arm
      runner but never run on an actual Pi. It has now.
      Host-local registry written at ~/.config/pulseengine/bench-devices.yaml, because a claim is
      host-local by construction and jess's committed devices.yaml describes the Mac's /dev/cu.* paths.

      *** A SECOND TARGET NOBODY KNEW WAS THERE: REAL STM32F100 SILICON ***
      The Pi also has an ST-LINK/V1 (0483:3744). The operator identified the target as an STM32F100;
      read out over SWD (halted, then resumed):
        DBGMCU_IDCODE 0x10016420  -> DEV_ID 0x420, STM32F100 value line
        CPUID         0x411FC231  -> ARM Cortex-M3 r1p1
        flash size    128 KB       initial MSP 0x20002000 -> 8 KB SRAM
        unique id     05e12d35 30553130 43191e14
      128 KB flash / 8 KB SRAM / Cortex-M3 with an onboard ST-LINK/V1 is an STM32VLDISCOVERY - and it
      is THE SAME PART as the Pixhawk 6X-RT's IO coprocessor. TEST-PIX-028 (gust F100/M3 byte-exact
      pass-through, REQ-PIX-004 PART-P02) has only ever run in Renode; this is a standalone target for
      it on real silicon with ZERO flight risk, shared with gale. Registered as `stlink-v1`, NOT as
      `stlink-v3`: the V3 (003B001A3235511337333439) is a different probe on the Mac, and reusing its
      name would be a lock whose name does not match the hardware - AFD-082's vacuous lock in a new
      costume. Caveat recorded: V1J13S0 firmware is HLA-only (openocd needs interface/stlink-hla.cfg
      and says so itself), nSRST is not wired, and with HLA a memory read on a RUNNING target returns
      nothing at all rather than erroring - which reads exactly like a dead probe.

      *** BOARD HEALTH ***: four ISP entries this session, ZERO flash writes, every SDP command
      read-only. The board returned to normal PX4 each time (once via the PX4 bootloader for ~3 s,
      which is expected). Verified healthy at the end over the MAVLink shell: PX4 1.15.4, NuttX
      11.0.0, MCU i.MX RT1170 rB0. Everything ran under a with-device claim on pixhawk-6xrt.
    tags: [h1, silicon, sdp, linux, pi, afd-080, afd-082, stm32f100, bench, with-device, self-correction]
    fields:
      detected-by: jess retesting H1 on the Raspberry Pi after the operator moved the vehicle, 2026-09-05
      severity: major
      triage-status: confirmed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T14:06:12Z
    links:
      - type: corrects
        target: AFD-080

  - id: AFD-088
    type: ai-found-defect
    title: "TEST-PIX-028's 'on-target' M3 rung is green about a machine that cannot exist: the image needs 64 KB SRAM with its stack at 0x20020000, and the real STM32F100 has 8 KB"
    status: open
    description: |-
      2026-09-05. Operator, on being told the Pi bench has a real STM32F100: "possibly this should
      improve our renode work as well." It did, immediately, and not in the way I expected - the first
      thing real silicon bought was not a new capability but the falsification of an existing claim.

      *** THE FINDING: TEST-PIX-028 IS GREEN ABOUT A MACHINE THAT CANNOT EXIST ***
      TEST-PIX-028 runs hardware/renode/gust-m3/passthrough_mem.elf on hardware/renode/gust-m3/m3.repl
      and is cited as the ON-TARGET execution rung for REQ-PIX-004 PART-P02 - the gust F100 failsafe
      core, i.e. the Pixhawk 6X-RT's real STM32F100 IO coprocessor. It is wired into CI's renode-smoke
      job and has been green since 2026-07-22.
      m3.repl declares 256 KB of SRAM at 0x20000000. The real part has 8 KB. Measured off actual
      STM32F100 silicon today (STM32VLDISCOVERY on the Pi bench, read over SWD, halted then resumed):
          DBGMCU_IDCODE 0x10016420  -> DEV_ID 0x420, STM32F100 value line
          flash size    0x1FFFF7E0  -> 0x0080 = 128 KB
          initial MSP   0x20002000              => 8 KB SRAM, top at 0x20002000
      Checked the image against that real geometry:
          initial MSP   0x20020000   OUTSIDE physical SRAM - the FIRST stack push faults on silicon
          SRAM segment  0x20000000 + 0x10000 = 0x20010000   OVERFLOWS 8 KB by 57,344 bytes
      The image wants 64 KB of RAM and puts its stack 128 KB above the SRAM base. The target part has
      8 KB. This firmware cannot run on the hardware the test is evidence about, and it never could
      have. The oracle is green because the EMULATOR IS MORE GENEROUS THAN THE TARGET.

      *** WHY THIS IS THE INTERESTING SHAPE OF VACUOUS EVIDENCE ***
      The campaign has repeatedly found gates that assert nothing. This one asserts something real -
      the pass-through IS byte-exact, the asymmetric rotor-out zeros DO survive un-re-mixed, and that
      result is genuine Cortex-M3 semantics. What does not transfer is the word ON-TARGET. An emulator
      configured more permissively than the part does not fail the way the part fails; it passes. So
      the failure mode is not "the check is empty" but "the check is about the wrong machine", and
      that is harder to see precisely because the result it reports is true.
      IN FAIRNESS: neither m3.repl nor TEST-PIX-028 ever claimed exact-part fidelity - both say
      "STM32F100-class". The defect is not a lie in the model, it is the inferential step from
      "class" to "the F100 failsafe core" in a requirement's verification chain. A synthetic platform
      is a fine place to prove ISA semantics; it is not evidence that the image fits the silicon.

      *** THE GATE, so this cannot regress or be argued about ***
      hardware/renode/gust-m3/check-fits-real-f100.sh asserts the image against the MEASURED geometry
      (8 KB SRAM at 0x20000000, 128 KB flash): initial MSP inside physical SRAM, and every SRAM LOAD
      segment fitting 8 KB. It exits 1 today, by design - that is the honest state, and it is a
      mechanical check rather than a paragraph anyone has to believe.

      *** WHAT THIS DOES NOT SAY ***
      It does not say gust is wrong, or that the pass-through logic is wrong - the byte-exactness
      result stands on its own as an ISA-level claim. It does not say Renode is defective: a synthetic
      platform is exactly what Renode is for, and m3.repl is honest about being one. It says the V for
      REQ-PIX-004 PART-P02 does not currently close on the target, and the artifact spine should say
      so rather than counting an emulated 256 KB machine as the on-target rung.

      *** WHAT WOULD ACTUALLY CLOSE IT ***
        1. Rebuild the pass-through for the real geometry (8 KB SRAM, stack inside it). If synth
           cannot yet emit an image that small, THAT is the finding and belongs upstream with numbers.
        2. Re-run TEST-PIX-028 against a real-geometry Renode platform, so the emulated rung stops
           being more permissive than the silicon.
        3. Then run the same image on the STM32VLDISCOVERY over SWD and diff it against Renode - the
           bench now has the part, so the emulator need not be the only witness. That third rung is
           what the operator's remark was actually pointing at, and it is only reachable because the
           first two now have a number attached.
      NOTE the VLDISCOVERY currently has other firmware on it (flash@0x08000000 =
      20002000 08000401 08000ad5 080013d7), so step 3 means erasing someone's board - operator
      consent first, and it is not the vehicle.
    tags: [renode, gust, f100, cortex-m3, test-pix-028, req-pix-004, on-target, emulator-fidelity, vacuous-evidence, silicon]
    fields:
      detected-by: comparing the Renode M3 platform against STM32F100 silicon read on the Pi bench, 2026-09-05
      severity: major
      triage-status: confirmed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T14:15:37Z
    links:
      - type: defect-against
        target: TEST-PIX-028

  - id: AFD-090
    type: ai-found-defect
    title: jess bypassed its own bench-claim rule five times in one session — every one of them mid-debugging, which is when the rule matters most; made assertable rather than remembered
    status: open
    description: |-
      2026-09-05. Operator: "Ensure once you use the tooling to ensure you use with device." An honest
      audit of the Pi session says I did not, five times.

      *** THE AUDIT ***
        CLAIMED (correct):   the read-only telemetry capture; both openocd F100 identifications; all
                             four h1-*.sh ISP runs; the registry parse checks.
        CLAIM-FREE (fine):   lsusb, /dev/serial listing, ROM presence polling, post-ISP state checks -
                             these are explicitly claim-free under the devices.yaml rule.
        *** NOT CLAIMED, AND SHOULD HAVE BEEN ***
          1. the pyusb kernel-driver re-attach        -> opened 1fc9:013d directly
          2. plain `sdphost error-status`             -> opened the ROM
          3. UsbDevice.scan filter comparison         -> enumerated and opened
          4. read-register argument-form attempts     -> opened the ROM, 4 invocations
          5. HIDAPI_Enumerate probing                 -> opened the device

      *** THE PATTERN, WHICH IS THE ACTUAL FINDING ***
      Every single violation happened during the debugging spiral - the stretch where I was cycling
      hypotheses about why spsdk could not see the device. Not one happened while doing the planned
      work, where I claimed correctly every time. The rule did not fail because it was unclear or
      disagreed with; it failed because attention was entirely on the bug. That is the general case:
      a discipline that depends on remembering it holds exactly until the moment something goes wrong,
      which is the moment it is most needed. jess built with-device precisely to stop two agents
      silently colliding, then bypassed it while distracted. Promising to try harder is not a fix.

      *** THE FIX: MAKE IT ASSERTABLE, NOT REMEMBERED ***
      with-device 0.2.2 exports WITH_DEVICE_CLAIM into the wrapped command - the sorted, deduplicated
      device list held for that command's lifetime. Any script can then assert its own precondition:
          with-device --require-claim pixhawk-6xrt
          -> exits 2 with: NOT UNDER A CLAIM for pixhawk-6xrt. ... Re-run as: with-device ...
      Nesting UNIONS rather than overwrites, so `with-device a -- with-device b -- cmd` leaves cmd able
      to assert either; without that, a script that legitimately wraps another would fail its own
      assertion. 40 tests (20 unit + 20 behavioural). The behavioural ones cover the exported value
      being sorted and deduped, --require-claim passing inside a claim, failing outside it, and -
      the case that matters - FAILING WHEN THE CLAIM IS ON A DIFFERENT DEVICE, because holding
      something is not holding the thing you are about to drive.
      This does not retroactively make the five unclaimed accesses safe. gale was not on the bench at
      the time so no collision is known to have occurred, but none of them had any protection against
      one, which is worth stating rather than assuming away.
