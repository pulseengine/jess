  - id: AFD-028
    type: ai-found-defect
    title: synth --safety-bounds is a NO-OP on the optimized path (main i32/i64 memory access) - flight bounds-safety hole
    status: open
    description: >
      Surfaced 2026-06-19 (iter#38) by the synth maintainer (synth#377) while
      answering jess's question about pinning --safety-bounds for the falcon flight
      build. Per-path behavior verified: on the OPTIMIZED path (the bulk of a flight
      loop - i32/i64 loads/stores) --safety-bounds {none,mpu,software} emit
      BYTE-IDENTICAL code (movw/movt/add/str) with NO inline bounds check and NO MPU
      programming - `software` is a no-op there; `mpu` programs zero MPU regions (it
      only writes a .safety-manifest.json the codegen never enforces). Inline checks
      are emitted ONLY via the direct selector (the declined ops: bulk-mem #374,
      i64 #372, floats). So #374's bulk-mem traps correctly (inline UDF), but the
      main memory path is unprotected. Impact for jess: pinning --safety-bounds
      software on the falcon M7 firmware would give a FALSE sense of memory-safety -
      it protects only decline-path ops, not the primary load/store path; `mpu` is
      worse (looks enforced, isn't). jess's posture (DD-006 maximal-wasm + the gust
      TCB boundary): hardware-MPU enforcement of the wasm linear-memory region
      belongs in the NATIVE TRUSTED BASE (a register/MMIO concern owned by gale's
      verified primitives), with synth's inline bounds as defense-in-depth - so for
      jess `software` was intended as belt-and-suspenders, NOT the sole mechanism.
      But #377 means jess must (a) NOT treat synth bounds as load-bearing on the main
      path, and (b) confirm/own MPU programming of the linear-memory region in the
      native base. RESOLVED-(b) iter#43: gale provides a VERIFIED MPU primitive
      (gale/src/mpu.rs + mem_domain.rs + mmu.rs, Verus/Rocq-proven) - so the native
      trusted base (gale-maximal-wasm, DD-017) DOES own MPU enforcement of the
      linear-memory region; synth's --safety-bounds stays defense-in-depth only, as
      the DD-006 posture held. So the flight memory-safety guarantee = gale's MPU
      (verified), not synth bounds. Tracking https://github.com/pulseengine/synth/issues/377;
      scoping with the maintainer. Suggested: synth should either emit real inline
      checks on the optimized path under `software`, or program real MPU regions
      under `mpu`, or clearly document that bounds enforcement is the embedder's
      (native base's) responsibility so `software`/`mpu` aren't mistaken for
      enforcement.
