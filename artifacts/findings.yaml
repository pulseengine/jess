  - id: AFD-073
    type: ai-found-defect
    title: The CI step named 'pinned toolchain' did not enforce it — an off-pin build exits 0, so the gate would have gone green on the wrong toolchain
    status: resolved
    description: |-
      2026-09-04. Follow-up to AFD-072, found by chasing a SECONDARY observation in the clean-room report
      rather than only its headline defects. C3 noted in passing that ON-PIN/OFF-PIN was "banner-only: an
      off-pin meld/loom never fails the build". Verified: an off-pin build exits 0.
      *** THE CONSEQUENCE ***: the CI step is NAMED "build the cascade image (pinned toolchain, fetched)"
      and nothing made that true. If the fetched binaries were ever a different version - a changed pin, a
      changed release, a tampered fetch - the gate would have gone GREEN with an OFF-PIN banner in the log
      that nobody reads. A step whose name asserts something no check enforces is the unearned-green class
      this campaign keeps finding, and it had just been promoted to a gate.
      *** FIX ***: REQUIRE_ON_PIN=1 turns an off-pin toolchain from a printed warning into a hard failure,
      and CI sets it. It covers all four off-pin paths: a non-executable override, a digest matching no
      pin, a digest matching a FOREIGN-PLATFORM pin, and the synth off-pin branch. Local release-watch
      deliberately leaves it unset, because testing a candidate toolchain is exactly what off-pin mode
      exists for (AFD-066, AFD-069) - the flag makes CI strict without taking that away.
      *** CONTROLS, all three observed ***:
        off-pin loom + REQUIRE_ON_PIN=1   -> rc=1, "REQUIRE_ON_PIN is set and loom is off-pin"
        off-pin loom, flag unset          -> rc=0, banner only (release-watch preserved)
        pinned meld+loom + flag           -> rc=0, ON-PIN
      *** THE GENERAL LESSON ***: the clean-room's asides are worth verifying, not just its findings. This
      one read as a minor "FYI, banner-only" next to three reproducible defects, and it was the same
      defect class one level up - a claim in a name with no check behind it.
    tags: [unearned-green, ci-gate, on-pin, toolchain-pinning, clean-room-aside, self-correction]
    fields:
      detected-by: jess verifying a secondary observation in the AFD-072 clean-room report, 2026-09-04
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-04T11:11:18Z

  - id: AFD-074
    type: ai-found-defect
    title: "'The oracles are a CI gate' covered 2 of 16 — NINE are never run in CI, and jess's first audit of that was itself vacuous (basename matching)"
    status: resolved
    description: |-
      2026-09-04. AFD-071 put the two cascade oracles into CI and that was reported as closing AFD-064 D4
      ("none of the on-target oracles run in CI"). AN EXACT-PATH AUDIT OF ci.yml SHOWS IT DID NOT.
      *** MEASURED ***: of 16 runnable oracle scripts in the repo, ci.yml invokes 5 by path. NINE ARE
      NEVER RUN IN CI AT ALL - verified by checking, for each, whether any CI-invoked script calls it:
        NEVER RUN   tools/appcompose/build-and-verify.sh     the composed wasm stack (AFD-044)
        NEVER RUN   tools/dispatch/run.sh                    the dispatch contract (AFD-067)
        NEVER RUN   tools/flight-loop/run.sh                 DD-025 flight loop
        NEVER RUN   tools/timer-probe/run.sh                 the clock behaviour DD-025 rests on
        NEVER RUN   tools/fusion-matrix/run.sh               every meld memory strategy
        NEVER RUN   tools/gust/passthrough-oracle.sh
        NEVER RUN   hardware/renode/tcb-link/run-oracle.sh
        NEVER RUN   hardware/renode/stack-highwater/run-oracle.sh
        NEVER RUN   hardware/renode/vehicle/run-vehicle-multinode.sh
      Only tools/embedder-init/run.sh runs TRANSITIVELY, via cascade-invoke/build.sh.
      So "the on-target oracles are a CI gate" was true and much narrower than it sounded: most
      COMPONENT-LEVEL claims in this campaign still rest on hand-run evidence.
      *** MY FIRST AUDIT OF THIS WAS ITSELF VACUOUS, and that is the more useful half of the finding ***.
      It tested `grep -q "$(basename $f)" ci.yml`, which reports IN CI for every file named run.sh or
      run-oracle.sh because ci.yml contains those basenames for DIFFERENT files. It cheerfully reported
      tools/dispatch/run.sh and hardware/renode/tcb-link/run-oracle.sh as covered when neither is. A
      coverage audit that matches on a generic basename measures nothing. Caught by re-running it against
      FULL PATHS, which flipped the answer for 5 of 16 entries.
      *** FIX ***: a `component-oracles` CI job running the four wasmtime-level oracles that need no
      Renode - appcompose (AFD-044), dispatch (AFD-067), flight-loop and timer-probe. Dependencies are
      installed PINNED TO THE LOCAL VERSIONS (wasm-tools 1.245.1, wac 0.10.1, wasmtime 42.0.1) so CI and
      local are not silently different toolchains, and a PREFLIGHT asserts the whole set before any work -
      the AFD-072 lesson about discovering missing tools one at a time.
      *** DELIBERATELY NOT INCLUDED, and named rather than left implicit ***:
        - tools/fusion-matrix/run.sh invokes `varve run` directly and has NO MELD/LOOM/SYNTH override, so
          it cannot run without varve on the runner. It needs the AFD-069 override treatment first.
        - The three remaining Renode oracles (tcb-link, stack-highwater, vehicle) each need their own
          setup; they stay local-only for now and are still an open gap, not a closed one.
      So this narrows the gap from 9 to 5; it does not close it. Stating the residual explicitly because
      AFD-071 was read as closing more than it did, and that is exactly how this recurs.
    tags: [ci-coverage, vacuous-audit, afd-064-d4, hand-run-evidence, component-oracles, self-correction]
    fields:
