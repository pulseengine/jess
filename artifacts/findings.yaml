  - id: AFD-079
    type: ai-found-defect
    title: "H1 is now executable: the prompt's recipe skipped the flashloader, ISP entry is software not surgery, and the SWD route is blocked on a cable — runbook is read-only by default with every guard observed firing"
    status: resolved
    description: |-
      2026-09-05. The Pixhawk 6X-RT was attached this tick (PX4 FMU v6XRT.x, idVendor 13891, streaming
      76,010 B of MAVLink in 6 s on /dev/cu.usbmodem01). H1 is the first incomplete rung. Researched the
      actual procedure rather than executing the one written in the loop prompt, and it was wrong in one
      place and right in another - in both cases the source that settled it was the tool's own data, not a
      forum.
      *** THE PROMPT'S H1 RECIPE IS INCOMPLETE ***: it says nxpdevscan -> blhost get-property 1 -> ...
      For this part that skips a required step. spsdk's OWN device database for mimxrt1176 declares:
        isp: rom:         protocol: sdp    usb 0x1FC9:0x013D
             flashloader: protocol: mboot  usb 0x15A2:0x0073
      So the ROM speaks SDP and blhost/mboot is reachable only after a flashloader is loaded into OCRAM.
      blhost's write-memory / call / read-memory - exactly the H1 shape - therefore need that binary.
      NXP community posts claim the opposite ("from RT11XX discard sdphost, just use blhost"). The
      database and the forum disagree; the FIRST read-only nxpdevscan in ISP settles it by VID:PID before
      anything is written, so the runbook does not need the question resolved in advance.
      *** ISP ENTRY IS SOFTWARE ON THIS BOARD, which reverses jess's earlier advice ***: PX4's v6xrt
      bootloader doc gives QGroundControl -> Analyze Tools -> MAVLink Console -> `reboot -i`. No
      disassembly. The BOOT button inside the FMUM module is the BRICKED-board fallback, not the normal
      path. Recovery is documented: BOOT button + reflash px4_fmu-v6xrt_bootloader.bin to 0x30000000 via
      MCUXpresso Secure Provisioning Tool. So the downside is bounded and reversible.
      *** THE SWD ROUTE IS BLOCKED ON HARDWARE, which also reverses jess's earlier preference ***: the
      6X-RT does expose SWD (JST SM10B Pixhawk Debug Full: SWDIO pin 4, SWCLK pin 5, nRST pin 9), and
      pyocd has BUILT-IN mimxrt1170_cm7/cm4 targets - but PX4 states an ST-Link "adapter must be
      soldered", and the attached STLINK-V3 is on a NUCLEO-G474RE, not the Pixhawk. So SWD needs a Holybro
      Pixhawk Debug Adapter or soldering. ISP is the route available today.
      *** FLASHLOADER ACQUIRED AND PINNED, with corroborated provenance ***: it ships inside a TOOL repo,
      not as a release asset. Fetched from JayHeng/NXP-MCUBootUtility and verified BYTE-IDENTICAL to the
      copy in NXP'S OWN ORG (nxp-mcuxpresso/mcu-boot-utility) - two independent sources, one the vendor.
      sha256 ba6a8b06161aef7914436909185b6196b278f8e4cd16deeaab9945c1464d5f41, 80,930 B. Structurally
      verified as a real i.MX IVT: tag 0xD1, length 32, version 0x40, entry 0x20262561, self 0x2024FE00,
      both in OCRAM1. UNSIGNED (csf=0), which is normal for a flashloader and is stated rather than
      glossed. fetch.sh gained a `ghfile:` locator for repo-committed artifacts.
      *** THE RUNBOOK IS SAFE BY DEFAULT ***: hardware/silicon/rt1176-blhost/h1-runbook.sh.
        - DEFAULT IS READ-ONLY. --execute is required for any write and a human passes it.
        - NO FLASH VERB EXISTS in the script. Audited on EXECUTABLE lines only: the seven blhost/sdphost
          calls are write-file (to OCRAM), jump-address, get-property x2, write-memory, call, read-memory.
          A naive grep matched 1 "flash" hit - it was the comment saying no flash command is issued, which
          is why the audit was re-run against executable lines.
        - THE ADDRESS IS NEVER GUESSED. It must come from get-property 12 (reserved regions), and the
          script refuses if that returns nothing parseable. Writing outside a reserved region is how the
          bootloader's own state gets corrupted.
        - PASS REQUIRES BOTH MARKERS: 0x1E55F00D and arg+0x55. The second is address-derived, so a stale
          RAM read cannot fake it; a single-word check could.
        - Entering ISP is NOT in the script. It is a command to the vehicle and belongs to the operator.
      *** GUARDS OBSERVED FIRING, not assumed ***: no board -> rc=1 "Nothing was done"; --execute without
      ADDR -> rc=1 "Refusing to guess"; --dry-run -> rc=0, prints the full sequence and executes nothing.
      The exit codes were checked BARE after a `| tail` first reported the refusal as rc=0 - the campaign's
      most-repeated trap, hit again here in jess's own verification.
      NOTHING WAS SENT TO THE VEHICLE THIS TICK. Read-only telemetry only.
    tags: [h1, hardware, rt1176, isp, sdp, flashloader, provenance, safe-by-default, runbook, research]
    fields:
      detected-by: jess researching the documented H1 procedure against spsdk's device database and PX4/NXP docs before touching the attached board, 2026-09-05
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T08:15:07Z

  - id: AFD-080
    type: ai-found-defect
    title: "H1 on silicon: ISP entry WORKS and the ROM is confirmed SDP-only (refuting the prompt's blhost recipe on hardware) — but spsdk 3.1.0's SDP layer cannot transfer data with this ROM"
    status: open
    description: |-
      2026-09-05. FIRST ATTEMPT AT H1 ON REAL SILICON, with the operator's standing consent. The board was
      NOT harmed and is healthy: after every attempt it returned to normal PX4 mode on its own and streams
      telemetry (31,346 B in 3 s at the end). NOTHING WAS WRITTEN TO FLASH. H1 IS NOT ACHIEVED - the
      blocker is characterised below and is in the host tooling, not in jess's procedure.
      *** WHAT IS NOW PROVEN ON HARDWARE ***:
        1 ISP ENTRY WORKS AND IS REPEATABLE. `reboot -i` via PX4's own Tools/mavlink_shell.py over MAVLink
          SERIAL_CONTROL puts the board into serial-download mode. Done three times, ~1 s each. No
          disassembly, no BOOT button, no QGroundControl.
        2 THE ROM IS SDP, NOT MBOOT - MEASURED, not inferred. In ISP the board enumerates as
          "SE Blank RT Family", VID 0x1FC9 PID 0x013D, name list including mimxrt1176. That is exactly
          what spsdk's device database predicts for `isp.rom.protocol: sdp`.
        3 blhost CANNOT SEE THE ROM: `blhost -u -- get-property 1` -> SpsdkNoDeviceFoundError. So the H1
          recipe in the loop prompt (nxpdevscan -> blhost get-property 1 -> write-memory -> call) IS
          WRONG FOR THIS PART and would have failed at step 2. jess's earlier correction is confirmed on
          silicon; the NXP community claim "from RT11xx discard sdphost, just use blhost" is refuted.
        4 THE ROM TIMES OUT BACK TO PX4 IF LEFT IDLE. The first attempt failed because jess interleaved
          unrelated work (merging a PR, analysing the IVT) while the board sat in ISP. Once in ISP, act
          immediately. The subsequent runs poll for the device and proceed with no idle time.
      *** THE BLOCKER: spsdk 3.1.0's SDP LAYER CANNOT TRANSFER DATA WITH THIS ROM ***.
        write-file  -> "Status (HAB mode) = 2 (0x2)"  "Response status = 248 (0xf8)"
        read-register -> read_safe() returns empty
        jump-address  -> UNKNOWN ERROR, board stays at 0x1FC9:0x013D (flashloader never runs)
      NEITHER 0x2 NOR 0xF8 IS A VALID SDP ResponseValue. spsdk's own enum lists WRITE_FILE_OK 0x88888888,
      WRITE_DATA_OK 0x128A8A12, LOCKED 0x12343412, UNLOCKED 0x56787856, HAB_SUCCESS 0xF0F0F0F0. A
      HAB-locked device would report LOCKED (0x12343412) - it does not. So this reads as a protocol/parse
      mismatch between spsdk 3.1.0 and the RT1176 ROM rather than a secure-boot refusal, though jess has
      NOT proven which and does not claim to.
      *** A MISLEADING ERROR THAT COST TIME, worth reporting upstream ***: spsdk/apps/sdphost.py:133
      raises "Error: invalid sub-command or arguments 'read-register ...'" when sdp.read_safe() returns
      FALSY - i.e. when the READ FAILED. The message names the arguments, so a failed transfer looks like
      a syntax mistake. jess spent several cycles re-checking argument order against the click decorators
      before reading the source and finding the raise site.
      *** A REAL BUG IN JESS'S OWN RUNBOOK, found by doing this ***: it hardcoded the flashloader load
      address as 0x20240000. The image's IVT declares self=0x2024FE00 and entry=0x20262561; loading at the
      guessed base would put the entry point outside the loaded span. Now DERIVED from the IVT's own self
      field, with the image span and entry containment checked. This is the same class as "never guess an
      address" that the runbook already applied to the payload target.
      *** NEXT, in order ***: (a) try a different spsdk version - 3.1.0 may simply predate correct RT1176
      SDP support; (b) determine HAB state definitively rather than by elimination; (c) fall back to PX4's
      documented path, MCUXpresso Secure Provisioning Tool, which is known to work on this board and
      handles the ROM handshake itself.

      *** ROOT CAUSE FOUND 2026-09-05 — IT IS A macOS PLATFORM LIMITATION, not spsdk's version, not the
      board, and not jess's procedure. ***
      FIRST, A VERSION ERROR OF MINE: the loop prompt specifies blhost 3.11.0. jess installed spsdk
      3.1.0 — I read "3.11.0" as "3.1.0". Corrected to 3.11.0 and RE-RAN: IDENTICAL FAILURE. So the
      version was wrong AND was not the cause; both facts are worth recording, because fixing the wrong
      one would have looked like progress.
      THE EVIDENCE, from spsdk's own debug log:
        TX-CMD: WriteFile(address=0x2024FE00, length=80930)   <- command is well-formed and IS sent
        OUT[1025]: 01, 04, 04, 20, 24, FE, 00, ...            <- correct SDP WriteFile header on the wire
        RX-CMD: Timeout Error                                 <- the device NEVER ANSWERS
      Every SDP transfer times out. Enumeration, however, works perfectly.
      WHY: macOS binds the SDP device to the HID driver. Confirmed with ioreg — the device appears under
      IOHIDDevice as VendorID 8137 (0x1FC9), Product "SE Blank RT Family". spsdk's SDP-over-USB is
      SdpUSBInterface = SDPBulkProtocol, i.e. libusb bulk transfers; spsdk/sdp/protocol/ contains ONLY
      bulk_protocol.py and serial_protocol.py — THERE IS NO HID PATH. macOS does not permit libusb to
      detach its HID driver, so the interface can be enumerated but never claimed. That single fact
      explains every symptom: nxpdevscan sees the device (HID enumeration), and every transfer times out
      (libusb cannot claim it).
      A RED HERRING WORTH RECORDING because it cost time and looked alarming: the debug log contains RX
      packets 0xFE1CF701, 0xFE1C7601 and 0x67757374. 0xFE is the MAVLink v1 start byte and 0x67757374 is
      ASCII "gust". Those are NOT SDP responses — they are nxpdevscan PROBING SERIAL PORTS with an mboot
      PING and an SDP ReadStatus, hitting /dev/cu.usbmodem01, and misreading PX4 telemetry as protocol
      data. Harmless, but it briefly looked like the ROM was returning garbage.
      *** RESOLUTION PATHS, none of which are "try harder on macOS" ***:
        (a) Run the SDP leg from LINUX, where libusb can detach the kernel HID driver. Most direct, and
            jess's CI already runs ubuntu-latest — though CI has no board attached.
        (b) NXP's MCUXpresso Secure Provisioning Tool on macOS, which is PX4's own documented path for
            this board and does its own HID handling.
        (c) A HID backend for spsdk's SDP — upstream work, not jess's to do.
      *** BOARD HEALTH THROUGHOUT ***: five ISP entries, zero flash writes, and the board returned to
      normal PX4 within ~5 s every time. Final check: 52,777 B of telemetry in 4 s. The vehicle is
      unharmed and the whole exercise is reversible by design.
    tags: [h1, silicon, rt1176, isp, sdp, spsdk, tool-friction, blocked, hardware-verified]
    fields:
      detected-by: jess running H1 on the attached Pixhawk 6X-RT under standing operator consent, 2026-09-05
      severity: major
      triage-status: confirmed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T08:45:38Z
  - id: AFD-081
    type: ai-found-defect
    title: jess and gale share one physical bench and the org had NO reservation mechanism — added a host-local claim whose lock dies with the holder, self-tested including the crashed-holder case
    status: resolved
    description: |-
      2026-09-05. jess and gale both want the same physical bench (the STLINK-V3 on a NUCLEO-G474RE, and
      later the Pixhawk). Checked first whether the org already had a reservation mechanism - searched
      kiln, relay, gale, scry, varve, temper and jess for hardware-lock code and for issues about shared
      probes: NOTHING EXISTS. So this is the first, which makes getting the SCOPE right more important
      than features.
      *** THE CONSTRAINT THAT MAKES IT SMALL ***: a probe can only be driven from the host it is PLUGGED
      INTO. Two agents can therefore only collide on the SAME MACHINE. Cross-machine coordination is not
      merely unnecessary, it is impossible to need. That eliminates every heavyweight option considered -
      a reservation server, a GitHub-issue mutex, a git-CAS lease file - and leaves a host-local lock.
      *** THE FAILURE MODE THAT ACTUALLY MATTERS ***: not "two agents both want it" (rare, and obvious
      when it happens) but "one agent CRASHED holding it and now nobody can use the bench". Any design
      with an explicit release step has that failure. So the claim is an OS flock held on an open fd for
      exactly the lifetime of the wrapped command: when the process dies, for ANY reason, the kernel drops
      it. There is no release to forget and no stale-lock reaper to write.
        tools/bench/with-device <device> <purpose> -- <command...>
        tools/bench/with-device --status | --self-test
        tools/bench/devices.yaml   the registry (stlink-v3, pixhawk-6xrt)
      *** SELF-TESTED, because a lock that does not exclude is worse than no lock at all *** - it would
      give two agents false confidence while they corrupt each other's session. --self-test forks a real
      holder and asserts all three properties, each OBSERVED:
        contender while held      rc=3   refused, names the holder, pid and purpose
        contender after release   rc=0
        contender after the holder CRASHED (os._exit)  rc=0   <- the bench is NOT wedged
      *** SCOPE NOTE recorded in devices.yaml ***: read-only telemetry on the Pixhawk (O_RDONLY on the
      tty) needs NO claim - it cannot disturb another user. Anything that WRITES needs the claim AND
      operator consent. Conflating those two would make the lock either useless or obstructive.
      *** PROCESS NOTE ***: verifying this hit the campaign's most-repeated trap for the THIRD time in one
      session - `tool | sed` reported the contender's refusal as rc=0 because that is sed's status. Caught
      and re-checked bare. Three occurrences in one session is no longer bad luck; it is a signal that any
      exit code quoted from a pipeline in this campaign should be treated as unverified until re-run bare.
    tags: [bench, hardware, reservation, shared-resource, gale, flock, self-tested, crash-safe]
    fields:
      detected-by: jess needing the STLINK-V3 that gale also uses, 2026-09-05
      severity: major
      triage-status: closed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T10:10:33Z

  - id: AFD-082
    type: ai-found-defect
    title: hidapi OPENS the RT1176 SDP device that libusb cannot — but the replies are jess's own command echoed back, so H1 is still blocked; and the new bench lock accepted any device name
    status: open
    description: |-
      2026-09-05. Board attached; Track A. H1 was blocked by AFD-080 (macOS binds the RT1176 SDP device to
      the HID driver; spsdk's SDP-over-USB is libusb bulk with NO HID path, so it can enumerate but never
      claim). This tick tested the obvious unblock: speak HID instead of fighting it.
      *** REAL PROGRESS: hidapi OPENS the device that libusb CANNOT. *** Under a bench claim, six ISP
      entries, all read-only commands:
        hid.enumerate(0x1FC9, 0x013D) -> 1 interface, usage_page 0xFF00 usage 1 (the SDP HID shape)
        h.open_path(...) -> SUCCEEDS
      That is the precise thing spsdk fails at. It confirms AFD-080's root cause from the other side and
      identifies a viable route on macOS that does not need Linux or the Pi.
      *** BUT THE CHANNEL IS NOT PROVEN, AND I NEARLY REPORTED THAT IT WAS. *** The device returned
      report id=3 to every command, which looked like the SDP HAB-mode response and read as a breakthrough.
      It is not. Comparing what was sent against what came back, for a READ_REGISTER at 0x2024FE00:
        sent      01 01 20 24 fe 00 20 00 00 00 10 00
        received  00 00 00 24 fe 00 20 00 00 00 10 00
      The reply CONTAINS MY OWN ADDRESS AND COUNT. Changing the address to 0x00200000 changed the "reply"
      correspondingly. It is my own command echoed back, not a device response. No report id=4 (the SDP
      response report) was ever received, and no value ever decoded to a valid HAB code
      (0x12343412 LOCKED / 0x56787856 UNLOCKED) in either byte order.
      So: OPEN works, REQUEST/RESPONSE does not. H1 REMAINS BLOCKED. The honest status is "the macOS
      blocker has one layer peeled off", not "the ROM answered".
      *** ONE THING THAT WAS RIGHT ***: the report size. spsdk's bulk trace showed OUT[1025]; padding the
      HID output report to 1024 bytes + 1 report id produced a second reply where 16- and 64-byte reports
      produced only one. The transfer size is 1025 and the earlier undersized writes were wrong.
      *** A VACUOUS LOCK IN JESS'S OWN NEW BENCH TOOL, found by reading its own status output ***:
      with-device accepted ANY device name. A typo - `with-device stlnk-v3` - would silently create a
      DIFFERENT lock file, exclude nobody, and leave both agents believing they held the device. A stray
      `stlink-003B001A...` lock was sitting next to `stlink-v3` from exactly that mistake, made by me
      hours earlier. That is the vacuous-gate failure in lock form, shipped in the tool built to prevent
      a coordination failure. FIXED: unknown names are refused (rc=4) against tools/bench/devices.yaml.
      The fix then BROKE --self-test, because `selftest-device` was not registered - the self-test caught
      my own change, which is what it is for. Registered it explicitly in devices.yaml rather than adding
      a name-pattern bypass: a bypass in a lock is the hole that later gets used for something real. ONE
      rule, no exceptions - the registry is authoritative.
      *** BOARD HEALTH ***: six ISP entries, zero flash writes, returned to normal PX4 every time. One
      scare worth recording: immediately after the last return, telemetry read 0 B in 3 s. Re-checked
      after settling rather than reporting a fault - 53,686 / 52,626 / 51,080 B across three consecutive
      4 s windows. The zero was boot time, not damage.

      *** UPDATE 2026-09-05 — gale CORRECTED jess's claim rule, and jess MEASURED the thing gale could
      only assert. *** jess's rule was "read-only telemetry needs no claim". gale (gale#356) showed the
      second O_RDONLY open on a tty is NOT refused, and argued a serial read is SINGLE-CONSUMER: two
      readers each get a subset, silently. They were explicit that they had measured the double-open but
      NOT the byte-splitting, and offered to nail it down. jess did:
          one reader alone      66,872 B in 5 s
          two readers together  37,787 B + 40,053 B = 77,840 B combined
      Each got roughly HALF. Combined is ~16% over solo, not the ~2x duplication would give, and NEITHER
      READER ERRORED. So two agents tailing one Pixhawk tty each capture a silent SUBSET, indistinguishable
      from a flaky USB link - the exact failure this tool exists to prevent. jess's exemption was
      self-defeating and is WITHDRAWN.
      NEW RULE, either condition claims: (1) it attaches a debug probe - `mdw` is not a harmless read; or
      (2) it opens a device whose data is CONSUMED BY THE READER - any tty/serial, even O_RDONLY. Genuinely
      claim-free is narrower than "reads": files, lsusb/ioreg, `pyocd list`, an already-captured log.
      CONSEQUENCE FOR THIS SESSION'S EVIDENCE: every telemetry capture jess took today ran unclaimed under
      the wrong rule. None is known to be corrupted - gale was not reading concurrently - but they were
      taken with no protection against exactly that, which is worth stating rather than assuming.
      *** RELEASE-READINESS (operator asked for it to become a varve-layer tool) ***: varve layers are
      cosign-signed OCI bundles of TOOL BINARIES, and per the PulseEngine CLI conventions every binary in
      a layer must meet a baseline. with-device met NONE of it. Now conformant and verified:
        --version / -V -> "with-device 0.1.0", rc 0     --help -> rc 0
        unknown flag   -> rc 2 with usage on stderr     --status --format json -> structured output
        exit codes documented: 2 usage (incl. unregistered device), 3 busy, else the wrapped command's
      Zero third-party dependencies (stdlib only), which matters for a tool that must be reproducible
      inside a signed layer.
      OPEN QUESTION THAT IS NOT JESS'S TO DECIDE: where it lives. Every current layer tool comes from its
      own repo (loom from loom, rivet from rivet). jess is a CONSUMER repo whose releases are findings,
      not tools, so shipping an org-wide utility from here is the wrong shape. Raised with varve.
    tags: [h1, silicon, sdp, hid, macos, afd-080, near-miss, vacuous-lock, bench, self-correction]
    fields:
      detected-by: jess testing whether hidapi bypasses the macOS HID claim limitation, 2026-09-05
      severity: major
      triage-status: confirmed
    provenance:
      created-by: ai
      model: claude-opus-4-8
      timestamp: 2026-09-05T10:49:09Z

  - id: AFD-083
    type: ai-found-defect
    title: "my own deadlock rationale failed its negative control: the self-test passes with the sort REMOVED — what prevents deadlock is no-hold-and-wait, not the ordering (with-device ported to Rust, released, CI-gated)"
    status: open
    description: |-
      2026-09-05. Board attached; Track A. User set three requirements for the shared-bench claim tool:
      deadlock-free under multi-device claims, shipped in the GitHub release, and Rust mandatory.
      All three are met. But the load-bearing result of this tick is a negative control that
      CONTRADICTED THE DESIGN RATIONALE I HAD ALREADY WRITTEN INTO THE CODE.

      *** THE PORT (requirement 3) ***: tools/bench/with-device is now a Rust crate, replacing the
      Python script at the same path (v0.1.0 -> v0.2.0). ZERO dependencies: flock(2) is declared with a
      bare `extern "C"`, so the crate that will sit in a signed varve layer has nothing to vendor and
      nothing to audit but itself. clippy -D warnings + cargo fmt --check clean.

      *** THE FINDING: MY OWN DEADLOCK ARGUMENT DID NOT SURVIVE ITS NEGATIVE CONTROL ***
      I designed sorted acquisition (Dijkstra's resource hierarchy: all claimants take locks in one
      global order, so no cycle can form) and wrote in the module header that `--self-test` PROVES it,
      by racing two processes that request the same two devices in OPPOSITE order. The self-test went
      green on the first run. Reporting it there would have been a confident wrong claim.

      Then I removed the sort and re-ran. Measured on this binary:
        as shipped                        opposite-order pair -> 0,0 in 2.1 s   PASS
        sort REMOVED, everything else     opposite-order pair -> 0,0 in 2.1 s   PASS  <-- test blind
        sort removed AND hold-and-wait    opposite-order pair -> 3,3 in 15.1 s  FAIL  <-- real cycle,
                                          restored                                    broken only by the
                                                                                      --wait deadline

      So the mechanism that actually prevents deadlock here is NO HOLD-AND-WAIT: on contention the
      claimant DROPS every lock it already holds before retrying, which breaks Coffman's hold-and-wait
      condition outright. The sort is real and kept as defence in depth (it is what would still hold if
      --wait ever grew a blocking flock(LOCK_EX) path, where drop-and-retry is unavailable), but the
      self-test does not discriminate on it. The 3,3-in-15.1s control is what makes the test non-vacuous
      at all: without it, a test that passes on EVERY variant is a test that measures nothing.

      This is the AFD-048 failure mode - a vacuous negative control - caught at authoring time instead
      of by a clean-room pass, and caught in the rationale rather than the code. The code was correct;
      the STATED REASON it was correct was wrong. Module header now carries the table above and says
      plainly which mechanism the test sees. Generalised lesson: "I designed property P and the test
      passes" is not evidence for P. Break P and confirm the test goes red. Design intent is the thing
      least likely to be independently checked later, because it reads as explanation, not as a claim.

      *** THE RELEASE (requirement 2) ***: jess had NO release workflow - v0.6.0 was cut by hand and jess
      shipped no binary at all, which is why with-device existed only as a file gale could read but not
      run, and why varve#130 had nothing to pin (a varve layer needs a signed release asset with a
      digest, not a repo path). .github/workflows/release.yml now builds 4 targets
      (x86_64/aarch64-unknown-linux-gnu, aarch64/x86_64-apple-darwin) on tag push, emits
      with-device-<ver>-<triple>.tar.gz + SHA256SUMS.txt in the same shape every other PulseEngine repo
      publishes and tools/deps/fetch.sh already parses, so a consumer pins it exactly like synth or meld.
      HONEST SCOPE: aarch64-unknown-linux-gnu is CROSS-BUILT and its self-test is SKIPPED - that asset
      ships unexecuted, and the workflow says so at the step rather than implying coverage. It is the
      target the Pi will use, so it needs a real run before anyone trusts it there.

      *** CI GATE ***: new `bench-tool` job runs build + the CLI baseline + --self-test on every PR. The
      tool's own exclusion property is now gated rather than remembered.
      *** VERDICT (post-merge, no longer pre-emptive) ***: PR #228 ALL GREEN on adf4fa6 - all 8 CI jobs
      including bench-tool. Merged as 0312ec3. Released as v0.7.0.
      *** A BUG IN MY OWN NEW GATE, found before CI hit it ***: the bench-tool step ran under
      `set -euo pipefail` and asserted the unknown-flag exit code with `cmd; rc=$?`. Under `set -e` that
      aborts the step the instant cmd fails - i.e. on exactly the failure the assertion exists to
      measure. The job would have gone red at that line having performed NO assertion. Found only by
      running the step body VERBATIM under `set -e` rather than running the commands individually,
      which is the sole way the difference is observable. Now `rc=0; cmd || rc=$?`. Generalises: a CI
      step is a shell PROGRAM, and testing its commands one at a time does not test the program.
      *** RELEASE ASSETS VERIFIED FROM A CLEAN DOWNLOAD, not from the build tree ***: fresh temp dir,
      `gh release download v0.7.0`, `shasum -a 256 -c SHA256SUMS.txt` with no --ignore-missing (so all
      four assets must be present, not merely the ones that happen to be there): 4/4 OK. Extracted the
      aarch64-apple-darwin tarball and EXECUTED it - `--version` -> with-device 0.2.0, `--self-test` ->
      5/5 PASS including the opposite-order pair, and a two-device claim against the shipped
      devices.yaml.example succeeded. "It is published" is not "it works"; this is the executed claim.
        sha256 aarch64-apple-darwin      a81598fc292edc541be1f8bd248c26f21ef979a4a4cea0c0c9a8e01133373700
        sha256 aarch64-unknown-linux-gnu aa53cfddcc2acb92419514563dd26797edf0f932124ec34acf962df77cc515ff
        sha256 x86_64-apple-darwin       7d7718f7bd872857914622bbfb751ec9b157e74cf46b5de3fcec664f004e650c
        sha256 x86_64-unknown-linux-gnu  ffb22a58b423d468bf81c91735359f84006607cfb370879b5aab002d9d8a0548
      STILL UNEXECUTED, stated rather than glossed: both linux assets. They are the right ELF class
      (x86-64 and ARM aarch64, PIE, stripped) but nothing has RUN them - the release job self-tests only
      the targets its runner can execute. aarch64-unknown-linux-gnu is the Raspberry Pi target, so it
      needs a real run there before the Pi plan depends on it.
