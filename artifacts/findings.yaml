    description: >
      RELEASE REGRESSION found in jess loop iter#4 (2026-06-10): falcon-v1.45.0 ships
      no falcon-flight-v*.wasm component asset (0 wasm assets) - only platform CLI
      tarballs, cdx, rivet snapshot, SHA256SUMS; the darwin tarball contains only
      falcon-hello + docs. The wasm component was present through falcon-v1.44.0
      (falcon-flight-v1.44.wasm + .sha256) and earlier (v1.33, v1.34). CHANGELOG has
      no entry announcing the removal, so it looks unintentional - same signature as
      the v1.28-v1.32 drop tracked in AFD-006 / relay#100 (restored in v1.33).
      Impact: jess's whole forward chain (wasmtime SIL gate, meld fusion, kiln
      execution, synth Cortex-M compile) consumes the published falcon-flight wasm;
      with it absent, falcon-v1.45.0 cannot be adopted and the loop stalls at v1.44.0.
