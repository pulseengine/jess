          DTCM into OCRAM costs latency on the INNERMOST rate loop - precisely the loop DD-026's data-flow
          design optimised for (raw gyro co-scheduled on M7 to avoid cross-core delay). So the granularity
          issue is not merely "fatal on the F100": on the M7 it silently trades away the latency margin the
          architecture was designed around.
      CONCLUSION: the fused 3-core image (DD-023/REQ-PIX-021) is blocked on meld gaining EXTENT-granular
      (not page-granular) rebasing. --emit-relocs remains a publication precondition on BOTH suppliers -
      necessary, now proven insufficient alone.
