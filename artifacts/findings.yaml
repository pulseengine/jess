artifacts:
  - id: AFD-001
    type: ai-found-defect
    title: synth graph unresolvable — broken CTRL-RA ref plus synth-sigil cycle
    status: draft
    description: >
      During jess external-integration setup (Task 8/9 of the rivet tracking
      spine), `rivet validate` was run against the synth upstream repo
      (pulseengine/synth) to test whether it could be consumed as a cross-repo
      external. Validation failed with multiple graph errors.

      Detection method: `rivet validate` (rivet's own graph-resolution machinery)
      during jess external integration on 2026-06-04.

      Root causes identified:
      1. Broken internal cross-reference `CTRL-RA` in
         synth/safety/stpa/code-generation-ucas.yaml — the target artifact does
         not exist in the synth artifact store, leaving the graph dangling.
      2. A dependency cycle between the synth and sigil repos (synth references
         sigil artifacts and sigil references synth artifacts), making external
         graph resolution impossible for either repo in isolation.
      3. Dangling `kiln:` prefix links in sigil's artifact files that cannot be
         resolved without kiln being fully loaded, compounding the cycle.

      Because the graph does not resolve, none of synth, meld, kiln, or sigil can
      currently be consumed as rivet cross-repo externals. Traceability for all
      four is anchored at supplier-boundary external-anchor artifacts until the
      upstream graphs are fixed.

      Status: open.
      Upstream issue URL: TODO — to be filed via `gh issue create` against
      pulseengine/synth once this jess task is committed.
    tags: [supplier, upstream, graph-error, blocked]
    fields:
      severity: major
      triage-status: open
      detected-by: rivet validate (graph resolution during cross-repo external integration)
      discovered-at: "2026-06-04"
      notes: >
        Affects synth (primary), and transitively meld, kiln, sigil due to the
        cross-repo cycle. Filed against EXTERNALANCHOR-002 (synth). All four
        supplier anchors are tagged `blocked` in suppliers.yaml. The upstream
        issue URL field will be updated once the GitHub issue is created against
        pulseengine/synth.
    links:
      - type: defect-against
        target: EXTERNALANCHOR-002
      - type: traces-to
        target: REQ-003
    provenance:
      created-by: ai-assisted
      model: claude-sonnet-4-6
      timestamp: 2026-06-04T17:47:53Z

