  - id: AFD-103
    type: ai-found-defect
    title: "varve-core already existed and jess argued five comments from the CLI surface without checking; varve enlarged the ask correctly (the crate cannot say 'verified' at ALL), and the exchange uncovered a structural limit: one repo can contribute at most one payload to a layer"
    status: open
    description: |-
      2026-09-06. Outcome of the varve#130 design exchange. Three results, one of which jess should have
      found for itself.

      *** 1. `varve-core` ALREADY EXISTS, AND JESS WROTE FOUR FAILURE REPORTS WITHOUT FINDING IT ***
      Verified against crates.io rather than taken from the reply: `varve-core`, 7 versions, max 0.32.0,
      updated 2026-09-05, repo pulseengine/varve, "Layer manifests, resolution, the core store, and
      verification wiring for varve". The `varve` CLI is a thin shell over it.
      It already offers what jess spent five comments asking for:
          varve_core::resolve::resolve(&pin, &store) -> Result<Resolved, ResolveError>
      with `Resolved.tools: Vec<(String, PathBuf)>` and a DIFFERENTIATED error enum - NotInstalled,
      DigestNotInstalled, NameDigestMismatch, Ambiguous, PartialLayer, tools-subset - each carrying what
      to do next. `NameDigestMismatch` is precisely the "which binary answered" question that broke
      tools/wit/regen.sh.
      JESS'S SHARE OF THIS: the ask was written from the CLI surface without checking whether a library
      existed. varve took the discoverability failure as their finding, which is generous; the search
      cost was one crates.io query. Recorded here as a jess process note, not only an upstream one:
      argue from the tool's full surface, not the surface you happen to be standing on.

      *** 2. WHERE THE ASK WAS RIGHT, AND VARVE ENLARGED IT IN JESS'S FAVOUR ***
      jess argued "verification failure must be its own variant, never folded into not-found - a
      consumer that treats the second as the first FAILS OPEN". Correct and not currently expressible:
      `resolve()` DOES NOT VERIFY. It reads the store and trusts that `install` verified on the way in,
      so "present but does not verify" is not among the answers.
      varve refused to patch that with "call verify first", on the grounds that a two-call contract with
      an implicit ordering is the shell contract wearing types. Their restatement is bigger than jess's
      ask and better: it is not "the crate must not collapse errors", it is THE CRATE MUST BE ABLE TO
      SAY `verified` AT ALL. Also missing and confirmed: no per-payload lookup (so "absent from the
      layer" and "present but no entry for this platform" are not separable), and no format self-report
      (so a consumer built once and run for months cannot state "I met a layer newer than I know" as a
      fact rather than a parse error).
      Scoped by varve as a requirement for the next release with jess's four clauses as its spine.

      *** 3. A STRUCTURAL VARVE DEFECT THE EXCHANGE UNCOVERED, NOTHING TO DO WITH JESS ***
      Testing whether moving with-device would help produced this: ONE REPOSITORY CAN CONTRIBUTE AT MOST
      ONE PAYLOAD TO A LAYER. Two guards combine - a tool's `name` must equal its repository basename,
      and two entries may not share a `name` - so `name` is pinned to the repo and the repo may appear
      once. It already blocks work in flight: zephyrproject-rtos/sdk-ng publishes 140 host x target
      toolchains and a layer wanting two targets cannot express it. So moving with-device would have
      fixed nothing and left the same wall standing for Zephyr and WASI.

      *** DECISION RECORDED: with-device STAYS IN JESS ***
      The operator's call, overruling varve's own recommendation, with a positive argument rather than a
      deferral: jess is the integrator archive and a tool arbitrating an exclusive claim on a physical
      bench IS integration work. varve's "every layer tool ships from its own repo" was a hygiene rule,
      and hygiene loses to a tool sitting with the work it serves. CONDITION: revisit if it grows past
      bench arbitration - more consumers, its own cadence, a scope that stops being integration.
      The layer keeps carrying it from jess; the fifth field handles the tag/version divergence, and
      2026.09.1 ships 0.2.1 with the next rolling deposit picking up 0.2.2.

      *** WHAT JESS CAN DO NOW, WITHOUT WAITING ***
      varve-core 0.32.0 is consumable today. A catalogue reader can be built against `resolve()` now,
      with the verification gap KNOWN AND STATED rather than assumed away - i.e. a consumer that says
      plainly "the layer was resolved, not re-verified at read time" until the next release closes it.
      That is strictly better than the CLI parsing jess was about to write, and it does not block on
      varve. NOT started this tick; recorded as the next concrete step.
    tags: [varve, varve-core, consumer-api, upstream, with-device, process, self-correction, discoverability]
    fields:
      detected-by: the varve#130 design exchange, verified against crates.io, 2026-09-06
      severity: major
      triage-status: confirmed
    provenance:
