      *** THE CONSTANT WAS JESS'S OWN STUB, AND IT PROVES THE SEAM WORKS ***:
        gale: fn now() -> u64 { read32(TIM2_CNT) as u64 }   with TIM2_CNT = 0x4000_0024
        0x4000_0024 & 0xFF = 36 - exactly the constant AFD-047 reported as unexplained.
      So now() DOES call through gust:hal/mmio.read32 with the expected address, and the value came
      back out of jess's own address-derived stub. AFD-047's first instinct was right and its
      "correction" was wrong.
      *** ROOT CAUSE - A STALE ARTIFACT THE SCRIPT PREFERRED ALPHABETICALLY ***. jess DID build a
      ticking HAL variant to test exactly this, and concluded from it that the clock stayed frozen.
      That test never ran the ticking HAL. app/gust-hal-tick was created with `cp -r
      app/gust-hal-stub`, which copied the stub's target/ directory too, leaving a stale
      jess_gust_hal_stub.wasm beside the real jess_gust_hal_tick.wasm. Both the ad-hoc compose and
      the committed tools/timer-probe/run.sh selected `ls .../*.wasm | head -1`, and the stale STUB
      sorts first. Every "ticking" run silently composed the CONSTANT stub.
      *** THE CORRECTED RESULT - A CLEAN SINGLE-VARIABLE DIFFERENTIAL ***, everything identical but
      read32's return:
        CONSTANT stub    clock_advances=0  slept=0  polls=10000  elapsed_at=0
        TICKING hal      clock_advances=1  slept=1  polls=0      elapsed_at=1
      The probe is now 6/6 including its negative control, and THE WAKE FIRES ON THE FIRST POLL.
      *** WHAT THIS CHANGES ***: gale's timer path WORKS end to end on the shipped v0.7.0 -
      spawn.start -> timer.sleep -> timer.slept -> elapsed. PERIODICITY IS UNBLOCKED. The design gale
      documented is confirmed: the embedder supplies time through gust:hal/mmio, TIM2_CNT is a
      documented mock counter, and timer-thin is the driver meant to own the real prescaler behind
      that seam. gust:hal is the right home for jess's clock, as gale said.
      *** WHAT SURVIVES FROM AFD-047 ***: the reframing gale adopted for DD-025 - the constraint is
      not only who drives the EXECUTOR but who supplies the CLOCK - is still correct, and is now
      correct for a demonstrated reason rather than a mistaken one: time enters the graph ONLY
      through the host's read32. An application in pure wasm cannot manufacture it. Also confirmed by
      gale: 7f09ada touches only the world and the example, no runtime.
      *** THE LESSON, and it is the third instance of the same shape this campaign ***: AFD-048
      found a control that measured statefulness instead of input sensitivity; this one ran a
      control that never applied its variable at all. Both PASSED and both were wrong. A negative
      control must be shown to have ACTUALLY CHANGED the thing it names - here, that the artifact
      composed is the artifact intended. run.sh now names the tick artifact explicitly and REFUSES
      if a stale stub is present in that directory; the refusal is itself negative-controlled.
      NOT CLAIMED: this ran under wasmtime. The ticking read32 advances on every call, so the wake
      firing on poll 0 is a degenerate instant timer, not a realistic rate - it proves the MECHANISM,
      not a schedule.
    tags: [gale, dd-025, timer, clock, stale-artifact, vacuous-control, self-correction, periodicity]
