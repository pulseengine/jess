  - id: AFD-005
    type: ai-found-defect
    title: rules_wasm_component lacks working synth_compile and hermetic meld synth toolchains
    status: resolved
    description: >
      rules_wasm_component does not export a working synth_compile rule (disabled in relay/BUILD.bazel: 'requires a synth attribute that this file doesnt provide') and does not bundle meld/synth as hermetic Bazel toolchains. Consequence for jess: a downstream firmware build (meld_fuse -> synth_compile -> renode_test) cannot be expressed without depending on meld/synth as modules, which drags their verus/rocq/lean (Nix) proof toolchains into a firmware-only build. Suggested fix: export synth_compile with a synth toolchain attr and provide meld/synth toolchains from rules_wasm_component (or a thin rules_synth/rules_meld). Upstream issue https://github.com/pulseengine/rules_wasm_component/issues/489 (filed, supervising). RESOLVED 2026-06-14 (iter#18): rwc v1.1.0 (#468) ships meld_fuse + synth_compile as hermetic toolchains, both exported from wasm/defs.bzl. jess bumped its pin to the v1.1.0 tag (b6a1412) and wired //:falcon-fused (meld_fuse) -> //:falcon-firmware (synth_compile, cortex-m4f); bazel build is GREEN - fused wasm wasm-tools VALID, firmware is a 32-bit ARM EABI5 ELF (24 funcs, .linear_memory, vector table, link-survivable relocs per synth#345). The hermetic fetch->adopt->fuse->compile chain is now real in jess WITHOUT the proof toolchains. Caveat: ELF is exports-only until synth#275 dispatch lands (renode emulate step deferred accordingly). Confirmed on rwc#489 item 2.
    tags: [release-watch, rules_wasm_component, build]
    fields:
      detected-by: jess 0.2.0 bazel wiring — relay BUILD.bazel disables synth_compile (missing synth attr)
      severity: major
      triage-status: open
    links:
      - type: traces-to
        target: REQ-001

